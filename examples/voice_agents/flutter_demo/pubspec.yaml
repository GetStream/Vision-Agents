name: flutter_demo
description: The Flutter half of swift_demo — the same agent, talked to by a Flutter app.
publish_to: none
version: 0.1.0

# Stream Chat 10.4's floor, which stream_agents_chat follows.
environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  # Material's widgets, moved out of the Flutter framework in 3.47.
  material_ui: any
  # The microphone, asked for before a call on Android. iOS asks by itself when the call
  # first uses it.
  permission_handler: ^12.0.3
  # Stream Chat's AI components: the conversation, its steps, the composer and the voice glow.
  # Built on Stream's design system. Pinned to a main commit until a release is published.
  stream_chat_flutter_ai:
    git:
      url: https://github.com/GetStream/stream-chat-flutter-ai.git
      ref: 165b016f6093df03c74093b647dd141e43e5f256
      path: packages/stream_chat_flutter_ai
  # Stream's design system, which the AI components are built on: its widgets for the app's own
  # screens (app bar, buttons, sheets). The version stream_chat_flutter_ai uses.
  stream_core_flutter: ^0.5.3
  # The channel a written conversation is kept in; the version stream_agents_chat pins.
  stream_chat: 10.4.0
  stream_video_flutter: 1.6.0
  # The SDKs as they are in this checkout, as the Android demo's included build does.
  stream_agents_core:
    path: ../../../sdks/dart/core
  stream_agents_chat:
    path: ../../../sdks/dart/chat
  stream_agents_rtc:
    path: ../../../sdks/dart/rtc

# The chat and rtc packages ask for stream_agents_core from pub.dev, which it is not on yet.
dependency_overrides:
  stream_agents_core:
    path: ../../../sdks/dart/core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
