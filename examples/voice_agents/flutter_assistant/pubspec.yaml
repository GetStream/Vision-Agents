name: flutter_assistant
description: The Flutter half of swift_assistant — Juno, the same agent, talked to by a Flutter app.
publish_to: none
version: 0.1.0

# Stream Chat 10.4's floor, which stream_agents_chat follows.
environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  # A photo from the composer, shrunk and turned the way the camera held it before it is sent.
  flutter_image_compress: ^2.5.1
  # trip_map's map: OpenStreetMap tiles, no key.
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  # The timezone get_local_context names, such as Europe/Amsterdam.
  flutter_timezone: ^5.1.1
  # A connector's sign-in: a web authentication sheet on iOS, an Auth Tab or a Custom Tab on
  # Android, handed back to the app by its own scheme.
  flutter_web_auth_2: ^5.1.0
  # Where get_location says the person is: a reading, and the address at it.
  geocoding: ^5.0.0
  geolocator: ^14.1.2
  http: ^1.6.0
  intl: ^0.20.2
  # The calendar, the camera and the microphone, asked for on Android the first time they are
  # needed. iOS asks by itself when they are first used.
  permission_handler: ^12.0.3
  # Stream Chat's AI components: the conversation, its steps, the composer and the voice glow.
  # Built on Stream's design system. Pinned to the head of the AI parity features pull request (#90)
  # until it is released.
  stream_chat_flutter_ai:
    git:
      url: https://github.com/GetStream/stream-chat-flutter-ai.git
      ref: 49b659bac899566aa8508b68733387b65fe923e8
      path: packages/stream_chat_flutter_ai
  # The A2UI renderer for the UI the agent writes in its replies. Pinned to the head of the
  # AI parity features pull request (#90), like stream_chat_flutter_ai, until it is released.
  stream_chat_flutter_ai_a2ui:
    git:
      url: https://github.com/GetStream/stream-chat-flutter-ai.git
      ref: 49b659bac899566aa8508b68733387b65fe923e8
      path: packages/stream_chat_flutter_ai_a2ui
  # Stream's design system, which the AI components are built on: its widgets for the app's own
  # screens (app bar, buttons, sheets). The version stream_chat_flutter_ai uses.
  stream_core_flutter: ^0.5.3
  # The channel a written conversation is kept in; the version stream_agents_chat pins.
  stream_chat: 10.4.0
  stream_video_flutter: 1.6.0
  # The SDKs as they are in this checkout.
  stream_agents_core:
    path: ../../../sdks/dart/core
  stream_agents_chat:
    path: ../../../sdks/dart/chat
  stream_agents_rtc:
    path: ../../../sdks/dart/rtc

# The chat and rtc packages ask for stream_agents_core from pub.dev, which it is not on yet.
dependency_overrides:
  stream_agents_core:
    path: ../../../sdks/dart/core
  # The renderers ask for stream_chat_flutter_ai from pub.dev, where this commit is not.
  stream_chat_flutter_ai:
    git:
      url: https://github.com/GetStream/stream-chat-flutter-ai.git
      ref: 49b659bac899566aa8508b68733387b65fe923e8
      path: packages/stream_chat_flutter_ai

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/UIComponents.json
