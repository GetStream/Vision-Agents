[project]
name = "sales-assistant-agent"
version = "0.1.0"
description = "AI sales coaching agent powered by Vision Agents"
requires-python = ">=3.12"

dependencies = [
    "python-dotenv>=1.0",
    "vision-agents",
    "vision-agents-plugins-assemblyai",
    "vision-agents-plugins-getstream",
    "vision-agents-plugins-gemini",
    "getstream",
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
markers = ["integration: marks tests as integration tests"]

[tool.uv.sources]
"vision-agents" = { path = "../../agents-core", editable = true }
"vision-agents-plugins-assemblyai" = { path = "../../plugins/assemblyai", editable = true }
"vision-agents-plugins-getstream" = { path = "../../plugins/getstream", editable = true }
"vision-agents-plugins-gemini" = { path = "../../plugins/gemini", editable = true }
