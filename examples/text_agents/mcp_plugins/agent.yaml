name: mcp_plugins
description: Reads the team's issues and your own calendar and files, and makes 3D renders with Blender.
mode: text
llm: llm-fast
# The company's accounts: connected once each, on the dashboard, for every conversation.
plugins:
  - sentry
  - github
  - hubspot
  - salesforce
# Each person's own: the agent asks for one in the chat the first time it needs it.
# Linear, Calendly and Cal.com register their own OAuth clients, so they need nothing
# configured on the router: ask about an issue and the login works.
user_plugins:
  - linear
  - google_calendar
  - google_drive
  - google_docs
  - calendly
  - calcom
  - slack
# How a plugin is reached and what its login asks for. Left out, each is the catalog's:
# Linear at https://mcp.linear.app/mcp, asking for read and write. readonly reaches
# https://mcp.linear.app/mcp/readonly instead, which has no tool that writes and asks only
# for read; scopes replaces what the login asks for. A login made before a change keeps
# what it was granted, so connect again after changing either. toolsets limits Cal.com to
# some of its tools, and needs no new login. tools offers the model only the tools named,
# or matching a pattern such as get_*, on any plugin or MCP server; left out, all of them.
# plugin_options:
#   - plugin: linear
#     readonly: true
#     scopes: [read]
#     tools: [list_issues, get_issue]
#   - plugin: calcom
#     toolsets: [bookings, availability, event-types]
#   - plugin: google_drive
#     scopes:
#       - https://www.googleapis.com/auth/drive.readonly
#       - https://www.googleapis.com/auth/drive.file
# Any other MCP server, by its URL. The router opens it for every conversation, with no
# login, and offers its tools as tablejourney__<tool>.
mcp_servers:
  - name: tablejourney
    url: https://tablejourney.com/mcp
# Blender for the render skill, in the router's Daytona sandbox.
sandbox: daytona
sandbox_options:
  # bpy is Blender as a Python module, for Python 3.13. The libraries are the X and GL
  # ones its wheel links against that a slim Debian does not have.
  setup:
    - >-
      apt-get update && apt-get install -y --no-install-recommends
      libgl1 libx11-6 libxext6 libxfixes3 libxi6 libxkbcommon0 libxrender1
      libxxf86vm1 libsm6 libice6 libxt6 && rm -rf /var/lib/apt/lists/*
    - pip install --no-cache-dir bpy==5.2.2
  timeout: 5m
  cpu: 2
  memory_gb: 4
