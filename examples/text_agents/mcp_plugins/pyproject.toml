[project]
name = "mcp-plugins-agent"
version = "0.0.0"
requires-python = ">=3.13,<3.14"

dependencies = [
  "aiohttp>=3.10",
  "cryptography>=42",
  "python-dotenv>=1.0",
  "vision-agents-plugins-getstream",
  "vision-agents-plugins-omni",
  "vision-agents-plugins-stream",
  "vision-agents",
]

[tool.uv.sources]
"vision-agents-plugins-getstream" = {path = "../../../plugins/getstream", editable=true}
"vision-agents-plugins-omni" = {path = "../../../plugins/omni", editable=true}
"vision-agents-plugins-stream" = {path = "../../../plugins/stream", editable=true}
"vision-agents" = {path = "../../../sdks/python", editable=true}
