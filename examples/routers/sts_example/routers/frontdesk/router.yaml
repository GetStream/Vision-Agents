name: frontdesk
description: A conversation held by one native audio model, quick to answer and never a
  named vendor.

tags:
  team: support

# One block where the cascade needs three. The model on the other end hears the caller,
# decides when they have finished, answers and speaks, so there is no transcriber, turn
# detector or voice to configure here, and nothing to keep them in step with each other.
sts:
  # A capability, not a model: the model quickest to first audio, pinned to Gemini 3.1
  # Flash Live while it is up, with the rest of the tier behind it. Naming a vendor here
  # would be naming which one is down today.
  target: sts-fast

  # Ask the model to write down what it heard and what it said. Both are terms: one vendor
  # cannot turn its transcript off and two give only finals, so asking narrows the
  # candidates to the models that can, and a model that cannot is not asked.
  input_transcript: true
  output_transcript: true

  # A requirement rather than a description. It rules out the one vendor that has
  # published nothing about training, because a vendor who has said nothing is not a
  # vendor who has said no.
  data_policy:
    allow_training: false
