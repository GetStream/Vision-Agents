[project]
name = "accelerated-agent-example"
version = "0.0.0"
requires-python = ">=3.13,<3.14"

# Dependencies that the example actually uses
dependencies = [
  "python-dotenv>=1.0",
  "vision-agents-plugins-getstream",
  "vision-agents-plugins-stream",
  "vision-agents",
  "pytest>=8.0",
  "pytest-asyncio>=1.0",
]

[tool.uv.sources]
"vision-agents-plugins-getstream" = {path = "../../../plugins/getstream", editable=true}
"vision-agents-plugins-stream" = {path = "../../../plugins/stream", editable=true}
"vision-agents" = {path = "../../../agents-core", editable=true}
