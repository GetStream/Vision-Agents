id: telecom.coherence
pack: telecom
category: checklist
name: Two minute outage repair stays coherent
persona: A subscriber who restates account details and wants the reboot before a truck.
max_duration_s: 240
judge:
  coherence: true
  task: After two minutes the listener should still know reboot happened, ticket T-1842 exists, and a morning tech is coming. Do not skip reboot.
turns:
  - id: intro
    text: "Internet has been down since 6 this morning. I already unplugged the gateway once but it is still dead, can you help?"
    trigger: {kind: after_agent_turn, delay_ms: 500}
  - id: identity
    text: "PIN 4471, last four 9821, service address 14 Cedar Lane. Gateway error 840 is on the display."
    trigger: {kind: after_agent_turn, delay_ms: 500}
  - id: outage
    text: "Is this an area outage or just my house? Neighbors on the next street still have internet as far as I know."
    trigger: {kind: after_agent_turn, delay_ms: 500}
  - id: reboot
    text: "Okay walk me through the reboot again. I will do it now. I do not want a truck if a reboot will fix it."
    trigger: {kind: after_agent_turn, delay_ms: 500}
  - id: still_down
    text: "Still down after the reboot. Lights are the same, error 840 is still there. Please open a ticket."
    trigger: {kind: after_agent_turn, delay_ms: 500}
  - id: address
    text: "Confirm you have 14 Cedar Lane, last four 9821. I do not want the tech sent to the wrong house."
    trigger: {kind: after_agent_turn, delay_ms: 500}
  - id: window
    text: "Morning window is fine. I will be home. Please read the ticket number back when you have it."
    trigger: {kind: after_agent_turn, delay_ms: 500}
  - id: error
    text: "Log error 840 on the ticket so the tech is not guessing. That code has been on the gateway since 6."
    trigger: {kind: after_agent_turn, delay_ms: 500}
  - id: readback
    text: "Read back reboot done, ticket number, morning tech, and 14 Cedar Lane so I know we did not lose the plot."
    trigger: {kind: after_agent_turn, delay_ms: 500}
  - id: thanks
    text: "Thanks, I will wait for the morning window."
    trigger: {kind: after_agent_turn, delay_ms: 400}
seed:
  outage: false
  reboot_succeeds: false
  gateway_error: "840"
  credit_eligible: false
  accounts:
    - {id: acc1, pin: "4471", last4: "9821", address: "14 Cedar Lane", plan: "fiber-500"}
end_state:
  - path: reboot_attempted
    eq: true
  - path: ticket.id
    exists: true
  - path: dispatch.window
    exists: true
expected_tools:
  - name: verify_account
    args: {pin: "4471", last4: "9821", address: "14 Cedar Lane"}
  - name: walk_reboot
    args: {}
  - name: create_ticket
    args: {reason: "no-service", address: "14 Cedar Lane"}
  - name: dispatch_tech
    args: {window: "am"}
tool_order:
  - {before: walk_reboot, after: dispatch_tech}
entities:
  - {name: last4, value: "9821", in_tools: true, in_speech: true, tool: verify_account, arg: last4}
  - {name: error, value: "840", in_speech: true, in_tools: false}
policy:
  - Reboot before a truck roll. Read the ticket number back. Stay coherent over a long call.
agent_replies:
  - "Regional internet support."
  - "No area outage. Reboot failed, ticket T-1842, morning tech at 14 Cedar Lane, error 840, last four 9821."
