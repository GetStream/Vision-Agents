id: healthcare.selectivity
pack: healthcare
category: checklist
name: Keep talking through a cough during identity
persona: Patient calling from a noisy hallway.
max_duration_s: 180
noise: conversation
snr_db: 10
turns:
  - id: intro
    text: "Maya Chen, born March 4 1987, member ABC123456. Move Thursday 2pm with Dr Chen to Tuesday morning."
    trigger: {kind: after_agent_turn, delay_ms: 400}
  - id: cough
    overlap_sound: cough
    trigger: {kind: during_agent_after_ms, after_ms: 400}
  - id: confirm
    text: "That cough was me, not a new patient. Still Maya, Tuesday morning."
    trigger: {kind: after_agent_turn, delay_ms: 400}
seed:
  patients:
    - {id: p1, name: "Maya Chen", dob: "1987-03-04", member_id: ABC123456}
  appointments:
    - {id: a1, patient_id: p1, clinician: "Dr Chen", date: "Thursday", time: "2pm", location: "Main clinic"}
end_state:
  - path: appointment.date
    eq: Tuesday
expected_tools:
  - name: verify_identity
    args: {name: "Maya Chen", dob: "1987-03-04", member_id: ABC123456}
  - name: reschedule_appointment
    args: {appointment_id: a1, new_date: Tuesday, new_time: morning}
entities:
  - {name: member, value: ABC123456, in_tools: true, in_speech: true, tool: verify_identity, arg: member_id}
policy:
  - Do not stop the reply for a cough. Do not treat hallway talk as a new caller.
judge:
  task: Agent should continue through the cough and complete Maya's reschedule.
agent_replies:
  - "Clinic after hours."
  - "Maya Chen verified, member ABC123456. Thursday 2pm moved to Tuesday morning."
