[project]
name = "voicebench-agents"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
  "python-dotenv>=1.0",
  "vision-agents",
  "vision-agents-plugins-getstream",
  "vision-agents-plugins-openai",
  "vision-agents-plugins-stream",
  "fastapi",
  "uvicorn",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voicebench_agents"]

[tool.uv.sources]
"vision-agents" = {path = "../../sdks/python", editable=true}
"vision-agents-plugins-getstream" = {path = "../../plugins/getstream", editable=true}
"vision-agents-plugins-openai" = {path = "../../plugins/openai", editable=true}
"vision-agents-plugins-stream" = {path = "../../plugins/stream", editable=true}
