name: vision_agents_rtc
description: >-
  Talk to a Stream Vision Agent out loud: joins the call the agent is on with Stream Video,
  and renders the agent's video beside the device camera.
version: 0.1.0
repository: https://github.com/GetStream/Vision-Agents/tree/accelerate/sdks/dart/rtc
topics: [ai, agents, voice, video, stream]

# Stream Video 1.6's floor.
environment:
  sdk: ^3.10.0
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter
  # A hosted constraint, resolved to ../core in this repository by pubspec_overrides.yaml.
  vision_agents_core: ^0.1.0
  stream_video_flutter: 1.6.0
  # Makes the camera's pictures into the JPEGs the agent is sent, in pure Dart.
  image: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Runs the half second between the camera's pictures in a test without waiting for it.
  fake_async: ^1.3.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
