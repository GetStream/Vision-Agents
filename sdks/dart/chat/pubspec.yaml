name: vision_agents_chat
description: >-
  A Stream Vision Agents conversation kept in Stream Chat: the channel a session is kept in,
  on one Stream Chat client shared by every session, or on the app's own.
version: 0.1.0
repository: https://github.com/GetStream/Vision-Agents/tree/accelerate/sdks/dart/chat
topics: [ai, agents, chat, stream]

# Stream Chat 10.4's floor, which is higher than the core's.
environment:
  sdk: ^3.12.0

dependencies:
  # A hosted constraint, resolved to ../core in this repository by pubspec_overrides.yaml.
  vision_agents_core: ^0.1.0
  # Pure Dart, so this package is too, and the ui package's Flutter half stays optional.
  stream_chat: 10.4.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.32.0
