package: acceleration
# Paths are resolved against the working directory, so generation runs from sdks/go/.
output: acceleration/generated.go
generate:
  models: true
  client: true
output-options:
  skip-prune: true
  # The sockets are in the spec so a reader knows they exist, but a generated client
  # cannot express an upgrade. They are hand-written in stream/socket.go, the same way the
  # server side of them is hand-written in acceleration/internal/api. openSocketSession has
  # no Go client yet.
  exclude-operation-ids:
    - watchSession
    - streamModality
    - dispatchCalls
    - openSocketSession
  # Staff operations (/v1/ops/*, /v1/manage/*) are Stream's own, reached with a staff key and
  # never by a customer. They stay in the spec, which Stream's staff tools are typed from.
  exclude-tags:
    - Staff
