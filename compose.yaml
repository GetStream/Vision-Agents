name: vision-agents

# Every port is published on this machine's loopback only: Postgres keeps its default
# password, Redis has none, and the router may run with no auth. ROUTER_PUBLISH_ADDRESS
# publishes the router on another address, such as 0.0.0.0 for a phone on the same network.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: model_router
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d model_router"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  router:
    build:
      context: ./acceleration
    image: vision-agents-router
    # Provider credentials come from the repo-root .env; the two below are the
    # ones that differ inside the network and so are set here instead.
    env_file:
      - path: .env
        required: false
    environment:
      ROUTER_POSTGRES_DSN: postgres://postgres:postgres@postgres:5432/model_router?sslmode=disable
      ROUTER_REDIS_ADDR: redis:6379
      # The usage service below. While it is down the rows wait in Postgres to be shipped.
      ROUTER_USAGE_URL: http://usage:8070
      ROUTER_USAGE_TOKEN: ${USAGE_INGEST_TOKEN:-local-usage-token}
      # The Redis the usage service mirrors spend to, which spend limits read every second.
      ROUTER_USAGE_REDIS_URL: redis://redis:6379
    ports:
      - "${ROUTER_PUBLISH_ADDRESS:-127.0.0.1}:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # The usage service, from the router's image, on a database of its own. The router ships
  # the usage it records here.
  usage-db:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: postgres
    command: >-
      sh -c "psql -h postgres -U postgres -tAc \"SELECT 1 FROM pg_database WHERE datname = 'usage'\" | grep -q 1
      || psql -h postgres -U postgres -c 'CREATE DATABASE usage'"
    depends_on:
      postgres:
        condition: service_healthy

  # Runs the router's image, which only the router builds: `docker compose build router`.
  usage:
    image: vision-agents-router
    pull_policy: never
    entrypoint: ["usage"]
    environment:
      USAGE_POSTGRES_DSN: postgres://postgres:postgres@postgres:5432/usage?sslmode=disable
      USAGE_REDIS_URL: redis://redis:6379
      USAGE_INGEST_TOKEN: ${USAGE_INGEST_TOKEN:-local-usage-token}
      USAGE_MANAGE_KEY: ${USAGE_MANAGE_KEY:-local-usage-manage-key}
      # Made-up tiers for the local stack; the start adds the ones the database lacks.
      USAGE_TIERS_FILE: /etc/usage/tiers.json
    volumes:
      - ./acceleration/tiers/dev.json:/etc/usage/tiers.json:ro
    ports:
      - "127.0.0.1:8070:8070"
    healthcheck:
      test: ["CMD", "usage", "healthcheck"]
      interval: 5s
      retries: 10
    depends_on:
      usage-db:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  dashboard:
    build:
      context: ./dashboard
      args:
        NEXT_PUBLIC_ROUTER_URL: http://localhost:8080
        NEXT_PUBLIC_CUSTOMER_ID: examples
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - router

volumes:
  pgdata:
