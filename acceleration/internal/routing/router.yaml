    # Breeze TTS 2 on our own Baseten deployment. Two languages only, and it performs a
    # vocal event the way the ElevenLabs v3 socket does, so it sits in the high-quality
    # tier where being expressive is worth waiting a little for.
    #
    # The price is the GPU: Breeze report a real-time factor of 0.32 against S2 Pro's
