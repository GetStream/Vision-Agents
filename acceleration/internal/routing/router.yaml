llm:
  providers:
    # Flash is a 284B mixture-of-experts model with only 13B active per token, which is why
    # it answers fast enough for a conversation. Reasoning is off by default, so the first
    # word of the answer is the first thing that arrives.
    - provider: deepseek
      model: DeepSeek-V4-Flash-0731
      description: "A 284B mixture-of-experts with 13B active per token, so it answers fast. The cheapest model here."
      languages: [ar, de, en, es, fr, hi, id, it, ja, ko, nl, pl, pt, ru, th, tr, vi, zh]
      realtime: true
      tier: low-latency
      price:
        per_million_input_tokens: 0.13
        per_million_cached_input_tokens: 0.028
        per_million_output_tokens: 0.26

    - provider: openai
      model: gpt-5.6-luna
      description: "OpenAI's small, fast model. Reads images, and costs little."
      languages: [ar, de, en, es, fr, hi, id, it, ja, ko, nl, pl, pt, ru, th, tr, vi, zh]
      realtime: true
      tier: low-latency
      input_modalities: [image]
      price:
        per_million_input_tokens: 0.20
        per_million_cached_input_tokens: 0.02
        per_million_output_tokens: 1.20

    # GPT-6 Luna, which takes over from GPT-5.6 Luna as what vlm prefers: half the input
    # price and well under half the output, and Artificial Analysis put it at the lowest cost
    # per task of any model on their board. OpenAI default it to medium reasoning effort; the
    # provider asks for none unless a request names one, so the first word of the answer is
    # the first thing that arrives.
    #
    # OpenAI do not train on API traffic unless the organisation opts in, so that half is a
    # no. Retention is the gap. Abuse-monitoring logs are kept for up to 30 days, but a
    # response sent without store: false - which is how this provider sends one unless asked
    # to store it - is kept as application state for "at least 30 days", a floor with no
    # ceiling, so it is unspecified. Zero Data Retention would bring it to none, and it is an
    # approval OpenAI grant per organisation rather than a flag sent with a request.
    - provider: openai
      model: gpt-6-luna
      description: "OpenAI's most efficient model, and what Vision prefers. Reads images, and the cheapest OpenAI model here."
      languages: [ar, de, en, es, fr, hi, id, it, ja, ko, nl, pl, pt, ru, th, tr, vi, zh]
      realtime: true
      tier: low-latency
      input_modalities: [image]
      data_policy:
        trains_on_data: "no"
        retention: unspecified
      price:
        per_million_input_tokens: 0.10
        per_million_cached_input_tokens: 0.01
        per_million_output_tokens: 0.50

    # What llm-fast prefers, so this is the model a conversation gets unless it is down. It
    # is the dearest of this tier by some way and its thinking is billed as output, which is
    # why the provider asks for the low thinking level rather than the medium it defaults to.
    # These are Google's introductory rates and double on 1 January 2027.
    - provider: gemini
      model: gemini-3.8-flash
      description: "Quick and strong, and what llm-fast prefers. Reads images. The dearest of the fast tier."
      languages: [ar, de, en, es, fr, hi, id, it, ja, ko, nl, pl, pt, ru, th, tr, vi, zh]
      realtime: true
      tier: low-latency
      input_modalities: [image]
      price:
        per_million_input_tokens: 0.75
        per_million_cached_input_tokens: 0.075
        per_million_output_tokens: 3.75

    # Self-hosted, so there is no per-token bill: the deployment is charged by the minute.
    # The rates below convert Baseten's H100 rate of $0.10833/min at an assumed 1500 output
    # tokens per second across the batch, with prefill taken as five times cheaper than
    # decode. They are an estimate of what this deployment costs us, not a published price.
    # Thinking stays off: the live path wants the first word, not a think-then-speak turn.
    - provider: gemma
      model: gemma-4-26B-A4B-it
      description: "Open weights on our own GPUs: 26B with 4B active, billed by the GPU minute rather than the token."
      languages: [ar, de, en, es, fr, hi, id, it, ja, ko, nl, pl, pt, ru, th, tr, vi, zh]
      realtime: true
      tier: low-latency
      price:
        per_million_input_tokens: 0.24
        per_million_output_tokens: 1.20

