# Provider capabilities and the capability shortcuts that resolve to them, one section per
# modality. Adding a provider or model is a config edit, not a code change.
#
# tier is what a model optimises for: low-latency for a live conversation, high-quality
# when it can take longer. It defaults to low-latency.
#
# price is in US dollars and is whatever this deployment is billed, so it is config rather
# than fact: check each vendor's pricing page, and for a self-hosted model divide the GPU
# hour by the throughput you measured. A model sets whichever unit it is billed in and
# leaves the rest at zero, and a model with no price reports a cost of zero.
#
# supports lists the optional terms a model can express: diarization, a speaking speed, a
# domain filter. A request asking for one is only routed to a model that declared it, so a
# term is either honoured or the request is refused - never dropped in silence. A model
# that declares nothing serves every request that asks for nothing, which is most of them.
# The list is what the code behind the model actually sends upstream, so adding a term here
# is a claim about the provider package as much as about the vendor.
#
# data_policy is what happens to what a model is sent, and every model that hears or speaks
# must declare it. Like the price it is config rather than fact: what a vendor does with our audio
# depends on which plan we are on, which flags we send and whether an admin switched zero
# retention on, and none of that is in a vendor's documentation. trains_on_data is yes, no
# or unknown, and retention is none, a duration such as 30d, unspecified for a provider
# that stores something without saying for how long, or unknown for one that has published
# nothing. A request naming a data policy is routed only to models that meet it, and
# unknown and unspecified meet nothing - a vendor who has said nothing is not a vendor who
# has said no.

stt:
  providers:
    # Deepgram do not store transcripts, and a request that asked not to be trained on
    # carries mip_opt_out=true, which is what excludes it from the Model Improvement
    # Partnership Program - their only route from an API request into a training set.
    # Opted-out requests are "retained only for the duration necessary to process the
    # request", and show as opted out in their own usage logs, so this is auditable
    # rather than taken on trust.
    #
    # Neither Flux model declares profanity_filter or verbatim, and the reason is our own
    # code rather than the vendor's. Deepgram's pages disagree three ways about whether
    # Flux accepts profanity_filter and filler_words, but the question does not arise:
    # FluxTranscriptionOptions in the Go SDK has neither field and there is no escape
    # hatch for an extra query parameter, so this package cannot send them. supports is a
    # promise about what the provider package really transmits, so it stays quiet.
    - provider: deepgram
      model: flux-general-en
      description: "Deepgram's live transcriber with built-in turn detection, the one the others are measured against. English only."
      benchmark: { word_error_rate: 0.074, latency_ms: 21 }
      languages: [en]
      realtime: true
      tier: low-latency
      supports: [keyterms, endpointing]
      data_policy:
        trains_on_data: "no"
        retention: none
      price:
        per_audio_hour: 0.276

    - provider: deepgram
      model: flux-general-multi
      description: "The multilingual Flux: the same turn detection in 12 languages."
      languages: [en, es, fr, de, hi, it, ja, ko, nl, pt, ru, zh]
      realtime: true
      tier: low-latency
      supports: [keyterms, endpointing]
      data_policy:
        trains_on_data: "no"
        retention: none
      price:
        per_audio_hour: 0.276

    # Gemini 3.5 Transcribe over the Live API. It detects the language itself and claims
    # 85+ of them; the list here is the ones this deployment routes on. Billed per token
    # rather than per hour of audio: $3.50/1M audio in at 25 tokens a second, plus
    # $21.00/1M text out, which Google puts at about $0.009 an audio minute.
    - provider: gemini
      model: gemini-3.5-transcribe-live
      description: "Detects the language itself and can tidy the transcript as it writes it. About -e.009 an audio minute."
      benchmark: { word_error_rate: 0.04, latency_ms: 395 }
      languages:
        [
          ar,
          bg,
          cs,
          da,
          de,
          el,
          en,
          es,
          et,
          fi,
          fr,
          he,
          hi,
          hr,
          hu,
          id,
          it,
          ja,
          ko,
          lt,
          lv,
          nl,
          no,
          pl,
          pt,
          ro,
          ru,
          sk,
          sl,
          sv,
          th,
          tr,
          uk,
          vi,
          zh,
        ]
      realtime: true
      tier: low-latency
      # The only model here that can be asked for a smart transcript: mode SMART removes
      # disfluencies, tidies the grammar, formats the result and resolves spoken
      # self-corrections. VERBATIM is its default and what everything else does.
      supports: [keyterms, verbatim, smart]
      # The paid tier does not train: Google "doesn't use your prompts ... or responses to
      # improve our products". Retention is the gap. They log prompts and responses "for a
      # limited period of time" for abuse detection and publish no figure, and there is no
      # zero-retention path on the Gemini Developer API at all - ZDR and a BAA exist only
      # on Vertex. So this cannot serve a request that names a retention ceiling, which is
      # the honest answer until the route moves to Vertex.
      data_policy:
        trains_on_data: "no"
        retention: unspecified
      price:
        per_audio_hour: 0.54

    # 25 languages; see nvidia/parakeet-tdt-0.6b-v3. Self-hosted on an L4, so the price is
    # the GPU rather than a per-hour-of-audio rate. Measured throughput on one replica.
    - provider: parakeet
      model: parakeet-tdt-0.6b-v3
      description: "Open weights on our own GPU, in 25 languages. No third party hears the audio."
      languages:
        [
          bg,
          cs,
          da,
          de,
          el,
          en,
          es,
          et,
          fi,
          fr,
          hr,
          hu,
          it,
          lt,
          lv,
          mt,
          nl,
          pl,
          pt,
          ro,
          ru,
          sk,
          sl,
          sv,
          uk,
        ]
      realtime: true
      tier: low-latency
      # The strongest data policy here, and the only one that is a fact about where the
      # weights run rather than a promise by a vendor: CC-BY-4.0 weights on our own GPU,
      # so no third party is sent the audio and there is nobody to keep it.
      data_policy:
        trains_on_data: "no"
        retention: none
      price:
        per_audio_hour: 0.079

    # The same weights as the entry above, on Together's serverless endpoint rather than
    # our own deployment. Kept as a separate provider because the bill and the pager are
    # not shared, so routing has to be able to pick between them. Together charge
    # $0.0035 a minute for the streaming variant, which is the rate below.
    - provider: together-parakeet
      model: nvidia/parakeet-tdt-0.6b-v3-realtime
      description: "The same Parakeet weights on Together's serverless endpoint."
      languages:
        [
          bg,
          cs,
          da,
          de,
          el,
          en,
          es,
          et,
          fi,
          fr,
          hr,
          hu,
          it,
          lt,
          lv,
          mt,
          nl,
          pl,
          pt,
          ro,
          ru,
          sk,
          sl,
          sv,
          uk,
        ]
      realtime: true
      tier: low-latency
      # Training is a separate opt-in and off by default. Retention is not: Together
      # "stores the prompts you send and the responses models return" unless an org admin
      # turns zero retention on in organisation settings, and it is not retroactive. Their
      # transcription page claims ZDR is the default and their ZDR page and privacy policy
      # both say it is not; the ZDR page wins. Unlike xAI's, this is not readable from an
      # API response, and there is no TOGETHER_API_KEY in this deployment to read it with,
      # so it stays unspecified: an admin has to look at organisation settings and set
      # this to none. Until then this model serves no request that names a retention.
      data_policy:
        trains_on_data: "no"
        retention: unspecified
      price:
        per_audio_hour: 0.21

    # NVIDIA's Nemotron 3 ASR, on Together's serverless endpoint and reached over the same
    # realtime socket as the Parakeet above. A separate provider because it is a different
    # model family rather than a different host, and routing names a provider to pick one.
    #
    # English only, and NVIDIA recommend it over the multilingual model below for an
    # English call. Billed at $0.0015 a minute, which is the rate here.
    - provider: together-nemotron
      model: nvidia/nemotron-3-asr-streaming-0.6b
      description: "NVIDIA's Nemotron 3 on Together. English only, at -e.0015 a minute."
      benchmark: { word_error_rate: 0.07, latency_ms: 70 }
      languages: [en]
      realtime: true
      tier: low-latency
      # Together's, and so the same unresolved question as the Parakeet above: training is
      # opt-in and off, retention is on unless an org admin turns zero retention on. Set
      # this to none once ZDR is confirmed for our org.
      data_policy:
        trains_on_data: "no"
        retention: unspecified
      price:
        per_audio_hour: 0.09

    # Nemotron 3.5 ASR, the multilingual extension of the model above: the same cache-aware
    # architecture with language-ID prompt conditioning, so one checkpoint covers 40
    # language-locales and detects which one is being spoken rather than being told.
    #
    # The languages are NVIDIA's transcription-ready and broad-coverage tiers, 32 locales
    # collapsing to the 28 codes below. Their third tier - el, he, lt, lv, mt, nn, sl, th -
    # is recognised by the tokenizer but needs fine-tuning before it transcribes, so it is
    # left out: declaring it would route a call to a model that cannot serve it.
    #
    # Together price this at $0.0045 a minute on their pricing page and $0.0015 on their
    # serverless catalogue. The rate below is the higher of the two, so a bill that comes
    # in at the pricing page's number is one routing already expected.
    - provider: together-nemotron
      model: nvidia/nemotron-3.5-asr-streaming-0.6b
      description: "Multilingual Nemotron: works out which of 28 languages is being spoken."
      languages:
        [
          ar,
          bg,
          cs,
          da,
          de,
          en,
          es,
          et,
          fi,
          fr,
          hi,
          hr,
          hu,
          it,
          ja,
          ko,
          nb,
          nl,
          pl,
          pt,
          ro,
          ru,
          sk,
          sv,
          tr,
          uk,
          vi,
          zh,
        ]
      realtime: true
      tier: low-latency
      # Together's, so the same unresolved org setting as the two models above.
      data_policy:
        trains_on_data: "no"
        retention: unspecified
      price:
        per_audio_hour: 0.27

    # xAI's Speech to Text. The languages are the ones the `language` parameter accepts,
    # which is what turns on the written form of numbers and currencies; the model
    # transcribes any of them either way. Billed at $0.20 an hour of streaming audio,
    # against $0.10 for the batch endpoint this does not use.
    - provider: grok
      model: grok-stt
      description: "xAI's transcriber. Tells a bystander's voice from the caller's without being asked."
      benchmark: { word_error_rate: 0.027, latency_ms: 490 }
      languages:
        [
          ar,
          cs,
          da,
          de,
          en,
          es,
          fa,
          fil,
          fr,
          hi,
          id,
          it,
          ja,
          ko,
          mk,
          ms,
          nl,
          pl,
          pt,
          ro,
          ru,
          sv,
          th,
          tr,
          vi,
        ]
      realtime: true
      tier: low-latency
      # filler_words is documented identically on the batch endpoint and the streaming
      # socket, and its default is the clean transcript, so asking for verbatim here is
      # asking for something it does not do unless told. It is narrower than Gemini's
      # SMART, which is why the other half of that pair is not declared: this keeps the
      # ums, it does not rewrite the sentence.
      supports: [keyterms, diarize, verbatim]
      # xAI "never trains on your API inputs or outputs without your explicit
      # permission". Requests are kept encrypted for 30 days for abuse auditing and then
      # deleted. Team-wide zero retention is self-serve in their console and would make
      # this none, and this is asserted rather than assumed: /v1/api-key answers
      # x-zero-data-retention: false and x-data-retention: general for our team, which is
      # the 30 days below. Switch ZDR on there and this becomes none.
      data_policy:
        trains_on_data: "no"
        retention: 30d
      price:
        per_audio_hour: 0.20

    # Meta's Muse Voice Transcribe. The languages are named in full on the wire; the
    # provider translates these codes on the way out. Diarisation and endpointing are
    # the same model rather than a stage after it, and it is fed 80ms at a time because
    # that is the rate it turns audio into tokens at. Billed at $3 per 1,000 audio
    # minutes, which is the rate below.
    - provider: muse
      model: muse-voice-transcribe-1.0
      description: "Meta's transcriber, with speaker labels and endpointing built into the model."
      benchmark: { word_error_rate: 0.031, latency_ms: 163 }
      languages:
        [
          ar,
          bn,
          de,
          en,
          es,
          fr,
          he,
          hi,
          id,
          it,
          ja,
          kn,
          ko,
          mr,
          ms,
          nl,
          pl,
          pt,
          ta,
          te,
          th,
          tl,
          tr,
          vi,
          zh,
        ]
      realtime: true
      tier: low-latency
      supports: [keyterms, diarize]
      # The weakest disclosure here, and the reason unknown is a value this field
      # can take. Meta's terms commit to purposes for retention and never to a clock: no
      # duration, no deletion commitment, no page defining the zero-retention policy that
      # the handshake's own zdrOverride field overrides. Nothing states that audio sent to
      # Muse Voice Transcribe is not trained on either; that it is a Standard Service with
      # no contributor variant implies it, and an implication is not a declaration. So
      # this serves requests that ask nothing and no request that asks.
      data_policy:
        trains_on_data: unknown
        retention: unknown
      price:
        per_audio_hour: 0.18

    # Cartesia's Ink 2 on the socket that detects turns for itself, which is the same job
    # Flux does and much the same shape of protocol - Cartesia publish a migration guide
    # from one to the other. English only: they say multilingual is coming, and until it
    # does ink-whisper is where the other languages are, on the batch endpoint.
    #
    # Billed in credits at three a second of audio, silence included, which at the entry
    # self-serve rate of $50 a million credits is the figure below.
    - provider: cartesia
      model: ink-2
      description: "Cartesia's live transcriber with its own turn detection, much like Flux. English only."
      benchmark: { word_error_rate: 0.034, latency_ms: 431 }
      languages: [en]
      realtime: true
      tier: low-latency
      # keyterm is repeated on the query string, up to a hundred terms and 1200
      # characters, and turn_end_timeout_ms caps how long the model waits after the caller
      # stops before ending the turn, which is what asking for silence endpointing asks
      # for. The three turn-detection thresholds are this model's own and are reachable
      # through overwrites rather than standardised.
      supports: [keyterms, endpointing]
      # Cartesia's account, so the same answer as the Sonic entry in the tts block below:
      # opted in to training unless the account files the form, and Zero Data Retention an
      # Enterprise setting per workspace.
      data_policy:
        trains_on_data: "yes"
        retention: unspecified
      price:
        per_audio_hour: 0.54

    # Inworld's own STT model on their bidirectional streaming socket.
    #
    # That socket is a gateway in front of AssemblyAI, Soniox, Groq and Deepgram as well,
    # and none of those are reachable through this entry. Two of them are providers of
    # their own here, and reaching a model through somebody else's gateway would route
    # around the health and the price that make a fallback list mean anything.
    #
    # $0.15 an audio hour on demand, which is the rate below; a paid plan brings it to
    # $0.10 and a deployment on one edits this.
    - provider: inworld
      model: inworld-stt-1
      description: "Inworld's own streaming transcriber, at -e.15 an audio hour."
      benchmark: { word_error_rate: 0.042, latency_ms: 71 }
      languages:
        [
          ar,
          cs,
          da,
          de,
          el,
          en,
          es,
          fa,
          fi,
          fil,
          fr,
          hi,
          hu,
          id,
          it,
          ja,
          ko,
          mk,
          ms,
          nl,
          pl,
          pt,
          ro,
          ru,
          sv,
          th,
          tr,
          vi,
          yue,
          zh,
        ]
      realtime: true
      tier: low-latency
      # prompts is what this API calls keyterms, and it is the one biasing field the
      # gateway offers on every model. Turn detection is the model's own and tunable:
      # minEndOfTurnSilenceWhenConfident is the silence a caller asking for endpointing
      # means, and the confidence threshold behind it is an overwrite.
      supports: [keyterms, endpointing]
      # Inworld's account, so the same answer as the TTS entry below. Zero Data Retention
      # is arranged per workspace with their team rather than sent with a request, and
      # their published terms say what we may not do with their output and nothing about
      # what they do with our audio.
      data_policy:
        trains_on_data: unknown
        retention: unspecified
      price:
        per_audio_hour: 0.15

    # Scribe v2 Realtime, the streaming half of Scribe. The batch model below the fold in
    # the recording path is the more capable one - it diarises up to 32 speakers, tags
    # audio events and covers more languages - and this one is built for the 150ms a live
    # call needs instead.
    #
    # The languages are the two accuracy tiers ElevenLabs publish a word error rate for at
    # 10% or better, out of the ninety the model recognises. The rest are left out for the
    # reason Nemotron's third tier is: a language the vendor's own figures say it
    # transcribes badly is not one to route a call to.
    #
    # $0.39 an audio hour at the standard rate, before the $0.05 an hour keyterm prompting
    # adds; an annual Business plan brings the base to $0.28.
    - provider: elevenlabs
      model: scribe_v2_realtime
      description: "ElevenLabs' live Scribe, built for the 150 ms a live call needs."
      benchmark: { word_error_rate: 0.036, latency_ms: 141 }
      languages:
        [
          az,
          be,
          bg,
          bn,
          bs,
          ca,
          cs,
          da,
          de,
          el,
          en,
          es,
          et,
          fa,
          fi,
          fil,
          fr,
          gl,
          gu,
          hi,
          hr,
          hu,
          hy,
          id,
          is,
          it,
          ja,
          ka,
          kk,
          kn,
          lt,
          lv,
          mk,
          ml,
          mr,
          ms,
          mt,
          ne,
          nl,
          no,
          or,
          pl,
          pt,
          ro,
          ru,
          sk,
          sl,
          sr,
          sv,
          sw,
          ta,
          te,
          tr,
          uk,
          vi,
          yue,
          zh,
        ]
      realtime: true
      tier: low-latency
      # Fifty keyterms of twenty characters, against the batch model's thousand of fifty,
      # and a voice activity detector whose silence threshold is what endpointing asks
      # for. diarize is deliberately absent: ElevenLabs say plainly that the realtime
      # model does not name the speaker and that batch Scribe is where that lives, so a
      # request asking to be told who spoke is routed elsewhere rather than answered by
      # something that cannot. no_verbatim is real here and undeclared for now, because
      # nothing sends it.
      supports: [keyterms, endpointing]
      # ElevenLabs' account, so the same answer as the three TTS entries below: self-serve
      # accounts are opted in to training, history is kept with no published window, and
      # Zero Retention Mode is Enterprise-only.
      data_policy:
        trains_on_data: "yes"
        retention: unspecified
      price:
        per_audio_hour: 0.39

    # Nova-3 on the batch listen endpoint, which is the recording path rather than the
    # live one. It is not a Flux model: Flux exists to decide where a turn ended while
    # somebody is still talking, and a recording has the whole file in front of it, which
    # is what makes this both cheaper per hour and more accurate. $0.0043 an audio minute,
    # which is the rate below.
    - provider: deepgram
      model: nova-3
      description: "Deepgram's batch model for recordings. Cheaper and more accurate, but not for live calls."
      benchmark: { word_error_rate: 0.066, latency_ms: 66 }
      languages: [de, en, es, fr, hi, it, ja, nl, pt, ru]
      realtime: false
      tier: high-quality
      supports:
        [
          detect_language,
          diarize,
          words,
          format,
          redact,
          summary,
          entities,
          keyterms,
          channels,
          profanity_filter,
        ]
      # profanity_filter is the one Deepgram's own pages agree this model takes, and the
      # batch path builds its own query string, so it can be sent. verbatim is not
      # declared: filler_words is sent when asked, and an integration test confirms the
      # request is accepted, but their comparison table says this model strips the ums
      # whatever the parameter says. A term is declared once it is known to be honoured,
      # not once it is known to be accepted.
      data_policy:
        trains_on_data: "no"
        retention: none
      price:
        per_audio_hour: 0.258

  aliases:
    # The two groups Vision Agents maintains so that a config does not have to, and the
    # only ones offered as a choice. A customer who wants the models we would pick for a
    # live call names one of these and gets the list as it is reviewed here, rather than
    # copying today's answer into their own config and keeping it.
    #
    # Both name their members outright, which everything below avoids and the field's own
    # documentation warns about: a name here is a judgement about which models are wanted
    # rather than a fact about what they can do, so it goes stale in the way a requirement
    # does not. That is what these are for, and the cost of it is that the lists have to be
    # re-read rather than trusted. Last reviewed 2026-09.

    # Fast: answering before the caller wonders whether the line dropped. Flux is pinned
    # because Deepgram's turn detector is the one the other three are measured against,
    # with the multilingual Flux beside it so a caller who is not speaking English still
    # lands on Deepgram; then Ink 2, whose migration guide is written from that exact
    # model, then Inworld, then Nemotron on Together, the cheapest of them by a factor of
    # six. Health orders the four behind the pin, which is what naming a group means.
    stt-fast:
      title: Speed
      description: "Stream's pick for a live call: Deepgram Flux first, then Ink 2, Inworld and Nemotron as failover."
      require_realtime: true
      tier: low-latency
      prefer: deepgram/flux-general-en
      only:
        - deepgram/flux-general-en
        - deepgram/flux-general-multi
        - cartesia/ink-2
        - inworld/inworld-stt-1
        - together-nemotron/nvidia/nemotron-3-asr-streaming-0.6b

    # Accurate: the same live path, ordered by how well it hears rather than how quickly.
    # Muse is pinned because it is the one of the four that names the voice as well, so a
    # config that goes on to ask for diarize: true narrows to the model this group already
    # starts with rather than to a different one.
    #
    # No tier requirement, for the reason en-high-accuracy gives: accuracy is worth waiting
    # for, so a slower live model belongs here. All four happen to be low-latency today, and
    # declaring that would turn replacing one of them with a better, slower model into a
    # config that refuses to load.
    stt-accurate:
      title: Accuracy
      description: "Stream's pick for hearing every word: Muse first, which also labels speakers, then Scribe, Ink 2 and Nemotron."
      require_realtime: true
      prefer: muse/muse-voice-transcribe-1.0
      only:
        - muse/muse-voice-transcribe-1.0
        - elevenlabs/scribe_v2_realtime
        - cartesia/ink-2
        - together-nemotron/nvidia/nemotron-3-asr-streaming-0.6b

    # The transcribers an English call is trusted to. Every live model here is realtime
    # and low-latency and speaks English, so nothing any of them declares tells these
    # apart from the rest and the names have to be given outright. Gemini, the two
    # Parakeets, Ink 2, Inworld and Scribe stay reachable through the shortcuts below and
    # by naming a provider and model. Grok is the one of these four that names the voice
    # without being asked, and so the one that can tell a bystander at the caller's
    # microphone from the caller.
    en-low-latency:
      languages: [en]
      require_realtime: true
      tier: low-latency
      only:
        - deepgram/flux-general-en
        - deepgram/flux-general-multi
        - grok/grok-stt
        - muse/muse-voice-transcribe-1.0

    multilingual-low-latency:
      multilingual: true
      require_realtime: true
      tier: low-latency

    # The recording path. It excludes the live models rather than merely allowing the
    # batch ones, because a whole recording streamed at a socket is the expensive way to
    # do the thing this alias exists for.
    en-recorded:
      languages: [en]
      require_recorded: true

    multilingual-recorded:
      multilingual: true
      require_recorded: true

    # No tier requirement: accuracy is worth waiting for, so a slower live model is a
    # candidate here. It is still the live path, though - a recording belongs at
    # en-recorded, where the batch models are.
    en-high-accuracy:
      languages: [en]
      require_realtime: true

    multilingual-high-accuracy:
      multilingual: true
      require_realtime: true

