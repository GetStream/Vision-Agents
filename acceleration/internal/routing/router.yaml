      input_modalities: [image]
      price:
        per_million_input_tokens: 0.75
        per_million_cached_input_tokens: 0.075
        per_million_output_tokens: 3.75

    # Self-hosted, so there is no per-token bill: the deployment is charged by the minute.
    # The rates below convert Baseten's H100 rate of $0.10833/min at an assumed 1500 output
    # tokens per second across the batch, with prefill taken as five times cheaper than
