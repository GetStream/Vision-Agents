          ja,
          ko,
          ms,
          nl,
          no,
          pl,
          pt,
          ro,
          ru,
          sk,
          sv,
          ta,
          tr,
          uk,
          vi,
          zh,
        ]
      realtime: false
      tier: high-quality
      supports: [speed, stability, format]
      data_policy:
        trains_on_data: "yes"
        retention: unspecified
      price:
        per_million_chars: 110.0

  aliases:
    en-low-latency:
      languages: [en]
      require_realtime: true
      tier: low-latency

    multilingual-low-latency:
      multilingual: true
      require_realtime: true
      tier: low-latency

    en-recorded:
      languages: [en]
      require_recorded: true

    multilingual-recorded:
      multilingual: true
      require_recorded: true

    en-high-accuracy:
      languages: [en]
      require_realtime: true
      tier: high-quality

    multilingual-high-accuracy:
      multilingual: true
      require_realtime: true
      tier: high-quality

llm:
  providers:
    # Flash is a 284B mixture-of-experts model with only 13B active per token, which is why
    # it answers fast enough for a conversation. Reasoning is off by default, so the first
    # word of the answer is the first thing that arrives.
    - provider: deepseek
      model: DeepSeek-V4-Flash-0731
      languages: [ar, de, en, es, fr, hi, id, it, ja, ko, nl, pl, pt, ru, th, tr, vi, zh]
      realtime: true
      tier: low-latency
      price:
        per_million_input_tokens: 0.13
        per_million_cached_input_tokens: 0.028
        per_million_output_tokens: 0.26

    - provider: openai
      model: gpt-5.6-luna
      languages: [ar, de, en, es, fr, hi, id, it, ja, ko, nl, pl, pt, ru, th, tr, vi, zh]
      realtime: true
      tier: low-latency
      price:
        per_million_input_tokens: 0.20
        per_million_cached_input_tokens: 0.02
        per_million_output_tokens: 1.20

    # What llm-fast prefers, so this is the model a conversation gets unless it is down. It
    # is the dearest of this tier by some way and its thinking is billed as output, which is
    # why the provider asks for the low thinking level rather than the medium it defaults to.
    # These are Google's introductory rates and double on 1 January 2027.
    - provider: gemini
      model: gemini-3.8-flash
      languages: [ar, de, en, es, fr, hi, id, it, ja, ko, nl, pl, pt, ru, th, tr, vi, zh]
      realtime: true
      tier: low-latency
      price:
        per_million_input_tokens: 0.75
        per_million_cached_input_tokens: 0.075
        per_million_output_tokens: 3.75

    # Self-hosted, so there is no per-token bill: the deployment is charged by the minute.
    # The rates below convert Baseten's H100 rate of $0.10833/min at an assumed 1500 output
    # tokens per second across the batch, with prefill taken as five times cheaper than
    # decode. They are an estimate of what this deployment costs us, not a published price.
    # Thinking stays off: the live path wants the first word, not a think-then-speak turn.
    - provider: gemma
      model: gemma-4-26B-A4B-it
      languages: [ar, de, en, es, fr, hi, id, it, ja, ko, nl, pl, pt, ru, th, tr, vi, zh]
      realtime: true
      tier: low-latency
      price:
        per_million_input_tokens: 0.24
        per_million_output_tokens: 1.20

    # Gemma 4 31B on Cerebras' public inference API, around 1500 tokens a second. Reasoning
    # stays off: the live path wants the first word, not a think-then-speak turn.
    - provider: cerebras
      model: gemma-4-31b
      languages: [ar, de, en, es, fr, hi, id, it, ja, ko, nl, pl, pt, ru, th, tr, vi, zh]
      realtime: true
      tier: low-latency
      price:
        per_million_input_tokens: 2.15
        per_million_output_tokens: 2.70

    # Pro is a 1.6T-parameter frontier model: better answers, and slow enough that it wants
    # to be off the live path unless the caller asked for quality.
    - provider: deepseek
      model: DeepSeek-V4-Pro-0813
      languages: [ar, de, en, es, fr, hi, id, it, ja, ko, nl, pl, pt, ru, th, tr, vi, zh]
      realtime: true
      tier: high-quality
      price:
        per_million_input_tokens: 1.32
        per_million_cached_input_tokens: 0.132
        per_million_output_tokens: 3.96

    - provider: openai
      model: gpt-5.6-terra
      languages: [ar, de, en, es, fr, hi, id, it, ja, ko, nl, pl, pt, ru, th, tr, vi, zh]
      realtime: true
      tier: high-quality
      price:
        per_million_input_tokens: 2.00
        per_million_cached_input_tokens: 0.20
        per_million_output_tokens: 12.00

    # Sol is the frontier tier, and what llm-thinking prefers, so this is the model the
    # skills run on unless it is down. OpenAI defaults it to medium reasoning effort, which
    # the provider also sends explicitly when this concrete model is selected.
    - provider: openai
      model: gpt-5.6-sol
      languages: [ar, de, en, es, fr, hi, id, it, ja, ko, nl, pl, pt, ru, th, tr, vi, zh]
      realtime: true
      tier: high-quality
      price:
        per_million_input_tokens: 5.00
        per_million_cached_input_tokens: 0.50
        per_million_output_tokens: 30.00

  aliases:
    en-low-latency:
      languages: [en]
      require_realtime: true
      tier: low-latency

    multilingual-low-latency:
      multilingual: true
      require_realtime: true
      tier: low-latency

    en-high-accuracy:
      languages: [en]
      tier: high-quality

    multilingual-high-accuracy:
      multilingual: true
      tier: high-quality

    # A fast answer, in whatever language. The shorthand a caller reaches for when the only
    # thing that matters is that the answer starts arriving.
    #
    # Gemini 3.8 Flash is preferred outright rather than left to the ranking, so the model a
    # conversation gets is the one this deployment chose. The rest of the tier is still here
    # to catch it being down.
    llm-fast:
      require_realtime: true
      tier: low-latency
      prefer: gemini/gemini-3.8-flash

    # What the flow controller runs on: it classifies every transcript revision into one
    # small JSON object saying who holds the floor, and it is asked constantly, including
    # while the caller is still talking. So it is pinned to a model that starts writing at
    # once rather than one that thinks first -- thinking spends the whole tiny token budget
    # before the JSON is closed, and adds a round trip of latency to every decision the
    # caller waits through. Pinned to Gemini for now so a Cerebras RPM limit does not
    # swallow barge-in follow-ups; prefer cerebras/gemma-4-31b again when the quota is back.
    llm-flow:
      require_realtime: true
      tier: low-latency
      prefer: gemini/gemini-3.8-flash

    # What a skill runs on: the model asked the part of a turn the talking model could not
    # answer itself. The conversation carries on while it thinks, so this is the shorthand
    # for quality over speed, and nothing here is chosen for how soon it starts.
    #
    # GPT-5.6 Sol is preferred outright rather than left to the ranking, for the same reason
    # llm-fast pins its own: the model that does the thinking is the one this deployment
    # chose. The rest of the tier is still here to catch it being down.
    llm-thinking:
      tier: high-quality
      prefer: openai/gpt-5.6-sol

# What is true today, which neither a model nor a handbook can answer. These providers all
# read the same web, so what separates them is whether a model writes the answer before it
# comes back: the low-latency tier returns pages and lets the conversation's own model read
# them, and the high-quality tier pays a second model and the seconds it takes to have the
# sentence written for it.
#
# Every one of them is billed by the call rather than by what it read, which is what
# per_thousand_requests prices. The languages are the ones this deployment routes on; all
# three search in more than these.
search:
  providers:
    # Exa's fast search: its own index, no crawl and no model, which is why it is the
    # quickest way to put sources in front of a conversation. $5 per 1,000 searches.
    - provider: exa
      model: fast
      languages: [ar, de, en, es, fr, hi, id, it, ja, ko, nl, pl, pt, ru, th, tr, vi, zh]
      realtime: true
      tier: low-latency
      supports: [domains, category, recency, location, contents]
      price:
        per_thousand_requests: 5.0

    # Perplexity's ranked index, which is the same endpoint their own answers are built on
    # with nothing written on top. $5 per 1,000 requests, whatever the request found.
    - provider: perplexity
      model: search
      languages: [ar, de, en, es, fr, hi, id, it, ja, ko, nl, pl, pt, ru, th, tr, vi, zh]
      realtime: true
      tier: low-latency
      price:
        per_thousand_requests: 5.0

    # Tavily searches its index and summarises in the same round trip, so it is the one
    # low-latency provider that answers in a sentence. Priced at the entry self-serve rate
    # of one credit a search.
    - provider: tavily
      model: basic
      languages: [ar, de, en, es, fr, hi, id, it, ja, ko, nl, pl, pt, ru, th, tr, vi, zh]
      realtime: true
      tier: low-latency
      price:
        per_thousand_requests: 8.0

    # Exa deciding for itself between its neural and keyword indexes. Better recall on a
    # question phrased the way somebody speaks, and slower than fast.
    - provider: exa
      model: auto
      languages: [ar, de, en, es, fr, hi, id, it, ja, ko, nl, pl, pt, ru, th, tr, vi, zh]
      realtime: true
      tier: high-quality
      supports: [domains, category, recency, location, contents]
      price:
        per_thousand_requests: 5.0

    # Tavily's advanced depth crawls the pages it finds rather than trusting the index
    # snippet, at two credits a search and roughly double the latency.
    - provider: tavily
      model: advanced
      languages: [ar, de, en, es, fr, hi, id, it, ja, ko, nl, pl, pt, ru, th, tr, vi, zh]
      realtime: true
      tier: high-quality
      price:
        per_thousand_requests: 16.0

    # Sonar reads the pages and writes the answer, so this is a language model in the
    # middle of a conversation and is priced and timed like one. The rate is the $5 per
    # 1,000 request fee at low context plus an allowance for the tokens a search-shaped
    # question spends, which is what makes it an estimate rather than a published number.
    - provider: perplexity
      model: sonar
      languages: [ar, de, en, es, fr, hi, id, it, ja, ko, nl, pl, pt, ru, th, tr, vi, zh]
      realtime: true
      tier: high-quality
      price:
        per_thousand_requests: 6.0

    # Sonar Pro searches more widely before it answers and costs more per request to do it.
    - provider: perplexity
      model: sonar-pro
      languages: [ar, de, en, es, fr, hi, id, it, ja, ko, nl, pl, pt, ru, th, tr, vi, zh]
      realtime: true
      tier: high-quality
      price:
        per_thousand_requests: 12.0

  aliases:
    en-low-latency:
      languages: [en]
      require_realtime: true
      tier: low-latency

    multilingual-low-latency:
      multilingual: true
      require_realtime: true
      tier: low-latency

    en-high-accuracy:
      languages: [en]
      tier: high-quality

    multilingual-high-accuracy:
      multilingual: true
      tier: high-quality

    # Whichever provider answers quickest, in whatever language. The shorthand a session
    # gets when nobody said which one they wanted.
    search-fast:
      require_realtime: true
      tier: low-latency
