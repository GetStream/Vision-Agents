      only:
        - gemma/gemma-4-26B-A4B-it
        - cerebras/gemma-4-31b
        - openai/gpt-5.6-luna

    # A fast answer, in whatever language. The shorthand a caller reaches for when the only
    # thing that matters is that the answer starts arriving.
    #
    # Gemini 3.8 Flash is preferred outright rather than left to the ranking, so the model a
    # conversation gets is the one this deployment chose. The rest of the tier is still here
    # to catch it being down.
    llm-fast:
      title: Fast
      description: "The quickest strong answer in any language, for a live conversation. Prefers Gemini 3.8 Flash and fails over to the rest of the fast tier."
      require_realtime: true
      tier: low-latency
      prefer: gemini/gemini-3.8-flash

    # The best answers a conversation can have, at the cost of waiting for them. GPT-5.6
    # Sol is preferred, with the rest of the quality tier as failover.
    llm-smart:
      title: Smart
      description: "The strongest models, for agents that must get hard questions right. Slower to answer. Prefers GPT-5.6 Sol."
      tier: high-quality
      prefer: openai/gpt-5.6-sol

    en-low-latency:
      languages: [en]
      require_realtime: true
      tier: low-latency

    # With no model preferred, the fast tier is ordered on health alone, so this is
    # whichever of them is answering quickest right now.
    multilingual-low-latency:
      multilingual: true
      require_realtime: true
      tier: low-latency

    en-high-accuracy:
      languages: [en]
      tier: high-quality

    multilingual-high-accuracy:
      multilingual: true
      tier: high-quality

    vlm:
      require_input_modalities: [image]
      prefer: openai/gpt-5.6-luna

    # What the flow controller runs on: it classifies every transcript revision into one
    # small JSON object saying who holds the floor, and it is asked constantly, including
    # while the caller is still talking. So it is pinned to a model that starts writing at
    # once rather than one that thinks first -- thinking spends the whole tiny token budget
    # before the JSON is closed, and adds a round trip of latency to every decision the
    # caller waits through. Pinned to Gemini for now so a Cerebras RPM limit does not
    # swallow barge-in follow-ups; prefer cerebras/gemma-4-31b again when the quota is back.
    llm-flow:
      require_realtime: true
      tier: low-latency
      prefer: gemini/gemini-3.8-flash

    # What a skill runs on: the model asked the part of a turn the talking model could not
    # answer itself. The conversation carries on while it thinks, so this is the shorthand
    # for quality over speed, and nothing here is chosen for how soon it starts.
    #
    # GPT-5.6 Sol is preferred outright rather than left to the ranking, for the same reason
    # llm-fast pins its own: the model that does the thinking is the one this deployment
    # chose. The rest of the tier is still here to catch it being down.
    llm-thinking:
      tier: high-quality
      prefer: openai/gpt-5.6-sol

    # What product data is analysed on: the model that reads a week of calls, tickets and
    # threads and writes what customers are asking for. That is a different intent from
    # quality over speed in a conversation, which is why it is not llm-thinking with another
    # name: nobody is waiting on the other end, and which model does the reading is a
    # decision about product data rather than about a skill. The tier answers it, and a
    # deployment that wants a particular model for it pins one with prefer.
    #
    # Jev, the model the product agent classifies signal with, is deliberately not here: it
    # is TypeSafe's System One model, which answers typed questions with probabilities and
    # writes no prose, so it is a tool in the agent rather than a provider in this catalogue.
    llm-analysis:
      tier: high-quality

    # What rules on a simulated conversation when the simulation names no model. Nobody is
    # waiting for the verdict, and the verdict is the point, so it is the quality tier. It
    # has no title because it is the simulation's default rather than a choice for a
    # conversation; a simulation that wants another model names one instead.
    llm-judge:
      multilingual: true
      tier: high-quality

    # What plays the caller in a simulation when the simulation names no model. It holds a
    # conversation in real time, so it is the fast tier on the same model llm-fast prefers.
    llm-scenario-runner:
      require_realtime: true
      tier: low-latency
      prefer: gemini/gemini-3.8-flash

# What is true today, which neither a model nor a handbook can answer. These providers all
# read the same web, so what separates them is whether a model writes the answer before it
# comes back: the low-latency tier returns pages and lets the conversation's own model read
# them, and the high-quality tier pays a second model and the seconds it takes to have the
# sentence written for it.
#
# Every one of them is billed by the call rather than by what it read, which is what
# per_thousand_requests prices. The languages are the ones this deployment routes on; all
# three search in more than these.
search:
  providers:
    # Exa's fast search: its own index, no crawl and no model, which is why it is the
    # quickest way to put sources in front of a conversation. $5 per 1,000 searches.
    - provider: exa
      model: fast
      description: "Exa's own index with no crawl and no model. The quickest way to put sources in front of a conversation."
      benchmark: { search_index: 68, cost_per_task: 0.159 }
      languages: [ar, de, en, es, fr, hi, id, it, ja, ko, nl, pl, pt, ru, th, tr, vi, zh]
      realtime: true
      tier: low-latency
      supports: [domains, category, recency, location, contents]
      price:
        per_thousand_requests: 5.0

    # Perplexity's ranked index, which is the same endpoint their own answers are built on
    # with nothing written on top. $5 per 1,000 requests, whatever the request found.
    - provider: perplexity
      model: search
      description: "Perplexity's ranked index, without an answer written on top."
      languages: [ar, de, en, es, fr, hi, id, it, ja, ko, nl, pl, pt, ru, th, tr, vi, zh]
      realtime: true
      tier: low-latency
      price:
        per_thousand_requests: 5.0

    # Tavily searches its index and summarises in the same round trip, so it is the one
    # low-latency provider that answers in a sentence. Priced at the entry self-serve rate
    # of one credit a search.
    - provider: tavily
      model: basic
      description: "Searches and summarises in one round trip, so it answers in a sentence and stays fast."
      benchmark: { search_index: 66, cost_per_task: 0.193 }
      languages: [ar, de, en, es, fr, hi, id, it, ja, ko, nl, pl, pt, ru, th, tr, vi, zh]
      realtime: true
      tier: low-latency
      price:
        per_thousand_requests: 8.0

    # Exa deciding for itself between its neural and keyword indexes. Better recall on a
    # question phrased the way somebody speaks, and slower than fast.
    - provider: exa
      model: auto
      description: "Exa picks neural or keyword search. Better on spoken questions, slower than fast."
      benchmark: { search_index: 74, cost_per_task: 0.127 }
      languages: [ar, de, en, es, fr, hi, id, it, ja, ko, nl, pl, pt, ru, th, tr, vi, zh]
      realtime: true
      tier: high-quality
      supports: [domains, category, recency, location, contents]
      price:
        per_thousand_requests: 5.0

    # Tavily's advanced depth crawls the pages it finds rather than trusting the index
    # snippet, at two credits a search and roughly double the latency.
    - provider: tavily
      model: advanced
      description: "Crawls the pages it finds. Two credits a search and about twice the latency."
      languages: [ar, de, en, es, fr, hi, id, it, ja, ko, nl, pl, pt, ru, th, tr, vi, zh]
      realtime: true
      tier: high-quality
      price:
        per_thousand_requests: 16.0

    # Sonar reads the pages and writes the answer, so this is a language model in the
    # middle of a conversation and is priced and timed like one. The rate is the $5 per
    # 1,000 request fee at low context plus an allowance for the tokens a search-shaped
    # question spends, which is what makes it an estimate rather than a published number.
    - provider: perplexity
      model: sonar
      description: "Reads the pages and writes the answer, so it is timed and priced like a language model."
      languages: [ar, de, en, es, fr, hi, id, it, ja, ko, nl, pl, pt, ru, th, tr, vi, zh]
      realtime: true
      tier: high-quality
      price:
        per_thousand_requests: 6.0

    # Sonar Pro searches more widely before it answers and costs more per request to do it.
    - provider: perplexity
      model: sonar-pro
      description: "Sonar that searches more widely before it answers, at a higher price."
      languages: [ar, de, en, es, fr, hi, id, it, ja, ko, nl, pl, pt, ru, th, tr, vi, zh]
      realtime: true
      tier: high-quality
      price:
        per_thousand_requests: 12.0

  aliases:
    # Whichever provider answers quickest, in whatever language. The shorthand a session
    # gets when nobody said which one they wanted.
    search-fast:
      title: Fast results
      description: "Whichever provider answers quickest, in any language. The conversation's own model reads the results."
      require_realtime: true
      tier: low-latency

    en-low-latency:
      languages: [en]
      require_realtime: true
      tier: low-latency

    multilingual-low-latency:
      multilingual: true
      require_realtime: true
      tier: low-latency

    en-high-accuracy:
      languages: [en]
      tier: high-quality

    multilingual-high-accuracy:
      title: Deeper search
      description: "Searches wider or reads the pages it finds, and some write the answer too. Better results, slower and dearer."
      multilingual: true
      tier: high-quality

# Typed judgements about a piece of text: a probability that a condition holds, one option
# out of a named set, a position on a described scale. What a guardrail asks before a reply
# is spoken, and what a flow controller asks about who holds the floor.
lcm:
  providers:
    # TypeSafe bill input tokens only and publish the rate per million, which is what this
    # is. Output tokens are free because there is no generated text to charge for: the
    # answer is a distribution.
    #
    # The language list is the model's rather than a locale setting: a question and the
    # text it is asked about are both natural language, and Jev is not configured per
    # language. It is declared broadly rather than left at English so a policy written in
    # German is not refused by routing for a reason that has nothing to do with the model.
    #
    # Zero retention and no training are what TypeSafe's terms say for API traffic. Like
    # every other data_policy here this is config rather than fact: it is worth re-reading
    # their terms rather than trusting this line.
    - provider: typesafe
      model: jev-latest
      languages: [ar, de, en, es, fr, hi, id, it, ja, ko, nl, pl, pt, ru, th, tr, vi, zh]
      realtime: true
      tier: low-latency
      data_policy:
        trains_on_data: "no"
        retention: none
      price:
        per_million_input_tokens: 0.042

  aliases:
    en-low-latency:
      languages: [en]
      require_realtime: true
      tier: low-latency

    multilingual-low-latency:
      multilingual: true
      require_realtime: true
      tier: low-latency

    # The accuracy shortcuts name no tier, which is not the oversight it looks like.
    # There is one classifier, and asking for the most accurate judgement available has
    # to resolve to it or the name means nothing here while meaning something everywhere
    # else. A slower, better judge earns the tier when one exists.
    en-high-accuracy:
      languages: [en]

    multilingual-high-accuracy:
      multilingual: true

    # The shorthand a guardrail gets when nobody said which model should judge. A
    # judgement on the live path is wanted quickly above all else.
    classify-fast:
      require_realtime: true
      tier: low-latency
