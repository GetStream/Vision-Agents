      model: s2-pro
      languages:
        [
          ar,
          de,
          en,
          es,
          fi,
          fr,
          hi,
          id,
          it,
          ja,
          ko,
          nl,
          pl,
          pt,
          ru,
          sv,
          th,
          tr,
