    #
    # Cache reads are 5% of input rather than the usual 10%, but the compatibility endpoint
    # does not cache, so that rate is what Anthropic bill rather than one this route reaches.
    - provider: anthropic
      model: claude-opus-5-5
      description: "Anthropic's Opus 5.5, top of the Artificial Analysis Intelligence Index. Reads images, and costs less than Sol."
      languages: [ar, de, en, es, fr, hi, id, it, ja, ko, nl, pl, pt, ru, th, tr, vi, zh]
      realtime: true
      tier: high-quality
      input_modalities: [image]
      # Anthropic's Commercial Terms say they "may not train models on Customer Content",
      # and API inputs and outputs are deleted "within 30 days of receipt or generation".
      # Opus 5.5 is not one of the Covered Models that require 30-day retention, so a zero
      # retention agreement would make this none; nothing in this deployment says we have one.
      data_policy:
        trains_on_data: "no"
        retention: 30d
      price:
        per_million_input_tokens: 4.00
        per_million_cached_input_tokens: 0.20
        per_million_output_tokens: 20.00

    # GPT-6 Sol is built for complex coding and agentic work, and what llm-thinking prefers,
