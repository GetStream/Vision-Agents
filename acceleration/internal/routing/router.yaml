# Speech to speech: one native audio model that hears the caller and speaks back, in place
# of a transcriber, a text model and a voice. Every entry is realtime, because there is no
# batch half of a conversation. The terms are the ones a model can be asked for beyond a
# voice and instructions: semantic_turns is a turn detector that reads the words rather than
# waiting out a pause, endpointing a pause whose length can be set, tools and text the
# ability to call a function or take a typed turn, and the two transcripts whether the model
# writes down what it heard and what it said.
#
# Prices are estimates. These models bill audio in, audio out and text at three different
# rates, and Price has one token bucket, so the audio rates are applied to every token and
# the split is lost. It is the perplexity/sonar treatment, and the same caveat: what makes
# it an estimate is the shape of Price, not the vendor's list.
sts:
  providers:
    # Gemini 3.8 Live, generally available since September 2026 and what Google now point
    # a voice agent at, so it is what sts-fast prefers. Artificial Analysis time it at
    # 1.18s to first audio against 0.96s for 3.1 Flash Live on minimal thinking, and put
    # it twelve points higher on quality; timed from the caller's last word against the
    # live API from here, VAD wait included, it came in a tenth of a second quicker.
    # Tools are non-blocking by default: the model closes its turn when it calls one, so a
    # slow tool no longer holds the conversation, though it stays quiet until the answer
    # comes. It takes no thinking level. Turns are a silence timer, not semantic. Billed
    # like 3.1: audio in at $3/1M tokens, out at $12/1M. Google do not train on paid-tier
    # traffic and log it "for a limited period of time" with no figure, with no
    # zero-retention path on the Developer API, so this cannot serve a request naming a
    # retention ceiling.
    - provider: gemini
      model: gemini-3.8-live
      description: "Google's default live voice, and what Fast conversational prefers. About a second to first audio, sees images, and a slow tool no longer holds the conversation."
      languages: [ar, de, en, es, fr, hi, id, it, ja, ko, nl, pl, pt, ru, th, tr, vi, zh]
      realtime: true
      tier: low-latency
      supports: [endpointing, tools, text, input_transcript, output_transcript]
      input_modalities: [image]
      data_policy:
        trains_on_data: "no"
        retention: unspecified
      price:
        per_million_input_tokens: 3.0
        per_million_output_tokens: 12.0

    # Gemini 3.8 Live Extended Thinking, a separate model id rather than a setting on the
    # one above. It reasons in the background and runs tools asynchronously while speaking
    # a filler, then the answer, which is why a reply here can span several of the API's
    # turns. First on the Artificial Analysis speech-to-speech index at 82.6 and on Tau
    # Voice at 68.6%, both at high thinking and 1.35s to first audio. It refuses a session
    # without a thinking level and the provider sends low, its floor, unless overwrites say
    # otherwise, so the benchmark figures are for a slower setting than the default. Same
    # rates as 3.8 Live, with the thinking billed as output. Same data terms.
    - provider: gemini
      model: gemini-3.8-live-extended-thinking
      description: "Top of the Artificial Analysis speech-to-speech board. Thinks in the background and talks while a tool runs. Sees images."
      languages: [ar, de, en, es, fr, hi, id, it, ja, ko, nl, pl, pt, ru, th, tr, vi, zh]
      realtime: true
      tier: high-quality
      supports: [endpointing, tools, text, input_transcript, output_transcript]
      input_modalities: [image]
      data_policy:
        trains_on_data: "no"
        retention: unspecified
      price:
        per_million_input_tokens: 3.0
        per_million_output_tokens: 12.0

    # Gemini 3.1 Flash Live, which Google now call a legacy preview in favour of 3.8 Live.
    # Kept rather than removed because it still answers, passes the live suite and is the
    # quickest of the three to first audio on Artificial Analysis' figures, and a config
    # that names it should not start failing before Google retire it. Its function calling
    # is synchronous only, so a tool that takes a while holds the conversation while it
    # runs. Same rates and data terms as 3.8 Live.
    - provider: gemini
      model: gemini-3.1-flash-live-preview
      description: "The previous Gemini live voice, now a legacy preview. Under a second to first audio. Tools run synchronously, so a slow tool holds the conversation."
      languages: [ar, de, en, es, fr, hi, id, it, ja, ko, nl, pl, pt, ru, th, tr, vi, zh]
      realtime: true
      tier: low-latency
      supports: [endpointing, tools, text, input_transcript, output_transcript]
      input_modalities: [image]
      data_policy:
        trains_on_data: "no"
        retention: unspecified
      price:
        per_million_input_tokens: 3.0
        per_million_output_tokens: 12.0

    # GPT-Realtime-2. The only model here with a semantic turn detector. Audio in at
    # $32/1M tokens, $0.40/1M cached, out at $64/1M. OpenAI do not train on API traffic
    # and keep it thirty days for abuse monitoring; zero retention is an enterprise setting.
    - provider: openai
      model: gpt-realtime-2
      description: "The only model here with semantic turn detection. Sees images. Among the dearest."
      languages: [ar, de, en, es, fr, hi, id, it, ja, ko, nl, pl, pt, ru, th, tr, vi, zh]
      realtime: true
      tier: high-quality
      supports: [semantic_turns, endpointing, tools, text, input_transcript, output_transcript]
      input_modalities: [image]
      data_policy:
        trains_on_data: "no"
        retention: 30d
      price:
        per_million_input_tokens: 32.0
        per_million_cached_input_tokens: 0.40
        per_million_output_tokens: 64.0

    # GPT-Live-1 is not a Realtime model: it is served by the Live API at /v1/live/sessions,
    # which is its own package. It listens and speaks at once, has no turn detector to tune,
    # does not see, and hands reasoning and tools to a Responses backend, gpt-5.6-terra
    # unless overwrites name another in backend_model. Tools therefore run while the model
    # keeps talking. It debuted top of the Artificial Analysis speech-to-speech index at
    # 81.5 with a GPT-6 Astra backend, but at 1.24-1.34s to first audio there. The voice
    # layer is $0.05 a minute of session, billed per second, priced here by the caller's
    # audio; the backend's tokens are billed on top and not counted, so this undercounts.
    # OpenAI name voices in English and Portuguese only and publish no language list.
    # They do not train on API traffic. Retention is unknown: the Live API is missing
    # from their per-endpoint table, and what the backend calls it makes keep is not said.
    - provider: openai
      model: gpt-live-1
      description: "Tops the Artificial Analysis board and keeps talking while a tool runs, but is slower to first audio and cannot see. Backend tokens are billed on top."
      languages: [en, pt]
      realtime: true
      tier: high-quality
      supports: [tools, text, input_transcript, output_transcript]
      data_policy:
        trains_on_data: "no"
        retention: unknown
      price:
        per_audio_hour: 3.0

    # xAI's Grok Voice over its OpenAI-compatible socket. It does not see, and it reports
    # no usage, so it is priced by the caller's audio: $0.05 a minute of conversation on
