        per_million_cached_input_tokens: 0.02
        per_million_output_tokens: 1.20

    # What llm-fast prefers, so this is the model a conversation gets unless it is down. It
    # is the dearest of this tier by some way and its thinking is billed as output, which is
    # why the provider asks for the low thinking level rather than the medium it defaults to.
    # These are Google's introductory rates and double on 1 January 2027.
    - provider: gemini
      model: gemini-3.8-flash
      description: "Quick and strong, and what llm-fast prefers. Reads images. The dearest of the fast tier."
      languages: [ar, de, en, es, fr, hi, id, it, ja, ko, nl, pl, pt, ru, th, tr, vi, zh]
