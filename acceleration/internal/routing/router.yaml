  # A title offers a shortcut to someone picking a model, in the order written here, so
  # the one a conversation gets by default comes first.
  aliases:
    # Small talk, as cheaply and quickly as it can be had: the smallest models here, for
    # an agent whose turns are short and whose instructions are simple. Gemma 4 26B, with
    # 4B active per token, is preferred; Gemma 4 31B on Cerebras and GPT-5.6 Luna catch it
    # being down. Like the STT groups this names its members, since being small is not
    # something a model declares.
    llm-conversational:
      title: Conversational
      description: "Super lightweight models for simple, short turns. Prefers Gemma 4 26B-A4B, then Gemma 4 31B on Cerebras and GPT-5.6 Luna."
      require_realtime: true
      tier: low-latency
      prefer: gemma/gemma-4-26B-A4B-it
      only:
        - gemma/gemma-4-26B-A4B-it
        - cerebras/gemma-4-31b
        - openai/gpt-5.6-luna

    # A fast answer, in whatever language. The shorthand a caller reaches for when the only
    # thing that matters is that the answer starts arriving.
    #
    # Gemini 3.8 Flash is preferred outright rather than left to the ranking, so the model a
    # conversation gets is the one this deployment chose. The rest of the tier is still here
    # to catch it being down.
    llm-fast:
      title: Fast
      description: "The quickest strong answer in any language, for a live conversation. Prefers Gemini 3.8 Flash and fails over to the rest of the fast tier."
      require_realtime: true
      tier: low-latency
      prefer: gemini/gemini-3.8-flash

    # The best answers a conversation can have, at the cost of waiting for them. GPT-5.6
    # Sol is preferred, with the rest of the quality tier as failover.
