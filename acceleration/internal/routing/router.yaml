    sts-vision:
      title: Vision
      description: "A conversation the model can watch as well as hear. Prefers GPT-Realtime-2."
      require_input_modalities: [image]
      prefer: openai/gpt-realtime-2

    multilingual-high-accuracy:
      title: High quality
      description: "Realtime voice that sounds and reasons best, whatever it costs in speed."
      multilingual: true
      require_realtime: true
