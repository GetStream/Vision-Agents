plugins:
  - id: slack
    name: Slack
    category: Communication
    description: Search the workspace, read and send messages, and look people up.
    url: https://mcp.slack.com/mcp
    auth: oauth
  - id: calendly
    name: Calendly
    category: Scheduling
    description: Check availability, create scheduling links, and book meetings.
    url: https://mcp.calendly.com
    auth: oauth
  - id: calcom
    name: Cal.com
    category: Scheduling
    description: Manage bookings, event types and schedules.
    url: https://mcp.cal.com/mcp
    auth: oauth
  - id: shopify
    name: Shopify
    category: Commerce
    description: Orders, products and inventory on a shop.
    url: https://{instance}/api/mcp
    auth: oauth
    instance_required: true
    instance_hint: The shop hostname, such as mystore.myshopify.com
  - id: salesforce
    name: Salesforce
    category: Customers
    description: Accounts, contacts and opportunities in an org.
    url: https://{instance}/mcp
    auth: oauth
    instance_required: true
    instance_hint: The org my-domain, such as mycompany.my.salesforce.com
  # https://mcp.sentry.dev, opened October 3, 2026. OAuth with dynamic client registration,
  # advertised at /.well-known/oauth-protected-resource/mcp.
  - id: sentry
    name: Sentry
    category: Engineering
    description: Search issues and errors, read their events, and triage them.
    url: https://mcp.sentry.dev/mcp
    auth: oauth
  # https://developers.google.com/workspace/calendar/api/guides/configure-mcp-server, opened
  # October 3, 2026. Google registers no client on the fly, so the deployment sets
  # GOOGLE_CALENDAR_MCP_CLIENT_ID and GOOGLE_CALENDAR_MCP_CLIENT_SECRET from a web client in
  # its own Cloud project, with calendarmcp.googleapis.com enabled.
  - id: google_calendar
    name: Google Calendar
    category: Scheduling
    description: Read calendars, events and free time.
    url: https://calendarmcp.googleapis.com/mcp/v1
    auth: oauth
    # Read only: one of the four scopes every Calendar MCP tool accepts.
    scopes:
      - https://www.googleapis.com/auth/calendar.readonly
    # Google returns a refresh token only for offline access, and again only on consent.
    authorize_params:
      access_type: offline
      prompt: consent
