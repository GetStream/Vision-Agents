info:
  description: Records the usage events producers ship, once per usage id, keeps what every subject spent in every daily, weekly, bi-weekly and monthly window, and mirrors those totals to Redis. It does not price (the producer sends what the work cost), authenticate customers, or admit requests. Reachable only inside the cluster, from the producers and the routers.
  title: Usage service
  version: 0.1.0
openapi: 3.0.3
paths:
  /healthz:
    get:
      description: 200 when the service's database answers, 503 when it does not. Takes no token.
      operationId: getUsageHealth
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthOutputBody'
          description: OK
        "500":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Service Unavailable
      security: []
      summary: Whether the service can record events
      tags:
        - Staff
  /v1/events:
    post:
      description: 'Records each event that passes the contract''s checks and is not recorded yet, and adds it to every window of every subject it names, in one transaction; then writes those windows'' totals to Redis before answering, and the totals of the windows a duplicate counts for too, so sending a batch again repairs Redis. Each event is decoded and checked on its own: one that fails is answered in `rejected` with its index in the batch and its reason, and the rest are recorded. An event accepted or a duplicate is recorded, and the producer may forget it; `mirrored` says whether Redis took the totals. Sending a batch again is safe. At most 500 events and 2 MiB, else 413; a body that is not JSON with an `events` array is a 422; 503 when the database fails, and the producer sends the whole batch again.'
      operationId: ingestUsageEvents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Batch'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ack'
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Unauthorized
        "413":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Request Entity Too Large
        "422":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Service Unavailable
      security:
        - IngestToken: []
      summary: Record usage events
      tags:
        - Staff
  /v1/standings:
    post:
      description: One standing per organization asked about, in the order asked. At most 500 organizations, else 413.
      operationId: readStandings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StandingQuery'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Standings'
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Unauthorized
        "413":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Request Entity Too Large
        "422":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Internal Server Error
      security:
        - IngestToken: []
      summary: Read organizations' standings
      tags:
        - Staff
  /v1/windows:
    post:
      description: Each subject's current daily, weekly, bi-weekly and monthly window from the database, a window nobody has spent in at zero, and writes them to Redis, so a key that was flushed or evicted is back after one read. At most 500 subjects, else 413.
      operationId: readUsageWindows
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WindowsQuery'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Windows'
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Unauthorized
        "413":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Request Entity Too Large
        "422":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Service Unavailable
      security:
        - IngestToken: []
      summary: Read what subjects spent in their current windows
      tags:
        - Staff
