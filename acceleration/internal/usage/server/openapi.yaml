info:
  description: |-
    Records the usage events producers ship, once per usage id, keeps what every subject spent in every daily, weekly, bi-weekly and monthly window, and mirrors those totals to Redis. It keeps each organization's account (credit, spend, status and its own settings), debited in the transaction that records its events, and what each tier string decides; routers read both in organizations' standings. It does not price (the producer sends what the work cost), authenticate customers, or admit requests. Reachable only inside the cluster, from the producers, the routers and the operator's management tools.

    A request whose shape the schema refuses is a 422. The management API's own failures carry a `code` beside the problem's fields: `invalid_request` (400), `unauthenticated` (401), `not_configured` (404: the service has no manage key), `default_tier` and `idempotency_key_reused` (409).
  title: Usage service
  version: 0.1.0
openapi: 3.0.3
paths:
  /healthz:
    get:
      description: 200 when the service's database answers, 503 when it does not. Takes no token.
      operationId: getUsageHealth
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthOutputBody'
          description: OK
        "500":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Service Unavailable
      security: []
      summary: Whether the service can record events
      tags:
        - Staff
  /v1/events:
    post:
      description: 'Records each event that passes the contract''s checks and is not recorded yet, and adds it to every window of every subject it names, in one transaction; then writes those windows'' totals to Redis before answering, and the totals of the windows a duplicate counts for too, so sending a batch again repairs Redis. Each event is decoded and checked on its own: one that fails is answered in `rejected` with its index in the batch and its reason, and the rest are recorded. An event accepted or a duplicate is recorded, and the producer may forget it; `mirrored` says whether Redis took the totals. Sending a batch again is safe. At most 500 events and 2 MiB, else 413; a body that is not JSON with an `events` array is a 422; 503 when the database fails, and the producer sends the whole batch again.'
      operationId: ingestUsageEvents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Batch'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ack'
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Unauthorized
        "413":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Request Entity Too Large
        "422":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Service Unavailable
      security:
        - IngestToken: []
      summary: Record usage events
      tags:
        - Staff
  /v1/manage/accounts/{organization_id}:
    get:
      description: |-
        The organization's standing: its tier's settings, its own overrides and the settings in force, its status, what was granted and spent, its balance, and its spend in the current UTC day and calendar month. Every organization has an account: one nothing has changed is active with nothing granted or spent.

        Management API: it takes the manage key in `X-Manage-Key`, never the ingest token, and answers 404 `not_configured` when the service has none. Every call names its actor in `X-Stream-Actor-Id` (1 to 256 characters) and may name a person in `X-Stream-Actor-Name`, percent-encoded when it is not printable ASCII; every change is recorded against them.
      operationId: getAccount
      parameters:
        - description: 'The organization: 1 to 255 bytes of UTF-8, without | { } or a control character.'
          in: path
          name: organization_id
          required: true
          schema:
            description: 'The organization: 1 to 255 bytes of UTF-8, without | { } or a control character.'
            type: string
        - description: The tier to answer the standing on; absent is the tier the organization's newest event carried.
          explode: false
          in: query
          name: organization_tier
          schema:
            description: The tier to answer the standing on; absent is the tier the organization's newest event carried.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Standing'
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Unauthorized
        "404":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Service Unavailable
      security:
        - ManageKey: []
      summary: Read an organization's account
      tags:
        - Staff
  /v1/manage/accounts/{organization_id}/credits:
    get:
      description: |-
        Newest first.

        Management API: it takes the manage key in `X-Manage-Key`, never the ingest token, and answers 404 `not_configured` when the service has none. Every call names its actor in `X-Stream-Actor-Id` (1 to 256 characters) and may name a person in `X-Stream-Actor-Name`, percent-encoded when it is not printable ASCII; every change is recorded against them.
      operationId: listCredits
      parameters:
        - description: 'The organization: 1 to 255 bytes of UTF-8, without | { } or a control character.'
          in: path
          name: organization_id
          required: true
          schema:
            description: 'The organization: 1 to 255 bytes of UTF-8, without | { } or a control character.'
            type: string
        - description: The most items one page answers.
          explode: false
          in: query
          name: limit
          schema:
            default: 50
            description: The most items one page answers.
            format: int64
            maximum: 200
            minimum: 1
            type: integer
        - description: The next_cursor of the page before; absent for the first page.
          explode: false
          in: query
          name: cursor
          schema:
            description: The next_cursor of the page before; absent for the first page.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditEntryPage'
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Unauthorized
        "404":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Service Unavailable
      security:
        - ManageKey: []
      summary: List an organization's credit entries
      tags:
        - Staff
    post:
      description: |-
        Writes a credit entry and adds its amount to the organization's credit, once per `Idempotency-Key` (required, 1 to 255 characters): 201 with the entry written, or 200 with the one already written under the key, which changes nothing. A key that holds another organization's entry, one of another kind or amount, or a suspension, restore or settings change, is a 409 `idempotency_key_reused`. Only the sign is checked: `top_up`, `grant` and `dispute_reversal` are above 0, `refund` and `dispute` below, an `adjustment` either but not 0. Any account takes credit, a suspended one included: payment rules are the writer's.

        Management API: it takes the manage key in `X-Manage-Key`, never the ingest token, and answers 404 `not_configured` when the service has none. Every call names its actor in `X-Stream-Actor-Id` (1 to 256 characters) and may name a person in `X-Stream-Actor-Name`, percent-encoded when it is not printable ASCII; every change is recorded against them.
      operationId: addCredit
      parameters:
        - description: 'The organization: 1 to 255 bytes of UTF-8, without | { } or a control character.'
          in: path
          name: organization_id
          required: true
          schema:
            description: 'The organization: 1 to 255 bytes of UTF-8, without | { } or a control character.'
            type: string
        - description: 'Required: 1 to 255 characters. The entry is written once under it.'
          in: header
          name: Idempotency-Key
          schema:
            description: 'Required: 1 to 255 characters. The entry is written once under it.'
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
