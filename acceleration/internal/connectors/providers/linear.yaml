# Linear's hosted MCP server, as the prototype ran it live (internal/mcp/connectors.yaml:67-76
# on codex/connector-support at cf62af0d, «[proto]:N» below; its live OAuth and list_teams
# call are in docs/connector-handover.md:180 there). Vendor pages, opened October 1, 2026:
#   [mcp]   https://linear.app/docs/mcp
#   [oauth] https://linear.app/developers/oauth-2-0-authentication
# [oauth] is Linear's OAuth for apps registered with Linear. A client the MCP server registers
# dynamically talks to the authorization server the MCP server advertises, and [mcp] does not
# say that one behaves the same, so every value taken from [oauth] is # unverified for it.
# Architecture rows cited are «Axes where providers differ» in
# acceleration/docs/connectors/architecture.md on connectors/planning.
id: linear
# A new revision for any change to what this file says; see AGENTS.md. 2 renames
# client.policy to client.registration. 3 lists the tools that only read.
revision: 3
# [proto]:68-70
name: Linear
category: Project management
description: Search issues and projects, read workspace context, and update work.
endpoints:
  # [mcp]; [proto]:71. Authorize and token endpoints are not written: they are discovered
  # from the MCP server (RFC 9728 and 8414), as the prototype did for every DCR entry
  # (docs/connector-design.md:38 at cf62af0d). A revoke endpoint is left out for the same
  # reason: [oauth]'s https://api.linear.app/oauth/revoke is for Linear's own apps.
  mcp: https://mcp.linear.app/mcp
  # No api_base, so Linear takes no direct calls through the connection proxy: MCP only
  # (AI-1308). A token here comes from a client registered by DCR with the authorization
  # server the MCP server names, and nothing says https://api.linear.app/graphql takes it.
  # GET https://mcp.linear.app/.well-known/oauth-protected-resource/mcp at
  # 2026-10-15T18:13:39Z: resource https://mcp.linear.app/mcp, authorization_servers
  # [https://mcp.linear.app]; its oauth-authorization-server document: issuer
  # https://mcp.linear.app, its own authorize, token and register endpoints, resource
  # https://mcp.linear.app/mcp. So the token is issued for the MCP server, by an issuer that is
  # not [oauth]'s (https://api.linear.app/oauth/token). [mcp], opened 2026-10-15, says that a
  # client that requests read gets a token that «can't reach write APIs», and names no other
  # API the token reaches. Add api_base once a Linear page says the GraphQL API accepts it.
  # For direct calls, use linear_app (AI-1351): the customer's own Linear OAuth app, whose
  # token Linear documents for both the GraphQL API and the MCP server.
# Authorization code with PKCE: row 1 («Auth code + PKCE (Slack, Linear)»); [proto]:72.
schemes: [oauth2_code]
client:
  # «OAuth 2.1 with dynamic client registration»: [mcp]; [proto]:73.
  registration: [dcr]
scopes:
  # [proto]:74-76. [mcp] names read as the scope that keeps a connection read-only.
  list: [read, write]
  # No separator, so a space (RFC 6749 section 3.3), which is how the prototype joined every
  # scope list but Slack's (internal/mcp/oauth.go:262-264 at cf62af0d). [oauth] says comma
  # separated for Linear's own apps. # unverified
# No identity: the account is Linear's GraphQL viewer query (row 6), a profile request this
# schema cannot make, so the account stays unverified (architecture doc, «Risks», item 9).
refresh:
  # Rotating, a 30-minute grace for a consumed refresh token, an access token valid for
  # 24 hours: [oauth]; row 15 («Linear 30 min»). # unverified for the MCP server's clients
  rotating: true
  grace: 30m
  access_ttl: 24h
rate_limit:
  # Per user: row 16. No vendor page behind it. # unverified
  per: user
sources:
  - kind: mcp
    endpoint: mcp
    # The tools that only read. Linear's page ([mcp], opened 2026-11-04) names no tools, so
    # each name and what it does is from the tool's own description in the tools/list of
    # https://mcp.linear.app/mcp, read on 2026-11-04 through Anthropic's claude.ai Linear
    # connector: each one gets, lists or searches («Retrieve ...», «List ...», «Search ...»)
    # and none says it changes anything. get_attachment takes an attachment id and returns
    # the file or its download URL, signed for five minutes; that brings data in, as
    # google_drive.yaml's download_file_content does, and only a tool that writes could send
    # the URL on. Left out: every save_, create_, delete_, retire_, restore_, share_, unshare_,
    # mark_, merge_, submit_, update_, resolve_ and prepare_ tool, which change the workspace,
    # and extract_images, which fetches the image URLs found in markdown the model passes,
    # so a URL to any host could carry data out. A tool added later is left out too.
    read_only_tools:
      - get_attachment
      - list_agent_skills
      - get_agent_skill
      - list_comments
      - list_cycles
      - list_custom_views
      - get_document
      - list_documents
      - get_issue
      - list_issues
      - list_issue_statuses
      - get_issue_status
      - list_issue_labels
      - list_projects
      - get_project
      - list_project_labels
      - list_release_pipelines
      - list_releases
      - get_release
      - list_release_notes
      - get_release_note
      - list_milestones
      - get_milestone
      - get_notifications
      - list_teams
      - get_team
      - get_triage_responsibility
      - list_templates
      - get_template
      - list_users
      - get_user
      - get_workspace
      - search_documentation
      - get_diff
      - list_diffs
      - get_diff_threads
      - whoami
      - list_customers
      - list_customer_needs
      - list_initiatives
      - get_initiative
      - list_initiative_labels
      - get_status_updates
