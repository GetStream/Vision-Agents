# WhatsApp through the customer's own Meta app (T51, AI-879), on the channel bridge: a channel
# only, no tools. The customer's Meta app is the provider app: the app's backend puts its app
# id and App Secret through PUT /v1/agents/connectors/whatsapp/oauth-client, and points the
# app's WhatsApp webhook at POST /v1/connectors/events/whatsapp/{app id}, with the app id as
# the Verify Token (wave 3d Q1). The replies go from the business number with the customer's
# system-user access token. STOP, START and HELP are kept from the agent by the bridge
# (channelbridge.keywords): Meta answers none of them itself. Text messages, and the caption of
# a photo, a video or a document as its text (revision 2), and a photo itself, with or without
# a caption (revision 3); replies past the 24-hour window (approved templates) and Meta's Tech
# Provider with Embedded Signup are later tickets.
# internal/channels/whatsapp.go is where it started.
# Meta's pages, opened October 8, 2026:
#   [hooks]    https://developers.facebook.com/docs/graph-api/webhooks/getting-started
#   [payload]  https://developers.facebook.com/docs/whatsapp/cloud-api/webhooks/payload-examples
#   [send]     https://developers.facebook.com/docs/whatsapp/cloud-api/guides/send-messages
#   [versions] https://developers.facebook.com/docs/graph-api/changelog
# Opened November 4, 2026:
#   [image]    https://developers.facebook.com/docs/whatsapp/cloud-api/webhooks/reference/messages/image
#   [video]    https://developers.facebook.com/docs/whatsapp/cloud-api/webhooks/reference/messages/video
#   [document] https://developers.facebook.com/docs/whatsapp/cloud-api/webhooks/reference/messages/document
#   [media]    https://developers.facebook.com/docs/whatsapp/cloud-api/reference/media
# Opened November 5, 2026:
#   [basic]    https://developers.facebook.com/docs/development/create-an-app/app-dashboard/basic-settings
#   [endpoint] https://developers.facebook.com/documentation/business-messaging/whatsapp/webhooks/create-webhook-endpoint
#   [start]    https://developers.facebook.com/documentation/business-messaging/whatsapp/get-started.md
#   [tokens]   https://developers.facebook.com/docs/whatsapp/access-tokens
id: whatsapp
# A new revision for any change to what this file says; see AGENTS.md.
# Revision 2 (AI-2133): a photo, a video and a document with a caption are read, with the
# caption as their text (also).
# Revision 3 (AI-2740): a photo's file is read too, by its id (also[0].media, media_lookup), so
# a photo without a caption is read as well.
# Revision 4 (AI-2915): the input's and the provider app's labels and descriptions, and the
# setup steps, which only the catalog shows: a connection on revision 3 stays current.
revision: 4
name: WhatsApp
category: Communication
description: Answer people on WhatsApp from the customer's own business number.
setup:
  # [basic] links the App Dashboard here: «developers.facebook.com/apps».
  url: https://developers.facebook.com/apps
  steps:
    # [basic]: the page is «the Basic Settings of your App Dashboard», with a section «App ID»
    # and «find the app secret assigned to your app by Meta».
    - title: Copy the app's ID and secret
      description: >-
        In the App Dashboard, open your app's Basic settings. Paste its App ID and App Secret
        as the Meta app here.
    # [endpoint]: «navigate to the App Dashboard > WhatsApp > Configuration panel», or for an app
    # with the «Connect with customers through WhatsApp» use case «App Dashboard > Use cases >
    # Customize > Configuration»; the endpoint goes in the «Callback URL field» and the string in
    # the «Verify token field»; once the endpoint answers the check «the panel will save your
    # changes». The verify token is the app id (channel.handshake below).
    - title: Point the webhook at the router
      description: >-
        In the App Dashboard, open WhatsApp > Configuration (or Use cases > Customize >
        Configuration). Paste the Callback URL shown here, and your App ID as the Verify token.
        Meta checks the URL before it saves them.
    # [endpoint]: after the check «a list of fields you can subscribe to will appear»; [payload]:
    # a message arrives in a change with «"field": "messages"».
    - title: Subscribe to messages
      description: In the same panel, subscribe the webhook to the messages field.
    # [start]: the API Setup page, where a person is told to «retain both your test phone number
    # ID and Messaging account ID». # unverified: where on that page the id is shown.
    - title: Copy the phone number ID
      description: >-
        In the App Dashboard, open WhatsApp > API Setup and copy the ID of the business number
        that is to answer.
    # [tokens]: «Business settings» > «System Users» > «+Add»; «Assign assets» with «Manage
    # app»; «Generate token» with «business_management», «whatsapp_business_management» and
    # «whatsapp_business_messaging».
    - title: Make a system user token
      description: >-
        In Business settings, open System Users and add one. Assign it your app with Manage
        app, then generate a token with business_management, whatsapp_business_management and
        whatsapp_business_messaging.
    # The bridge finds the connection of a message's number among the app's own connections
    # only (store.AppConnectionByAccount, owner_type app).
    - title: Connect the number
      description: >-
        Create a connection owned by the app, not by a user, with the phone number ID and the
        token. A user's connection gets no messages.
# [send]: «Authorization: Bearer EAAJB...», the customer's access token.
schemes: [bearer]
inputs:
  # The business number's id, value.metadata.phone_number_id in [payload] («106540352242922»),
  # and the id a reply is posted to ([send], «POST /<WHATSAPP_BUSINESS_PHONE_NUMBER_ID>/messages»).
  # It is the connection's account (identity below), which the bridge finds the connection of
  # an event's number by (store.AppConnectionByAccount). # unverified: the length; [payload]'s
  # example has 15 digits.
  - name: phone_number_id
    # [start] writes «phone number ID»; # unverified: the API Setup page's own label for it.
    label: Phone number ID
    description: In the App Dashboard, WhatsApp > API Setup, the ID of the business number. Digits only.
    pattern: "[0-9]{1,32}"
identity: [phone_number_id]
client:
  # The customer's own Meta app is the provider app: its App Secret signs the webhooks
  # ([hooks]), so it is the signing secret. The record holds the app alone: no OAuth client.
  registration: [customer]
# The provider app's two fields: provider_app_id is the Meta app's id, signing_secret its App
# Secret. [basic]: the Basic settings section «App ID», and «find the app secret assigned to
# your app by Meta»; [hooks]: «Generate a SHA256 signature using the payload and your app's App
# Secret». "Meta" is ours, so a form says whose app.
provider_app:
  id_label: Meta App ID
  id_description: In the App Dashboard, your app's Basic settings, App ID. It is also the webhook's Verify token.
  secret_label: Meta App Secret
  secret_description: >-
    In the App Dashboard, your app's Basic settings, App Secret. Meta signs every webhook with it
    (X-Hub-Signature-256).
channel:
  verifier:
    # [hooks]: «We sign all Event Notification payloads with a SHA256 signature and include
    # the signature in the request's X-Hub-Signature-256 header, preceded with sha256=», with
    # the App Secret. No timestamp is signed.
    kind: hmac_header
    secret: provider_app
    header: X-Hub-Signature-256
    algorithm: sha256
    encoding: hex
    prefix: sha256=
    signed: "{body}"
  # [hooks]: the Verify Token check, a GET with hub.mode, hub.verify_token and hub.challenge.
  handshake: hub_challenge
  # [payload]. No event_id: a delivery names no id of its own ([payload]: object and entry,
  # whose id is the WhatsApp Business Account's), so a forward is keyed by its body.
  format: json
  messages:
    # [hooks]: deliveries are batched, «a maximum of 1000 updates»; [payload]: messages sit in
    # entry[].changes[].value.messages[]. Statuses sit in value.statuses[], so each skips
    # them.
    each: $.entry[*].changes[*].value.messages[*]
    # [payload]: «"type": "text"». Other media, reactions, buttons and the rest are not read: a
    # reply to a button only follows a template or interactive message the bridge never sends.
    match:
      $.entry[*].changes[*].value.messages[*].type: text
    # [image]: a photo is «"type": "image"» with «"image": {"caption": "Taj Mahal", "mime_type",
    # "sha256", "id", "url"}», caption being «Media asset caption text». [video] and [document]
    # give «"type": "video"» with «"video": {"caption": ...}» and «"type": "document"» with
    # «"document": {"caption": ..., "filename": ...}», the same «Media asset caption text».
    # The caption is the message's text, so the person's question about the file is answered,
    # keywords included, as the same words sent as text would be (as on Linq, where the text
    # sent with a video is answered and the video is not passed on). A video or a document
    # without a caption is not read, as on revision 1, and its file is not passed on. A build
    # before also (a rollback) ignores it and reads text messages only, as revision 1 does.
    also:
      - match:
          $.entry[*].changes[*].value.messages[*].type: image
        text: $.entry[*].changes[*].value.messages[*].image.caption
        # [image]: id is «Media asset ID. You can perform a GET on this ID to get the asset
        # URL», and mime_type «Media asset MIME type». The webhook's own url is «being released
        # to developers gradually», so the id is what every delivery has. A build before kind
        # media (a rollback) ignores it and reads the caption alone, as revision 2 does.
        media:
          id: $.entry[*].changes[*].value.messages[*].image.id
          mime_type: $.entry[*].changes[*].value.messages[*].image.mime_type
      - match:
          $.entry[*].changes[*].value.messages[*].type: video
        text: $.entry[*].changes[*].value.messages[*].video.caption
      - match:
          $.entry[*].changes[*].value.messages[*].type: document
        text: $.entry[*].changes[*].value.messages[*].document.caption
    # [media], «Get media URL»: GET /<MEDIA_ID> with the access token answers url, mime_type,
    # sha256, file_size and id; «Media URLs expire after 5 minutes», so the file is downloaded
    # right after; «Media IDs in webhooks expire after 7 days». «Download media»: a GET of that
    # url with the same access token («If you omit your token, the request will fail»). Its
    # host is lookaside.fbsbx.com: [image]'s example url, and the url Meta answered in a probe
    # of a business number on v25.0 (November 4, 2026; a GET without the token got 401, with it
    # the file). No other host gets the token. v25.0 as the reply's below.
    media_lookup:
      url: https://graph.facebook.com/v25.0/{id}
      file: $.url
      host: lookaside.fbsbx.com
    # [payload]: value.metadata.phone_number_id, the business number that received it.
    provider_unit_id: $.entry[*].changes[*].value.metadata.phone_number_id
    thread_key:
      # [payload]: messages[].from, the person's number as digits («16505551234»). One thread
      # for each person and business number, and the number a reply goes to.
      - name: from
        path: $.entry[*].changes[*].value.messages[*].from
    # The contact map keys the person by the same number with a + (channelbridge.episodeSources).
    author_id: $.entry[*].changes[*].value.messages[*].from
    provider_message_id: $.entry[*].changes[*].value.messages[*].id
    text: $.entry[*].changes[*].value.messages[*].text.body
  reply:
    # [send]: POST /<WHATSAPP_BUSINESS_PHONE_NUMBER_ID>/messages. v25.0: the newest version
    # [versions] lists with an «Available Until» date (July 29, 2028); v26.0's is «TBD».
    # Meta answers 200 with messages[].id when it takes the message ([send]).
    url: https://graph.facebook.com/v25.0/{provider_unit_id}/messages
    # [send], the text message example. "to" carries a "+": Meta's "WhatsApp user phone number
    # formats" section of https://developers.facebook.com/docs/whatsapp/cloud-api/reference/messages
    # says that without it the business number's country calling code is prepended, which can
    # misdeliver the message. The webhook's "from" is digits only, so the "+" is added here.
    body:
      messaging_product: whatsapp
      recipient_type: individual
      to: "+{thread.from}"
      type: text
      text:
        body: "{text}"
