# A shop's storefront MCP server, moved from the plugin catalog (internal/plugins/plugins.yaml,
# entry shopify, «[plugin]» below; T58 in acceleration/docs/connectors/subtasks.md on
# connectors/planning). The core's fixture testdata/manifests/shopify.yaml is the Admin API's
# authorization code grant; this is the plugin's MCP endpoint on the shop.
# Vendor pages, opened October 13, 2026:
#   [storefront] https://shopify.dev/docs/apps/build/storefront-mcp
#                catalog and cart left /api/mcp; search_shop_policies_and_faqs stayed.
#   [faqs]       https://shopify.dev/docs/agents/catalog/policy-and-faqs-tool
#                «No authentication is required.» The endpoint is https://{storedomain}/api/mcp.
#   [grant]      https://shopify.dev/docs/apps/build/authentication-authorization/access-tokens/authorization-code-grant
#                the shop host pattern, as the fixture cites it.
# And one shop, fetched October 13, 2026: POST https://stream-agents-e2e.myshopify.com/api/mcp
# tools/list, with no Authorization, answered 200 and the one tool
# search_shop_policies_and_faqs (request eec350f1-1bc9-41ec-aaf4-bf792611e685-1791915330).
# The same call with a bearer the shop was not issued also answered 200 and that tool.
# Revision 1 asked for oauth2_code. [storefront] says those catalog tools are not on this
# server any more, and [faqs] says what remains needs no credential, so a login cannot
# bring them back. A plugin grant is oauth2_code and does not move onto this revision
# (internal/pluginmigrate resolves oauth2_code and skips when it is not a scheme).
id: shopify
# A new revision for any change to what this file says; see AGENTS.md.
# 2 drops the login. /api/mcp needs none, and revision 1 is marked broken.
revision: 2
# Revision 1 sent the browser to log in. No consent on it reaches this server's tool, so a
# connection made on it is asked to connect again, on this revision, which stores nothing.
broken_revisions:
  - revisions: [1]
    reason: "asked for an OAuth login; the storefront MCP at /api/mcp needs none"
name: Shopify
category: Commerce
description: A shop's policies and FAQs.
setup:
  # [faqs]: the address is the store domain, and no authentication is required. The pattern
  # below is [grant]'s, so the address is the myshopify.com one.
  url: https://shopify.dev/docs/agents/catalog/policy-and-faqs-tool
  steps:
    - title: Copy the shop address
      description: Use the shop's myshopify.com address, such as mystore.myshopify.com.
    - title: Enter it here
      description: Paste that address. The shop answers without a login.
inputs:
  # The shop host, the plugin's instance ([plugin] instance_hint: «The shop hostname, such as
  # mystore.myshopify.com»), in the pattern [grant] writes:
  # /^[a-zA-Z0-9][a-zA-Z0-9\-]*\.myshopify\.com$/. A shop on its own domain is refused, so
  # what a caller types can only name a host under myshopify.com.
  - name: shop
    pattern: ^[a-zA-Z0-9][a-zA-Z0-9\-]*\.myshopify\.com$
endpoints:
  # [plugin] url, https://{instance}/api/mcp. [faqs] is the same path.
  mcp: https://{shop}/api/mcp
# [faqs]: no authentication. The none scheme stores an empty payload and sends no header.
schemes: [none]
sources:
  - kind: mcp
    endpoint: mcp
