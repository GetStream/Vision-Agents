# Cal.com's hosted MCP server (internal/mcp/connectors.yaml:60-66 on codex/connector-support at
# cf62af0d, «[proto]:N» below). The id is the prototype's ([proto]:60), and the one the core
# guard already denies (internal/connectors/core/guard_test.go). Vendor page, opened
# October 2, 2026:
#   [mcp] https://cal.com/docs/mcp-server
# And the servers' own metadata, fetched on October 2, 2026 («[prm]» and «[as]»):
#   [prm] GET https://mcp.cal.com/.well-known/oauth-protected-resource/mcp at
#         2026-10-02T21:06:33Z: resource https://mcp.cal.com/mcp, authorization_servers
#         [https://mcp.cal.com], no scopes_supported.
#   [as]  GET https://mcp.cal.com/.well-known/oauth-authorization-server at
#         2026-10-02T21:06:34Z: issuer https://mcp.cal.com, authorize, token, registration and
#         revocation endpoints under https://mcp.cal.com/oauth/, grant_types_supported
#         [authorization_code, refresh_token], code_challenge_methods_supported [S256],
#         token_endpoint_auth_methods_supported [none], no client_id_metadata_document_supported.
id: calcom
# A new revision for any change to what this file says; see AGENTS.md. 2 renames
# client.policy to client.registration. 3 lists the tools that only read.
revision: 3
# [proto]:61-63
name: Cal.com
category: Scheduling
description: Manage bookings, event types and schedules.
endpoints:
  # [mcp] («https://mcp.cal.com/mcp»); [proto]:64. Authorize, token and revoke are not
  # written: oauth2_code discovers them through [prm] and [as] (RFC 9728 and 8414), which
  # answer for this exact endpoint.
  mcp: https://mcp.cal.com/mcp
# «Streamable HTTP transport with OAuth 2.1 authentication»: [mcp]. PKCE S256: [as].
schemes: [oauth2_code]
client:
  # [as] has a registration_endpoint for public clients and no CIMD flag; [proto]:66.
  registration: [dcr]
# No scopes: [prm] names none and [mcp] lists none, so the scope parameter is left out, as
# MCP 2025-11-25 «Scope Selection Strategy» asks («omitting the scope parameter if
# scopes_supported is undefined»). The prototype asked for none either ([proto]:60-66).
# No identity, capture or refresh policy: neither [mcp] nor [as] documents a token response,
# token lifetimes or rotation. # unverified
sources:
  - kind: mcp
    endpoint: mcp
    # The tools that only read, from «Available tools» in [mcp] (opened again 2026-11-05; 72
    # tools, none marked read-only, so each name and what it does is from its row there):
    # every get_ tool, whose row says it gets, lists or returns («Get ...», «List ...»), and
    # describe_api_operation, which «Get[s] the input schema for an API operation».
    # get_busy_times reads the person's connected calendars, which brings data in.
    # get_app_link is one of the two «local tools»: it builds a link into the Cal.com web app
    # from ids and calls nothing. Left out: every update_, create_, delete_, duplicate_,
    # reschedule_, cancel_, confirm_, mark_, add_, assign_, unassign_ and edit_ tool, which
    # change the account; call_api_operation, which runs «any API v2 operation»;
    # calculate_routing_form_slots, which takes a routing form response, as [mcp] does not say
    # whether Cal.com stores it; and search_docs and find_api_operation, which send the
    # model's free text to a search of Cal.com's public documentation and API catalog,
    # outside the account, as linear.yaml leaves out search_documentation. A tool added later
    # is left out too.
    read_only_tools:
      - get_app_link
      - get_me
      - get_event_types
      - get_event_type
      - get_event_type_settings
      - get_event_type_history
      - get_scheduling_config
      - get_crm_sync_errors
      - get_events
      - get_event
      - get_bookings
      - get_booking
      - get_booking_attendees
      - get_booking_attendee
      - get_booking_routing_trace
      - get_org_team_bookings
      - get_org_user_bookings
      - get_schedules
      - get_schedule
      - get_default_schedule
      - get_availability
      - get_busy_times
      - get_connected_calendars
      - get_conferencing_apps
      - get_my_teams
      - get_org_teams
      - get_team_memberships
      - get_team_membership
      - get_org_memberships
      - get_org_membership
      - get_org_attributes
      - get_org_attribute
      - get_attribute_options
      - get_user_attributes
      - get_user_attribute_history
      - get_org_routing_forms
      - get_org_routing_form_responses
      - get_team_routing_forms
      - get_routing_form
      - get_routing_form_history
      - describe_api_operation
