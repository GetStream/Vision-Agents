# GitHub's remote MCP server (internal/mcp/connectors.yaml:77-84 on codex/connector-support at
# cf62af0d, «[proto]:N» below). The core's fixture testdata/manifests/github.yaml is the
# GitHub App installation flow; this is the MCP server's user flow. Vendor pages, opened
# October 2, 2026:
#   [remote]  https://github.com/github/github-mcp-server/blob/f10e4e1f923d46b86f2e80e849aa74084c847184/docs/remote-server.md
#   [host]    https://github.com/github/github-mcp-server/blob/f10e4e1f923d46b86f2e80e849aa74084c847184/docs/host-integration.md
#   [oauth]   https://docs.github.com/en/apps/oauth-apps/building-oauth-apps/authorizing-oauth-apps
#   [user]    https://docs.github.com/en/apps/creating-github-apps/authenticating-with-a-github-app/generating-a-user-access-token-for-a-github-app
#   [refresh] https://docs.github.com/en/apps/creating-github-apps/authenticating-with-a-github-app/refreshing-user-access-tokens
# Opened October 9, 2026:
#   [readme]  https://github.com/github/github-mcp-server/blob/eb47a99ddb866ca2b8a162920e6bda9521f33ebb/README.md
# Opened October 15, 2026:
#   [toolsets] https://github.com/github/github-mcp-server/blob/main/docs/remote-server.md
#   [rest]    https://docs.github.com/en/rest/using-the-rest-api/getting-started-with-the-rest-api
#   [restauth] https://docs.github.com/en/rest/authentication/authenticating-to-the-rest-api
#   [versions] https://docs.github.com/en/rest/about-the-rest-api/api-versions
#   [paging]  https://docs.github.com/en/rest/using-the-rest-api/using-pagination-in-the-rest-api
# Opened October 20, 2026:
#   [assets]  https://docs.github.com/en/rest/releases/assets
#   [secrets] https://www.daytona.io/docs/en/secrets.md
# And the servers' own metadata, fetched on October 2, 2026 («[prm]» and «[as]»):
#   [prm] GET https://api.githubcopilot.com/.well-known/oauth-protected-resource/mcp/ at
#         2026-10-02T21:06:34Z: resource https://api.githubcopilot.com/mcp/,
#         authorization_servers [https://github.com/login/oauth], scopes_supported [repo,
#         read:org, read:user, user:email, read:packages, write:packages, read:project,
#         project, gist, notifications].
#   [as]  GET https://github.com/.well-known/oauth-authorization-server/login/oauth at
#         2026-10-02T21:06:35Z: issuer https://github.com/login/oauth, authorize
#         https://github.com/login/oauth/authorize, token
#         https://github.com/login/oauth/access_token, code_challenge_methods_supported
#         [S256], authorization_response_iss_parameter_supported true, no
#         registration_endpoint, no token_endpoint_auth_methods_supported; fetched again at
#         2026-10-02T22:13:25Z, scopes_supported [offline_access].
id: github
# A new revision for any change to what this file says; see AGENTS.md. 2 renames
# client.policy to client.registration. 3 adds bearer (AI-990). 4 (AI-1308) adds
# endpoints.api_base, so a backend can call GitHub's REST API through the connection proxy.
# 5 (AI-1309) adds the X-MCP-Toolsets header on the mcp source, so GitHub offers its Actions
# tools beside the default ones. 6 adds sandbox, so code in a session's sandbox can call
# GitHub's REST API with the connection's token.
revision: 6
# [proto]:78-80
name: GitHub
category: Developer tools
description: Search repositories, inspect issues and pull requests, and make changes.
endpoints:
  # [remote] («URL: https://api.githubcopilot.com/mcp/»); [proto]:81.
  mcp: https://api.githubcopilot.com/mcp/
  # The issuer [prm] names. [host] asks hosts to discover the endpoints rather than hard-code
  # https://github.com/login/oauth/authorize, so authorize and token come from [as]. The issuer
  # is pinned instead of found from the MCP endpoint: oauth2_code strips the trailing slash
  # before the well-known suffix (RFC 9728 section 3.1), and that document,
  # /.well-known/oauth-protected-resource/mcp at 2026-10-02T21:06:34Z, names resource
  # https://api.githubcopilot.com/mcp without it, which section 3.3 refuses; the root
  # document answered 404 at 2026-10-02T21:10:21Z.
  issuer: https://github.com/login/oauth
  # RFC 8707 resource indicator: [prm]'s resource. Whether GitHub's authorization server
  # reads it is not documented on the pages above. # unverified
  resource: https://api.githubcopilot.com/mcp/
  # [rest]: a request's URL «includes the base URL for the GitHub REST API
  # (https://api.github.com)»; GET /repos/octo/hello/issues is
  # https://api.github.com/repos/octo/hello/issues. Each scheme's token is taken there as
  # «Authorization: Bearer»: an OAuth App's ([oauth], «Use the access token to access the
  # API»: «curl -H "Authorization: Bearer OAUTH-TOKEN" https://api.github.com/user»), a GitHub
  # App's user token ([user]: «Include the user access token in the Authorization header of an
  # API request»), and a personal access token ([restauth]: «you can create a personal access
  # token», «you can use Authorization: Bearer or Authorization: token»). [rest] rejects a
  # request with no User-Agent; the proxy forwards the caller's, and Go's client sends
  # Go-http-client/1.1 when there is none (net/http request.go, defaultUserAgent, go1.27).
  # Accept is a «should» on [rest], and with no X-GitHub-Api-Version GitHub answers as
  # 2022-11-28 ([versions]), so the proxy adds neither. GitHub pages with an absolute Link
  # header naming api.github.com ([paging]: «link:
  # <https://api.github.com/repositories/1300192/issues?page=2>; rel="prev"»); the proxy
  # rewrites each such link to the connection's proxy URL (api.proxiedLinks). URLs in a body
  # (url, comments_url and the like) name api.github.com too and are passed as they came: a
  # client must not follow one with the router's credential, but call its path through the
  # proxy. With no ROUTER_PUBLIC_URL every Link is dropped (fail closed), so paging needs it set.
  api_base: https://api.github.com
# Authorization code with PKCE S256: [oauth], [user] (code_challenge_method S256); [as].
# And a personal access token the developer supplies, sent to the same endpoint as
# «"Authorization": "Bearer ${input:github_mcp_pat}"» ([readme]:73-83, «GitHub Personal Access
# Token»), which is the bearer scheme's header (RFC 6750 section 2.1). bearer reads none of
# the client, scopes, refresh or issuer below: they are oauth2_code's. A token learns no
# account, since this manifest has no identity. A connection that names no scheme still gets
# oauth2_code, its one scheme that is not static (api.defaultScheme).
schemes: [oauth2_code, bearer]
client:
  # A GitHub App or an OAuth App registered ahead of time: «Dynamic Client Registration is
  # NOT supported by Remote GitHub MCP Server at this time» ([host]), and [as] has neither a
  # registration_endpoint nor a CIMD flag. The prototype said dcr ([proto]:83); the vendor
  # page wins. [host] recommends a GitHub App and says a user's organization may have to
  # approve or install it, which is why a customer may bring its own; that is our policy,
  # not a vendor fact. The list order is not the order: oauth2_code tries a customer's
  # client before the operator's (ownerOrder in schemes/oauth2code/client.go).
  registration: [operator, customer]
  # client_id and client_secret go in the token request body: [oauth], [user]. [as] lists no
  # methods, so without this oauth2_code would pick client_secret_basic, which neither page
  # documents.
  auth_method: client_secret_post
  # [proto]:84
  env: GITHUB
scopes:
  # All of [prm]'s scopes_supported, as MCP 2025-11-25 «Scope Selection Strategy» asks. An
  # OAuth App takes them; a GitHub App's user token has fine-grained permissions instead and
  # its scope «will always be an empty string» ([user]). The prototype asked for none
  # ([proto]:77-84, docs/connector-design.md:148 there), before [prm] listed them.
  # offline_access is [as]'s one scope: with it «you will receive an expiring access token
  # and a refresh token even if your app is not configured to use expiring tokens», and it
  # «will not alter the scope behavior» ([oauth], opened October 2, 2026). So an OAuth App
  # gets the 8-hour token and rotating refresh token below rather than a token that never
  # expires. What a GitHub App does with it is not on [user]. # unverified
  list:
    - repo
    - read:org
    - read:user
    - user:email
    - read:packages
    - write:packages
    - read:project
    - project
    - gist
    - notifications
    - offline_access
  # No separator, so a space: [oauth] («A space-delimited list of scopes»). The token
  # response answers granted scopes with commas («"scope":"repo,gist"», [oauth]), which one
  # separator cannot say; see the PR.
# No identity: the token response carries no account id ([oauth], [user]), and GET /user
# is a profile request this schema cannot make.
refresh:
  # A GitHub App's user token: «expires after 8 hours», the refresh token after 6 months
  # (refresh_token_expires_in 15897600 seconds, 4416h), and «Once you use a refresh token,
  # that refresh token and the old user access token will no longer work»: [user],
  # [refresh]. No access_ttl: it is used only when a response has no expires_in, and GitHub
  # leaves expires_in out exactly when the token does not expire: «If you disabled
  # expiration of user access tokens, this parameter will be omitted» ([user]), and an
  # OAuth App sends it only with expiring tokens or offline_access ([oauth]). Both pages
  # opened October 2, 2026.
  rotating: true
  refresh_ttl: 4416h
sources:
  - kind: mcp
    endpoint: mcp
    # [toolsets] «Optional Headers»: «X-MCP-Toolsets: Comma-separated list of toolsets to
    # enable», and /mcp/ alone is the default toolset. The header rather than the /x/actions
    # path, which «can only be a single toolset», so endpoints.mcp and resource stay
    # /mcp/ and the tokens of existing connections keep working. Live tools/list with a
    # personal access token at 2026-10-15T19:15:12Z: no header and «default» 49 tools each;
    # «actions» 4 (actions_get, actions_list, actions_run_trigger, get_job_logs);
    # «default,actions» 53, the 49 and the 4.
    headers:
      X-MCP-Toolsets: default,actions
# Code in a session's sandbox reads a placeholder from GITHUB_TOKEN, and the sandbox's egress
# puts the connection's token in its place only in a request to these hosts ([secrets]). It is
# the env var name GitHub's own tools read the token from (gh: «GH_TOKEN, GITHUB_TOKEN»,
# https://cli.github.com/manual/gh_help_environment, opened October 20, 2026). A placeholder is
# replaced only in a request header and only when the header carries it verbatim ([secrets]),
# so code sends it as «Authorization: Bearer», which every scheme's token takes ([rest] and
# api_base above). A header that carries it Base64-encoded, as Basic auth does, is not matched
# ([secrets], «Transformed placeholders»), so github.com, where git sends one, is left out.
sandbox:
  env: GITHUB_TOKEN
  hosts:
    # [rest]: the REST API's base URL is https://api.github.com.
    - api.github.com
    # [assets], «Upload a release asset»: «Use the upload_url returned in the response of the
    # Create a release endpoint», and its example request is
    # https://uploads.github.com/repos/OWNER/REPO/releases/RELEASE_ID/assets?name=example.zip.
    - uploads.github.com
