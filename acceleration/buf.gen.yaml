version: v2
# The plugins are pinned go run commands rather than binaries on PATH or tool directives,
# so generating needs nothing installed and the router's own dependency graph is not
# merged with a code generator's. protoc-gen-go's version is google.golang.org/protobuf's
# in go.mod, which is the library the code it writes runs against.
plugins:
  - local: [go, run, google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12]
    out: internal/node
    opt: paths=source_relative
  - local: [go, run, google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2]
    out: internal/node
    opt: paths=source_relative
