package: api
# Paths are resolved against the working directory, so generation runs from acceleration/.
output: internal/api/generated.go
generate:
  models: true
  std-http-server: true
  strict-server: true
  embedded-spec: true
output-options:
  skip-prune: true
  # The three sockets are in the spec so a client generator and a reader know they exist,
  # but a strict server cannot express an upgrade. Their handlers are hand-written in
  # sessionws.go, streamws.go and dispatchws.go and registered on the mux before the
  # generated routes, which is also what puts them behind the server-side-only check.
  exclude-operation-ids:
    - watchSession
    - streamModality
    - dispatchCalls
    - pluginOAuthCallback
