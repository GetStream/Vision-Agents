package: api
# Paths are resolved against the working directory, so generation runs from acceleration/.
output: internal/api/generated.go
generate:
  models: true
  std-http-server: true
  strict-server: true
  embedded-spec: true
output-options:
  skip-prune: true
  # The two sockets are in the spec so a client generator and a reader know they exist,
  # but a strict server cannot express an upgrade. Their handlers are hand-written in
  # sessionws.go and streamws.go and registered on the mux before the generated routes.
  exclude-operation-ids:
    - watchSession
    - streamModality
    - pluginOAuthCallback
