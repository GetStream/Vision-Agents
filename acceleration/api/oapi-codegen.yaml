package: api
# Paths are resolved against the working directory, so generation runs from acceleration/.
output: internal/api/generated.go
# Every operation api/legacy.yaml declares is served by a handler written by hand, so only
# its models are generated: the sockets, the agent-log stream and the data export and
# import, none of which a typed operation can hand back or take.
generate:
  models: true
output-options:
  skip-prune: true
