openapi: 3.0.3
# The operations oapi-codegen still generates. Everything else about the document - its
# description, servers, security and the operations already declared in Go - lives in
# internal/api, and cmd/openapi merges the two into openapi.yaml. Move an operation to Go
# by registering it with Huma and deleting it here, along with any component nothing
# left here refers to.
info:
  title: Model Router
  version: 0.2.0

paths:
  /v1/agents/logs:
    get:
      operationId: listAgentLogs
      summary: Latest structured agent logs, with backward cursor pagination
      parameters:
        - {name: config_id, in: query, schema: {type: string}}
        - {name: session_id, in: query, schema: {type: string}}
        - {name: user_id, in: query, schema: {type: string}}
        - {name: severity, in: query, schema: {type: string, enum: [info, error]}}
        - {name: source, in: query, description: Comma-separated user/agent/tool/system sources., schema: {type: string}}
        - {name: q, in: query, schema: {type: string, maxLength: 256}}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 250, default: 250}}
      responses:
        "200":
          description: Newest first; resume cursor marks the history/live handoff.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AgentLogPage"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "503":
          description: Log storage is unavailable.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /v1/agents/logs/stream:
    get:
      operationId: streamAgentLogs
      summary: Read-only SSE of durable logs with replay
      description: logs events carry AgentLog arrays in ingestion order; checkpoint events advance the resume cursor; reset requires reloading history. Last-Event-ID resumes on reconnect. No agent controls are accepted.
      parameters:
        - {name: config_id, in: query, schema: {type: string}}
        - {name: session_id, in: query, schema: {type: string}}
        - {name: user_id, in: query, schema: {type: string}}
        - {name: severity, in: query, schema: {type: string, enum: [info, error]}}
        - {name: source, in: query, description: Comma-separated user/agent/tool/system sources., schema: {type: string}}
        - {name: q, in: query, schema: {type: string, maxLength: 256}}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: Last-Event-ID, in: header, schema: {type: string}}
      responses:
        "200":
          description: SSE events logs, checkpoint and reset.
          content:
            text/event-stream:
              schema: {type: string}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "503":
          description: Log storage is unavailable.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /v1/agents/logs/{id}:
    get:
      operationId: getAgentLog
      summary: Redacted structured log details scoped to the customer
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: One log with full safe metadata.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AgentLog"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "503":
          description: Log storage is unavailable.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "404": {$ref: "#/components/responses/NotFound"}

  /v1/data/export:
    get:
      operationId: exportData
      summary: Everything this app has, as newline-delimited JSON
      description: >
        One line per row, `{"table": ..., "row": {...}}`, and a last line
        `{"cursor": ..., "customer": ..., "at": ...}`. The cursor comes last because it is
        also what says the export finished: a stream that broke halfway has no cursor
        line, so half a copy cannot be mistaken for a whole one. The rows are read at one
        moment rather than stitched together, and exporting starts recording changes so
        that `listDataChanges` carries on from exactly where this left off.

        Only the calling app's rows are here, and credentials are not: an API key secret,
        an OAuth access token and an OAuth refresh token stay with the deployment that
        holds them, so an imported plugin connection has to be authorized again. The audio
        behind a voice sample and a call recording lives in an object bucket rather than in
        this database; the rows naming those objects are here, and copying the bucket is
        yours to do.

        Server-side only, and refused entirely when the router runs with
        ROUTER_AUTH_MODE=noauth, where naming a customer is all it takes to be one.
      responses:
        "200":
          description: The export, streamed
          content:
            # Newline-delimited JSON, declared as text so that every client generator
            # can express it. The server sends application/x-ndjson.
            text/plain:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: This deployment has no database to export from.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /v1/data/import:
    post:
      operationId: importData
      summary: Write an export, or a batch of changes, into this deployment
      description: >
        Takes what `exportData` produced, and the same lines with a `change` in place of a
        `row` for what `listDataChanges` returned. Every row is written under the calling
        app whatever the file says, so an export from one app cannot be imported into
        another's rows, and rows belonging to a customer through a parent are only written
        where that parent is the caller's.

        Importing is idempotent: the same export applied twice leaves what applying it
        once would.

        Server-side only, and refused when the router runs with ROUTER_AUTH_MODE=noauth.
      requestBody:
        required: true
        content:
          # The file exportData produced: newline-delimited JSON, sent as it stands.
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: What was written
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataImport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: This deployment has no database to import into.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /v1/data/changes:
    get:
      operationId: listDataChanges
      summary: What has happened to this app's rows since a cursor
      description: >
        Oldest first, for replaying onto the deployment that took the export. A change is
        only returned once every transaction older than it has committed, so following the
        cursor never steps over a row, and a change carries the row as it now reads rather
        than the columns that changed, so applying one twice is the same as applying it
        once.

        Changes are only recorded for an app that has exported, and only for as long as
        the deployment's retention window. A cursor older than what is still kept is
        answered 410, which means export again.

        Server-side only, and refused when the router runs with ROUTER_AUTH_MODE=noauth.
      parameters:
        - {name: after, in: query, description: The cursor the last page ended at., schema: {type: integer, format: int64}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 1000, default: 500}}
      responses:
        "200":
          description: The changes since the cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataChangePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "410":
          description: The changes since that cursor are no longer kept, so export again.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "503":
          description: This deployment has no database to read changes from.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}

  /v1/agents/plugins/callback:
    get:
      operationId: pluginOAuthCallback
      summary: Finish a plugin login
      description: >
        The provider redirects here with a code. The path is unauthenticated because the
        browser arrives from the identity provider, and the state is the secret.
      security: []
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: The browser is sent back to the agent editor

  /v1/agents/sessions/{id}/events:
    get:
      operationId: watchSession
      x-client-accessible: true
      summary: Watch the conversation and answer the model's tool calls
      description: >
        A WebSocket, which OpenAPI cannot describe past the upgrade. Frames are JSON
        objects carrying a `type` and the fields of that event.

        The server sends what the conversation did: `joined`, `heard`, `responding`,
        `response_delta`, `responded` (pending_work remains true while tools or delegated work are outstanding), `spoke`, `turn`, `decision`, `delegated`,
        `task_settled`, `task_cancelled`, `tool_call`, `tool_ran`, `transferred`,
        `pressed`, `looked_up`, `backchannel`, `interrupted`, `overlap_decided`,
        `conversation_compacted`, `models_changed`, `error` and `left`.

        Persistent text sessions also emit `conversation_updated` with conversation_id
        and a complete message snapshot: id, command_id, question_id, role, text, state, response_started_at,
        state_started_at, finished_at, duration_ms, saved, persistence_error and
        attachments. Each tool_calling attachment has tool_call_id, name, title,
        status, phase, summary, immutable started_at, execution_started_at, finished_at
        and duration_ms. Activity states are thinking, queued, tools, writing,
        completed, failed and cancelled. tool_started includes tool_call_id, tool,
        turn_id and started_at; tool_ran also includes tool_call_id.

        A respond command carrying command_id emits command_accepted with a nested
        command receipt (command_id, user_message_id, assistant_message_id, state,
        duplicate). Personal persistent text sessions require this ID. A retry with
        the same text returns the existing IDs without invoking the model again;
        reuse with different text emits an error. Commands with IDs currently accept
        text only. After restart an interrupted command is reported, not rerun.

        An `interrupt` command carrying `command_id` stops that command and emits
        `command_stopped` with its terminal receipt. A stop arriving after its command
        finished replays that command's receipt and leaves the command running now
        alone; an unknown command is reported as an error. Without `command_id` the frame
        stops whichever reply is current, which is what a caller with no command to name
        means by it.

        A `decision` frame is one judgement the conversation made, carrying the same
        fields as a CallEvent. Together they are why the call went the way it did, and
        they are also written down, so a finished call replays them from
        `/v1/agents/calls/{id}/events`.

        Two frames are only sent when asked for, because they are far more frequent than
        the rest and most consumers want neither. `interim=true` adds `hearing`, which is
        a transcript revision as it arrives rather than a settled turn. `decisions=false`
        drops `decision`.

        `replay_pending_tools=true` opts a durable tool host into replay of external
        tool calls still awaiting results in a live voice session. Completed,
        cancelled and timed-out requests are excluded at snapshot time. Replays
        retain their tool and turn IDs and may duplicate live delivery; the host
        must persist execution receipts and refuse to repeat uncertain writes.
        Ordinary status watchers should leave this disabled. Persistent text
        command recovery is unchanged.

        The client sends `tool_result` to answer a `tool_call`, and `say`, `respond`,
        `interrupt` (optionally naming a `command_id`), `instructions` or `close` to act
        on the session. A `tool_call` is the only frame that must be answered:
        everything else is a report. Tool calls made by durable personal commands carry
        `command_id` and `turn_id`; their result must repeat both values so a result cannot
        be adopted by another command or turn.

        `tool_result.output` is a string, or an array of parts `[{type: text|image_url,
        ...}]`. An image has an `image_url` object containing `url` (HTTP(S) or data URI), optionally with `detail` of
        `auto`, `low` or `high`. One socket message is at most
        5 MB.

        `respond` may carry `images: [{url, detail}]`. These schedule the vision skill;
        the conversation receives the question and later the findings, without raw images.
        Video capture uses task-correlated `get_video_frames` tool requests and `tool_result`
        replies. Frames are never attached automatically to conversational turns.
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - name: interim
          in: query
          required: false
          description: Also send `hearing` frames, which are the words as they are revised.
          schema:
            type: boolean
            default: false
        - name: decisions
          in: query
          required: false
          description: Send `decision` frames.
          schema:
            type: boolean
            default: true
        - name: replay_pending_tools
          in: query
          required: false
          description: Replay pending live voice tool requests to a durable tool host.
          schema:
            type: boolean
            default: false
      responses:
        "101":
          description: The socket is open
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/{modality}/stream:
    get:
      operationId: streamModality
      summary: Route one modality over a socket, for a pipeline running elsewhere
      description: >
        A WebSocket, which OpenAPI cannot describe past the upgrade. This is the routing
        the agent does, offered a piece at a time: a caller running its own pipeline sends
        audio or text and gets transcripts, audio or completions back, and the request is
        failed over and billed exactly as it would be inside a session.

        Every socket opens with a `start` frame. It names either a `config_id`, a stored
        router config to take the options from, or the options outright; naming both
        overrides that config field by field. What it may carry is the modality's own
        option block - `SttOptions` for speech-to-text, `TtsOptions` for a voice,
        `LlmOptions` for a model, `StsOptions` for a speech-to-speech model - plus
        `agent_id` and `call_id` to attribute the work to a conversation and `tags` to
        bill it.

        Speech-to-text then takes binary PCM at the `sample_rate` the start frame named, 16
        kHz mono by default, and returns `transcript` frames. Text-to-speech takes `speak`
        frames and returns binary audio with `synthesis_complete` between utterances: each
        audio frame opens with a little-endian header of a uint32 sample rate, a uint16
        channel count and two reserved bytes, followed by PCM16 samples. Language models
        take `respond` frames, each naming an `id` and anything from `LlmOptions` for that
        one response along with its `tools`, and return `delta`, `reasoning_delta` and one
        `complete` per response; a `complete` reports the `status` the response ended in,
        what it cost in tokens and how long the caller waited for the first of them.
        `messages[].content` is a string, or an array of parts `[{type: text|image_url,
        ...}]`. Assistant messages replay `tool_calls: [{id, name, arguments, signature}]`,
        with arguments encoded as a JSON string and optional opaque signature. Tool-result
        messages use `role: tool` and `tool_call_id` to correlate their content. Completed
        tool calls include the same replay fields; incomplete responses additionally report
        `incomplete_reason` (such as `max_output_tokens`). The LLM `started` frame advertises
        `tool_history: true` when tool replay is supported. Content parts use `[{type: text|image_url,
        ...}]` with images on `image_url: {url, detail}`. Use `vlm` to select image-capable models. A model that does not accept images
        is refused with an `error` frame naming the model and the modality, before anything
        is billed. An
        `interrupt` frame naming `response_ids` abandons responses still being generated,
        which still settle and are still billed for what they produced before being cut
        off.

        Speech-to-speech takes binary PCM at the `sample_rate` the start frame named, 16
        kHz mono by default, and returns the model's own voice as binary audio alongside
        JSON frames: `speech_started` and `speech_stopped` when the model's own detector
        hears the caller begin and finish, `input_transcript` and `output_transcript` for
        what it heard and said, `response_started` and `response_complete` around each
        reply, and `tool_call` and `tool_cancel` when it wants a function run. Each audio
        frame opens with a sixteen-byte little-endian header of a uint32 sample rate, a
        uint16 channel count, a uint16 header version, a uint32 generation and a uint32
        chunk index, so a client can drop audio from a reply that `response_complete` has
        already reported interrupted. Mid-stream it takes `text` to inject a typed turn,
        `instructions` and `tools` to change either where the model allows it, `frame`
        with an `image_url` for a model that sees, `tool_result` with `tool_call_id` and
        `output` or `error`, and `interrupt` with an optional `played_ms` saying how much
        of the reply the listener heard. What the routed model cannot do is refused with an
        `error` frame rather than dropped. All four report failures as `error` frames and
        end with `closed`.

        Search is answered at `/v1/search` rather than here: one question and its answer
        need no socket held open between them. Memory and phone are recorded rather than
        routed, so they are not served either.
      parameters:
        - $ref: "#/components/parameters/Modality"
      responses:
        "101":
          description: The socket is open
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/dispatch:
    get:
      operationId: dispatchCalls
      summary: Wait for inbound calls to answer, as a worker
      description: >
        A WebSocket, which OpenAPI cannot describe past the upgrade. The worker connects
        here and waits, rather than being called, because the agent runs in the customer's
        own process and this service cannot reach into it.

        The socket opens with a `ready` frame naming the worker, and a `call` or `message`
        frame arrives for each piece of work handed to it, each carrying the `work_id` that
        names it. The worker answers `done` with that `work_id`, and an `error` when it
        could not be done, which is what frees its room for the next piece. It also sends
        `load` so an operator can see what each worker is under, and `ping` to time the
        round trip itself.

        Work goes to whichever of a customer's workers is holding the least of what it said
        it can hold, so a worker that never reports `done` is one the router cannot tell is
        busy.

        A `message` written to a running session whose agent sets `dispatch.text` carries
        that `session_id`, and a `command_id` when it was sent as a durable command. The
        model has not answered it: the worker does, by creating a response on that session
        with a server-side credential and the same `command_id` and text.

        Server-side only: it needs a server-side token, so it cannot be reached from an
        end user's device. This is the clearest case of why: a worker is offered other
        people's callers, so anything that can open this socket can answer for the whole
        app. The auth type has no query parameter, so a browser cannot open one at all.
      parameters:
        - name: capacity
          in: query
          required: false
          description: How much work this worker takes at once, calls and messages together.
          schema:
            type: integer
            minimum: 1
            default: 4
        - name: active
          in: query
          required: false
          description: >
            How much work this worker is still running from before it reconnected, which
            the router counts against its capacity until each piece is reported `done`.
            Sending this at all, even as 0, is what says the worker reports `done`; one
            that leaves it out is held only to the depth of its queue.
          schema:
            type: integer
            minimum: 0
        - name: handles
          in: query
          required: false
          description: >
            The kinds of work this worker accepts, comma separated. Absent is both. A worker
            that only answers in writing says `message`, so a caller is never left listening
            to a phone it would have dropped.
          schema:
            type: string
            example: call,message
      responses:
        "101":
          description: The socket is open
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    Modality:
      name: modality
      in: path
      required: true
      description: Which kind of model to route.
      schema:
        $ref: "#/components/schemas/Modality"
    SessionID:
      name: id
      in: path
      required: true
      description: The session, as returned when it was created.
      schema:
        type: string

  responses:
    BadRequest:
      description: The request was malformed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: The customer header is missing
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: >-
        The caller is known and this operation is server-side only. It needs
        Stream-Auth-Type: server and a token carrying server: true, which means it cannot
        be reached from an end user's device.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No such modality, provider or shortcut
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    AgentLog:
      type: object
      required: [id, config_id, agent_id, session_id, source, severity, event_type, message, occurred_at, ingested_at]
      properties:
        id: {type: string}
        cursor: {type: string}
        config_id: {type: string}
        agent_id: {type: string}
        session_id: {type: string}
        user_id: {type: string}
        source: {type: string, enum: [user, agent, tool, system]}
        severity: {type: string, enum: [info, error]}
        event_type: {type: string}
        message: {type: string}
        occurred_at: {type: string, format: date-time}
        ingested_at: {type: string, format: date-time}
        details: {type: object, additionalProperties: true}
    AgentLogPage:
      type: object
      required: [items, has_more, next_cursor, resume_cursor, dropped_logs, coverage]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/AgentLog"}}
        has_more: {type: boolean}
        next_cursor: {type: string}
        resume_cursor: {type: string}
        dropped_logs: {type: integer, format: int64}
        coverage: {type: string}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    DataChange:
      type: object
      description: One thing that happened to one row of the calling app's data.
      required: [seq, table, op, key, at]
      properties:
        seq:
          type: integer
          format: int64
          description: Where this sits in the order changes happened, and the cursor to resume from.
        table:
          type: string
          description: Which table the row is in.
          example: agent_configs
        op:
          type: string
          enum: [insert, update, delete]
        key:
          type: object
          additionalProperties: true
          description: What identifies the row, which is all a delete has.
        row:
          type: object
          additionalProperties: true
          description: The row as it now reads, absent for a delete and never carrying a credential.
        at:
          type: string
          format: date-time

    DataChangePage:
      type: object
      required: [changes, cursor]
      properties:
        changes:
          type: array
          items:
            $ref: "#/components/schemas/DataChange"
        cursor:
          type: integer
          format: int64
          description: What to pass as `after` next time.
        caught_up:
          type: boolean
          description: >
            Nothing else has happened yet, which is when a switchover is safe: point your
            SDKs at the new deployment, wait for this to be true once more, and stop.

    DataImport:
      type: object
      required: [rows]
      properties:
        rows:
          type: integer
          format: int64
          description: How many rows were written.
        tables:
          type: object
          additionalProperties:
            type: integer
            format: int64
          description: How many of them went into each table.
        cursor:
          type: integer
          format: int64
          description: The cursor the export named, to ask the other deployment for changes from.

    Modality:
      type: string
      enum: [stt, tts, llm, sts, search, lcm, image, memory, knowledge, phone]
      description: >
        What kind of work was done. The first seven are routed across providers; sts is
        speech to speech, one native audio model in place of a transcriber, a text model
        and a voice. lcm is a large classifier model: it answers a question about a piece
        of text with a typed value and the probability behind it rather than with prose,
        which is what a guardrail asks before a reply is spoken. image is pictures drawn
        from a prompt. Memory, knowledge and
        phone are recorded but not routed, since there is one memory store, one knowledge
        base and one vendor per number, so the provider paths do not serve them while the
        statistics paths do.
      example: tts

