        A skill belongs to one agent config. Two agents that both need the same kind of work have one each, so editing what "explain" means for one leaves the other alone. The built-in think, recall and explain need no row: a config may name them without defining them.
        Server-side only: it needs a server-side token, so it cannot be reached from an end user's device.
