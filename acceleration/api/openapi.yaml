  /v1/agents/sessions:
    post:
      description: |-
        The whole conversation runs here: the agent joins the call, transcribes what it hears, answers it and speaks back, all through the routers. The caller keeps the session id and watches the conversation over the events socket.
        It returns once the agent is in the call, so a session that comes back is one that is already listening. Tools declared here are the caller's own: the model asks for them over the events socket and waits for the caller to answer.
      operationId: createSession
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: The agent is in the call
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: A session with that id already exists
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Join a call as a voice agent
      x-client-accessible: true
  /v1/agents/sessions/{id}:
    delete:
      description: |-
        Deletes the session, running or stopped: it is stopped first if it is running, then its turns and their items are deleted, and so is everything it taught the memory store. Memories other sessions learned about the same user are kept. The transcript a conversation in writing kept in Stream Chat is not deleted.

        To end a call and keep the conversation, stop the session instead.
      operationId: deleteSession
      parameters:
        - description: The session, as returned when it was created.
          in: path
          name: id
          required: true
          schema:
            description: The session, as returned when it was created.
            type: string
      responses:
        "204":
          description: The session is deleted
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Delete a session
      x-client-accessible: true
    get:
      description: 'Reading a session is open to the device holding it, for the same reason listing and stopping are: it is the conversation the caller is having. A session belonging to somebody else is reported as not found rather than refused, so this is not a way to find out whose an id is.'
      operationId: getSession
      parameters:
        - description: The session, as returned when it was created.
          in: path
          name: id
          required: true
          schema:
            description: The session, as returned when it was created.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: The session
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: One session
      x-client-accessible: true
    patch:
      description: |-
        Renames a session, relabels it, rewrites its instructions or moves it onto other models, for this session only: the agent config it started from is untouched. A field left out is left as it is. The id, the call and incognito are what the session is, so they cannot change; forking is how to get a session that differs in those.

        An end user's device may change a session's title, description and custom, so a person can tidy up their own conversations. Instructions, models and voice are the backend's to change, and a device asking for them is refused with a 403.

        A session that ended can still be renamed and relabelled. Instructions and models only mean something to a session that is running, so asking to change them on one that ended is refused.

        Model changes are opened before anything changes, so a target that does not route is refused and the session carries on as it was. Instructions and models take over from the next turn; a reply being spoken finishes on what it started with. Naming sts makes the session native, and an empty sts makes it a cascade again. A title or description given here stops the router naming the conversation for what was said.
      operationId: updateSession
      parameters:
        - description: The session, as returned when it was created.
          in: path
          name: id
          required: true
          schema:
            description: The session, as returned when it was created.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSessionRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: The session as it now is
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Change a session
      x-client-accessible: true
  /v1/agents/sessions/{id}/commands/{command_id}:
    get:
      description: Reads a command's receipt without accepting, running or stopping anything. It is how a client whose stop or submission had an unknown outcome reconciles the same command id rather than inventing another one.
      operationId: getSessionCommand
      parameters:
        - description: The session, as returned when it was created.
          in: path
          name: id
          required: true
          schema:
            description: The session, as returned when it was created.
            type: string
        - description: The client's own command id, as sent when the command was submitted.
          in: path
          name: command_id
          required: true
          schema:
            description: The client's own command id, as sent when the command was submitted.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandReceipt'
          description: The command's current receipt
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: What is known about one durable command
  /v1/agents/sessions/{id}/commands/{command_id}/interrupt:
    post:
      description: |-
        Abandons the reply that command is generating. Unlike interrupting the session, a stop that arrives after its command finished replays that command's terminal receipt and leaves the command running now alone, so a delayed stop for one question can never take the answer to the next one.
        A command accepted but not yet generating is prevented from starting. A command already completed, failed, cancelled or interrupted returns what it ended as. An unknown command is a 404, the same answer as a conversation the caller does not own.
        Interrupting model work claims nothing about a tool whose external side effect already happened.
      operationId: interruptSessionCommand
      parameters:
        - description: The session, as returned when it was created.
          in: path
          name: id
          required: true
          schema:
            description: The session, as returned when it was created.
            type: string
        - description: The client's own command id, as sent when the command was submitted.
          in: path
          name: command_id
          required: true
          schema:
            description: The client's own command id, as sent when the command was submitted.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandReceipt'
          description: The command's terminal receipt
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The stop was accepted but its durable outcome is unknown. The command is not reported stopped; retry the same command id.
      summary: Stop one named command, and nothing else
  /v1/agents/sessions/{id}/events:
    get:
      description: |-
        A WebSocket, which OpenAPI cannot describe past the upgrade. Frames are JSON objects carrying a `type` and the fields of that event.
        The server sends what the conversation did: `joined`, `heard`, `responding`, `response_delta`, `responded` (pending_work remains true while tools or delegated work are outstanding), `spoke`, `turn`, `decision`, `delegated`, `task_settled` (files lists what the work's code handed back, each a name, mime_type, url and size, uploaded to a persistent conversation's channel and attached to the reply), `task_cancelled`, `tool_call`, `tool_ran`, `transferred`, `pressed`, `looked_up`, `backchannel`, `interrupted`, `overlap_decided`, `conversation_compacted`, `models_changed`, `error` and `left`.
        Persistent text sessions also emit `conversation_updated` with conversation_id and a complete message snapshot: id, command_id, question_id, role, text, state, response_started_at, state_started_at, finished_at, duration_ms, saved, persistence_error and attachments. Each tool_calling attachment has tool_call_id, name, title, status, phase, summary, immutable started_at, execution_started_at, finished_at and duration_ms. A plugin_authorization attachment asks the end user to connect a plugin the reply needed, with plugin_id, title, authorize_url, text, thumb_url and title_link: a client shows it as a button opening authorize_url. Once the user finishes that login the message is sent again with the attachment's status set to connected. Activity states are thinking, queued, tools, writing, completed, failed and cancelled. tool_started includes tool_call_id, tool, turn_id and started_at; tool_ran also includes tool_call_id.
        A respond command carrying command_id emits command_accepted with a nested command receipt (command_id, user_message_id, assistant_message_id, state, duplicate). Personal persistent text sessions require this ID. A retry with the same text returns the existing IDs without invoking the model again; reuse with different text emits an error. Commands with IDs currently accept text only. After restart an interrupted command is reported, not rerun.
        An `interrupt` command carrying `command_id` stops that command and emits `command_stopped` with its terminal receipt. A stop arriving after its command finished replays that command's receipt and leaves the command running now alone; an unknown command is reported as an error. Without `command_id` the frame stops whichever reply is current, which is what a caller with no command to name means by it.
        A `decision` frame is one judgement the conversation made, carrying the same fields as a CallEvent. Together they are why the call went the way it did, and they are also written down, so a finished call replays them from `/v1/agents/calls/{id}/events`.
        Two frames are only sent when asked for, because they are far more frequent than the rest and most consumers want neither. `interim=true` adds `hearing`, which is a transcript revision as it arrives rather than a settled turn. `decisions=false` drops `decision`.
        `replay_pending_tools=true` opts a durable tool host into replay of external tool calls still awaiting results in a live voice session. Completed, cancelled and timed-out requests are excluded at snapshot time. Replays retain their tool and turn IDs and may duplicate live delivery; the host must persist execution receipts and refuse to repeat uncertain writes. Ordinary status watchers should leave this disabled. Persistent text command recovery is unchanged.
        The client sends `tool_result` to answer a `tool_call`, and `say`, `respond`, `interrupt` (optionally naming a `command_id`), `instructions` or `close` to act on the session. A `tool_call` is the only frame that must be answered: everything else is a report. Tool calls made by durable personal commands carry `command_id` and `turn_id`; their result must repeat both values so a result cannot be adopted by another command or turn.
        A call to a tool declared with an `approval` waits for a person. The client reports their answer with `tool_approval` (`tool_call_id`, `command_id`, `turn_id`, `allowed`, and optionally a `summary` shown when they declined), before it answers the call with `tool_result`.
        `tool_result.output` is a string, or an array of parts `[{type: text|image_url, ...}]`. An image has an `image_url` object containing `url` (HTTP(S) or data URI), optionally with `detail` of `auto`, `low` or `high`. One socket message is at most 5 MB.
        `respond` may carry `images: [{url, detail}]`. These schedule the vision skill; the conversation receives the question and later the findings, without raw images. Video capture uses task-correlated `get_video_frames` tool requests and `tool_result` replies. Frames are never attached automatically to conversational turns.
      operationId: watchSession
      parameters:
        - description: The session, as returned when it was created.
          in: path
          name: id
          required: true
          schema:
            type: string
        - description: Also send `hearing` frames, which are the words as they are revised.
          in: query
          name: interim
          schema:
            default: false
            type: boolean
        - description: Send `decision` frames.
          in: query
          name: decisions
          schema:
            default: true
            type: boolean
        - description: Replay pending live voice tool requests to a durable tool host.
          in: query
          name: replay_pending_tools
          schema:
            default: false
            type: boolean
      responses:
        "101":
          description: The socket is open
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Watch the conversation and answer the model's tool calls
      x-client-accessible: true
      x-client-frames:
        - $ref: '#/components/schemas/SessionRespondCommand'
        - $ref: '#/components/schemas/ToolResultCommand'
        - $ref: '#/components/schemas/ToolApprovalCommand'
  /v1/agents/sessions/{id}/fork:
    post:
      description: |-
        Opens a session from another's spec, carrying its history across by default, and records where it came from. The usual reason is to ask the same question of a different model without losing the original answer, which is why anything in the request is written over what the parent was opened with.
        The parent is untouched and keeps running if it was running. Forking an incognito session is refused rather than answered with an empty conversation: there is nothing recorded to fork from, and pretending otherwise would hand back a session that quietly lost everything the caller thought they were continuing.
      operationId: forkSession
      parameters:
        - description: The session, as returned when it was created.
          in: path
          name: id
          required: true
          schema:
            description: The session, as returned when it was created.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForkSessionRequest'
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: The fork is running
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Continue a conversation as a new one
      x-client-accessible: true
  /v1/agents/sessions/{id}/instructions:
    put:
      description: 'Deprecated: use updateSession. Applies from the next turn. The reply being spoken keeps the prompt it started with, because rewriting it mid-sentence would have the agent change character in the middle of a thought.'
      operationId: setSessionInstructions
      parameters:
        - description: The session, as returned when it was created.
          in: path
          name: id
          required: true
          schema:
            description: The session, as returned when it was created.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstructionsRequest'
        required: true
      responses:
        "204":
          description: The next turn will use them
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Change what the agent is told to be
  /v1/agents/sessions/{id}/interrupt:
    post:
      description: What a caller outside the call has instead of a voice. A murmur is not interrupted, because it was meant to overlap with whoever is talking.
      operationId: interruptSession
      parameters:
        - description: The session, as returned when it was created.
          in: path
          name: id
          required: true
          schema:
            description: The session, as returned when it was created.
            type: string
      responses:
        "204":
          description: The reply was abandoned, if there was one
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Abandon the reply being spoken
  /v1/agents/sessions/{id}/memories:
    delete:
      description: |-
        Deletes every memory learned in the session, running or ended, and leaves the rest of the user's memories alone. Ending a session keeps its memories, so the next conversation knows what this one established; this is how to take them back.

        Server-side only: it needs a server-side token, so it cannot be reached from an end user's device.
      operationId: deleteSessionMemories
      parameters:
        - description: The session whose memories to delete.
          in: path
          name: id
          required: true
          schema:
            description: The session whose memories to delete.
            type: string
      responses:
        "204":
          description: The memories are deleted
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Delete what one session remembered
  /v1/agents/sessions/{id}/respond:
    post:
      operationId: respondSession
      parameters:
        - description: The session, as returned when it was created.
          in: path
          name: id
          required: true
          schema:
            description: The session, as returned when it was created.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RespondRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandReceipt'
          description: Durable command accepted or replayed; only a new command starts inference
        "204":
          description: The model is answering
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The command ID was already accepted with different content
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Answer a piece of text through the model, as though it had been said
  /v1/agents/sessions/{id}/responses:
    get:
      description: 'Oldest first, which read in order are the conversation. This is the shape of it rather than the text: what was asked, whether the turn finished, and how long it took. The items endpoint is what carries what happened inside each one.'
      operationId: listResponses
      parameters:
        - description: The session, as returned when it was created.
          in: path
          name: id
          required: true
          schema:
            description: The session, as returned when it was created.
            type: string
        - description: Up to 200. Omitted is 25.
          explode: false
          in: query
          name: limit
          schema:
            description: Up to 200. Omitted is 25.
            maximum: 200
            minimum: 1
            type: integer
        - description: The `next_cursor` of the previous page, sent with the same filters. Omitted is the first page.
          explode: false
          in: query
          name: cursor
          schema:
            description: The `next_cursor` of the previous page, sent with the same filters. Omitted is the first page.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponsePage'
          description: The session's turns, oldest first
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: The turns the agent took in a session
      x-client-accessible: true
    post:
      description: |-
        The same thing respond does, with an id back. That is the whole difference and the reason this exists: respond returns nothing, so a caller that wants to follow one particular turn has to watch the socket and guess which events belong to it. With an id it can ask for that turn's items instead.
        It returns as soon as the turn has started, not when it has finished. A model takes seconds and a request that waited them out would time out on anything long enough to be worth asking.
      operationId: createResponse
      parameters:
        - description: The session, as returned when it was created.
          in: path
          name: id
          required: true
          schema:
            description: The session, as returned when it was created.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateResponseRequest'
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
          description: The agent is answering
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The command ID was already accepted with different content
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Ask the agent something and get a handle on the answer
      x-client-accessible: true
  /v1/agents/sessions/{id}/responses/items:
    get:
      description: |-
        One flat stream across every turn rather than a list per turn, because that is how a conversation reads and how it is rendered: the question, what the agent did about it, what it said, then the next question. Naming a response narrows it to that turn.
        Deltas are not here. A hundred fragments of one sentence are the sentence, and keeping them would make this mostly punctuation; a caller watching a turn happen reads the deltas off the events socket, and a caller reading one back wants the shape of it.
        Nothing is returned for an incognito session, which has no items to return.
      operationId: listResponseItems
      parameters:
        - description: The session, as returned when it was created.
          in: path
          name: id
          required: true
          schema:
            description: The session, as returned when it was created.
            type: string
        - description: Narrow to one turn's items. Omitted is every turn in the session.
          explode: false
          in: query
          name: response_id
          schema:
            description: Narrow to one turn's items. Omitted is every turn in the session.
            type: string
        - description: Up to 1000. Omitted is 200.
          explode: false
          in: query
          name: limit
          schema:
            description: Up to 1000. Omitted is 200.
            maximum: 1000
            minimum: 1
            type: integer
        - description: The `next_cursor` of the previous page, sent with the same filters. Omitted is the first page.
          explode: false
          in: query
          name: cursor
          schema:
            description: The `next_cursor` of the previous page, sent with the same filters. Omitted is the first page.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponseItemPage'
          description: The items, oldest first
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: What the agent did, turn by turn, in the order it happened
      x-client-accessible: true
  /v1/agents/sessions/{id}/rewind:
    post:
      description: |-
        The conversation continues as though nothing after the named response had been said: the reply being spoken is abandoned, the agent's history is cut back to the end of that response, and every later response is marked rewound, so neither the responses nor their items list them again. The named response itself is kept.
        The history is rebuilt from what the session recorded, the question and the answer of each turn, so a session that recorded nothing cannot be rewound: an incognito one, one on a deployment with no store, and a native speech-to-speech one, whose model keeps its own context. A persistent conversation is refused as well, because its transcript lives in Chat and would bring the rewound turns back the next time it opened; fork it at the response instead.
      operationId: rewindSession
      parameters:
        - description: The session, as returned when it was created.
          in: path
          name: id
          required: true
          schema:
            description: The session, as returned when it was created.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RewindSessionRequest'
        required: true
      responses:
        "204":
          description: The conversation carries on from the end of that response
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Go back to a response and carry on from there
      x-client-accessible: true
  /v1/agents/sessions/{id}/say:
    post:
      description: For when the caller already knows what should be said, such as a greeting. A model would only add latency and cost to words that were never in question.
      operationId: saySession
      parameters:
        - description: The session, as returned when it was created.
          in: path
          name: id
          required: true
          schema:
            description: The session, as returned when it was created.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SayRequest'
        required: true
      responses:
        "204":
          description: The text is being spoken
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Speak a piece of text without going through the model
  /v1/agents/sessions/{id}/settings:
    patch:
      description: |-
        Deprecated: use updateSession. Swaps what the agent runs on without leaving the call, for this session only: the agent config it started from is untouched. The new models are opened before anything changes, so a target that does not route is refused and the agent carries on as it was. They take over from the next turn; a reply being spoken finishes on the models it started with.
        Naming sts makes the session native, and an empty sts makes it a cascade again, on whatever llm, stt and tts it names or had before. The conversation carries across: a conversation model is handed the history on every turn, and a speech-to-speech model is opened with the recent transcript in its instructions.
      operationId: setSessionSettings
      parameters:
        - description: The session, as returned when it was created.
          in: path
          name: id
          required: true
          schema:
            description: The session, as returned when it was created.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionSettingsRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: The session, on its new models
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Change the models and voice of one running session
  /v1/agents/sessions/{id}/stop:
    post:
      description: |-
        The agent leaves the call and the session stops running. Everything it recorded is kept: it can still be read back, renamed and forked, and what it remembered carries into the next conversation. Deleting a session is what takes those away.

        A conversation in writing has nothing to hang up, so it is usually left running rather than stopped. Stopping is for a call, where the agent is holding a line open.
      operationId: stopSession
      parameters:
        - description: The session, as returned when it was created.
          in: path
          name: id
          required: true
          schema:
            description: The session, as returned when it was created.
            type: string
      responses:
        "204":
          description: The agent has left
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Stop a running session
      x-client-accessible: true
  /v1/agents/sessions/query:
    post:
      description: |-
        Three queries are supported, each over the sessions still running and the ones that ended:

        - every session, sorted by `updated_at`
        - a text search, `{"text": {"$q": "billing"}}`, sorted by `relevance`
        - one project's, `{"project_id": "health"}`, sorted by `updated_at`

        `agent`, `agent_id`, `config_id`, `user_id`, `modality`, `state`, `created_at` and `custom` narrow any of them. A backend gets its customer's sessions; an end user gets their own, whatever they ask for, and an anonymous caller who named nobody gets none.

        The search reads what a person named the conversation, not what was said in it. There is no total: counting every conversation costs more than the page.
      operationId: querySessions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionQuery'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionPage'
          description: A page of sessions
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: List or search the caller's sessions
      x-client-accessible: true
  /v1/agents/simulation-runs:
    get:
      description: Without a simulation named this is the log of everything that has been run lately, which is the same question as what one simulation has come to, asked of all of them.
      operationId: listSimulationRuns
      parameters:
        - explode: false
          in: query
          name: simulation_id
          schema:
            type: string
        - explode: false
          in: query
          name: state
          schema:
            enum:
              - running
              - passed
              - failed
              - cancelled
              - errored
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SimulationRun'
                type: array
          description: The runs, newest first
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: What the simulations have come to, newest first
  /v1/agents/simulation-runs/{id}:
    get:
      operationId: getSimulationRun
      parameters:
        - description: The resource, as returned when it was created.
          in: path
          name: id
          required: true
          schema:
            description: The resource, as returned when it was created.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationRun'
          description: The run and its conversations
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: One run, with the conversations it had
  /v1/agents/simulation-runs/{id}/cancel:
    post:
      description: |-
        Unlike a paused campaign the conversations in flight are ended too: there is nobody on the other end of them to be hung up on.
        Server-side only: it needs a server-side token, so it cannot be reached from an end user's device.
      operationId: cancelSimulationRun
      parameters:
        - description: The resource, as returned when it was created.
          in: path
          name: id
          required: true
          schema:
            description: The resource, as returned when it was created.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationRun'
          description: The run is stopping
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Stop a run
  /v1/agents/simulations:
    get:
      operationId: listSimulations
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Simulation'
                type: array
          description: The customer's simulations, newest first
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: The simulations the calling customer has
    post:
      description: |-
        A simulation is a scenario to put an agent through and something that has to be true at the end of it. The scenario is a brief rather than a script: it is given to a model that plays the caller, reads what the agent says back and decides what to say next, so a scenario can say to change your mind once the order is handled. Nothing is run until it is.
        Server-side only: it needs a server-side token, so it cannot be reached from an end user's device.
      operationId: createSimulation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulationRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Simulation'
          description: The simulation was stored
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Write down a conversation to have with an agent
  /v1/agents/simulations/{id}:
    delete:
      description: |-
        The runs that named it are kept, so the simulation stops being runnable rather than stops having existed.
        Server-side only: it needs a server-side token, so it cannot be reached from an end user's device.
      operationId: deleteSimulation
      parameters:
        - description: The resource, as returned when it was created.
          in: path
          name: id
          required: true
          schema:
            description: The resource, as returned when it was created.
            type: string
      responses:
        "204":
          description: The simulation is gone
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Delete a simulation
    get:
      operationId: getSimulation
      parameters:
        - description: The resource, as returned when it was created.
          in: path
          name: id
          required: true
          schema:
            description: The resource, as returned when it was created.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Simulation'
          description: The simulation
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: One simulation
    put:
      description: |-
        Every field is written, so the body is what the simulation now asks rather than what changed about it. The runs it already has keep their own copy of what they tested, so an old result still says what it was a result of.
        Server-side only: it needs a server-side token, so it cannot be reached from an end user's device.
      operationId: updateSimulation
      parameters:
        - description: The resource, as returned when it was created.
          in: path
          name: id
          required: true
          schema:
            description: The resource, as returned when it was created.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulationRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Simulation'
          description: The simulation as it now is
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Replace a simulation
  /v1/agents/simulations/{id}/run:
    post:
      description: |-
        Returns once the run is written rather than once it is over: the conversations happen after the answer, and the run says how far along they are. A simulation asking several ways has them all at once.
        Server-side only: it needs a server-side token, so it cannot be reached from an end user's device.
      operationId: runSimulation
      parameters:
        - description: The resource, as returned when it was created.
          in: path
          name: id
          required: true
          schema:
            description: The resource, as returned when it was created.
            type: string
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationRun'
          description: The run is going
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Have the conversations
  /v1/agents/skills:
    get:
      operationId: listSkills
      parameters:
        - description: Only the skills belonging to this agent config. Omit for every skill the customer has, across all of their agents.
          explode: false
          in: query
          name: config_id
          schema:
            description: Only the skills belonging to this agent config. Omit for every skill the customer has, across all of their agents.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Skill'
                type: array
          description: The customer's skills, newest first
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
