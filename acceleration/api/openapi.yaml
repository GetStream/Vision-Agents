  /v1/agents/knowledge:
    post:
      operationId: ingestKnowledge
      x-server-side-only: true
      summary: Fill a knowledge base with what the business wrote down
      description: >
        The writing half of the lookup a config's knowledge_namespace gives an agent. Each
        document is cut into passages here rather than by the caller, so a file read off
        disk by the command and one posted by an SDK are cut the same way and can replace
        each other.

        Passages are keyed by the source and the position they came from, so posting a
        document again after editing it replaces that document's passages rather than
        leaving two versions of them to be found. A namespace is never shared between
        agents, and the caller names it.

        Server-side only: it needs a server-side token, so it cannot be reached from an
        end user's device.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestKnowledgeRequest"
      responses:
        "200":
          description: The passages were written
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestedKnowledge"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/agents/knowledge/urls:
    get:
      operationId: listKnowledgeUrls
      summary: The pages a knowledge base is kept filled from
      parameters:
        - name: namespace
          in: query
          required: false
          description: One knowledge base. Omit to list every page the customer has.
          schema:
            type: string
      responses:
        "200":
          description: The customer's pages, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KnowledgeUrl"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: addKnowledgeUrl
      x-server-side-only: true
      summary: Keep a knowledge base filled from a page
      description: >
        Posting a document is a thing that happens once; a url is a subscription, because
        the page behind it changes and nobody re-posts it. The page is fetched here, turned
        into markdown, cut into passages the same way a document is, and written under the
        url so a later read replaces it rather than adding a second copy.

        The fetch happens before this answers and a live crawl takes seconds, so this is
        slower than the endpoints around it. A page that could not be read is still stored,
        in the failed state with the reason on it, rather than refused and forgotten.

        Server-side only: it needs a server-side token, so it cannot be reached from an
        end user's device.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeUrlRequest"
      responses:
        "201":
          description: The page was stored, read or not
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeUrl"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/agents/knowledge/urls/{id}:
    get:
      operationId: getKnowledgeUrl
      summary: One page, and when it was last read
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: The page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeUrl"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteKnowledgeUrl
      x-server-side-only: true
      summary: Stop filling a knowledge base from a page
      description: >
        The passages the page wrote are removed too. Leaving them would have the agent go
        on answering out of a page nobody subscribes to any more, which is worse than it
        saying it does not know.

        Server-side only: it needs a server-side token, so it cannot be reached from an
        end user's device.
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "204":
          description: The page and its passages are gone
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/agents/knowledge/urls/{id}/index:
    post:
      operationId: indexKnowledgeUrl
      x-server-side-only: true
      summary: Read a page again
      description: >
        Nothing re-reads a page on its own, so this is what a caller with its own schedule
        calls. Passages past the end of the new version are removed, so a page that got
        shorter does not leave its old tail behind.

        Server-side only: it needs a server-side token, so it cannot be reached from an
        end user's device.
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: The page as it now is
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeUrl"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

