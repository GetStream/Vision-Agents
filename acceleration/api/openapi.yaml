          type: string
      required:
        - guest_id
        - user_id
      type: object
    ClaimGuestResult:
      properties:
        guest_id:
          type: string
        sessions_moved:
          description: How many conversations moved onto the account.
          type: integer
        user_id:
          type: string
      required:
        - guest_id
        - sessions_moved
        - user_id
      type: object
    ClassifyAnswer:
      description: Which fields carry the answer depends on the type. A noul fills yes alone. A choice fills chosen, probabilities and confidence. A score fills level, legend, probabilities and confidence.
      properties:
        chosen:
          description: The likeliest option of a choice.
          type: string
        confidence:
          description: How peaked the distribution is, not whether acting on it is safe.
          format: double
          type: number
        legend:
          additionalProperties:
            type: string
          description: A score's levels by index, as decimal strings.
          type: object
        level:
          description: Where a score landed, which may be between two of its levels.
          format: double
          type: number
        probabilities:
          additionalProperties:
            format: double
            type: number
          description: 'The distribution the answer came from: options for a choice, level indices for a score. They sum to one.'
          type: object
        type:
          $ref: '#/components/schemas/ClassifyQuestionType'
        "yes":
          description: The probability a noul is true, from 0 to 1.
          format: double
          type: number
      required:
        - type
      type: object
    ClassifyQuestion:
      properties:
        instructions:
          example: Is the customer asking for a refund?
          type: string
        levels:
          description: A score's levels, in order, each describing a concrete situation.
          items:
            type: string
          type: array
        "no":
          description: What no means for a noul, where the instructions do not say it.
          type: string
        options:
          additionalProperties:
            type: string
          description: A choice's options, each with a description of what it covers or an empty string where the name says it. Include one for "none of these" whenever the options may not cover an input.
          type: object
        type:
          $ref: '#/components/schemas/ClassifyQuestionType'
        "yes":
          description: What yes means for a noul, where the instructions do not say it.
          type: string
      required:
        - instructions
        - type
      type: object
    ClassifyQuestionType:
      description: noul is yes or no, answered as the probability of yes. choice picks one of named options. score places the state along ordered levels.
      enum:
        - noul
        - choice
        - score
      type: string
    ClassifyRequest:
      properties:
        questions:
          additionalProperties:
            $ref: '#/components/schemas/ClassifyQuestion'
          description: Keyed by ids of the caller's own choosing, which is how the answers come back. An id is not part of what is asked, so a question carries its whole meaning in its instructions.
          type: object
        state:
          description: 'What the questions are about: a string for plain text, or a JSON object whose parts a question can name, such as `message`.'
          example: I was charged twice this month and nobody has answered my email.
        tags:
          additionalProperties:
            type: string
          type: object
        target:
          description: A provider/model or a capability shortcut. Empty takes classify-fast.
          example: classify-fast
          type: string
      required:
        - questions
        - state
      type: object
    ClassifyResult:
      properties:
        answers:
          additionalProperties:
            $ref: '#/components/schemas/ClassifyAnswer'
          type: object
        model:
          description: The version that answered, which is worth recording when the target was an alias.
          type: string
        provider:
          type: string
        usage:
          $ref: '#/components/schemas/ClassifyUsage'
      required:
        - answers
        - model
        - provider
        - usage
      type: object
    ClassifyUsage:
      description: What the request read and wrote. The state's tokens are counted once however many questions shared them.
      properties:
        input_tokens:
          format: int64
          type: integer
        output_tokens:
          format: int64
          type: integer
      required:
        - input_tokens
        - output_tokens
      type: object
    CommandReceipt:
      properties:
        assistant_message_id:
          type: string
        command_id:
          type: string
        duplicate:
          description: True when this command already exists and no new inference was started.
          type: boolean
        state:
          description: Latest locally recorded response state; an interrupted command is never automatically rerun.
          type: string
        user_message_id:
          type: string
      required:
        - assistant_message_id
        - command_id
        - duplicate
        - state
        - user_message_id
      type: object
    ConnectChannelRequest:
      description: Credentials for one line, connected once for the app and named by any number of agents under channels in agent.yaml. Sending a line already connected replaces its credentials and keeps its webhook URL.
      properties:
        account_id:
          description: The provider's own id for the line. WhatsApp's phone number id; not needed by the others.
          type: string
        challenge:
          description: The verify token Meta's webhook setup echoes back. WhatsApp only.
          type: string
        kind:
          description: whatsapp, sms or imessage.
          minLength: 1
          type: string
        number:
          description: The number people write to, in E.164. For sms it must be a number this app bought with POST /v1/phone/numbers.
          maxLength: 20
          minLength: 2
          type: string
        signing:
          description: 'What the provider signs deliveries with: Meta''s app secret, Telnyx''s public key, Linq''s whsec_ secret.'
          type: string
        token:
          description: 'What authenticates a send: a Meta access token, a Telnyx API key, a Linq API key.'
          type: string
      required:
        - kind
        - number
      type: object
    Connection:
      description: One account at one connector, owned by the app or by one of its users. Credentials are never shown.
      properties:
        account_id:
          description: The provider account, known once it is connected.
          readOnly: true
          type: string
        auth_scheme:
          description: How the connection authenticates, one of its connector's schemes.
          type: string
        connector_id:
          type: string
        created_at:
          format: date-time
          readOnly: true
          type: string
        definition_revision:
          description: The connector's revision when the connection was made, which it keeps reading until it is reconnected.
          format: int64
          readOnly: true
          type: integer
        expires_at:
          description: When the current credential expires. Absent when there is none or it does not.
          format: date-time
          readOnly: true
          type: string
        granted_scopes:
          items:
            type: string
          nullable: true
          readOnly: true
          type: array
        id:
          readOnly: true
          type: string
        inputs:
          additionalProperties:
            type: string
          description: What the connection was created with, the connector's defaults filled in.
          type: object
        label:
          type: string
        metadata:
          additionalProperties:
            type: string
          description: What the provider said about the account when it was connected, such as a workspace id. Empty until then.
          readOnly: true
          type: object
        owner:
          $ref: '#/components/schemas/ConnectionOwner'
        revision:
          description: Advances with every new credential, starting at 1.
          format: int64
          readOnly: true
          type: integer
        status:
          $ref: '#/components/schemas/ConnectionStatus'
        updated_at:
          format: date-time
          readOnly: true
          type: string
      required:
        - id
        - connector_id
        - definition_revision
        - owner
        - auth_scheme
        - inputs
        - metadata
        - status
        - granted_scopes
        - revision
        - created_at
        - updated_at
      type: object
    ConnectionCredentials:
      additionalProperties: false
      description: Credentials for a connection, under the revision the caller last read. An unknown field is refused rather than ignored.
      properties:
        expected_revision:
          description: The connection's revision as last read. A connection that has moved past it is refused with a 409, so two writers never replace each other's credentials unseen.
          format: int64
          minimum: 1
          type: integer
        values:
          additionalProperties:
            type: string
          description: 'What the connection''s auth_scheme takes, write-only. api_key: api_key and header. bearer: token. none: nothing, which activates the connection. oauth2_client_credentials: client_id and client_secret, which are tried at the token endpoint at once. oauth2_code: a grant the provider already issued, as access_token, refresh_token (optional), expires_at (RFC 3339) and scope (the granted scopes joined as the connector''s scopes are); its endpoints and client are the connector''s, never the caller''s.'
          type: object
      required:
        - expected_revision
      type: object
    ConnectionOwner:
      additionalProperties: false
      description: 'Whose a connection is: the app''s, which any of its agents may be bound to, or one user''s.'
      properties:
        type:
          $ref: '#/components/schemas/ConnectionOwnerType'
        user_id:
          description: The user, for a user-owned connection only. It must be the user the backend acts for, named by X-Stream-User-Id.
          type: string
      required:
        - type
      type: object
    ConnectionOwnerType:
      description: app is the app's own account, user one user's.
      enum:
        - app
        - user
      type: string
      x-enum-varnames:
        - ConnectionOwnerTypeApp
        - ConnectionOwnerTypeUser
    ConnectionPage:
      properties:
        has_more:
          type: boolean
        items:
          items:
            $ref: '#/components/schemas/Connection'
          nullable: true
          type: array
        next_cursor:
          description: Pass as cursor for the next page, with the same owner_type and connector_id. Absent on the last one.
          type: string
      required:
        - items
        - has_more
      type: object
    ConnectionRequest:
      additionalProperties: false
      description: A connection to create, pending until an account is connected. An unknown field is refused rather than ignored.
      properties:
        auth_scheme:
          description: One of the connector's schemes. Omitted is its only one; a connector with several needs it named.
          type: string
        connector_id:
          description: A built-in, such as slack, or one of the app's own.
          minLength: 1
          type: string
        inputs:
          additionalProperties:
            type: string
          description: Values for the connector's inputs, such as a region. One without a default is required, and each must match the connector's enum or pattern.
          type: object
        label:
          description: A name to tell connections apart by.
          maxLength: 120
          type: string
        owner:
          $ref: '#/components/schemas/ConnectionOwner'
      required:
        - connector_id
        - owner
      type: object
    ConnectionStatus:
      description: pending until an account is connected, then connected, needs_reauthorization once the provider stops accepting its credential, and disconnected when it is deleted.
      enum:
        - pending
        - connected
        - needs_reauthorization
        - disconnected
      type: string
    ConnectionTool:
      properties:
        description:
          type: string
        input_schema:
          additionalProperties: {}
          description: The JSON Schema of its arguments.
          type: object
        name:
          description: The tool's name at the provider. An agent config grants it by this name.
          type: string
        schema_digest:
          description: The SHA-256 of its name, description and input schema. A grant pins it, so a tool whose schema changes is not offered until it is granted again.
          type: string
      required:
        - name
        - description
        - input_schema
        - schema_digest
      type: object
    ConnectionTools:
      description: 'The tools a connection offered when it was last validated, in one piece: the provider''s own list, not a page of one.'
      properties:
        checked_at:
          description: When the list was read. Absent until a validate listed it.
          format: date-time
          type: string
        connection_id:
          type: string
        digest:
          description: The digest of the whole list. Absent until a validate listed it.
          type: string
        tools:
          items:
            $ref: '#/components/schemas/ConnectionTool'
          nullable: true
          type: array
      required:
        - connection_id
        - tools
      type: object
    ConnectionValidation:
      description: Whether a connection's credential works, found by asking the provider for its tools.
      properties:
        checked_at:
          description: When the tools were listed. Absent until a validate listed them.
          format: date-time
          type: string
        connection_id:
          type: string
        error:
          description: Why the status is not connected, for a person to read.
          type: string
        status:
          $ref: '#/components/schemas/ConnectionValidationStatus'
        tools_digest:
          description: The digest of the tools the connection offers, as GET .../tools shows them. Absent until a validate listed them.
          type: string
      required:
        - connection_id
        - status
      type: object
    ConnectionValidationStatus:
      description: 'connected: the credential works and the tools were listed. pending: no credentials yet. needs_reauthorization: the provider no longer takes the credential, so only a reconnect helps. failed: the provider could not be reached or listed nothing usable; error says why.'
      enum:
        - connected
        - pending
        - needs_reauthorization
        - failed
      type: string
    Connector:
      description: 'A connector: an account elsewhere an agent may reach, built in or the app''s own. Only what a caller chooses between is shown. Endpoints, how an account is recognised, refresh and rate limits stay with the router.'
      properties:
        category:
          type: string
        client:
          $ref: '#/components/schemas/ConnectorClient'
        created_at:
          description: When this revision was stored.
          format: date-time
          readOnly: true
          type: string
        custom:
          description: The app's own definition rather than a built-in.
          readOnly: true
          type: boolean
        description:
          type: string
        id:
          description: Unique among the built-ins and the app's own. A custom definition's starts with custom_, and a built-in's never does.
          type: string
        inputs:
          description: What a connection is created with, such as a region or a shop.
          items:
            $ref: '#/components/schemas/ConnectorInput'
          nullable: true
          type: array
        name:
          type: string
        revision:
          description: The manifest's revision. A connection is created from the newest one and keeps reading it until it is reconnected.
          format: int64
          readOnly: true
          type: integer
        schemes:
          description: How a connection may authenticate, such as oauth2_code.
          items:
            type: string
          nullable: true
          type: array
        scopes:
          description: The scopes a consent asks for.
          items:
            type: string
          nullable: true
          type: array
      required:
        - id
        - revision
        - name
        - custom
        - schemes
        - inputs
        - scopes
        - client
        - created_at
      type: object
    ConnectorClient:
      additionalProperties: false
      description: How the OAuth client a connection uses is registered, and how the client authenticates at the token endpoint.
      properties:
        alg:
          description: How a private_key_jwt assertion is signed, and set only for it.
          enum:
            - RS256
            - PS256
          type: string
        auth_method:
          $ref: '#/components/schemas/ConnectorClientAuthMethod'
        registration:
          description: The client registration mechanisms the connector allows, tried as the scheme orders them. Empty when the connector needs no OAuth client.
          items:
            $ref: '#/components/schemas/ConnectorClientRegistrationMethod'
          nullable: true
          type: array
          uniqueItems: true
      type: object
    ConnectorClientAuthMethod:
      description: How the OAuth client authenticates at the token endpoint, as the IANA OAuth token endpoint authentication methods registry spells it.
      enum:
        - none
        - client_secret_post
        - client_secret_basic
        - private_key_jwt
        - tls_client_auth
      type: string
    ConnectorClientRegistrationMethod:
      description: operator is this deployment's own client, customer one the app registered, dcr one registered on the fly (RFC 7591) and cimd one named by a metadata document.
      enum:
        - operator
        - customer
        - dcr
        - cimd
      type: string
    ConnectorInput:
      properties:
        default:
          description: Used when the connection gives no value. An input without one is required.
          type: string
        enum:
          description: The values it may take. Absent when a pattern decides.
          items:
            type: string
          nullable: true
          type: array
        name:
          type: string
        pattern:
          description: A regular expression the whole value must match.
          type: string
      required:
        - name
      type: object
    ConnectorOAuthClient:
      description: 'The OAuth client the app registered with a connector''s provider itself. The secret is write-only: no response carries it.'
      properties:
        auth_method:
          $ref: '#/components/schemas/ConnectorOAuthClientAuthMethod'
        client_id:
          type: string
        connector_id:
          readOnly: true
          type: string
        created_at:
          format: date-time
          readOnly: true
          type: string
        registration:
          $ref: '#/components/schemas/ConnectorClientRegistrationMethod'
          description: 'customer: the app''s own client, which every consent and refresh of the connector''s connections then uses.'
          readOnly: true
        updated_at:
          description: When the client, its secret or its method last changed.
          format: date-time
          readOnly: true
          type: string
      required:
        - connector_id
        - registration
        - client_id
        - created_at
        - updated_at
      type: object
    ConnectorOAuthClientAuthMethod:
      description: 'How the app''s own OAuth client authenticates at the token endpoint (RFC 7591 section 2): none for a public client, which has no secret, client_secret_basic or client_secret_post.'
      enum:
        - none
        - client_secret_basic
        - client_secret_post
      type: string
    ConnectorOAuthClientRequest:
      additionalProperties: false
      description: The OAuth client the app registered with the connector's provider. An unknown field is refused rather than ignored.
      properties:
        auth_method:
          $ref: '#/components/schemas/ConnectorOAuthClientAuthMethod'
          description: 'Overrides the connector''s own client.auth_method. Left out, the connector''s applies, and failing that the consent picks: none without a secret, else client_secret_basic where the provider accepts it.'
        client_id:
          maxLength: 2048
          minLength: 1
          pattern: ^[ -~]+$
          patternDescription: printable ASCII, RFC 6749 Appendix A.1
          type: string
        client_secret:
          description: Sealed at rest and never returned. Left out for a public client (auth_method none).
          maxLength: 2048
          pattern: ^[ -~]+$
          patternDescription: printable ASCII, RFC 6749 Appendix A.2
          type: string
          writeOnly: true
      required:
        - client_id
      type: object
    ConnectorPage:
      properties:
        has_more:
          type: boolean
        items:
          items:
            $ref: '#/components/schemas/Connector'
          nullable: true
          type: array
        next_cursor:
          description: Pass as cursor for the next page, with the same q. Absent on the last one.
          type: string
      required:
        - items
        - has_more
      type: object
    ConnectorToolGrant:
      description: One tool a binding allows.
      properties:
        name:
          description: The tool as the connector names it.
          minLength: 1
          type: string
        schema_digest:
          description: The SHA-256 of the tool's name, description and input schema, as 64 lowercase hex characters. A tool whose schema has changed since no longer matches and is not offered.
          pattern: ^[a-f0-9]{64}$
          type: string
      required:
        - name
        - schema_digest
      type: object
    Contact:
      properties:
        attempts:
          type: integer
        call_id:
          description: The call this contact became, which is what the call paths take.
          type: string
        error:
          description: Why they could not be rung, when they could not be.
          type: string
        id:
          type: string
        instructions:
          type: string
        state:
          enum:
            - pending
            - calling
            - done
            - failed
          type: string
        to_number:
          type: string
        vendor_call_id:
          type: string
      required:
        - attempts
        - id
        - state
        - to_number
      type: object
    ContactsRequest:
      properties:
        contacts:
          items:
            properties:
              instructions:
                description: What to say to this person, added to whatever the config already says.
                type: string
              to_number:
                type: string
            required:
              - to_number
            type: object
          type: array
      required:
        - contacts
      type: object
    ContentPart:
      oneOf:
        - $ref: '#/components/schemas/TextContentPart'
        - $ref: '#/components/schemas/ImageContentPart'
    CreateOptOutRequest:
      properties:
        channel:
          $ref: '#/components/schemas/OptOutChannel'
        recipient:
          description: The number, in E.164.
          maxLength: 20
          minLength: 2
          type: string
        source:
          description: Omitted is api.
          enum:
            - api
            - dashboard
          type: string
      required:
        - recipient
        - channel
      type: object
    CreateResponseRequest:
      properties:
        command_id:
          description: Required for personal persistent text conversations, and text only. Reuse this ID and identical text for retries; a retry starts no second turn and returns no id.
          pattern: ^[A-Za-z0-9_-]{1,128}$
          type: string
        images:
          items:
            $ref: '#/components/schemas/ImageSource'
          type: array
        text:
          description: What to answer, as though it had been said.
          type: string
        videos:
          description: Recorded clips to show the agent. The router samples evenly spaced frames from each and hands them to the vision skill with their timestamps, which is how every vision model is shown a video, since none of the ones routed here take one whole.
          items:
            $ref: '#/components/schemas/VideoSource'
          maxItems: 2
          type: array
      required:
        - text
      type: object
    CreateSessionRequest:
      properties:
        agent:
          description: 'The name of an agent config to start from, as an alternative to config_id. It is what a caller actually knows the agent as: "docs" rather than an id they never chose. A name matching nothing is refused rather than silently starting an unconfigured agent, and naming both this and config_id is refused too, since there is no sensible answer when they disagree.'
          type: string
        agent_id:
          description: Keys transcripts and statistics. Empty means the call id.
          type: string
        backchannel:
          default: false
          description: Murmur while a participant is still talking, the way a person does.
          type: boolean
        call_id:
          description: The call to join. Required unless the session is text.
          type: string
        call_type:
          default: default
          type: string
        config_id:
          description: An agent config to start from. Everything else in this request overrides what the config says, so a caller can reuse a configuration and still change one thing about this call.
          type: string
        context_truncated:
          description: Older history was omitted from the model context.
          type: boolean
        conversation_id:
          description: Stream Chat CID to resume; returned for persistent text sessions.
          type: string
        custom:
          additionalProperties: {}
          description: Anything the caller wants to remember about the session, handed back untouched and never read by the router. Sessions can be queried by these, which is what makes them worth writing.
          type: object
        description:
          description: A longer note about the conversation, searched alongside the title.
          type: string
        greeting:
          description: Said on joining without going through the model. Empty means the agent waits to be spoken to.
          type: string
        id:
          description: The id to hold the session by, so a caller can know it before the session exists. It must be a UUID nobody has used for a session before. Omitted, the router generates a UUIDv7.
          type: string
        incognito:
          default: false
          description: 'Hold the conversation and record nothing about it: no session row, no turns, no transcript, and no Stream Chat channel. The session still works exactly as any other while it is running; it simply cannot be found afterwards, which is the point. Forking one is refused, because there is nothing to fork from.'
          type: boolean
        instructions:
          type: string
        keyterms:
          description: Business-specific words the transcriber would otherwise get wrong. Up to 100 terms, and providers that cannot be told about vocabulary ignore them.
          items:
            type: string
          type: array
        languages:
          description: Language hints, which narrow the candidates in every modality.
          items:
            type: string
          type: array
        llm:
          description: 'A provider/model or a capability shortcut. Omit it and the config decides, or llm-fast when there is no config. These carry no schema default on purpose: a generated client that filled one in would send it, and a caller naming a config would silently lose the model it configured.'
          type: string
        max_tokens:
          type: integer
        memory:
          $ref: '#/components/schemas/SessionMemory'
        min_confidence:
          description: How sure the transcriber must be before the agent answers rather than checks what was meant.
          format: double
          type: number
        model_overwrites:
          $ref: '#/components/schemas/ModelOverwrites'
        navigating:
          default: false
          description: The agent placed this call, so let recordings finish and answer their menus.
          type: boolean
        phone:
          $ref: '#/components/schemas/SessionPhone'
        project_id:
          description: What the conversation belongs to. Also recorded as the "project" cost tag, so spend breaks down by project without the caller labelling it twice. A tag spelled out in tags wins.
          type: string
        search:
          description: Omit it and the config decides, or search-fast when there is no config.
          type: string
        sts:
          description: 'A speech-to-speech target. Naming one makes this a native session: the model hears and speaks for itself, so no transcriber, conversation model or voice is opened. Omit it and the config decides.'
          type: string
        stt:
          description: Omit it and the config decides, or en-low-latency when there is no config.
          type: string
        tags:
          additionalProperties:
            type: string
          description: Cost labels, carried onto every request the session makes.
          type: object
        text:
          default: false
          description: 'Hold the conversation in writing rather than on a call. Nothing is transcribed and nothing is spoken, so no call is joined and neither speech target is used. Everything between hearing and answering is unchanged: a text session has the same skills, knowledge and tools a call would have had, and its replies arrive as response_delta and responded events on the session''s socket.'
          type: boolean
        title:
          description: 'What to call the conversation, for a list a person reads. Never shown to the model: what a conversation is called is a label on it rather than part of it.'
          type: string
        tool_timeout_ms:
          description: How long the model waits for a tool result. Zero is the default.
          type: integer
        tools:
          items:
            $ref: '#/components/schemas/SessionTool'
          type: array
        tts:
          description: Omit it and the config decides, or en-low-latency when there is no config.
          type: string
        user_id:
          default: vision-agent
          description: Who the agent joins the call as.
          type: string
        user_name:
          default: Vision Agent
          type: string
        video:
          $ref: '#/components/schemas/SessionVideo'
        voice:
          description: Provider-specific voice id.
          type: string
      type: object
    CustomConnectorRequest:
      additionalProperties: false
      description: A custom MCP server for the app's agents to connect to. An unknown field is refused rather than ignored.
      properties:
        category:
          maxLength: 80
          type: string
        client:
          $ref: '#/components/schemas/ConnectorClient'
        description:
          maxLength: 1000
          type: string
        endpoint:
          description: 'The MCP server, over Streamable HTTP: a public https URL without userinfo, query or fragment. An address on a private network, loopback or link-local is refused.'
          maxLength: 2048
          type: string
        id:
          description: Starts with custom_, which no built-in does, so a custom definition never stands in for one. Creating an id that exists stores the next revision, unless the newest already says the same.
          pattern: ^custom_[a-z][a-z0-9_]{0,56}$
          patternDescription: custom_ then a lowercase letter, then up to 56 lowercase letters, digits or underscores
          type: string
        name:
          maxLength: 120
          minLength: 1
          type: string
        schemes:
          description: How a connection may authenticate. Each must be a scheme this deployment has.
          items:
            type: string
          minItems: 1
          nullable: true
          type: array
        scopes:
          description: The scopes a consent asks for, each an RFC 6749 scope token.
          items:
            pattern: ^[!#-\[\]-~]+$
            patternDescription: an RFC 6749 scope token
            type: string
          maxItems: 100
          nullable: true
          type: array
          uniqueItems: true
      required:
        - id
        - name
        - endpoint
        - schemes
      type: object
    DataChange:
      description: One thing that happened to one row of the calling app's data.
      properties:
        at:
          format: date-time
          type: string
        key:
          additionalProperties: {}
          description: What identifies the row, which is all a delete has.
          type: object
        op:
          enum:
            - insert
            - update
            - delete
          type: string
        row:
          additionalProperties: {}
          description: The row as it now reads, absent for a delete and never carrying a credential.
          type: object
        seq:
          description: Where this sits in the order changes happened, and the cursor to resume from.
          format: int64
          type: integer
        table:
          description: Which table the row is in.
          example: agent_configs
          type: string
      required:
        - at
        - key
        - op
        - seq
        - table
      type: object
    DataChangePage:
      properties:
        caught_up:
          description: 'Nothing else has happened yet, which is when a switchover is safe: point your SDKs at the new deployment, wait for this to be true once more, and stop.'
          type: boolean
        changes:
          items:
            $ref: '#/components/schemas/DataChange'
          type: array
        cursor:
          description: What to pass as `after` next time.
          format: int64
          type: integer
      required:
        - changes
        - cursor
      type: object
    DataImport:
      properties:
        cursor:
          description: The cursor the export named, to ask the other deployment for changes from.
          format: int64
          type: integer
        rows:
          description: How many rows were written.
          format: int64
          type: integer
        tables:
          additionalProperties:
            format: int64
            type: integer
          description: How many of them went into each table.
          type: object
      required:
        - rows
      type: object
    DataPolicy:
      description: 'What a caller requires of what happens to what they send: the audio they had transcribed, or the text they had spoken and the voice speaking it. This is a requirement rather than a description: a request naming one is only routed to a model whose declared handling meets it, and if none does the request is refused rather than sent somewhere that does not.'
      properties:
        allow_training:
          description: False requires a provider that has said it does not train on what it is sent. Omitting this asks nothing. A provider that has published nothing either way counts as not having said no.
          type: boolean
        retention:
          description: The longest a provider may keep this audio - none, or a duration such as 30d or 24h. Omitting it asks nothing.
          example: none
          type: string
      type: object
    DecisionKind:
      description: What a conversation decided. Asking puts a settled turn to the flow controller; waiting leaves it because the caller has not finished; ignoring drops speech meant for somebody else; answering replies to it; queueing holds it until the agent has stopped talking; interrupting abandons the reply being spoken and shortening ends it early; a backchannel is a listening noise that never reaches the model; superseding drops a ruling about words that have since changed; compacting replaces old history with a summary; delegating hands work to the subagent and settling is that work coming back, answered or not.
      enum:
        - ask
        - wait
        - ignore
        - answer
        - queue
        - interrupt
        - shorten
        - backchannel
        - supersede
        - compact
        - delegate
        - settle
        - fail
      type: string
    DispatchSetting:
      description: Whether this kind of work is left to the customer's own dispatch worker.
      enum:
        - enabled
        - disabled
      type: string
    Endpointing:
      description: 'What decides a turn is over: a long enough pause, or a model reading the words and judging the sentence finished.'
      enum:
        - silence
        - semantic
      type: string
    Equals:
      description: 'Matches one value exactly: "value" is short for {"$eq": "value"}.'
      oneOf:
        - type: string
        - additionalProperties: false
          properties:
            $eq:
              type: string
          required:
            - $eq
          type: object
    ErrorDetail:
      properties:
        code:
          description: What went wrong, for a program to branch on. Every type has a code of its own name (invalid_request, unauthenticated, forbidden, not_found, method_not_allowed, not_acceptable, conflict, gone, payload_too_large, unsupported_media_type, rate_limited, internal_error, unavailable) that a failure has when nothing names it better. The others are validation_failed, missing_customer, missing_organization, server_side_only, not_configured (this deployment does not offer the feature), modality_not_routed, and <resource>_not_found for agent_config, call, campaign, channel_account, command, connection, knowledge_document, knowledge_url, plugin, router_config, session, simulation, simulation_run, skill and voice. More may be added, so a client should expect one it does not know.
          type: string
        doc_url:
          description: Where the code is explained.
          format: uri
          type: string
        message:
          description: What went wrong, for a person to read. Its wording may change; branch on code.
          type: string
        type:
          $ref: '#/components/schemas/ErrorType'
      required:
        - message
        - type
        - code
        - doc_url
      type: object
    ErrorResponse:
      description: 'The body of every failure. A failure that is not the caller''s own is a 500 of type internal saying only "something went wrong": quote the response''s X-Request-Id to find out more.'
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      required:
        - error
      type: object
    ErrorType:
      description: 'The kind of failure, which decides the status it is answered with: invalid_request 400, authentication 401, permission 403, not_found 404, method_not_allowed 405, not_acceptable 406, conflict 409, gone 410, payload_too_large 413, unsupported_media_type 415, rate_limited 429, internal 500, unavailable 503.'
      enum:
        - invalid_request
        - authentication
        - permission
        - not_found
        - method_not_allowed
        - not_acceptable
        - conflict
        - gone
        - payload_too_large
        - unsupported_media_type
        - rate_limited
        - internal
        - unavailable
      type: string
    ForkSessionRequest:
      description: Continue a conversation as a new one. Everything the parent was opened with is inherited; anything named here is written over it, which is what makes a fork useful rather than a copy -- the usual reason to fork is to ask the same question of a different model.
      properties:
        agent:
          type: string
        call_id:
          description: The call the fork joins. A voice session cannot be forked into a text one or the other way about, so this is required when the parent held a call and refused when it did not.
          type: string
        config_id:
          type: string
        custom:
          additionalProperties: {}
          type: object
        description:
          type: string
        incognito:
          description: Hold the fork off the record. The parent still exists; this conversation onwards is simply not kept.
          type: boolean
        instructions:
          type: string
        messages:
          default: true
          description: Carry the parent's history into the fork, so the new conversation continues from what was already said. False starts the same configuration over from nothing, which is what comparing two answers to the same opening question wants.
          type: boolean
        model_overwrites:
          $ref: '#/components/schemas/ModelOverwrites'
        project_id:
          type: string
        response_id:
          description: Carry the parent's history only up to the end of this response, so the fork continues from that point rather than from where the parent is now. The history is read from what the parent recorded, which also lets a parent that kept no Chat transcript be forked with its history. Cannot be combined with messages false.
          type: string
        title:
          type: string
      type: object
    GeneratedImage:
      properties:
        data:
          description: The picture, base64. Decoded and checked before it was returned, and never more than 10 MiB.
          format: byte
          type: string
        height:
          type: integer
        media_type:
          description: What the picture is, read off the picture itself rather than the provider's label.
          enum:
            - image/png
            - image/jpeg
          type: string
        seed:
          description: The seed the provider reports, which draws the same picture again. Absent when it reports none.
          format: int64
          type: integer
        width:
          type: integer
      required:
        - data
        - height
        - media_type
        - width
      type: object
    Granularity:
      default: hourly
      enum:
        - hourly
        - daily
      type: string
    GuestUser:
      properties:
        custom:
          additionalProperties: {}
          type: object
        expires_at:
          description: When the token stops working. A guest coming back after it asks for another.
          format: date-time
          type: string
        id:
          type: string
        name:
          type: string
        token:
          description: A Stream user token for this guest, which is what the chat and video SDKs connect with. It carries role guest, so an app that has turned guests off refuses it.
          type: string
      required:
        - id
        - token
      type: object
    GuestUserRequest:
      properties:
        custom:
          additionalProperties: {}
          type: object
        id:
          description: A guest id to reuse, for somebody coming back. Omitted mints a new one. Asking for an id that is already a guest of this customer returns that guest with a fresh token rather than failing, because coming back is the same person.
          type: string
        name:
          description: What to call them, for a transcript a person reads later.
          type: string
      type: object
    Harness:
      description: 'Which harness the agent''s sessions run: what hands work to the subagent, loads skills, compacts the conversation and starts the sandbox. Set on the agent, never on a session. Omit it for the default, the only one there is.'
      enum:
        - default
      type: string
    HealthStatus:
      properties:
        dependencies:
          additionalProperties:
            type: string
          description: Dependency name to "ok" or a failure description.
          example:
            postgres: ok
            redis: ok
          type: object
        status:
          enum:
            - ok
            - degraded
          type: string
      required:
        - status
        - dependencies
      type: object
    IMessageProfile:
      properties:
        consent_method:
          type: string
        contact_card_image_url:
          description: Square, at least 200 by 200.
          type: string
        contact_card_name:
          type: string
        fallback_channels:
          description: imessage, rcs or sms, in the order to try them.
          items:
            type: string
          nullable: true
          type: array
      type: object
    ImageContentPart:
      properties:
        image_url:
          $ref: '#/components/schemas/ImageSource'
        type:
          enum:
            - image_url
          type: string
      required:
        - image_url
        - type
      type: object
    ImageErrorCode:
      description: Why a generation drew nothing, absent when it completed. content_filtered is a safety filter refusing the prompt or the picture; unsupported_option a size, shape or setting no candidate could honour; provider_failed anything else a provider did wrong; timeout the 240 seconds running out; cancelled the caller hanging up.
      enum:
        - content_filtered
        - unsupported_option
        - provider_failed
        - timeout
        - cancelled
      type: string
    ImageGeneration:
      properties:
        cost_micros:
          description: Millionths of a dollar, priced per picture or per megapixel from what came back. Zero when it failed.
          format: int64
          type: integer
        error:
          description: What went wrong, in words. Absent when the generation completed.
          type: string
        error_code:
          $ref: '#/components/schemas/ImageErrorCode'
        id:
          description: This response's own id, for logs. Nothing is stored under it.
          example: img_1b9d6bcd-bbfd-4b2d-9b5d-ab8dfbbd4bed
          type: string
        images:
          description: The pictures, as many as were asked for. Empty when the generation failed.
          items:
            $ref: '#/components/schemas/GeneratedImage'
          type: array
        model:
          example: alibaba/qwen-image-3/text-to-image
          type: string
        provider:
          description: Who drew it, or who refused to. Absent when nothing got as far as a provider.
          example: fal
          type: string
        status:
          $ref: '#/components/schemas/ImageGenerationStatus'
      required:
        - cost_micros
        - id
        - images
        - status
      type: object
    ImageGenerationRequest:
      properties:
        options:
          $ref: '#/components/schemas/ImageOptions'
        prompt:
          description: What to draw, in the caller's own words.
          example: A yellow watering can beside a seedling, flat illustration, no text
          type: string
        tags:
          additionalProperties:
            type: string
          type: object
      required:
        - prompt
      type: object
    ImageGenerationStatus:
      description: Whether the pictures were drawn. A failed generation says why in error_code and error.
      enum:
        - completed
        - failed
      type: string
    ImageOptions:
      description: Where to draw and what the picture should be. A size, shape, seed, negative prompt or format narrows the candidates to the models that declared it, so it is either honoured or the request is refused.
      properties:
        aspect_ratio:
          description: The shape, for the models that are asked for one rather than a size.
          example: "1:1"
          pattern: ^[0-9]+:[0-9]+$
          type: string
        "n":
          default: 1
          description: How many pictures to draw.
          maximum: 4
          minimum: 1
          type: integer
        negative_prompt:
          description: What to keep out of the picture.
          type: string
        output_format:
          description: The encoding, on a model that can be asked for one.
          enum:
            - png
            - jpeg
          type: string
        providers:
          description: A priority list of where to try, in the order given, which wins over target when it holds anything. Each entry is a provider name, a provider/model or a capability shortcut, expanded where it stands.
          items:
            type: string
          type: array
        seed:
          description: Draws the same picture again from the same prompt, on a model that reads one.
          format: int64
          minimum: 0
          type: integer
        size:
          description: Width by height in pixels, for the models that take a size.
          example: 1024x1024
          pattern: ^[0-9]+x[0-9]+$
          type: string
        target:
          description: A provider/model or a capability shortcut. Defaults to image-fast.
          example: image-fast
          type: string
      type: object
    ImageSource:
      properties:
        detail:
          enum:
            - auto
            - low
            - high
          type: string
        url:
          description: Absolute HTTP(S) URL or base64 image data URI.
          type: string
      required:
        - url
      type: object
    IndexedKnowledgeDocument:
      properties:
        created_at:
          format: date-time
          type: string
        id:
          type: string
        namespace:
          type: string
        passages:
          description: How many passages it was last cut into.
          type: integer
        source:
          description: What the document was posted as, and what its passages are keyed by.
          example: pricing.md
          type: string
        text:
          description: The document as it was last posted. Only reading one document fills it in, and one written before its text was kept has none.
          type: string
        updated_at:
          description: When it was last written.
          format: date-time
          type: string
      required:
        - created_at
        - id
        - namespace
        - passages
        - source
        - updated_at
      type: object
    IngestKnowledgeRequest:
      properties:
        chunk_size:
          description: Characters per passage. Zero is the default, which is small enough that several passages fit in front of a model and large enough that one still answers the question on its own.
          type: integer
        documents:
          items:
            $ref: '#/components/schemas/KnowledgeDocument'
          minItems: 1
          type: array
        namespace:
          description: The knowledge base to write into, which is what a config's knowledge_namespace names. Knowledge is never shared, so there is no default.
          example: docs
          type: string
      required:
        - documents
        - namespace
      type: object
    IngestedKnowledge:
      properties:
        documents:
          description: How many documents were read.
          type: integer
        namespace:
          type: string
        passages:
          description: How many passages they were cut into and written as.
          type: integer
      required:
        - documents
        - namespace
        - passages
      type: object
    InstructionsRequest:
      properties:
        instructions:
          type: string
      required:
        - instructions
      type: object
    KnowledgeDocument:
      properties:
        source:
          description: Where the document came from, as a reader would recognise it. Passage ids are keyed by it, so posting the same source again replaces what it wrote before.
          example: pricing.md
          type: string
        text:
          description: The document, whole. It is cut into passages here.
          type: string
      required:
        - source
        - text
      type: object
    KnowledgePassage:
      properties:
        id:
          type: string
        source:
          description: The heading or file the passage sits under.
          type: string
        text:
          type: string
      required:
        - id
        - source
        - text
      type: object
    KnowledgeUrl:
      properties:
        created_at:
          format: date-time
          type: string
        description:
          description: What the page was subscribed as being. Empty unless it was given one.
          type: string
        error:
          description: Why the last read failed. Empty otherwise.
          type: string
        id:
          type: string
        last_indexed_at:
          description: When it was last read successfully. Absent means never, which is what separates a page that has never worked from one that worked and has since broken.
          format: date-time
          nullable: true
          type: string
        namespace:
          type: string
        passages:
          description: How many passages the page was last cut into.
          type: integer
        refresh_hours:
          description: How often the page is read again on its own, in hours. Absent means never.
          type: integer
        state:
          $ref: '#/components/schemas/KnowledgeUrlState'
        title:
          description: 'What the page is called: the title it was subscribed with, or what it called itself when it was last read.'
          type: string
        updated_at:
          format: date-time
          type: string
        url:
          type: string
      required:
        - created_at
        - id
        - namespace
        - passages
        - state
        - updated_at
        - url
      type: object
    KnowledgeUrlDeclaration:
      description: A page an agent directory declares, in the knowledge base named after it.
      properties:
        description:
          type: string
        refresh_hours:
          description: How often the page is read again on its own, in hours. Omit it and the page is read on every sync that changes the directory, never on a schedule.
          example: 24
          format: int64
          minimum: 1
          type: integer
        title:
          example: Pricing
          type: string
        url:
          example: https://example.com/pricing
          type: string
      required:
        - url
      type: object
    KnowledgeUrlRequest:
      properties:
        description:
          description: 'What the page is, for a reader of the subscription. Optional, and kept as written: it says why this page is subscribed to, which a crawler cannot know.'
          example: What each plan includes and where the limits are.
          type: string
        namespace:
          description: The knowledge base to fill, which is what a config's knowledge_namespace names.
          example: docs
          type: string
        refresh_hours:
          description: How often the page is read again on its own, in hours. Omit it, or send zero, and the page is read when it is added and when it is re-indexed, never on a schedule. Adding the page again replaces it.
          example: 24
          minimum: 0
          type: integer
        title:
          description: 'What to call the page, for a reader of the subscription. Optional: a page that is not named here is named by what it called itself when it was last read.'
          example: Pricing
          type: string
        url:
          description: 'The page to read. It must be http or https: this is handed to a crawler and then used to key the passages it becomes.'
          example: https://example.com/pricing
          type: string
      required:
        - namespace
        - url
      type: object
    KnowledgeUrlState:
      description: Where the page has got to. Pending means it has been added and its first read is queued or being retried; failed means every attempt failed.
      enum:
        - pending
        - indexed
        - failed
      type: string
    LibraryVoice:
      description: One voice a provider offers. Everything past the name is what that vendor chose to say about it, in its own words, so a field being absent means the vendor did not label it rather than that the voice lacks it.
      properties:
        accent:
          type: string
        description:
          type: string
        gender:
          type: string
        id:
          description: What to put in the voice field, in the provider's own terms.
          type: string
        language:
          type: string
        name:
          type: string
        own:
          description: A voice this account made, rather than one from the public library.
          type: boolean
        preview:
          description: Whether the voice can be heard.
          type: boolean
        provider:
          type: string
        tags:
          items:
            type: string
          type: array
      required:
        - id
        - name
        - provider
      type: object
    LibraryVoices:
      properties:
        providers:
          description: The providers that publish a library, sorted by name.
          items:
            type: string
          type: array
        unavailable:
          description: Providers whose library could not be read just now.
          items:
            type: string
          type: array
        voices:
          items:
            $ref: '#/components/schemas/LibraryVoice'
          type: array
      required:
        - providers
        - voices
      type: object
    LinkChannelRequest:
      properties:
        config_id:
          description: The agent whose channels the number is being claimed on.
          minLength: 1
          type: string
        user_id:
          description: The end user the number will belong to.
          minLength: 1
          type: string
      required:
        - config_id
        - user_id
      type: object
    LlmOptions:
      description: 'How this config answers. The names are the response parameters the router already speaks rather than a second vocabulary for the same things. The system prompt is not among them: what the model answers under belongs to the agent asking, not to the config that decides where the asking goes.'
      properties:
        format:
          description: Whether the answer is prose or a JSON object.
          enum:
            - text
            - json_object
          type: string
        max_output_tokens:
          type: integer
        metadata:
          additionalProperties:
            type: string
          description: Passed to the provider untouched, for the providers that store it.
          type: object
        prompt_cache_key:
          description: What a cached prompt prefix is keyed by. Requests sharing a key and a prefix are read from the cache rather than charged in full.
          type: string
        providers:
          description: A priority list of where to try, in the order given, which wins over target when it holds anything. Each entry is a provider name, a provider/model or a capability shortcut, expanded where it stands. A response that fails is answered by the next entry that will have it.
          items:
            type: string
          type: array
        reasoning_effort:
          description: How long the model may think before answering, on the models that think.
          enum:
            - minimal
            - low
            - medium
            - high
          type: string
        store:
          description: Keep the response on the provider so a later one can continue from it.
          type: boolean
        target:
          description: A provider/model or a capability shortcut.
          example: llm-fast
          type: string
        temperature:
          format: float
          type: number
        tool_choice:
          description: auto, none, required, or the name of a tool the model must call. Which tools exist is per-request, since they change with the turn.
          type: string
        verbosity:
          enum:
            - low
            - medium
            - high
          type: string
      type: object
    McpServer:
      description: An MCP server the plugin catalog does not have. Every session opens it at the start and offers its tools to the model; the instructions the server gives are added to the agent's own. It is opened with no login unless it sets scopes or user, when it logs in with OAuth as its protected-resource metadata says, registering a client of its own, and saving it is refused when the server advertises no such login.
      properties:
        branding:
          $ref: '#/components/schemas/McpServerBranding'
          description: How the server described itself when the config was saved. Absent when it did not answer.
          readOnly: true
        name:
          description: What its tools are prefixed with, as <name>__<tool>. Lowercase, without __, and not a catalog plugin's id.
          maxLength: 32
          minLength: 1
          pattern: ^[a-z][a-z0-9_-]*$
          type: string
        needs_login:
          description: 'Whether the server requires an OAuth login, as it said when the config was saved: protected-resource metadata, or a 401 to a request without a token. Without user, the app logs in once, from the dashboard. Absent when it could not be asked, which a session starting asks again.'
          readOnly: true
          type: boolean
        scopes:
          description: The OAuth scopes its login asks for at consent. Left out, the login asks for the scopes_supported the server advertises. Only a server that needs a login may set it. A login made before a change keeps what it was granted.
          items:
            type: string
          maxItems: 32
          type: array
        tools:
          description: Offer the model only the server's tools matching these names or path.Match patterns. A tool left out is neither listed nor callable. Left out offers every tool.
          items:
            type: string
          maxItems: 128
          type: array
        url:
          description: Its Streamable HTTP endpoint, over https.
          maxLength: 2048
          minLength: 1
          type: string
        user:
          description: Each end user logs in with their own account, in the conversation, the first time the agent needs the server, as for user_plugins, rather than the app once, from the dashboard. Only a server that needs a login may set it.
          type: boolean
      required:
        - name
        - url
      type: object
    McpServerBranding:
      description: The serverInfo an MCP server answers initialize with. Every field is optional, and a server that sends only its name and version is titled by its name.
      properties:
        description:
          type: string
        icon_url:
          description: Its first icon served over https, as the server links it.
          type: string
        title:
          description: Its display title, or its name when it gives none.
          type: string
        version:
          type: string
        website_url:
          type: string
      type: object
    MessageContent:
      oneOf:
        - type: string
        - items:
            $ref: '#/components/schemas/ContentPart'
          type: array
    Modality:
      description: 'What kind of work was done. The first seven are routed across providers; sts is speech to speech, one native audio model in place of a transcriber, a text model and a voice. lcm is a large classifier model: it answers a question about a piece of text with a typed value and the probability behind it rather than with prose, which is what a guardrail asks before a reply is spoken. image is pictures drawn from a prompt. Memory, knowledge and phone are recorded but not routed, since there is one memory store, one knowledge base and one vendor per number, so the provider paths do not serve them while the statistics paths do.'
      enum:
        - stt
        - tts
        - llm
        - sts
        - search
        - lcm
        - image
        - memory
        - knowledge
        - phone
      type: string
    ModelCallTiming:
      properties:
        duration_ms:
          description: Request to completed response or failed create.
          format: double
          type: number
        input_tokens:
          format: int64
          type: integer
        model:
          type: string
        operation_id:
          description: Response ID for this operation; retries can share an ID.
          type: string
        output_tokens:
          format: int64
          type: integer
        provider:
          type: string
        purpose:
          description: reply, flow or subagent.
          type: string
        started_at:
          format: date-time
          type: string
        success:
          type: boolean
        ttft_ms:
          description: Request to first token.
          format: double
          type: number
      required:
        - model
        - provider
        - started_at
        - success
      type: object
    ModelOverwrites:
      description: |-
        What to change about the models for one session, over whatever its agent config decided.
        It is one object rather than a dozen fields at the top level because it is one idea: everything here overrides the config, and a caller reading a session back wants to see what they changed in one place rather than diffed against a config they would have to fetch. Only the safe knobs are here. Instructions and tools are not, because a caller able to rewrite those could make a session impersonate a different agent.
      properties:
        llm:
          description: A provider/model or a capability shortcut, in place of the config's.
          type: string
        max_output_tokens:
          description: Caps the reply, reasoning included. Omitted leaves the provider's default.
          type: integer
        search:
          type: string
        sts:
          description: A speech-to-speech target. Naming one here makes the session native even if the config did not, which means no transcriber, model or voice is opened.
          type: string
        stt:
          type: string
        temperature:
          description: 'How random the answer is. Omitted leaves the provider''s own default, which is not the same as zero: zero is a real request for a deterministic model.'
          format: double
          type: number
        thinking:
          description: How hard to reason before answering. It becomes the reasoning effort on the request, which is the vocabulary the providers that support one already speak, and means nothing to a model that does not reason.
          enum:
            - none
            - minimal
            - low
            - medium
            - high
          type: string
        tts:
          type: string
        verbosity:
          description: How much detail to give. Dropped for models that do not take it.
          enum:
            - low
            - medium
            - high
          type: string
      type: object
    NumberSearchResult:
      properties:
        numbers:
          description: What the vendors are offering, cheapest first.
          items:
            $ref: '#/components/schemas/AvailableNumber'
          type: array
        skipped:
          description: Vendors that were not part of the answer. A search that reached two of eight vendors found what two vendors had, and deciding whether to buy needs to know which.
          items:
            $ref: '#/components/schemas/SkippedVendor'
          type: array
      required:
        - numbers
        - skipped
      type: object
    OptOut:
      description: Somebody who asked not to be reached. Nothing is texted or dialled to them on the channel, or on any for all, until the opt-out is revoked or they text START.
      properties:
        channel:
          $ref: '#/components/schemas/OptOutChannel'
        created_at:
          format: date-time
          type: string
        id:
          type: string
        recipient:
          description: The number, in E.164.
          type: string
        source:
          description: keyword when they texted STOP, otherwise api or dashboard.
          type: string
      required:
        - id
        - recipient
        - channel
        - source
        - created_at
      type: object
    OptOutChannel:
      description: The channel a recipient opted out of, or all of them.
      enum:
        - sms
        - voice
        - whatsapp
        - imessage
        - all
      type: string
    OptOutPage:
      properties:
        has_more:
          type: boolean
        items:
          items:
            $ref: '#/components/schemas/OptOut'
          type: array
        next_cursor:
          description: Pass as `cursor` for the next page. Absent on the last one.
          type: string
      required:
        - has_more
        - items
      type: object
    PhoneCapability:
      description: What a number can carry. The names are Telnyx's feature names, because they are the widest vocabulary any of these vendors offers.
      enum:
        - voice
        - sms
        - mms
        - fax
        - emergency
        - hd_voice
        - international_sms
        - local_calling
      type: string
    PhoneNumber:
      properties:
        capabilities:
          items:
            $ref: '#/components/schemas/PhoneCapability'
          type: array
        country:
          type: string
        e164:
          type: string
        monthly_cost_micros:
          format: int64
          type: integer
        purchased_at:
          format: date-time
          type: string
        released_at:
          format: date-time
          nullable: true
          type: string
        stream_trunk_id:
          description: The SIP trunk calls to this number arrive on. Absent until attached.
          type: string
        tags:
          additionalProperties:
            type: string
          description: The customer's own cost labels.
          type: object
        vendor:
          type: string
      required:
        - capabilities
        - country
        - e164
        - monthly_cost_micros
        - purchased_at
        - vendor
      type: object
    PhoneNumberType:
      description: What kind of number it is, which decides who pays for the call.
      enum:
        - local
        - toll_free
        - mobile
      type: string
    PhoneOperation:
      enum:
        - search
        - buy
        - release
        - attach
        - dial
        - send_digits
      type: string
      x-enum-varnames:
        - PhoneOperationSearch
        - PhoneOperationBuy
        - PhoneOperationRelease
        - PhoneOperationAttach
        - PhoneOperationDial
        - PhoneOperationSendDigits
    PhoneSandbox:
      description: What an app may text and call before a 10DLC use case of its is approved.
      properties:
        audio_minutes_per_day:
          format: int64
          type: integer
        audio_seconds_today:
          description: Seconds of outbound calls since midnight UTC.
          format: int64
          type: integer
        enabled:
          description: Whether this deployment sandboxes apps with no approved use case. Off on a self-hosted router.
          type: boolean
        max_recipients:
          format: int64
          type: integer
        messages_per_day:
          format: int64
          type: integer
        messages_today:
          description: Messages sent since midnight UTC.
          format: int64
          type: integer
        recipients:
          description: The only numbers a sandboxed app may text and call.
          items:
            type: string
          type: array
        sandboxed:
          description: 'Whether this app is held to the limits below: true until one of its use cases is approved.'
          type: boolean
      required:
        - enabled
        - sandboxed
        - recipients
        - max_recipients
        - messages_today
        - messages_per_day
        - audio_seconds_today
        - audio_minutes_per_day
      type: object
    PhoneVendor:
      properties:
        capabilities:
          items:
            $ref: '#/components/schemas/PhoneCapability'
          type: array
        implemented:
          description: Whether this service can actually work with the vendor.
          type: boolean
        missing_credentials:
          description: The environment variables the vendor needs and does not have.
          items:
            type: string
          type: array
        operations:
          description: What this service can do at the vendor. Eight vendors buy numbers and two of those also bridge calls, so a number is not bought from a vendor that cannot answer on it by accident.
          items:
            $ref: '#/components/schemas/PhoneOperation'
          type: array
        ready:
          description: Implemented and holding every credential it needs.
          type: boolean
        vendor:
          example: twilio
          type: string
      required:
        - capabilities
        - implemented
        - ready
        - vendor
      type: object
    PlaceCallRequest:
      properties:
        call_id:
          description: The Stream call the answered leg joins, and so the one the agent has to be in. Omit to have one named after this call, since two calls from the same number are two conversations.
          type: string
        call_type:
          description: The Stream call type. Omit for "agent".
          type: string
        custom:
          additionalProperties:
            type: string
          description: Put on the Stream call, where the agent in it can read it. It is set at Stream rather than at the vendor, so every vendor can carry it.
          type: object
        from:
          description: One of the customer's own numbers, which is what the person sees.
          type: string
        headers:
          additionalProperties:
            type: string
          description: Carried to the person's leg as custom SIP headers. Only some vendors can express these, and one that cannot refuses the call.
          type: object
        initial_digits:
          description: Digits pressed once the person answers, for reaching an extension behind a menu, e.g. "ww1234#". w is a short pause and W a long one.
          type: string
        ring_timeout_seconds:
          description: How long to ring before giving up. Omit to leave the vendor's default, which is long enough to reach voicemail. A vendor whose call API cannot express it refuses the call rather than ringing for its own default.
          type: integer
        tags:
          additionalProperties:
            type: string
          type: object
        to:
          type: string
      required:
        - from
        - to
      type: object
    PlacedCall:
      properties:
        call_id:
          description: The Stream call the answered leg is routed into. An agent that is not in it hears nothing when the person picks up.
          type: string
        call_type:
          type: string
        status:
          description: The vendor's own word for where the call is, e.g. "queued".
          type: string
        vendor:
          description: Who is placing the call.
          type: string
        vendor_call_id:
          type: string
      required:
        - status
        - vendor_call_id
      type: object
    Plugin:
      description: One hosted MCP server from the built-in catalog.
      properties:
        category:
          type: string
        client_required:
          description: True when the provider registers no client on the fly, so a config needs one of the app's own, set with setPluginClient, before anybody can connect the plugin.
          type: boolean
        description:
          type: string
        id:
          type: string
        instance_hint:
          type: string
        instance_required:
          type: boolean
        logo_url:
          description: Where this deployment serves the plugin's logo, as an SVG needing no credential.
          readOnly: true
          type: string
        name:
          type: string
        readonly:
          description: True when the plugin has a read-only endpoint an agent may pick on its entry.
          type: boolean
        redirect_uri:
          description: The redirect URI that client has to list, which is this deployment's. Only with client_required.
          readOnly: true
          type: string
        scopes_supported:
          description: The OAuth scopes an agent may ask for on its entry, as the server advertises them. Absent when the server says nothing, and any scope is then passed through.
          items:
            type: string
          type: array
        setup_steps:
          description: What to do there, in order, before pasting the client into setPluginClient. Absent when the catalog has no instructions for the plugin.
          items:
            $ref: '#/components/schemas/PluginSetupStep'
          type: array
        setup_url:
          description: Where the app creates that client with the provider. Only with client_required.
          format: uri
          type: string
        toolsets:
          description: The groups of tools an agent may limit the plugin to on its entry. Absent when it cannot be limited.
          items:
            type: string
          type: array
      required:
        - category
        - description
        - id
        - logo_url
        - name
      type: object
    PluginAuthorization:
      properties:
        authorize_url:
          description: The URL the browser should open to finish the login.
          type: string
      required:
        - authorize_url
      type: object
    PluginClient:
      description: The OAuth client a config logs a plugin in with. Its secret is sealed and never returned.
      properties:
        client_id:
          description: The client id the provider issued.
          type: string
        has_secret:
          description: Whether a client secret is stored. It is never returned.
          type: boolean
      required:
        - client_id
        - has_secret
      type: object
    PluginConnection:
      description: A catalog plugin as this agent has it, including whether it is logged in. A plugin the config names that nobody has logged into yet is not_connected, which is what a dashboard reminds the app to finish, unless it has user, when each end user connects it in the conversation.
      properties:
        category:
          type: string
        client:
          $ref: '#/components/schemas/PluginClient'
          description: The OAuth client the config set for the plugin. Absent when it set none.
        client_required:
          description: True when nobody can connect the plugin until the config has a client of the app's own, set with setPluginClient.
          type: boolean
        description:
          type: string
        instance_hint:
          type: string
        instance_required:
          type: boolean
        instance_url:
          type: string
        logo_url:
          description: Where this deployment serves the plugin's logo, as an SVG needing no credential. Empty for an MCP server named by URL.
          readOnly: true
          type: string
        name:
          type: string
        plugin_id:
          type: string
        status:
          description: The app's login. Always not_connected for a plugin with user, which the app does not log into.
          enum:
            - pending
            - connected
            - failed
            - not_connected
          type: string
        user:
          description: 'True when the config names the plugin under user_plugins only: each end user connects their own account in the conversation.'
          type: boolean
      required:
        - logo_url
        - name
        - plugin_id
        - status
      type: object
    PluginEntry:
      description: 'One catalog plugin an agent names: its id, such as sentry, or an object naming it with how it is reached.'
      oneOf:
        - minLength: 1
          type: string
        - $ref: '#/components/schemas/PluginWithOptions'
    PluginEvent:
      description: One MCP event an agent subscribes to on a plugin it names. Each event that arrives opens a text conversation from the config, as whoever's login it came through, with the event's data as the first thing said to it.
      properties:
        arguments:
          additionalProperties: {}
          description: The event's filters, as its inputSchema describes them.
          type: object
        event:
          description: The event's name, as the server's events/list gives it, such as comment.created.
          minLength: 1
          type: string
        instructions:
          description: What the agent does with the event when it arrives, added to its instructions for that conversation.
          type: string
        plugin:
          description: A catalog plugin the config names under agent_plugins or user_plugins.
          minLength: 1
          type: string
      required:
        - plugin
        - event
      type: object
    PluginSetupStep:
      description: One thing to do with a plugin's provider before its OAuth client can be set.
      properties:
        description:
          description: How to do it with the provider.
          type: string
        title:
          description: What the step does, in a few words.
          type: string
      required:
        - title
        - description
      type: object
    PluginWithOptions:
      description: One catalog plugin an agent names, with how it is reached and what its login asks for. A login made before a change keeps what it was granted, so connect it again for the change to take.
      properties:
        name:
          description: A catalog plugin id, such as linear.
          minLength: 1
          type: string
        readonly:
          description: Reach the plugin's read-only MCP endpoint, which offers no tool that writes and asks for read access at consent. Only a plugin whose vendor runs one may set it, such as linear.
          type: boolean
        scopes:
          description: The OAuth scopes asked for at consent, in place of the catalog's. Left out asks for the catalog's, or the read-only endpoint's when readonly is set.
          items:
            type: string
          maxItems: 32
          type: array
        tools:
          description: Offer the model only the server's tools matching these names or path.Match patterns, such as search_files or read_*. A tool left out is neither listed nor callable. Left out offers every tool.
          items:
            type: string
          maxItems: 128
          type: array
        toolsets:
          description: Limit the server to these groups of tools, from the plugin's toolsets in the catalog, such as calcom's bookings and availability. Left out offers every tool. Changing them needs no new login.
          items:
            type: string
          maxItems: 32
          type: array
      required:
        - name
      type: object
    Policy:
      description: What an organization or an app decided about spend, data handling, prompt injection, which models may be used and how usage is labelled. Every field is optional, and a field left out is no opinion rather than off.
      properties:
        allowed_models:
          description: The only models requests may be routed to, as provider/model names, in every modality. Left out allows every model, and an empty list allows none. A request that could only go to models not on the list is refused, and a failover never reaches one.
          example:
            - deepseek/DeepSeek-V4-Flash-0731
          items:
            type: string
          type: array
        budget:
          $ref: '#/components/schemas/Budget'
        data_policy:
          $ref: '#/components/schemas/DataPolicy'
        prompt_injection:
          description: Screen what every LLM response is asked for prompt injection. The newest input - the user's turn and any tool results - goes to the classifier (lcm) beside the model call, so it adds nothing to time to first token. The end of the response is held until the verdict, and a response whose input reads as an injection fails with prompt_injection before its tool calls can be acted on.
          type: boolean
        require_own_stream_app:
          description: 'Keep the app out of the router''s own Stream app: in app mode it is never written there for want of a registered Stream app of its own, and what it wrote there before can only be read. True at either scope requires it, so an app cannot turn its organization''s off. An organization''s is set by the router''s operator and read here; sending it back unchanged is fine, and changing it is refused.'
          type: boolean
        tags:
          additionalProperties:
            type: string
          description: Labels recorded on every row of usage, over whatever the request labelled it with, so spend is attributed whatever a caller sends. Together with the request's own they must fit in 16 tags.
          example:
            application: support
          type: object
      type: object
    PostalAddress:
      properties:
        city:
          type: string
        country:
          description: ISO 3166-1 alpha-2.
          type: string
        postal_code:
          type: string
        state:
          description: State or region.
          type: string
        street:
          type: string
      type: object
    PrepareVoiceRequest:
      properties:
        providers:
          description: Which providers to teach the voice to. Empty means every provider this deployment can clone with.
          items:
            type: string
          type: array
      type: object
    PressDigitsRequest:
      properties:
        digits:
          description: 'What to press. Only 0-9, * and # can be pressed, and w waits half a second between two of them.'
          type: string
        vendor:
          description: Who is carrying the call, e.g. "telnyx".
          type: string
      required:
        - digits
        - vendor
      type: object
    Provider:
      properties:
        benchmark:
          $ref: '#/components/schemas/ProviderBenchmark'
        description:
          description: What the model is good at, and what that costs in speed or money. Empty if the deployment wrote none.
          type: string
        health:
          $ref: '#/components/schemas/ProviderHealth'
        languages:
          items:
            type: string
          type: array
        model:
          example: eleven_flash_v2_5
          type: string
        price:
          $ref: '#/components/schemas/ProviderPrice'
        provider:
          example: elevenlabs
          type: string
        realtime:
          type: boolean
        tier:
          $ref: '#/components/schemas/Tier'
        usage_share:
          description: This model's share of the modality's requests over the last seven days, across every customer, from 0 to 1. It is how popular the model is, and is 0 when nothing was served or the deployment keeps no statistics.
          format: double
          type: number
      required:
        - health
        - languages
        - model
        - provider
        - realtime
        - tier
      type: object
    ProviderBenchmark:
      description: What Artificial Analysis measured for this model, refreshed by hand rather than live. A field is absent when the model was not measured on it.
      properties:
        characters_per_second:
          description: Characters a text-to-speech model synthesises per second on the vendor's API.
          example: 115
          format: double
          type: number
        cost_per_task:
          description: US dollars one task of the search benchmark cost, searches and the answering model's tokens together.
          example: 0.127
          format: double
          type: number
        elo:
          description: Speech arena Elo rating of a text-to-speech model.
          example: 1273
          type: integer
        intelligence_index:
          description: Artificial Analysis Intelligence Index of a text model at the reasoning effort the router asks for.
          example: 33
          type: integer
        latency_ms:
          description: Milliseconds a speech-to-text model takes to its final transcript after speech ends.
          example: 490
          type: integer
        output_tokens_per_second:
          description: Tokens a text model writes per second on the host the router calls.
          example: 330
          format: double
          type: number
        search_index:
          description: Artificial Analysis Search Index of a search provider, from 0 to 100.
          example: 74
          type: integer
        word_error_rate:
          description: Streaming AA-WER of a speech-to-text model, from 0 to 1.
          example: 0.027
          format: double
          type: number
      type: object
    ProviderHealth:
      properties:
        available:
          description: False once the error rate crosses the configured threshold.
          type: boolean
        error_rate:
          format: double
          type: number
        errors:
          format: int64
          type: integer
        latency_ms_avg:
          format: double
          type: number
        requests:
          description: Requests seen in the current health window.
          format: int64
          type: integer
      required:
        - available
        - error_rate
        - errors
        - latency_ms_avg
        - requests
      type: object
    ProviderPrice:
      description: What this deployment is billed for the model, in US dollars. A rate is absent when the model is not billed by that unit.
      properties:
        per_million_input_tokens:
          example: 0.75
          format: double
          type: number
        per_million_output_tokens:
          example: 3.75
          format: double
          type: number
      type: object
    RCSProfile:
      properties:
        agent_overview:
          type: string
        brand_color:
          description: 'Hex, such as #1A73E8, with at least 4.5:1 contrast against white.'
          type: string
        call_to_action_text:
          type: string
        call_to_action_url:
          type: string
        company_overview:
          type: string
        description:
          maxLength: 100
          type: string
        display_name:
          maxLength: 40
          type: string
        double_opt_in:
          type: boolean
        hero_url:
          description: 1440 by 448 PNG or JPEG, at most 200 KB, on public HTTPS.
          type: string
        interaction_types:
          type: string
        logo_url:
          description: 224 by 224 PNG or JPEG, at most 50 KB, on public HTTPS.
          type: string
        message_examples:
          items:
            type: string
          nullable: true
          type: array
        opt_in_confirmation_message:
          type: string
        opt_in_methods:
          type: string
        support_email:
          type: string
        support_label:
          type: string
        support_phone:
          type: string
        test_video_url:
          description: Shows consent, example interactions, HELP and STOP.
          type: string
        use_case:
          description: otp, transactional, promotional or multi_use.
          type: string
      type: object
    RecordingSource:
      description: Where the audio to work on comes from. A URL is what every vendor's batch API takes and what anything longer than a clip should use; inline bytes save a caller with a short local file from having to host it somewhere first.
      properties:
        audio:
          description: The file itself, base64. For clips - a long recording belongs behind a URL.
          format: byte
          type: string
        url:
          description: A fetchable audio or video file.
          type: string
      type: object
    RecordingStatus:
      description: Where a job has got to. A failed job carries the reason in `error`, and a completed one carries its result.
      enum:
        - queued
        - running
        - completed
        - failed
      type: string
    RespondRequest:
      properties:
        client_id:
          description: The install the command came from. It is written on the person's message as client_id, and a client tool called while answering is addressed to it.
          pattern: ^[A-Za-z0-9_.:-]{1,128}$
          type: string
        command_id:
          description: Required for personal persistent text conversations. Reuse this ID and identical text for retries; duplicate acceptance does not restart inference.
          pattern: ^[A-Za-z0-9_-]{1,128}$
          type: string
        text:
          minLength: 1
          type: string
      required:
        - text
      type: object
    ReviewActor:
      description: 'Who moved a use case: the app, Stream staff or the vendor.'
      enum:
        - app
        - staff
        - vendor
      type: string
    ReviewDecision:
      description: approve sends the use case to the vendor; request_changes hands it back to the app to edit; reject ends it.
      enum:
        - approve
        - request_changes
        - reject
      type: string
    ReviewPage:
      properties:
        has_more:
          type: boolean
        items:
          items:
            $ref: '#/components/schemas/UseCaseReview'
          type: array
        next_cursor:
          description: Pass as `cursor` for the next page. Absent on the last one.
          type: string
      required:
        - has_more
        - items
      type: object
    ReviewQueue:
      properties:
        has_more:
          type: boolean
        items:
          items:
            $ref: '#/components/schemas/UseCaseForReview'
          type: array
        next_cursor:
          description: Pass as `cursor` for the next page. Absent on the last one.
          type: string
      required:
        - has_more
        - items
      type: object
    ReviewUseCaseRequest:
      properties:
        decision:
          $ref: '#/components/schemas/ReviewDecision'
        notes:
          description: What the app should change, or why it was rejected. Required unless approving.
          maxLength: 4096
          type: string
        reviewer:
          description: Who decided, as the app's timeline shows it.
          maxLength: 255
          type: string
      required:
        - decision
      type: object
    RewindSessionRequest:
      properties:
        response_id:
          description: The response to carry on from. It is kept; everything after it is not.
          type: string
      required:
        - response_id
      type: object
    RollupRequest:
      properties:
        from:
          format: date-time
          type: string
        granularity:
          $ref: '#/components/schemas/Granularity'
        to:
          format: date-time
          type: string
      required:
        - from
        - to
      type: object
    RollupResult:
      properties:
        buckets_written:
          format: int64
          type: integer
        granularity:
          $ref: '#/components/schemas/Granularity'
      required:
        - buckets_written
        - granularity
      type: object
    Route:
      properties:
        candidates:
          description: The models the shortcut resolves to right now, best first.
          items:
            $ref: '#/components/schemas/Candidate'
          type: array
        description:
          type: string
        id:
          description: The shortcut, which is what a config or request names as its target.
          example: llm-fast
          type: string
        title:
          example: Fast conversational
          type: string
      required:
        - candidates
        - description
        - id
        - title
      type: object
    RouterConfig:
      properties:
        created_at:
          format: date-time
          type: string
        id:
          type: string
        llm:
          $ref: '#/components/schemas/LlmOptions'
        name:
          type: string
        search:
          $ref: '#/components/schemas/SearchOptions'
        sts:
          $ref: '#/components/schemas/StsOptions'
        stt:
          $ref: '#/components/schemas/SttOptions'
        tts:
          $ref: '#/components/schemas/TtsOptions'
        updated_at:
          format: date-time
          type: string
      required:
        - created_at
        - id
        - name
        - updated_at
      type: object
    RouterConfigRequest:
      properties:
        llm:
          $ref: '#/components/schemas/LlmOptions'
        name:
          description: What the config is called, which is unique among the customer's own.
          type: string
        search:
          $ref: '#/components/schemas/SearchOptions'
        sts:
          $ref: '#/components/schemas/StsOptions'
        stt:
          $ref: '#/components/schemas/SttOptions'
        tts:
          $ref: '#/components/schemas/TtsOptions'
      required:
        - name
      type: object
    Sandbox:
      description: 'Where the subagent may run code it writes. Only the subagent is offered it: running code takes seconds, and the model holding the conversation has none to spare. Omit it and the subagent works everything out in its head.'
      enum:
        - daytona
      type: string
    SandboxOptions:
      additionalProperties: false
      description: How the sandbox is built and how long code may run in it. Only meaningful with a sandbox. Omit it for the provider's own Python sandbox and a 30 second run.
      properties:
        cpu:
          description: CPUs for the sandbox. Zero is the provider's default.
          format: int64
          maximum: 16
          minimum: 0
          type: integer
        disk_gb:
          description: Disk for the sandbox, in GiB. Zero is the provider's default.
          format: int64
          maximum: 100
          minimum: 0
          type: integer
        image:
          description: The container image to build on, which must have Python, such as python:3.13-slim-bookworm. Empty with anything else set is a slim Python 3.13 image.
          maxLength: 256
          type: string
        memory_gb:
          description: Memory for the sandbox, in GiB. Zero is the provider's default.
          format: int64
          maximum: 64
          minimum: 0
          type: integer
        setup:
          description: Shell commands run once on top of the image when it is built, such as installing packages. The provider keeps the built image, so only the first sandbox from a given setup waits for it.
          items:
            maxLength: 2048
            type: string
          maxItems: 32
          type: array
        timeout_ms:
          description: How long one run of code may take, at most 30 minutes. Zero is 30 seconds. A run is still bounded by the deadline of the skill it was written for.
          format: int64
          maximum: 1800000
          minimum: 0
          type: integer
      type: object
    SayRequest:
      properties:
        text:
          type: string
      required:
        - text
      type: object
    SearchAnswer:
      properties:
        answer:
          description: 'The provider''s own summary, where it offers one. It is what a voice agent wants: a sentence to say rather than a page to read.'
          type: string
        model:
          type: string
        provider:
          type: string
        results:
          description: The sources behind it, most relevant first.
          items:
            $ref: '#/components/schemas/SearchResult'
          type: array
      required:
        - model
        - provider
        - results
      type: object
    SearchDepth:
      description: How much work a search is worth. instant answers from the index in a few hundred milliseconds; deep crawls and reasons over what it finds and can take tens of seconds. Providers offer different ladders, so each one maps these four onto its own.
      enum:
        - instant
        - fast
        - standard
        - deep
      type: string
    SearchOptions:
      description: How this config finds out today's answers.
      properties:
        category:
          description: The kind of source to prefer - news, papers, company, github - for the providers that classify their index.
          type: string
        contents:
          description: What to return alongside each hit.
          items:
            enum:
              - text
              - highlights
              - summary
            type: string
          type: array
        depth:
          $ref: '#/components/schemas/SearchDepth'
        exclude_domains:
          items:
            type: string
          type: array
        include_domains:
          description: Only answer from these domains.
          items:
            type: string
          type: array
        location:
          description: Country or region to answer from, for queries whose answer depends on where.
          type: string
        max_age_hours:
          description: How stale a cached page may be. Zero forces a live crawl, which is slower and costs more.
          minimum: 0
          type: integer
        output_schema:
          additionalProperties: {}
          description: A JSON schema the answer must fit, for the providers that can be asked to structure what they found.
          type: object
        providers:
          description: A priority list of where to try, in the order given, which wins over target and depth when it holds anything. Each entry is a provider name, a provider/model or a capability shortcut, expanded where it stands. A search that fails is asked of the next entry that will have it.
          items:
            type: string
          type: array
        results:
          description: How many hits to return.
          minimum: 1
          type: integer
        target:
          description: A provider/model or a capability shortcut.
          example: search-fast
          type: string
      type: object
    SearchRequest:
      properties:
        config_id:
          description: A stored router config to take the options from. Anything named here as well overrides that one field of it.
          type: string
        options:
          $ref: '#/components/schemas/SearchOptions'
        query:
          description: The question, in the caller's own words.
          example: perioperative antibiotic guidance
          type: string
        tags:
          additionalProperties:
            type: string
          type: object
      required:
        - query
      type: object
    SearchResult:
      properties:
        score:
          description: How relevant the provider judged it.
          format: float
          type: number
        text:
          description: The relevant extract, which is what a model reads.
          type: string
        title:
          type: string
        url:
          type: string
      required:
        - url
      type: object
    Session:
      properties:
        agent:
          description: The name the agent was addressed as. Recorded on the session as well as the config id, so renaming a config does not rewrite what older sessions were opened against.
          type: string
        agent_id:
          type: string
        call_id:
          description: Empty for a text session, which joins no call.
          type: string
        call_type:
          type: string
        closed_at:
          description: When the session ended. Absent while it is still running.
          format: date-time
          type: string
        config_id:
          description: The agent config the session ran under, empty for one that spelled itself out.
          type: string
        context_truncated:
          description: Older history was omitted from the model context.
          type: boolean
        conversation_id:
          description: Stream Chat CID to resume; returned for persistent text sessions.
          type: string
        created_at:
          format: date-time
          type: string
        custom:
          additionalProperties: {}
          type: object
        description:
          type: string
        forked_from:
          description: The session this one continued from, empty for one opened fresh.
          type: string
        id:
          type: string
        incognito:
          description: 'Nothing about this session was recorded. It is reported so a caller can see that what they asked for is what they got, but it is never read back from storage: an incognito session has no row to read it from.'
          type: boolean
        instructions:
          type: string
        last_response_at:
          description: When the agent last answered. This is what a most-recently-used ordering of conversations reads, since a session renamed long after it ended has not become more recent.
          format: date-time
          type: string
        llm:
          description: The provider and model answering, once routing has picked one.
          type: string
        modality:
          $ref: '#/components/schemas/SessionModality'
        mode:
          $ref: '#/components/schemas/SessionMode'
        model_overwrites:
          $ref: '#/components/schemas/ModelOverwrites'
        project_id:
          type: string
        state:
          $ref: '#/components/schemas/SessionState'
        sts:
          description: The provider and model holding a native conversation, once routing has picked one.
          type: string
        stt:
          description: The provider and model transcribing, once somebody has been heard.
          type: string
        text:
          description: The conversation is held in writing rather than on a call.
          type: boolean
        thinking_llm:
          description: The provider and model delegated work runs on.
          type: string
        title:
          type: string
        tts:
          description: The provider and model speaking.
          type: string
        user_id:
          type: string
        video:
          $ref: '#/components/schemas/SessionVideo'
        voice:
          description: The voice speaking, in the provider's own terms. It is the provider's default when the session asked for none.
          type: string
      required:
        - agent_id
        - call_id
        - call_type
        - created_at
        - id
        - modality
        - state
        - user_id
      type: object
    SessionFilter:
      additionalProperties: false
      description: Which sessions to list. A field not listed here is refused rather than ignored.
      properties:
        agent:
          $ref: '#/components/schemas/Equals'
          description: The agent name the session was opened against.
        agent_id:
          $ref: '#/components/schemas/Equals'
          description: The agent id the session was created with, which names its transcript channel.
        config_id:
          $ref: '#/components/schemas/Equals'
          description: The agent config the session ran under. Empty for a session that spelled itself out.
        created_at:
          $ref: '#/components/schemas/TimeRange'
          description: When the session started.
        custom:
          additionalProperties:
            type: string
          description: The session's custom object holds every one of these pairs, which is how a caller finds again what it labelled.
          type: object
        modality:
          $ref: '#/components/schemas/Equals'
          description: 'text, voice or video: how the user took part.'
        project_id:
          $ref: '#/components/schemas/Equals'
        state:
          $ref: '#/components/schemas/Equals'
          description: live or ended, as each session reports its state.
        text:
          $ref: '#/components/schemas/TextMatch'
          description: Full text over the title, description, project and agent name. Sorted by relevance, and not combined with project_id.
        user_id:
          $ref: '#/components/schemas/Equals'
          description: 'Whose sessions to list. Only a server-side caller may set it: an end user is narrowed to their own whatever they ask for.'
      type: object
    SessionMemory:
      description: Who the session's memories are about. Without a user id nothing is recalled or stored, which is the case for a call with nobody identified on it.
      properties:
        app_id:
          description: Separates two deployments sharing one memory account.
          type: string
        filter:
          additionalProperties:
            type: string
          description: 'The caller''s own labels, which narrow recall further. They cannot widen it: a filter is applied alongside the user id, never instead of it.'
          type: object
        user_id:
          description: Who the memories belong to. Empty means the customer.
          type: string
      type: object
    SessionModality:
      description: 'How the user took part: text for a conversation held in writing, voice for a call, and video once the agent has seen the user''s video. It only moves up, from text or voice to video.'
      enum:
        - text
        - voice
        - video
      type: string
    SessionMode:
      description: 'How the session hears and speaks: a transcriber, a conversation model and a voice; one speech-to-speech model; or in writing.'
      enum:
        - cascade
        - native
        - text
      type: string
    SessionPage:
      properties:
        has_more:
          type: boolean
        items:
          items:
            $ref: '#/components/schemas/Session'
          type: array
        next_cursor:
          description: Pass as `cursor` for the next page. Absent on the last one.
          type: string
      required:
        - has_more
        - items
      type: object
    SessionPhone:
      description: The number the session acts from, which is what turns transferring on.
      properties:
        number:
          description: One of the customer's own numbers, written as +15551234567.
          type: string
        vendor:
          description: Who carries an outbound leg.
          type: string
        vendor_call_id:
          description: The outbound leg, set for a call the agent placed. Without one the agent has no keypad to press at.
          type: string
      required:
        - number
      type: object
    SessionQuery:
      additionalProperties: false
      properties:
        cursor:
          description: The next_cursor of the previous page, sent with the same filter and sort. Omitted is the first page.
          type: string
        filter:
          $ref: '#/components/schemas/SessionFilter'
        limit:
          description: Up to 200. Omitted is 25.
          format: int64
          maximum: 200
          minimum: 1
          type: integer
        sort:
          description: Omitted is updated_at, or relevance for a text search.
          items:
            $ref: '#/components/schemas/SessionSort'
          maxItems: 1
          nullable: true
          type: array
      type: object
    SessionRespondCommand:
      properties:
        command_id:
          description: Required for personal persistent text conversations; reuse on retries. Text only when present.
          pattern: ^[A-Za-z0-9_-]{1,128}$
          type: string
        images:
          items:
            $ref: '#/components/schemas/ImageSource'
          type: array
        text:
          type: string
        type:
          enum:
            - respond
          type: string
      required:
        - text
        - type
      type: object
    SessionSettingsRequest:
      description: What to change about one running session's models. A field left out is left as it is. The same safe knobs as ModelOverwrites, plus the voice.
      properties:
        llm:
          description: The conversation model, a provider/model or a capability shortcut.
          type: string
        max_output_tokens:
          type: integer
        sts:
          description: A speech-to-speech target, which makes the session native. Empty makes it a cascade again.
          type: string
        stt:
          type: string
        temperature:
          format: double
          type: number
        thinking:
          enum:
            - none
            - minimal
            - low
            - medium
            - high
          type: string
        tts:
          type: string
        verbosity:
          enum:
            - low
            - medium
            - high
          type: string
        voice:
          description: The voice to speak in, in the provider's own terms. Empty returns to the provider's default.
          type: string
      type: object
    SessionSort:
      additionalProperties: false
      properties:
        direction:
          default: -1
          description: -1, descending. Ascending is not offered.
          enum:
            - -1
          format: int64
          type: integer
        field:
          $ref: '#/components/schemas/SessionSortField'
      required:
        - field
      type: object
    SessionSortField:
      description: updated_at is the most recently active first. relevance is the best match first, and only sorts a text search.
      enum:
        - updated_at
        - relevance
      type: string
    SessionState:
      description: Whether the agent is still in the call.
      enum:
        - live
        - ended
      type: string
    SessionTool:
      description: One of the caller's own functions. The model is offered it by name and description; running it is the caller's business, over the events socket.
      properties:
        approval:
          $ref: '#/components/schemas/SessionToolApproval'
        description:
          description: What the model is told the tool does, which is the whole of how it decides when to reach for one.
          type: string
        display_title:
          description: What a call is doing, in words for the people in the conversation, such as "Checking your location". Shown on the reply's ai_tool_call attachment.
          maxLength: 80
          type: string
        executor:
          description: 'Who runs it. A client tool runs on a person''s device: in a persistent conversation its call is shown as awaiting the device of the person whose command it answers (their user and the command''s client_id), with its arguments, which every channel member can read. The caller still answers it over the events socket, once the device has reported. Defaults to server.'
          enum:
            - server
            - client
          type: string
          x-enum-varnames:
            - SessionToolExecutorServer
            - SessionToolExecutorClient
        name:
          type: string
        parameters:
          additionalProperties: {}
          description: A JSON Schema object describing the arguments.
          type: object
      required:
        - description
        - name
      type: object
    SessionToolApproval:
      description: 'Says a person must allow each call before it runs. In a persistent conversation the call''s ai_tool_call attachment opens as awaiting_approval, addressed to the person whose command it answers (and, for a client tool, their install), and carries this question for their client to ask. The caller collects the answer and reports it over the events socket with tool_approval: allowed, the call goes on as it would have (awaiting_client for a client tool, running otherwise); declined, it is cancelled. The caller still answers the call with tool_result either way. Every channel member can read the question.'
      properties:
        allow_title:
          description: The label of the button that allows the call.
          maxLength: 40
          type: string
        decline_title:
          description: The label of the button that declines it.
          maxLength: 40
          type: string
        message:
          description: What allowing it shares or does, such as "Only your city is shared."
          maxLength: 240
          type: string
        reason_argument:
          description: The argument, a string, in which the model says why it wants this call. Its text (at most 160 characters) is shown as the approval's reason, so it is visible to every channel member even for a server tool.
          maxLength: 64
          type: string
        title:
          description: The question, such as "Share your location?".
          maxLength: 80
          type: string
      required:
        - title
      type: object
    SessionVideo:
      properties:
        max_frames:
          description: Number of recent frames captured for a visual task. Default one.
          maximum: 8
          minimum: 1
          type: integer
        source:
          description: Track or processor source. Omitted requires one unambiguous available source.
          type: string
      type: object
    SetPluginClientRequest:
      description: The OAuth client an app registered with a plugin's provider, with the redirect URI <public url>/v1/agents/plugins/callback.
      properties:
        client_id:
          description: The client id the provider issued.
          maxLength: 512
          minLength: 1
          type: string
        client_secret:
          description: The client secret the provider issued. Left out for a public client.
          maxLength: 512
          type: string
          writeOnly: true
        user:
          description: 'Also name the plugin under the config''s user_plugins, so that each end user connects their own account in the conversation, the first time the agent needs it. Left out names nothing: the app connects the plugin once with authorize, which names it under agent_plugins.'
          type: boolean
      required:
        - client_id
      type: object
    SetSandboxRecipientsRequest:
      properties:
        recipients:
          description: Numbers in E.164, at most max_recipients of them.
          items:
            type: string
          maxItems: 10
          type: array
      required:
        - recipients
      type: object
    Simulation:
      properties:
        assertion:
          type: string
        caller_stt:
          type: string
        caller_target:
          type: string
        caller_tts:
          type: string
        caller_voice:
          type: string
        config_id:
          type: string
        created_at:
          format: date-time
          type: string
        id:
          type: string
        judge_target:
          type: string
        max_turns:
          type: integer
        mode:
          enum:
            - text
            - audio
          type: string
        name:
          type: string
        scenario:
          type: string
        tags:
          additionalProperties:
            type: string
          type: object
        updated_at:
          format: date-time
          type: string
        variations:
          type: integer
      required:
        - assertion
        - config_id
        - created_at
        - id
        - max_turns
        - mode
        - name
        - scenario
        - variations
      type: object
    SimulationCase:
      properties:
        call_id:
          description: The session that held it, which is what the call and transcript paths take. It is written as soon as it exists, so a conversation still going can be watched.
          type: string
        ended:
          description: Why the conversation stopped.
          enum:
            - complete
            - turns
            - timeout
            - failed
          type: string
        error:
          type: string
        finished_at:
          format: date-time
          type: string
        id:
          type: string
        passed:
          description: The judge's ruling. Absent when it never got as far as ruling, which is not the same as having ruled against.
          type: boolean
        scenario:
          description: The wording this conversation used.
          type: string
        score:
          description: How sure the judge was, from 1 to 5.
          type: integer
        started_at:
          format: date-time
          type: string
        state:
          enum:
            - pending
            - running
            - passed
            - failed
            - errored
            - cancelled
          type: string
        transcript:
          items:
            $ref: '#/components/schemas/SimulationLine'
          type: array
        turns:
          description: How many times the caller spoke.
          type: integer
        variation:
          description: Which way of asking this was, and the order they are listed in.
          type: integer
        verdict:
          description: What in the conversation decided it.
          type: string
      required:
        - id
        - scenario
        - started_at
        - state
        - turns
        - variation
      type: object
    SimulationDeclaration:
      description: A simulation an agent directory declares in simulations/*.yaml. It runs against the agent being synced.
      properties:
        assertion:
          description: What has to be true at the end for a run to have passed.
          minLength: 1
          type: string
        caller_stt:
          type: string
        caller_target:
          type: string
        caller_tts:
          type: string
        caller_voice:
          type: string
        judge_target:
          type: string
        max_turns:
          description: How many times the caller may speak. Twelve when left out.
          format: int64
          maximum: 200
          minimum: 1
          type: integer
        mode:
          description: Text when left out.
          enum:
            - text
            - audio
          type: string
        name:
          description: Unique among the agent's simulations, and what a sync finds it again by.
          minLength: 1
          type: string
        scenario:
          description: What the caller wants, in your own words and over as many turns as it takes.
          minLength: 1
          type: string
        tags:
          additionalProperties:
            type: string
          type: object
        variations:
          description: How many ways of asking the same thing one run tries.
          format: int64
          maximum: 10
          minimum: 1
          type: integer
      required:
        - name
        - scenario
        - assertion
      type: object
    SimulationLine:
      properties:
        at:
          format: date-time
          type: string
        caller:
          description: True when the simulated caller said it rather than the agent.
          type: boolean
        intended:
          description: What the agent meant to say, where that differs from what the caller heard. Only an audio simulation has both, and the difference is what running one is for.
          type: string
        text:
          type: string
      required:
        - caller
        - text
      type: object
    SimulationRequest:
      properties:
        assertion:
          description: What has to be true at the end for the run to have passed.
          type: string
        caller_stt:
          description: How the caller hears the agent. Audio simulations only.
          type: string
        caller_target:
          description: The model that plays the caller. Empty takes llm-scenario-runner, the deployment's fast-tier default.
          type: string
        caller_tts:
          description: How the caller speaks. Audio simulations only.
          type: string
        caller_voice:
          description: The voice the caller speaks in. Audio simulations only.
          type: string
        config_id:
          description: The agent being tested.
          type: string
        judge_target:
          description: The model that rules on the conversations, named the way any other routing target is. Empty takes llm-judge, the deployment's quality-tier default, since nobody is waiting for it.
          type: string
        max_turns:
          description: How many times the caller may speak, up to two hundred. It is what stops a caller that never decides it is finished. Twelve when left out.
          type: integer
        mode:
          description: Text hands the agent the words, which tests everything between hearing and answering. Audio generates speech and runs the whole pipeline, so what is judged is what a caller would actually have heard. Text when left out.
          enum:
            - text
            - audio
          type: string
        name:
          type: string
        scenario:
          description: What to ask, in your own words and over as many turns as it takes. This is a brief for the caller rather than a script, so it may describe things that depend on what the agent says back.
          type: string
        tags:
          additionalProperties:
            type: string
          type: object
        variations:
          description: How many ways of asking the same thing one run tries, up to ten. The scenario as written is always the first of them, and one is what left out means.
          type: integer
      required:
        - assertion
        - config_id
        - name
        - scenario
      type: object
    SimulationRun:
      properties:
        assertion:
          description: What was asked of this run, copied when it started. Editing a simulation does not rewrite what an old run tested.
          type: string
        cases:
          description: How many conversations this run is having.
          type: integer
        config_id:
          type: string
        conversations:
          description: The conversations this run had. Present when one run is asked for, and left out of a list so that reading the log does not mean reading every transcript.
          items:
            $ref: '#/components/schemas/SimulationCase'
          type: array
        error:
          type: string
        failed:
          type: integer
        finished_at:
          format: date-time
          type: string
        id:
          type: string
        judge_target:
          type: string
        mode:
          enum:
            - text
            - audio
          type: string
        passed:
          type: integer
        scenario:
          type: string
        simulation_id:
          type: string
        started_at:
          format: date-time
          type: string
        state:
          description: A run passed only if every one of its conversations did. A conversation that never got as far as a ruling leaves the run errored rather than failed.
          enum:
            - running
            - passed
            - failed
            - cancelled
            - errored
          type: string
      required:
        - cases
        - failed
        - id
        - passed
        - simulation_id
        - started_at
        - state
      type: object
    Skill:
      properties:
        capture_video:
          description: Capture task-scoped visual evidence before reasoning.
          type: boolean
        config_id:
          type: string
        created_at:
          format: date-time
          type: string
        deadline_ms:
          format: int64
          type: integer
        description:
          type: string
        id:
          type: string
        instructions:
          type: string
        name:
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - config_id
        - created_at
        - description
        - id
        - instructions
        - name
        - updated_at
      type: object
    SkillRequest:
      properties:
        capture_video:
          description: Capture task-scoped visual evidence before reasoning.
          type: boolean
        config_id:
          description: 'The agent config this skill belongs to. A skill is not shared: two agents that both need one have one each, so editing either leaves the other alone.'
          type: string
        deadline_ms:
          description: How long the work may run before it is abandoned. Zero is the default.
          format: int64
          type: integer
        description:
          description: The one line the fast model sees.
          type: string
        instructions:
          description: The full prompt, which only the subagent sees.
          type: string
        name:
          description: How the config names it, which is unique among that config's own skills.
          type: string
      required:
        - config_id
        - description
        - instructions
        - name
      type: object
    SkippedVendor:
      properties:
        reason:
          example: cannot search by administrative_area
          type: string
        vendor:
          example: twilio
          type: string
      required:
        - reason
        - vendor
      type: object
    Speech:
      properties:
        audio:
          description: The audio itself, base64, when it was not stored behind a URL.
          format: byte
          type: string
        audio_duration_ms:
          format: int64
          type: integer
        characters:
          description: How much text was spoken, which is what it was billed on.
          format: int64
          type: integer
        completed_at:
          format: date-time
          type: string
        created_at:
          format: date-time
          type: string
        error:
          type: string
        format:
          description: What the audio is encoded as, which is what was asked for.
          example: mp3_44100_128
          type: string
        id:
          type: string
        model:
          type: string
        provider:
          type: string
        status:
          $ref: '#/components/schemas/RecordingStatus'
        updated_at:
          format: date-time
          type: string
        url:
          description: Where the finished audio is, on a deployment that stores it. Empty means the audio came back inline instead.
          type: string
      required:
        - created_at
        - id
        - status
        - updated_at
      type: object
    SpeechRequest:
      properties:
        callback:
          description: A URL the finished job is POSTed to, so a caller does not have to poll.
          type: string
        config_id:
          description: A stored router config to take the options from. Anything named here as well overrides that one field of it.
          type: string
        inline:
          default: false
          description: Complete this short request synchronously without storing a recording job or audio. The 202 response contains the completed or failed result and its ephemeral ID cannot be retrieved later. No database is required. Cancelling the request cancels the work. Incompatible with callback; deadline 90 seconds. Maximum 8 MiB of input audio or 16000 characters of speech text. Default false retains asynchronous stored jobs.
          type: boolean
        options:
          $ref: '#/components/schemas/TtsOptions'
        tags:
          additionalProperties:
            type: string
          type: object
        text:
          description: What to say. Whole paragraphs rather than the sentence at a time a socket takes.
          type: string
      required:
        - text
      type: object
    SpendBucket:
      properties:
        bucket:
          format: date-time
          type: string
        cost_micros_total:
          description: Millionths of a dollar, priced from the configured rates.
          format: int64
          type: integer
        request_count:
          format: int64
          type: integer
        value:
          description: The modality or label value this row is for. "other" is everything outside the biggest few, and the empty string is spend carrying no such label at all, so a customer that labels only part of its traffic can see which part.
          example: support
          type: string
      required:
        - bucket
        - cost_micros_total
        - request_count
        - value
      type: object
    StatsBucket:
      properties:
        audio_ms_total:
          description: Billable audio, transcribed or produced.
          format: int64
          type: integer
        bucket:
          format: date-time
          type: string
        cached_input_tokens_total:
          description: The part of the prompt served from the provider's cache.
          format: int64
          type: integer
        characters_total:
          description: Billable text. Zero for providers that bill by audio.
          format: int64
          type: integer
        cost_micros_total:
          description: Millionths of a dollar, priced from the configured rates.
          format: int64
          type: integer
        error_count:
          format: int64
          type: integer
        images_total:
          description: Pictures drawn. Zero outside image.
          format: int64
          type: integer
        input_tokens_total:
          description: Prompt tokens read, cached ones included. Zero outside llm.
          format: int64
          type: integer
        latency_p50_ms:
          format: double
          nullable: true
          type: number
        latency_p95_ms:
          format: double
          nullable: true
          type: number
        model:
          type: string
        output_tokens_total:
          description: Generated tokens, reasoning included. Zero outside llm.
          format: int64
          type: integer
        provider:
          type: string
        request_count:
          format: int64
          type: integer
        uptime:
          description: Successes over total requests in the bucket.
          format: double
          nullable: true
          type: number
      required:
        - audio_ms_total
        - bucket
        - cached_input_tokens_total
        - characters_total
        - cost_micros_total
        - error_count
        - images_total
        - input_tokens_total
        - model
        - output_tokens_total
        - provider
        - request_count
      type: object
    StreamAppState:
      description: Whether the router acts in a registered app. disconnected is one the app took back, and blocked one Stream suspended or that stopped checking tokens. Neither is ever written into the router's own app instead.
      enum:
        - connected
        - disconnected
        - blocked
      type: string
    StreamCheck:
      properties:
        reattach:
          items:
            type: string
          nullable: true
          type: array
        settings:
          $ref: '#/components/schemas/AppSettings'
      required:
        - settings
        - reattach
      type: object
    StreamCredentials:
      description: 'The keys the router acts in the calling app''s own Stream app with. Secrets are written and never read back: no answer carries one.'
      properties:
        allow_guests:
          description: Whether guests may be made in the app. Left out keeps what was set, which starts off false.
          type: boolean
        expected_revision:
          description: The revision last read, 0 for an app never registered. A write made against an older one is a 409.
          format: int64
          type: integer
        keys:
          description: Every key the router may act in the app with, which replaces those it held. Each is checked with Stream. Empty disconnects the app, which needs a proof.
          items:
            $ref: '#/components/schemas/StreamKeyInput'
          maxItems: 8
          nullable: true
          type: array
        primary_key:
          description: The key tokens are minted with. Left out is the first.
          type: string
        proof:
          $ref: '#/components/schemas/StreamKeyInput'
          description: A key and secret of the app, which disconnecting needs. It is checked with Stream and kept nowhere.
      required:
        - keys
        - expected_revision
      type: object
    StreamKeyInput:
      properties:
        api_key:
          maxLength: 128
          minLength: 1
          type: string
        api_secret:
          description: The key's secret. It is sealed and never read back.
          maxLength: 256
          type: string
          writeOnly: true
        created_at:
          description: When Stream made the key, which says which key is the oldest and so signs the app's webhooks.
          format: date-time
          type: string
      required:
        - api_key
        - api_secret
      type: object
    StreamKeyState:
      properties:
        api_key:
          type: string
        created_at:
          description: When Stream made the key.
          format: date-time
          type: string
        last_webhook_at:
          description: When Stream last signed a hook with this key.
          format: date-time
          type: string
        secret_last4:
          description: The end of the secret, enough to tell two apart.
          type: string
        signs_webhooks:
          description: Whether Stream signs the app's hooks with this key, which is its oldest. yes is one a hook arrived signed with.
          enum:
            - "yes"
            - "no"
            - unknown
          type: string
        status:
          description: rejected is a key Stream stopped accepting, which the router no longer uses.
          enum:
            - active
            - rejected
          type: string
        verified_at:
          format: date-time
          type: string
      required:
        - api_key
        - status
        - signs_webhooks
      type: object
    StreamSettings:
      description: Which Stream app the router writes the calling app's conversations, transcripts, calls and phone lines into, and whether that app holds the types they need.
      properties:
        allow_guests:
          description: Whether guests may be made in the registered app.
          type: boolean
        call_type:
          $ref: '#/components/schemas/StreamTypeState'
          description: Whether the Stream app holds the agent call type calls are made with. Stream reports no grants for it here, so it is present or missing.
        channel_type:
          $ref: '#/components/schemas/StreamTypeState'
          description: Whether the Stream app holds the agent channel type conversations are kept in. unsafe is one whose grants let somebody other than the app's backend make, change or join a conversation's channel, or read one they are not in.
        checked_at:
          description: When Stream was asked. Absent when it could not be, and the types are then unknown. Answers are reused for a minute.
          format: date-time
          type: string
        keys:
          description: The registered app's keys, oldest first. No secret is ever read back.
          items:
            $ref: '#/components/schemas/StreamKeyState'
          nullable: true
          type: array
        primary_key:
          description: The key tokens are minted with.
          type: string
        revision:
          description: The registration's revision, 0 for an app that registered none. A write names the one it read.
          format: int64
          type: integer
        state:
          $ref: '#/components/schemas/StreamAppState'
          description: Whether the router acts in the registered app. Absent for an app that registered none.
        state_reason:
          description: Why the router stopped acting in the app, for one that is blocked.
          type: string
        stream_app_id:
          description: The registered app's own id.
          format: int64
          type: integer
        tenancy:
          $ref: '#/components/schemas/StreamTenancy'
        writes_into:
          $ref: '#/components/schemas/StreamWritesInto'
      required:
        - tenancy
        - writes_into
        - channel_type
        - call_type
      type: object
    StreamTenancy:
      description: Whose Stream app the router acts in. deployment is one app, the router's own, for every app it serves; app is each app's own.
      enum:
        - deployment
        - app
      type: string
    StreamTypeState:
      description: Whether a Stream app holds a type the router needs. unknown is a type Stream could not be asked about.
      enum:
        - present
        - missing
        - unsafe
        - unknown
      type: string
    StreamWritesInto:
      description: 'Which Stream app the calling app''s work is written into: this_app is its own, deployment_app is the router''s own app, shared with every app it serves that has none, and nowhere is no app at all, so conversations are not kept and calls cannot be made.'
      enum:
        - this_app
        - deployment_app
        - nowhere
      type: string
    StsOptions:
      description: How this config holds a conversation with one native audio model, in place of a transcriber, a text model and a voice. What every such model takes is a field here; what only some take is a term, and a request naming a term is routed to a model that declared it or refused, never served by one that ignores it.
      properties:
        data_policy:
          $ref: '#/components/schemas/DataPolicy'
        images:
          description: The session will send the model frames, so it is routed only to a model that sees, the way vlm routes a text model.
          type: boolean
        input_transcript:
          description: Ask the model to write down what it heard.
          type: boolean
        instructions:
          description: 'The system prompt the model converses under, sent when the session opens. A stored router config naming one is refused: what is said belongs to the agent holding the conversation, not to the config that decides where it goes.'
          type: string
        interrupt_response:
          description: Whether the model cuts its own reply off when it hears the caller. Omitting it leaves the vendor's default; false is for a speaker close enough to the microphone that the model would otherwise interrupt itself.
          type: boolean
        languages:
          items:
            type: string
          type: array
        output_transcript:
          description: Ask the model to write down what it said.
          type: boolean
        overwrites:
          additionalProperties: {}
          description: 'Settings for one provider that this vocabulary has no word for, keyed by provider name, for example {"openai": {"eagerness": "high"}}. The provider named parses its own block and refuses a field it does not have, so an overwrite is either sent or reported rather than accepted and dropped.'
          example:
            openai:
              eagerness: high
          type: object
        prefix_padding_ms:
          description: How much audio before the detected speech is kept, for a silence timer.
          type: integer
        providers:
          description: A priority list of where to try, in the order given, which wins over target when it holds anything. Each entry is a provider name, a provider/model or a capability shortcut, expanded where it stands.
          items:
            type: string
          type: array
        silence_ms:
          description: How long a pause ends the turn, for a silence timer.
          type: integer
        target:
          description: A provider/model or a capability shortcut.
          example: sts-fast
          type: string
        text:
          description: The session will inject typed turns.
          type: boolean
        tools:
          description: The session will hand the model functions to call.
          type: boolean
        turn_detection:
          description: 'What decides the caller has finished: a silence timer, a model reading the words, or nothing, which leaves the turns to the caller. Omitting it leaves the vendor''s default. Only some models read the words, so semantic is a term.'
          enum:
            - server_vad
            - semantic
            - none
          type: string
        voice:
          description: The vendor's own name for a voice, such as marin at OpenAI or Kore at Google. None of these models takes one of your own voices, so the name is passed on as given rather than looked up.
          example: marin
          type: string
      type: object
    SttOptions:
      description: 'How this config transcribes, live or from a recording. A field that only means something on one of the two forms says so: a recording has no endpointing to do, and a socket has no file to write subtitles from. A provider that cannot express a term refuses the request rather than dropping it silently.'
      properties:
        channels:
          description: Transcribe a multichannel recording per channel rather than mixed down.
          minimum: 1
          type: integer
        data_policy:
          $ref: '#/components/schemas/DataPolicy'
        detect_language:
          description: Let the provider identify the language instead of being told it.
          type: boolean
        diarize:
          description: Label each stretch of speech with who said it.
          type: boolean
        eager_end_of_turn:
          description: Send a transcript as soon as the model guesses the turn may be over, before it is sure, so a reply can start early. Live only. A model without an eager end of turn transcribes as normal rather than being refused. On by default for en-low-latency and multilingual-low-latency.
          type: boolean
        endpointing:
          $ref: '#/components/schemas/Endpointing'
        entities:
          description: Extract named entities from the recording. Recording only.
          type: boolean
        events:
          description: Tag non-speech audio events such as laughter or music.
          type: boolean
        format:
          description: Punctuation, capitalisation and smart formatting of numbers and dates.
          type: boolean
        interim:
          description: Emit partial transcripts as they firm up, not only final ones. Live only.
          type: boolean
        keyterms:
          description: Business-specific words the transcriber would otherwise get wrong. Up to 100 terms, and providers that cannot be told about vocabulary refuse them.
          items:
            type: string
          type: array
        languages:
          description: ISO codes candidates must cover. Empty with detect_language lets the provider decide.
          items:
            type: string
          type: array
        max_speakers:
          description: A hard cap on the speakers diarization may find, not a hint. Providers differ in what they allow, so one asked for more than it supports refuses.
          maximum: 32
          minimum: 1
          type: integer
        mode:
          $ref: '#/components/schemas/TranscriptionMode'
        output:
          $ref: '#/components/schemas/TranscriptFormat'
        overwrites:
          additionalProperties: {}
          description: 'Settings for one provider that this vocabulary has no word for, keyed by provider name, for example {"deepgram": {"eot_threshold": 0.6}}. The provider named parses its own block and refuses a field it does not have, so an overwrite is either sent or reported rather than accepted and dropped.'
          example:
            deepgram:
              eot_threshold: 0.6
          type: object
        profanity_filter:
          description: Mask offensive words rather than writing them down. Only some providers can be told to, so a request for it is routed to one of them or refused.
          type: boolean
        providers:
          description: A priority list of where to try, in the order given, which wins over target when it holds anything. Each entry is a provider name, a provider/model or a capability shortcut, and each is expanded where it stands, so the order given is the order tried. Health only moves a provider that is down to the back; unlike a shortcut, this does not reorder on latency, because a caller who wrote an order meant it.
          items:
            type: string
          type: array
        redact:
          description: Remove personally identifying information from the transcript.
          type: boolean
        sample_rate:
          description: Rate of the PCM sent on the socket. Zero means 16 kHz. Live only.
          example: 16000
          type: integer
        silence_ms:
          description: How long a pause ends a turn, for silence endpointing. Live only.
          example: 300
          type: integer
        summary:
          description: Summarise the recording, where the provider offers audio intelligence. Recording only.
          type: boolean
        target:
          description: A provider/model or a capability shortcut such as en-low-latency for the live path or en-recorded for a recording.
          example: en-low-latency
          type: string
        utterance_end_ms:
          description: How long after the last word an utterance is declared over. Live only.
          type: integer
        words:
          description: Word-level timestamps. Recording only.
          type: boolean
      type: object
    SyncAgentRequest:
      description: An agent directory as it is on disk. Everything after the simulations is what the directory's declaration decides rather than what it holds, and a setting left out leaves whatever is stored, so a model chosen in the dashboard survives a sync that says nothing about it.
      properties:
        agent_plugins:
          description: 'Plugins the agent reaches with the app''s own login: a catalog id, or an object naming it with how it is reached.'
          items:
            $ref: '#/components/schemas/PluginEntry'
          type: array
        channels:
          $ref: '#/components/schemas/AgentChannels'
          description: Lines this agent answers on besides Stream Chat, each a number the app connected.
        connectors:
          description: The connectors agent.yaml binds. Sent, they are the whole of the agent's bindings and replace the ones stored, an empty list removing them all. Left out, the stored ones are left alone.
          items:
            $ref: '#/components/schemas/AgentConnectorBinding'
          maxItems: 64
          type: array
        dispatch:
          $ref: '#/components/schemas/AgentDispatch'
        greeting:
          type: string
        guardrail:
          description: 'The directory''s guardrail.md, whole: frontmatter saying how to screen a turn, then the policy in prose. Empty means every turn is answered.'
          type: string
        harness:
          $ref: '#/components/schemas/Harness'
        hash:
          description: A fingerprint of the directory. A second sync with the same hash does nothing.
          type: string
        instructions:
          type: string
        keyterms:
          items:
            type: string
          type: array
        knowledge:
          items:
            $ref: '#/components/schemas/KnowledgeDocument'
          type: array
        knowledge_urls:
          description: The pages the directory's knowledge/urls.yaml declares. They are subscribed to in the same knowledge base as the files, so one lookup covers both.
          items:
            $ref: '#/components/schemas/KnowledgeUrlDeclaration'
          type: array
        llm:
          type: string
        mcp_servers:
          description: MCP servers outside the plugin catalog, opened by their URL with no login.
          items:
            $ref: '#/components/schemas/McpServer'
          maxItems: 16
          type: array
        mode:
          $ref: '#/components/schemas/AgentMode'
        name:
          description: What the config is called, which is also the directory's name.
          type: string
        plugin_events:
          description: MCP events the agent subscribes to on its plugins, each opening a text conversation when it arrives.
          items:
            $ref: '#/components/schemas/PluginEvent'
          maxItems: 32
          type: array
        sandbox:
          $ref: '#/components/schemas/Sandbox'
        sandbox_options:
          $ref: '#/components/schemas/SandboxOptions'
        search:
          type: string
        simulations:
          description: 'The simulations the directory''s simulations/*.yaml declare. Sent, they are the whole of the agent''s simulations: each is found by name, and one no longer declared is deleted. Left out, the stored ones are left alone.'
          items:
            $ref: '#/components/schemas/SimulationDeclaration'
          type: array
        skills:
          items:
            $ref: '#/components/schemas/SkillRequest'
          type: array
        speed:
          description: The voice's rate of delivery, 1 being its own. Zero leaves it there.
          format: double
          minimum: 0
          type: number
        sts:
          description: 'A speech-to-speech target: one native audio model that hears the caller and speaks back. Naming one makes the agent native, and stt, tts and llm are then not used. Empty means the cascade.'
          type: string
        stt:
          type: string
        tags:
          additionalProperties:
            type: string
          type: object
        thinking_llm:
          description: 'Only a voice agent names one: a text agent runs everything on its llm.'
          type: string
        tts:
          type: string
        user_plugins:
          description: Plugins each end user connects with their own account, from the conversation, the first time the agent needs one. Each is named like agent_plugins.
          items:
            $ref: '#/components/schemas/PluginEntry'
          type: array
        video:
          $ref: '#/components/schemas/SessionVideo'
        voice:
          type: string
      required:
        - name
        - hash
      type: object
    SyncAgentResult:
      properties:
        config:
          $ref: '#/components/schemas/AgentConfig'
        unchanged:
          description: True when the hash matched and nothing was written.
          type: boolean
        warnings:
          description: What was stored but will not work yet, such as a channel line the app has not connected.
          items:
            type: string
          nullable: true
          type: array
      required:
        - unchanged
        - config
      type: object
    TagKeySummary:
      properties:
        cost_micros_total:
          format: int64
          type: integer
        coverage:
          description: The share of the window's requests that carry this key, from 0 to 1. A key on half the traffic breaks down half the bill, which is worth knowing before it is read as the whole of it.
          format: double
          type: number
        key:
          example: product
          type: string
        request_count:
          format: int64
          type: integer
        top_values:
          description: The ten largest values, biggest spend first.
          items:
            $ref: '#/components/schemas/TagValueSummary'
          type: array
        value_count:
          description: How many distinct values the key was used with. One means it is context rather than a breakdown; hundreds mean it identifies something, such as an end customer, and only its largest values are worth a chart.
          format: int64
          type: integer
      required:
        - cost_micros_total
        - coverage
        - key
        - request_count
        - top_values
        - value_count
      type: object
    TagStatsBucket:
      properties:
        audio_ms_total:
          format: int64
          type: integer
        bucket:
          format: date-time
          type: string
        cached_input_tokens_total:
          format: int64
          type: integer
        characters_total:
          format: int64
          type: integer
        cost_micros_total:
          description: Millionths of a dollar, priced from the configured rates.
          format: int64
          type: integer
        error_count:
          format: int64
          type: integer
        images_total:
          format: int64
          type: integer
        input_tokens_total:
          format: int64
          type: integer
        latency_p50_ms:
          format: double
          nullable: true
          type: number
        latency_p95_ms:
          format: double
          nullable: true
          type: number
        output_tokens_total:
          format: int64
          type: integer
        request_count:
          format: int64
          type: integer
        tag_key:
          example: project
          type: string
        tag_value:
          example: moderation
          type: string
        uptime:
          format: double
          nullable: true
          type: number
      required:
        - audio_ms_total
        - bucket
        - cached_input_tokens_total
        - characters_total
        - cost_micros_total
        - error_count
        - images_total
        - input_tokens_total
        - output_tokens_total
        - request_count
        - tag_key
        - tag_value
      type: object
    TagValueSummary:
      properties:
        cost_micros_total:
          format: int64
          type: integer
        request_count:
          format: int64
          type: integer
        share:
          description: This value's share of what the key covers, from 0 to 1.
          format: double
          type: number
        value:
          example: support
          type: string
      required:
        - cost_micros_total
        - request_count
        - share
        - value
      type: object
    TextContentPart:
      properties:
        text:
          type: string
        type:
          enum:
            - text
          type: string
      required:
        - text
        - type
      type: object
    TextMatch:
      additionalProperties: false
      properties:
        $q:
          description: Quoted phrases and bare words both work, and punctuation is taken rather than refused.
          minLength: 1
          type: string
      required:
        - $q
      type: object
    Tier:
      description: What the model optimises for.
      enum:
        - low-latency
        - high-quality
      type: string
    TimeRange:
      additionalProperties: false
      properties:
        $gte:
          description: At or after this RFC3339 time.
          format: date-time
          type: string
        $lt:
          description: Strictly before this RFC3339 time.
          format: date-time
          type: string
      type: object
    TimelineEntry:
      properties:
        audio_out_ms:
          description: How much the agent spoke.
          format: double
          type: number
        cadence_ms:
          description: Last transcript revision to a stable turn ready for the flow controller.
          format: double
          type: number
        decision_ms:
          description: Stable turn to the main model request, including flow and queueing.
          format: double
          type: number
        heard:
          description: What the caller said, when it can be matched to this exchange.
          type: string
        interrupted:
          description: Whether the caller talked over the answer.
          type: boolean
        llm_ttft_ms:
          description: The wait between asking the model and its first token.
          format: double
          nullable: true
          type: number
        model_calls:
          description: Individual model requests for this turn, including flow and delegated work.
          items:
            $ref: '#/components/schemas/ModelCallTiming'
          type: array
        model_to_first_text_ms:
          description: Main model request to the first text delta admitted to the voice pipeline.
          format: double
          type: number
        roundtrip_ms:
          description: Last transcript revision to first audio published; includes cadence settling.
          format: double
          type: number
        said:
          description: What the agent answered.
          type: string
        speech_end_to_audio_ms:
          description: Last input audio to first output audio, estimated using provider STT processing time plus roundtrip. It excludes network transport and playback.
          format: double
          nullable: true
          type: number
        started_at:
          format: date-time
          type: string
        stt_latency_ms:
          description: The provider's decode time for the transcript that settled the turn.
          format: double
          nullable: true
          type: number
        text_to_tts_ms:
          description: First text delta to the first TTS request.
          format: double
          type: number
        tts_to_audio_ms:
          description: First TTS request to the first audio chunk published to the edge.
          format: double
          type: number
        tts_ttfb_ms:
          description: The wait between sending the first sentence and the first audio.
          format: double
          nullable: true
          type: number
        turn_id:
          type: string
      required:
        - started_at
        - turn_id
      type: object
    ToolApprovalCommand:
      description: A person's answer to a call awaiting their approval, from a persistent text command. It changes only how the call is shown; the call still needs a tool_result.
      properties:
        allowed:
          type: boolean
        command_id:
          type: string
        summary:
          description: Shown on the declined call, such as "Location not shared".
          maxLength: 120
          type: string
        tool_call_id:
          type: string
        turn_id:
          type: string
        type:
          enum:
            - tool_approval
          type: string
      required:
        - allowed
        - command_id
        - tool_call_id
        - turn_id
        - type
      type: object
    ToolResultCommand:
      properties:
        command_id:
          type: string
        error:
          type: string
        output:
          $ref: '#/components/schemas/MessageContent'
        tool_call_id:
          type: string
        turn_id:
          type: string
        type:
          enum:
            - tool_result
          type: string
      required:
        - tool_call_id
        - type
      type: object
    TranscriptEntity:
      description: Something the recording named, for the providers that pick them out.
      properties:
        end_ms:
          format: int64
          type: integer
        start_ms:
          format: int64
          type: integer
        text:
          type: string
        type:
          example: person
          type: string
      required:
        - text
        - type
      type: object
    TranscriptFormat:
      description: What a finished transcript is rendered as. json carries the words and speakers; srt and vtt are subtitle files. Recording only.
      enum:
        - json
        - srt
        - vtt
      type: string
    TranscriptMessage:
      properties:
        agent:
          description: Whether the agent said it rather than somebody it was talking to. It is what the line was stored as, so it holds however the agent was named.
          type: boolean
        created_at:
          format: date-time
          type: string
        name:
          description: That speaker's display name, when they have one.
          type: string
        speaker:
          description: Who said it, the agent under its own user id.
          type: string
        text:
          type: string
      required:
        - created_at
        - speaker
        - text
      type: object
    TranscriptWord:
      properties:
        confidence:
          format: float
          type: number
        end_ms:
          format: int64
          type: integer
        speaker:
          description: Who said it, when diarization was asked for.
          type: string
        start_ms:
          format: int64
          type: integer
        text:
          type: string
      required:
        - end_ms
        - start_ms
        - text
      type: object
    Transcription:
      properties:
        audio_duration_ms:
          description: How long the recording was, which is what it was billed on.
          format: int64
          type: integer
        completed_at:
          format: date-time
          type: string
        created_at:
          format: date-time
          type: string
        entities:
          items:
            $ref: '#/components/schemas/TranscriptEntity'
          type: array
        error:
          description: Why the job failed, if it did.
          type: string
        id:
          type: string
        language:
          description: What was spoken, whether it was asked for or detected.
          type: string
        model:
          type: string
        provider:
          type: string
        speakers:
          description: The speakers diarization found, in the order they first spoke.
          items:
            type: string
          type: array
        status:
          $ref: '#/components/schemas/RecordingStatus'
        subtitles:
          description: The transcript as an SRT or VTT file, when one of those was asked for.
          type: string
        summary:
          type: string
        text:
          description: The whole transcript as prose.
          type: string
        updated_at:
          format: date-time
          type: string
        words:
          description: Present when word-level timestamps were asked for.
          items:
            $ref: '#/components/schemas/TranscriptWord'
          type: array
      required:
        - created_at
        - id
        - status
        - updated_at
      type: object
    TranscriptionMode:
      description: How faithfully the transcript follows what was said. verbatim keeps the ums, the repetitions and the false starts; smart removes them, tidies the grammar and formats the result, which is why it cannot also diarize or time the words - they may no longer be the words that were spoken. Almost no provider offers both, so this narrows where a request can go.
      enum:
        - verbatim
        - smart
      type: string
    TranscriptionRequest:
      properties:
        callback:
          description: A URL the finished job is POSTed to, so a caller does not have to poll. The body is the same Transcription this returns.
          type: string
        config_id:
          description: A stored router config to take the options from. Anything named here as well overrides that one field of it.
          type: string
        inline:
          default: false
          description: Complete this short request synchronously without storing a recording job or audio. The 202 response contains the completed or failed result and its ephemeral ID cannot be retrieved later. No database is required. Cancelling the request cancels the work. Incompatible with callback; deadline 90 seconds. Maximum 8 MiB of input audio or 16000 characters of speech text. Default false retains asynchronous stored jobs.
          type: boolean
        options:
          $ref: '#/components/schemas/SttOptions'
        source:
          $ref: '#/components/schemas/RecordingSource'
        tags:
          additionalProperties:
            type: string
          description: Cost labels for this job.
          type: object
      required:
        - source
      type: object
    TransferCallRequest:
      properties:
        call_id:
          description: The Stream call the caller and the agent are already on.
          type: string
        call_type:
          description: The Stream call type. Omit for "agent".
          type: string
        from:
          description: The customer's number the human is dialled from, which is what they see.
          type: string
        tags:
          additionalProperties:
            type: string
          type: object
        to:
          description: The human being brought onto the call.
          type: string
      required:
        - call_id
        - from
        - to
      type: object
    TtsOptions:
      description: How this config speaks. A provider that cannot express a term refuses the request rather than dropping it silently, since a voice asked to sound urgent and speaking flatly is worse than one that says it cannot.
      properties:
        chunk_schedule:
          description: Character counts at which a streaming voice flushes audio. Smaller first values start speaking sooner and cost more requests. Live only.
          items:
            type: integer
          type: array
        data_policy:
          $ref: '#/components/schemas/DataPolicy'
        emotion:
          description: Affect to speak with, for the providers that take one.
          type: string
        format:
          description: Codec, sample rate and bitrate as one name - pcm_16000, mp3_44100_128, ulaw_8000 for telephony.
          example: pcm_16000
          type: string
        languages:
          items:
            type: string
          type: array
        overwrites:
          additionalProperties: {}
          description: 'Settings for one voice provider that this vocabulary has no word for, keyed by provider name, for example {"elevenlabs": {"voice_id": "21m00Tcm4TlvDq8ikWAM"}}. The provider named parses its own block and refuses a field it does not have, so an overwrite is either sent or reported rather than accepted and dropped. It is also the only way to steer a live voice per vendor, since a voice id from one library means nothing at another.'
          example:
            elevenlabs:
              voice_id: 21m00Tcm4TlvDq8ikWAM
          type: object
        pronunciations:
          additionalProperties:
            type: string
          description: How to say words the voice gets wrong, keyed by the word.
          type: object
        providers:
          description: A priority list of where to try, in the order given, which wins over target when it holds anything. Each entry is a provider name, a provider/model or a capability shortcut, and each is expanded where it stands, so the order given is the order tried. Health only moves a provider that is down to the back.
