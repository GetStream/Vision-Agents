          description: The line, with where to deliver
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Connect a channel line
  /v1/agents/channels/{id}:
    delete:
      description: |-
        Drops the line's credentials, so nothing is delivered or sent on it again.

        Server-side only.
      operationId: disconnectChannel
      parameters:
        - description: The account, as the connect answered with.
          in: path
          name: id
          required: true
          schema:
            description: The account, as the connect answered with.
            type: string
      responses:
        "204":
          description: Disconnected
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Disconnect a channel line
  /v1/agents/channels/hooks/{token}:
    get:
      description: 'What WhatsApp asks for before it will deliver: the verify token the line was connected with, answered with the challenge it sent, as text. Unauthenticated because Meta is not a customer; the token in the path names the line.'
      operationId: verifyChannelHook
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
        - in: query
          name: hub.mode
          schema:
            type: string
        - in: query
          name: hub.verify_token
          schema:
            type: string
        - in: query
          name: hub.challenge
          schema:
            type: string
      responses:
        "200":
          content:
            text/plain:
              schema:
                type: string
          description: The challenge, echoed
        "403":
          description: That is not this line's verify token
        "410":
          description: No line is connected at this address
        "500":
          $ref: '#/components/responses/InternalError'
      security: []
      summary: Answer a channel provider's webhook check
    post:
      description: 'Where WhatsApp, Telnyx and Linq deliver what somebody wrote to one of the app''s lines. Unauthenticated because the provider is not a customer: the token in the path names the line, and each delivery is checked against the signing secret that line was connected with. A message that has not been seen before earns a turn from whichever agent names the number under `channels`, and what the agent says goes back over the channel rather than in this response.'
      operationId: receiveChannelMessage
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      responses:
        "202":
          description: The delivery is taken, and the agent is answering it
        "400":
          description: The delivery is not one this provider sends
        "401":
          description: The delivery is not signed with this line's secret
        "410":
          description: No line is connected at this address; stop delivering to it
        "413":
          description: The delivery is over 256 KiB
        "500":
          $ref: '#/components/responses/InternalError'
      security: []
      summary: Receive a message on a channel
  /v1/agents/channels/links:
    post:
      description: |-
        Answers with a code to show somebody already signed in. The number that texts it to the agent belongs to that end user from then on, which is what an agent reading a person's own calendar or orders needs before it says a word. Only an agent whose `channels.identity` is `link` has anything to link.

        Server-side only.
      operationId: linkChannelNumber
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkChannelRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelLink'
          description: The code and when it stops working
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Mint a code to claim a number
  /v1/agents/chat-token:
    post:
      description: |-
        An agent writes what was said into the Stream Chat channel agent:{agent_id}, so a client that can read that channel needs no transcript API. This mints the token to read it with, and adds the reader to the channel, since a conversation they are not a member of is one they cannot watch.
        The secret stays here, the same as for a call token: the browser is handed something that expires.
      operationId: createChatToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatTokenRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatToken'
          description: The credentials, and the channel they are for
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: What a browser needs to read an agent's conversation
  /v1/agents/configs:
    get:
      description: |-
        With a name this is how a name becomes a config, which is what lets a backend say "docs" instead of an id it never chose.
        Server-side only, as it always was: a config carries the instructions the agent runs under, and those are not a page's business. A page addressing an agent by name does not need this -- it sends the name on the create-session request and the router resolves it, which is the same lookup without handing the instructions over.
      operationId: listAgentConfigs
      parameters:
        - description: Narrow the list to the config with this name, which is how a name is resolved to a config. Names are unique per customer, so this answers with at most one.
          explode: false
          in: query
          name: name
          schema:
            description: Narrow the list to the config with this name, which is how a name is resolved to a config. Names are unique per customer, so this answers with at most one.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AgentConfig'
                type: array
          description: The customer's configs, newest first
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: The agent configs the calling customer holds
    post:
      description: |-
        A config holds what a caller would otherwise repeat on every call: the models, the voice, the instructions and which skills the subagent may be handed. What is about one conversation rather than the agent behind it, the call id above all, stays in the create-session request.
        Server-side only: it needs a server-side token, so it cannot be reached from an end user's device.
      operationId: createAgentConfig
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentConfigRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentConfig'
          description: The config was stored
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Store a named configuration a session can be created from
  /v1/agents/configs/{id}:
    delete:
      description: |-
        Calls that already ran under it keep naming it, so the config stops being usable rather than stops having existed.
        Server-side only: it needs a server-side token, so it cannot be reached from an end user's device.
      operationId: deleteAgentConfig
      parameters:
        - description: The resource, as returned when it was created.
          in: path
          name: id
          required: true
          schema:
            description: The resource, as returned when it was created.
            type: string
      responses:
        "204":
          description: The config is gone
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Delete an agent config
    get:
      operationId: getAgentConfig
      parameters:
        - description: The resource, as returned when it was created.
          in: path
          name: id
          required: true
          schema:
            description: The resource, as returned when it was created.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentConfig'
          description: The config
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: One agent config
    patch:
      description: |-
        Writes only the fields sent, so a guardrail can be set without restating the instructions, skills and models beside it. Sessions already running keep the configuration they started with.

        Server-side only: it needs a server-side token, so it cannot be reached from an end user's device.
      operationId: patchAgentConfig
      parameters:
        - description: The config, as returned when it was created.
          in: path
          name: id
          required: true
          schema:
            description: The config, as returned when it was created.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentConfigPatch'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentConfig'
          description: The config as it now is
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Change some of an agent config
    put:
      description: |-
        Every field is written, so the body is what the config now is rather than what changed about it. Sessions already running keep the configuration they started with.
        Server-side only: it needs a server-side token, so it cannot be reached from an end user's device.
      operationId: updateAgentConfig
      parameters:
        - description: The resource, as returned when it was created.
          in: path
          name: id
          required: true
          schema:
            description: The resource, as returned when it was created.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentConfigRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentConfig'
          description: The config as it now is
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Replace an agent config
  /v1/agents/configs/{id}/plugins:
    get:
      description: The app's own logins, then every plugin the config names that has none yet, as not_connected, then every MCP server it names by URL that needs a login and has no user, which the app logs into the same way. An end user's logins, made for user_plugins or a server with user, are never listed.
      operationId: listConfigPlugins
      parameters:
        - description: The resource, as returned when it was created.
          in: path
          name: id
          required: true
          schema:
            description: The resource, as returned when it was created.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PluginConnection'
                type: array
          description: The config's connections
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: The plugin logins this agent holds
  /v1/agents/configs/{id}/plugins/{plugin_id}:
    delete:
      description: 'Server-side only: it needs a server-side token, so it cannot be reached from an end user''s device.'
      operationId: disconnectPlugin
      parameters:
        - description: The resource, as returned when it was created.
          in: path
          name: id
          required: true
          schema:
            description: The resource, as returned when it was created.
            type: string
        - description: A built-in catalog id such as slack or calendly, or the name of an MCP server the config names by URL that the app logs into.
          in: path
          name: plugin_id
          required: true
          schema:
            description: A built-in catalog id such as slack or calendly, or the name of an MCP server the config names by URL that the app logs into.
            type: string
      responses:
        "204":
          description: The login is gone
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Drop a plugin login
  /v1/agents/configs/{id}/plugins/{plugin_id}/authorize:
    post:
      description: |-
        Discovers the MCP server's OAuth endpoints and returns the URL the browser should open. Shopify needs an instance url, because it has no single global host.
        Server-side only: it needs a server-side token, so it cannot be reached from an end user's device.
      operationId: authorizePlugin
      parameters:
        - description: The resource, as returned when it was created.
          in: path
          name: id
          required: true
          schema:
            description: The resource, as returned when it was created.
            type: string
        - description: A built-in catalog id such as slack or calendly, or the name of an MCP server the config names by URL that the app logs into.
          in: path
          name: plugin_id
          required: true
          schema:
            description: A built-in catalog id such as slack or calendly, or the name of an MCP server the config names by URL that the app logs into.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizePluginRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginAuthorization'
          description: The URL the browser should open
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Start a plugin login
  /v1/agents/configs/{id}/plugins/{plugin_id}/client:
    delete:
      description: 'Server-side only: it needs a server-side token, so it cannot be reached from an end user''s device.'
      operationId: deletePluginClient
      parameters:
        - description: The resource, as returned when it was created.
          in: path
          name: id
          required: true
          schema:
            description: The resource, as returned when it was created.
            type: string
        - description: A built-in catalog id such as google_calendar.
          in: path
          name: plugin_id
          required: true
          schema:
            description: A built-in catalog id such as google_calendar.
            type: string
      responses:
        "204":
          description: The client is gone
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Drop the OAuth client an agent logs a plugin in with
    put:
      description: |-
        The OAuth app the app registered with the provider, such as a Google Cloud client, used for this config's logins to the plugin: the app's own and every end user's. A plugin with client_required has no other way in. The secret is sealed and never returned. Replaces the client set before; a login made with that one keeps working until it has to be renewed.
        Server-side only: it needs a server-side token, so it cannot be reached from an end user's device.
      operationId: setPluginClient
      parameters:
        - description: The resource, as returned when it was created.
          in: path
          name: id
          required: true
          schema:
            description: The resource, as returned when it was created.
            type: string
        - description: A built-in catalog id such as google_calendar.
          in: path
          name: plugin_id
          required: true
          schema:
            description: A built-in catalog id such as google_calendar.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPluginClientRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginClient'
          description: The client as stored, without its secret
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Set the OAuth client an agent logs a plugin in with
  /v1/agents/connections:
    get:
      description: |-
        One owner's connections, newest first: the app's own, or those of the user the backend acts for.

        Server-side only: it needs a server-side token, so it cannot be reached from an end user's device.
      operationId: listConnections
      parameters:
        - description: app lists the app's own; user lists those of the user the backend acts for, named by X-Stream-User-Id.
          explode: false
          in: query
          name: owner_type
          required: true
          schema:
            $ref: '#/components/schemas/ConnectionOwnerType'
            description: app lists the app's own; user lists those of the user the backend acts for, named by X-Stream-User-Id.
        - description: Keeps one connector's.
          explode: false
          in: query
          name: connector_id
          schema:
            description: Keeps one connector's.
            type: string
        - description: Up to 200. Omitted is 25.
          explode: false
          in: query
          name: limit
          schema:
            description: Up to 200. Omitted is 25.
            format: int64
            maximum: 200
            minimum: 1
            type: integer
        - description: The next_cursor of the previous page. Omitted is the first page.
          explode: false
          in: query
          name: cursor
          schema:
            description: The next_cursor of the previous page. Omitted is the first page.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionPage'
          description: A page of connections
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: List connections
    post:
      description: |-
        A pending connection to one account at a connector, made from the connector's newest revision. An app-owned connection is the app's, for any of its agents. A user-owned one is the user's the backend acts for: owner.user_id must be the user X-Stream-User-Id names. Credentials are added afterwards. A deployment with connectors off refuses every create.

        Server-side only: it needs a server-side token, so it cannot be reached from an end user's device.
      operationId: createConnection
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
          description: The pending connection
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Create a connection
  /v1/agents/connections/{id}:
    delete:
      description: |-
        Disconnects the account and drops its credentials at once, so nothing can use it from here on. The provider is not asked to revoke what it issued. A connection an agent config binds as its fixed connection is refused with a 409 unless force is set. Who may delete it is who may read it.

        Server-side only: it needs a server-side token, so it cannot be reached from an end user's device.
      operationId: deleteConnection
      parameters:
        - description: The connection, as returned when it was created.
          in: path
          name: id
          required: true
          schema:
            description: The connection, as returned when it was created.
            type: string
        - description: Delete it even while an agent config binds it as its fixed connection. The binding is left in place, naming a connection that no longer exists.
          explode: false
          in: query
          name: force
          schema:
            description: Delete it even while an agent config binds it as its fixed connection. The binding is left in place, naming a connection that no longer exists.
            type: boolean
      responses:
        "204":
          description: The connection is deleted
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflict
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Delete a connection
    get:
      description: |-
        An app-owned connection, or a user-owned one of the user the backend acts for. Another user's is not found, the same as one that does not exist.

        Server-side only: it needs a server-side token, so it cannot be reached from an end user's device.
      operationId: getConnection
      parameters:
        - description: The connection, as returned when it was created.
          in: path
          name: id
          required: true
          schema:
            description: The connection, as returned when it was created.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
          description: The connection
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Read a connection
  /v1/agents/connections/{id}/authorizations:
    post:
      description: |-
        Starts the provider's consent for a connection: a consent for a pending one, a reconnect for one connected before. Open launch_url in a popup from the dashboard and post it handoff_token when it says it is ready; the browser then goes to the provider and comes back to the router, which stores the grant and sends the browser to the dashboard with connection_id and status (connected, denied, failed or account_mismatch). A reconnect that comes back with another provider account keeps the old grant. Who may start it is who may read the connection. Needs ROUTER_PUBLIC_URL, where the provider sends the browser back to.

        Server-side only: it needs a server-side token, so it cannot be reached from an end user's device.
      operationId: createAuthorization
      parameters:
        - description: The connection, as returned when it was created.
          in: path
          name: id
          required: true
          schema:
            description: The connection, as returned when it was created.
            type: string
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Authorization'
          description: The consent is waiting for its browser
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Start a consent
  /v1/agents/connections/{id}/credentials:
    put:
      description: |-
        Stores the credentials a connection's scheme takes, sealed, and connects it: an API key, a bearer token, an OAuth client for client credentials, an OAuth grant the provider already issued, or nothing for a connector that needs none. expected_revision must be the connection's revision as last read; a connection that moved past it is a 409. The values are never shown again. Who may set them is who may read the connection.

        Server-side only: it needs a server-side token, so it cannot be reached from an end user's device.
      operationId: putConnectionCredentials
      parameters:
        - description: The connection, as returned when it was created.
          in: path
          name: id
          required: true
          schema:
            description: The connection, as returned when it was created.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionCredentials'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
          description: The connection, connected
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflict
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Set a connection's credentials
  /v1/agents/connections/{id}/tools:
    get:
      description: |-
        The tools the connection offered when it was last validated, each with the schema digest an agent config's grant pins. Empty until a validate listed them. Who may read them is who may read the connection.

        Server-side only: it needs a server-side token, so it cannot be reached from an end user's device.
      operationId: listConnectionTools
      parameters:
        - description: The connection, as returned when it was created.
          in: path
          name: id
          required: true
          schema:
            description: The connection, as returned when it was created.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionTools'
          description: The connection's tools
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: List a connection's tools
  /v1/agents/connections/{id}/validate:
    post:
      description: |-
        Gets the connection's credential, renewing it when it must, and asks the provider for its tools, which GET .../tools then shows. A connection that needs a reconnect says so without the provider being asked. Who may validate it is who may read it.

        Server-side only: it needs a server-side token, so it cannot be reached from an end user's device.
      operationId: validateConnection
      parameters:
        - description: The connection, as returned when it was created.
          in: path
          name: id
          required: true
          schema:
            description: The connection, as returned when it was created.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionValidation'
          description: What the validate found
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Validate a connection
  /v1/agents/connectors:
    get:
      description: |-
        The built-ins first, then the app's own, each by id and at its newest revision. `q` keeps the ones whose id, name, category or description holds it.

        Server-side only: it needs a server-side token, so it cannot be reached from an end user's device.
      operationId: listConnectors
      parameters:
        - description: Keeps the connectors whose id, name, category or description holds this, ignoring case.
          explode: false
          in: query
          name: q
          schema:
            description: Keeps the connectors whose id, name, category or description holds this, ignoring case.
            maxLength: 120
            type: string
        - description: Up to 200. Omitted is 25.
          explode: false
          in: query
          name: limit
          schema:
            description: Up to 200. Omitted is 25.
            format: int64
            maximum: 200
            minimum: 1
            type: integer
        - description: The next_cursor of the previous page. Omitted is the first page.
          explode: false
          in: query
          name: cursor
          schema:
            description: The next_cursor of the previous page. Omitted is the first page.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorPage'
          description: A page of connectors
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: List or search connectors
    post:
      description: |-
        Stores a custom MCP server as one of the app's connectors. Sending an id the app already has stores its next revision, which connections pick up when they reconnect; sending the same definition again changes nothing. A built-in cannot be changed this way.

        Server-side only: it needs a server-side token, so it cannot be reached from an end user's device.
      operationId: createConnector
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomConnectorRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connector'
          description: The connector as stored
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Add a custom MCP connector
  /v1/agents/connectors/{id}:
    get:
      description: |-
        A built-in or one of the app's own, at its newest revision. Another app's custom connector is not found.

        Server-side only: it needs a server-side token, so it cannot be reached from an end user's device.
      operationId: getConnector
      parameters:
        - description: The connector, such as slack or custom_crm.
          in: path
          name: id
          required: true
          schema:
            description: The connector, such as slack or custom_crm.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connector'
          description: The connector
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Read a connector
  /v1/agents/connectors/{id}/oauth-client:
    delete:
      description: |-
        Drops the client and its secret. Connections consented with it stop refreshing and need a reconnect with another client.

        Server-side only: it needs a server-side token, so it cannot be reached from an end user's device.
      operationId: deleteConnectorOAuthClient
      parameters:
        - description: The connector, such as github or custom_crm.
          in: path
          name: id
          required: true
          schema:
            description: The connector, such as github or custom_crm.
            type: string
      responses:
        "204":
          description: The client is removed
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Remove the app's own OAuth client for a connector
    put:
      description: |-
        Stores the OAuth client the app registered with the connector's provider, for every consent and refresh of the app's connections to it. Putting it again replaces it: a rotated secret is used from the next refresh of each connection. A new client_id makes the connections consented with the old one need a reconnect, since a refresh token is bound to the client it was issued to (RFC 6749 section 6). A connector whose client.registration does not list customer refuses it. The secret is sealed and never returned.

        Server-side only: it needs a server-side token, so it cannot be reached from an end user's device.
      operationId: setConnectorOAuthClient
      parameters:
        - description: The connector, such as github or custom_crm.
          in: path
          name: id
          required: true
          schema:
            description: The connector, such as github or custom_crm.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectorOAuthClientRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorOAuthClient'
          description: The client was replaced
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorOAuthClient'
          description: The client was stored
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflict
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Set the app's own OAuth client for a connector
  /v1/agents/connectors/events/{connector_id}:
    post:
      description: 'Where a provider delivers the events of a built-in connector: Slack''s tokens_revoked and app_uninstalled to the operator''s Slack app''s Request URL, for one. Unauthenticated because the provider is not a customer: each request is checked by the verifier the connector''s manifest names (channel.verifier) against the operator''s secret, and an unsigned or stale one changes nothing. A URL verification is answered with its challenge as text/plain. A signal that a grant ended moves every connection of that account to needs_reauthorization; a message goes to the channel bridge. The body is at most 256 KiB. No SDK wraps it: only a provider calls it.'
      operationId: receiveConnectorEvent
      parameters:
        - description: A built-in connector id such as slack.
          in: path
          name: connector_id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            text/plain:
              schema:
                type: string
          description: The event is taken, or a URL verification's challenge, echoed
        "401":
          description: The request is not signed by the provider, or its signed timestamp is more than the manifest's max_age from now
        "404":
          description: This connector takes no events here
        "413":
          description: The event is over 256 KiB
        "500":
          $ref: '#/components/responses/InternalError'
      security: []
      summary: Receive a connector's provider event
  /v1/agents/connectors/oauth/callback:
    get:
      description: 'The redirect URI a provider sends the browser back to. The state must name an open consent, the browser must hold the cookie the handoff set, and the consent is used once. The router then exchanges the code and sends the browser to the dashboard with connection_id and status: connected, denied, failed, or account_mismatch when a reconnect came back with another provider account and the old grant was kept. Unauthenticated because the browser arrives from the provider.'
      operationId: finishConnectorConsent
      parameters:
        - in: query
          name: state
          schema:
            type: string
        - in: query
          name: code
          schema:
            type: string
        - in: query
          name: iss
          schema:
            type: string
        - in: query
          name: error
          schema:
            type: string
      responses:
        "302":
          description: The browser is sent back to the dashboard
        "400":
          $ref: '#/components/responses/BadRequest'
        "403":
          description: The consent was started in another browser
        "500":
          $ref: '#/components/responses/InternalError'
      security: []
      summary: Finish a consent
  /v1/agents/connectors/oauth/launch/{id}:
    get:
      description: The launch_url of an authorization, opened in a popup by the dashboard. The page waits for the dashboard's origin to post the handoff token, trades it for the provider's authorize URL and goes there. Unauthenticated because a browser opens it; the page names no attempt and is the same for every one.
      operationId: getConnectorLaunchPage
      parameters:
        - description: The authorization.
          in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            text/html:
              schema:
                type: string
          description: The launch page
        "500":
          $ref: '#/components/responses/InternalError'
      security: []
      summary: The page a consent starts on
    post:
      description: 'What the launch page posts: `{"handoff_token": ...}`, from the router''s own origin only. It sets an HttpOnly cookie the callback requires, so the consent can finish only in this browser, and answers `{"authorization_url": ...}`, the provider''s authorize URL. A handoff token is traded once: a second handoff for the same consent is a 400. Unauthenticated because a browser sends it; the handoff token is the secret.'
      operationId: handOffConnectorLaunch
      parameters:
        - description: The authorization.
          in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The cookie is set and the authorize URL returned
        "400":
          $ref: '#/components/responses/BadRequest'
        "403":
          description: Not from the launch page's origin, or not this consent's handoff token
        "500":
          $ref: '#/components/responses/InternalError'
      security: []
      summary: Bind a consent to this browser
  /v1/agents/conversations/{cid}/commands/{command_id}:
    get:
      description: |-
        Reads one command's receipt from the conversation's own durable record. It opens nothing and starts nothing, so a client whose stop found no session left to reach reconciles that command here rather than reopening a session to ask about it.
        A command still running is reported as it stands; the session holding it is where it can be stopped.
      operationId: getConversationCommand
      parameters:
        - in: path
          name: cid
          required: true
          schema:
            type: string
        - description: The client's own command id, as sent when the command was submitted.
          in: path
          name: command_id
          required: true
          schema:
            description: The client's own command id, as sent when the command was submitted.
            type: string
        - explode: false
          in: query
          name: agent_id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandReceipt'
          description: The command's current receipt
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: What a command in this conversation ended as
  /v1/agents/conversations/{cid}/messages:
    get:
      operationId: getConversationMessages
      parameters:
        - in: path
          name: cid
          required: true
          schema:
            type: string
        - explode: false
          in: query
          name: agent_id
          required: true
          schema:
            type: string
        - explode: false
          in: query
          name: before
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: Conversation messages, oldest first, with an older-page cursor
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Read a persistent text conversation
  /v1/agents/guests:
    post:
      description: |-
        Returns a user id and a Stream token with role guest, which is what the chat and video SDKs connect with. From the router's point of view a guest is an ordinary end user whose name is worth less: their sessions are their own and nobody else's, but a guest id is not evidence of who anybody is, so a guest cannot be handed another guest's conversations by naming their id.
        Open to a page on purpose. A guest that a backend had to mint is a guest every anonymous visitor costs a round trip through the customer's own servers, which is exactly the integration this is meant to remove. An app that has turned guests off refuses it.
      operationId: createGuestUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestUserRequest'
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestUser'
          description: The guest and a token for them
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: This app does not admit guests
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Mint a guest so somebody can talk to an agent before signing up
      x-client-accessible: true
  /v1/agents/guests/claim:
    post:
      description: |-
        For somebody who talked to an agent and then signed up. Their sessions are rewritten to the real user and the guest is marked claimed, in one transaction: a guest marked claimed whose sessions still say the guest owns them is a person who signed up and lost their history, and sessions moved without the guest being marked is a guest that can be claimed again, by somebody else.
        Server-side only, and the one operation here that most needs to be. Only the customer's own backend knows that a given guest is a given account -- it is the thing that just authenticated them. A page allowed to ask this could claim anybody's conversations by guessing a guest id, which is the whole attack.
        A guest already claimed is refused rather than moved again.
      operationId: claimGuestUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimGuestRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimGuestResult'
          description: The conversations were moved
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: That guest was already claimed
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Move a guest's conversations onto the account they turned out to be
  /v1/agents/knowledge:
    post:
      description: |-
        The writing half of the lookup a config's knowledge_namespace gives an agent. Each document is cut into passages here rather than by the caller, so a file read off disk by the command and one posted by an SDK are cut the same way and can replace each other.
        Passages are keyed by the source and the position they came from, so posting a document again after editing it replaces that document's passages rather than leaving two versions of them to be found. A namespace is never shared between agents, and the caller names it.
        Server-side only: it needs a server-side token, so it cannot be reached from an end user's device.
      operationId: ingestKnowledge
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestKnowledgeRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestedKnowledge'
          description: The passages were written
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Fill a knowledge base with what the business wrote down
  /v1/agents/knowledge/documents:
    get:
      description: What was posted to /v1/agents/knowledge or synced from an agent directory's knowledge folder, one entry per source. Pages are listed at /v1/agents/knowledge/urls.
      operationId: listKnowledgeDocuments
      parameters:
        - description: One knowledge base. Omit to list every document the customer has.
          explode: false
          in: query
          name: namespace
          schema:
            description: One knowledge base. Omit to list every document the customer has.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/IndexedKnowledgeDocument'
                type: array
          description: The customer's documents, most recently written first
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: The documents a knowledge base was filled with
  /v1/agents/knowledge/documents/{id}:
    delete:
      description: |-
        The passages it was cut into are removed too, so the agent stops answering out of it.
        Server-side only: it needs a server-side token, so it cannot be reached from an end user's device.
      operationId: deleteKnowledgeDocument
      parameters:
        - description: The resource, as returned when it was created.
          in: path
          name: id
          required: true
          schema:
            description: The resource, as returned when it was created.
            type: string
      responses:
        "204":
          description: The document and its passages are gone
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Take a document out of a knowledge base
    get:
      description: 'What to start from when editing it: post it again under the same source to replace it. A document written before its text was kept comes back without one.'
      operationId: getKnowledgeDocument
      parameters:
        - description: The resource, as returned when it was created.
          in: path
          name: id
          required: true
          schema:
            description: The resource, as returned when it was created.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexedKnowledgeDocument'
          description: The document
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: One document, with the text it was posted as
  /v1/agents/knowledge/documents/{id}/passages:
    get:
      description: |-
        The passages as the agent finds them, which is what shows what a lookup can answer out of this document.
        Server-side only: it needs a server-side token, so it cannot be reached from an end user's device.
      operationId: listKnowledgeDocumentPassages
      parameters:
        - description: The resource, as returned when it was created.
          in: path
          name: id
          required: true
          schema:
            description: The resource, as returned when it was created.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/KnowledgePassage'
                type: array
          description: The passages
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: What a document was cut into, in order
  /v1/agents/knowledge/urls:
    get:
      operationId: listKnowledgeUrls
      parameters:
        - description: One knowledge base. Omit to list every page the customer has.
          explode: false
          in: query
          name: namespace
          schema:
            description: One knowledge base. Omit to list every page the customer has.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/KnowledgeUrl'
                type: array
          description: The customer's pages, newest first
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: The pages a knowledge base is kept filled from
    post:
      description: |-
        Posting a document is a thing that happens once; a url is a subscription, because the page behind it changes and nobody re-posts it. The page is fetched, turned into markdown, cut into passages the same way a document is, and written under the url so a later read replaces it rather than adding a second copy.
        The fetch is queued rather than done before this answers, since a live crawl takes seconds: the page comes back pending, and indexed or failed once it has been read. A read that fails is tried again a few times first. A page that could not be read is still stored, in the failed state with the reason on it, rather than refused and forgotten.
        Adding a page a knowledge base already has is a re-read of it rather than a second copy: the subscription is the url, so a declaration of what an agent reads can be applied again without being diffed first.
        Server-side only: it needs a server-side token, so it cannot be reached from an end user's device.
      operationId: addKnowledgeUrl
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgeUrlRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeUrl'
          description: The page was stored and its read queued
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Keep a knowledge base filled from a page
  /v1/agents/knowledge/urls/{id}:
    delete:
      description: |-
        The passages the page wrote are removed too. Leaving them would have the agent go on answering out of a page nobody subscribes to any more, which is worse than it saying it does not know.
        Server-side only: it needs a server-side token, so it cannot be reached from an end user's device.
      operationId: deleteKnowledgeUrl
      parameters:
        - description: The resource, as returned when it was created.
          in: path
          name: id
          required: true
          schema:
            description: The resource, as returned when it was created.
            type: string
      responses:
        "204":
          description: The page and its passages are gone
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Stop filling a knowledge base from a page
    get:
      operationId: getKnowledgeUrl
      parameters:
