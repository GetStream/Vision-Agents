                $ref: '#/components/schemas/ErrorResponse'
          description: Conflict
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Update a 10DLC use case
  /v1/phone/use-cases/{id}/reviews:
    get:
      description: |-
        Every move the use case made and who made it, oldest first.

        Server-side only.
      operationId: listUseCaseReviews
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - description: Up to 200. Omitted is 50.
          explode: false
          in: query
          name: limit
          schema:
            description: Up to 200. Omitted is 50.
            format: int64
            maximum: 200
            minimum: 1
            type: integer
        - description: The next_cursor of the previous page. Omitted is the first page.
          explode: false
          in: query
          name: cursor
          schema:
            description: The next_cursor of the previous page. Omitted is the first page.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewPage'
          description: A page of moves
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: List a use case's review history
  /v1/phone/use-cases/{id}/submit:
    post:
      description: |-
        Sends a use case to Stream's review, once it and the business profile have everything the registry asks for; a 400 says what is missing. Stream approving it registers it with the vendor.

        Server-side only.
      operationId: submitUseCase
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UseCase'
          description: The submitted use case
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflict
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Submit a 10DLC use case for review
  /v1/phone/vendors:
    get:
      description: Every vendor this service knows about. A vendor that is declared but not implemented is listed rather than hidden, so what is missing is visible before a number is bought.
      operationId: listPhoneVendors
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PhoneVendor'
                type: array
          description: The declared vendors
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: List the telephony vendors and whether they can be used
  /v1/policies/app:
    get:
      description: 'What the app itself decided. Its organization''s policy applies as well, as a floor the app can tighten and cannot loosen: both budgets are enforced, the stricter data policy wins, prompt injection is screened if either turns it on, only a model both allow may be routed to, and the organization''s tags win over the app''s.'
      operationId: getAppPolicy
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
          description: The app's policy, with what its budget has spent so far
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: The calling app's policy
    put:
      description: |-
        A field left out is no opinion, so the organization's setting shows through.

        Server-side only: it needs a server-side token, so it cannot be reached from an end user's device.
      operationId: updateAppPolicy
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Policy'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
          description: The policy was stored
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Replace the calling app's policy
  /v1/policies/organization:
    get:
      description: Applies to every app the router has seen the organization name. A request that names no organization is a 400.
      operationId: getOrganizationPolicy
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
          description: The organization's policy, with what its budget has spent so far
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: The calling app's organization's policy
    put:
      description: 'Server-side only: it needs a server-side token, so it cannot be reached from an end user''s device.'
      operationId: updateOrganizationPolicy
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Policy'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
          description: The policy was stored
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Replace the calling app's organization's policy
  /v1/router/configs:
    get:
      description: 'A router config is what an agent config is for a session, for a caller that routes one modality at a time: the target, the language and every per-modality option, decided once and named. It is separate from an agent config because it configures transcribing, speaking, answering and searching on their own, with no conversation behind them.'
      operationId: listRouterConfigs
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/RouterConfig'
                type: array
          description: The customer's router configs, newest first
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: The router configs the calling customer holds
    post:
      description: |-
        A modality block that names no target falls back to what a session falls back to, so a config only has to say what it wants changed.
        Server-side only: it needs a server-side token, so it cannot be reached from an end user's device.
      operationId: createRouterConfig
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouterConfigRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouterConfig'
          description: The config was stored
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Store a named set of per-modality routing options
  /v1/router/configs/{id}:
    delete:
      description: |-
        The requests that ran under it still name it, so the config stops being usable rather than stops having existed.
        Server-side only: it needs a server-side token, so it cannot be reached from an end user's device.
      operationId: deleteRouterConfig
      parameters:
        - description: The resource, as returned when it was created.
          in: path
          name: id
          required: true
          schema:
            description: The resource, as returned when it was created.
            type: string
      responses:
        "204":
          description: The config is gone
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Delete a router config
    get:
      operationId: getRouterConfig
      parameters:
        - description: The resource, as returned when it was created.
          in: path
          name: id
          required: true
          schema:
            description: The resource, as returned when it was created.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouterConfig'
          description: The config
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: One router config
    put:
      description: |-
        Every field is written, so the body is what the config now is rather than what changed about it. Sockets already open keep the options they were started with.
        Server-side only: it needs a server-side token, so it cannot be reached from an end user's device.
      operationId: updateRouterConfig
      parameters:
        - description: The resource, as returned when it was created.
          in: path
          name: id
          required: true
          schema:
            description: The resource, as returned when it was created.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouterConfigRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouterConfig'
          description: The config as it now is
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Replace a router config
  /v1/search:
    post:
      description: 'The fourth routed modality, reachable on its own rather than only as a tool an agent reaches for. One question, one answer: routed, failed over and billed like the rest, and with no socket because nothing arrives in pieces.'
      operationId: search
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchAnswer'
          description: What the provider found
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Answer a question out of what is true now
      x-client-accessible: true
  /v1/settings/app:
    get:
      description: |-
        Which Stream app the router writes the calling app's conversations and calls into, and whether that app holds the agent channel and call types. Stream is asked at most once a minute.

        Server-side only: it needs a server-side token, so it cannot be reached from an end user's device.
      operationId: getAppSettings
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppSettings'
          description: The app's settings
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
      summary: What the router does for the calling app
  /v1/settings/app/stream/check:
    post:
      description: |-
        Asks Stream again about the registered app: whether it stands, whether it holds the agent channel and call types, and which numbers still have their lines in another app. Needs stream.tenancy=app.

        Server-side only.
      operationId: checkAppStreamCredentials
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamCheck'
          description: What the check found
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflict
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
      summary: Check the calling app's own Stream app
  /v1/settings/app/stream/credentials:
    put:
      description: |-
        The keys the router acts in the calling app's own Stream app with, from now on, for every conversation, transcript, call and phone line. Each key is checked with Stream: it has to belong to the calling app, and the app may be neither suspended nor taking requests without checking their tokens. Keys left out are dropped, and the sessions acting in the app end. Needs stream.tenancy=app.

        Server-side only: it needs a server-side token, so it cannot be reached from an end user's device. Behind a proxy, the proxy has to declare the caller a server.
      operationId: updateAppStreamCredentials
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StreamCredentials'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppSettings'
          description: The app's settings as they now are
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflict
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
      summary: Register the calling app's own Stream app
  /v1/stats/activity:
    get:
      description: |-
        Sessions opened, responses produced and calls held, counted per bucket, alongside how many distinct people were behind them.
        Distinct users are counted rather than summed, which is why the granularity here is days or months rather than the hours the spend paths take: a month's active users are the people who came back, not the sum of its days, so a month has to be asked for as a month.
      operationId: getActivity
      parameters:
        - explode: false
          in: query
          name: granularity
          schema:
            $ref: '#/components/schemas/ActivityGranularity'
        - description: Start of the window, inclusive.
          explode: false
          in: query
          name: from
          required: true
          schema:
            description: Start of the window, inclusive.
            format: date-time
            type: string
        - description: End of the window, exclusive.
          explode: false
          in: query
          name: to
          required: true
          schema:
            description: End of the window, exclusive.
            format: date-time
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ActivityBucket'
                type: array
          description: One row per bucket, oldest first
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Who used the calling customer's agents, and how much
  /v1/stats/rollup:
    post:
      description: 'Covers every modality and customer in the window. Idempotent: re-running it over the same window recomputes those buckets, so a missed run is fixed by running it again.'
      operationId: runRollup
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RollupRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RollupResult'
          description: The rollup completed
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Aggregate request rows into a rollup table
  /v1/stats/spend:
    get:
      description: |-
        Spend across every modality at once, which is what a bill is. group_by decides what the series are: "modality" for where the money went, or a cost label for what it was spent on.
        Only the biggest values keep a series of their own, because a label such as customer_id has as many values as the customer has customers. The rest are summed into "other", and spend carrying no such label at all into the empty value, so the rows still add up to the total.
        Reads the request rows rather than the rollups, so today's spend is there without a rollup having run.
      operationId: getSpend
      parameters:
        - description: '"modality", or the cost label to group by.'
          in: query
          name: group_by
          schema:
            default: modality
            type: string
        - description: How many values keep a series of their own.
          in: query
          name: limit
          schema:
            default: 6
            maximum: 50
            minimum: 1
            type: integer
        - explode: false
          in: query
          name: granularity
          schema:
            $ref: '#/components/schemas/Granularity'
        - description: Start of the window, inclusive.
          explode: false
          in: query
          name: from
          required: true
          schema:
            description: Start of the window, inclusive.
            format: date-time
            type: string
        - description: End of the window, exclusive.
          explode: false
          in: query
          name: to
          required: true
          schema:
            description: End of the window, exclusive.
            format: date-time
            type: string
        - description: Only count requests carrying every one of these cost labels, each written "key:value". Repeat for several.
          explode: true
          in: query
          name: tag
          schema:
            description: Only count requests carrying every one of these cost labels, each written "key:value". Repeat for several.
            items:
              type: string
            type: array
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SpendBucket'
                type: array
          description: One row per bucket and group, oldest bucket first
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: What the calling customer spent, grouped
  /v1/stats/tags/keys:
    get:
      description: |-
        Cost labels are the customer's own, so nothing here knows in advance whether spend is broken down by product, by environment or by the end customer it was incurred for. This reports the keys in use and what each covers, so a reader can be shown the breakdown that means something rather than a list to guess from.
        A key every request carries with a single value -- environment: production and nothing else -- is context rather than a breakdown, and value_count says so.
      operationId: getTagKeys
      parameters:
        - description: Start of the window, inclusive.
          explode: false
          in: query
          name: from
          required: true
          schema:
            description: Start of the window, inclusive.
            format: date-time
            type: string
        - description: End of the window, exclusive.
          explode: false
          in: query
          name: to
          required: true
          schema:
            description: End of the window, exclusive.
            format: date-time
            type: string
        - description: Only consider requests carrying every one of these cost labels, each written "key:value". Repeat for several.
          explode: true
          in: query
          name: tag
          schema:
            description: Only consider requests carrying every one of these cost labels, each written "key:value". Repeat for several.
            items:
              type: string
            type: array
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TagKeySummary'
                type: array
          description: One row per label key, largest spend first
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Which cost labels the calling customer's spend carries
  /v1/stt/recordings:
    post:
      description: |-
        The non-realtime half of speech-to-text: a whole recording in, a whole transcript out. It is a job rather than a response because an hour of audio takes minutes to transcribe, so this returns immediately with an id to poll, or calls a callback when it is done.
        Routing works as it does everywhere else, except that the candidates are the providers registered as not realtime - the batch APIs, which are cheaper and more accurate than the same vendor's streaming model.
      operationId: transcribeRecording
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TranscriptionRequest'
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transcription'
          description: The job was accepted
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Transcribe a recording, off the live path
  /v1/stt/recordings/{id}:
    get:
      operationId: getTranscription
      parameters:
        - description: The resource, as returned when it was created.
          in: path
          name: id
          required: true
          schema:
            description: The resource, as returned when it was created.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transcription'
          description: The job as it now stands
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: One transcription job, and its transcript once it has one
  /v1/tts/recordings:
    post:
      description: 'The non-realtime half of text-to-speech: a chapter in, a file out. A job for the same reason transcription is - an audiobook is not a conversation, and nothing is waiting to hear the first chunk.'
      operationId: recordSpeech
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpeechRequest'
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Speech'
          description: The job was accepted
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Speak a whole text into one audio file, off the live path
  /v1/tts/recordings/{id}:
    get:
      operationId: getSpeech
      parameters:
        - description: The resource, as returned when it was created.
          in: path
          name: id
          required: true
          schema:
            description: The resource, as returned when it was created.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Speech'
          description: The job as it now stands
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: One speech job, and its audio once it has some
  /v1/turns/stats:
    get:
      description: One row per bucket and agent. A request row measures one provider call; a turn measures what the caller felt, from finishing a sentence to hearing the answer start, with the transcription, model and voice legs kept apart so a slow conversation can be attributed.
      operationId: getTurnStats
      parameters:
        - description: Narrow to one agent. Omit for every agent the customer runs.
          explode: false
          in: query
          name: agent_id
          schema:
            description: Narrow to one agent. Omit for every agent the customer runs.
            type: string
        - explode: false
          in: query
          name: granularity
          schema:
            $ref: '#/components/schemas/Granularity'
        - description: Start of the window, inclusive.
          explode: false
          in: query
          name: from
          required: true
          schema:
            description: Start of the window, inclusive.
            format: date-time
            type: string
        - description: End of the window, exclusive.
          explode: false
          in: query
          name: to
          required: true
          schema:
            description: End of the window, exclusive.
            format: date-time
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TurnStatsBucket'
                type: array
          description: One row per bucket and agent
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Conversational latency for the calling customer
security:
  - CustomerId: []
  - ApiKey: []
    AppToken: []
    AuthType: []
servers:
  - url: http://localhost:8080
