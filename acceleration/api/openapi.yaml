        - provider
      type: object
    ChannelAccount:
      description: 'One line the app answers on: the number people write to and where its provider delivers. The credentials are write-only, so they are never shown here.'
      properties:
        account_id:
          description: The provider's own id for the line, such as WhatsApp's phone number id.
          type: string
        created_at:
          format: date-time
          type: string
        delivering:
          description: True when the provider was pointed at the webhook URL for you, so there is nothing left to paste.
          type: boolean
        id:
          type: string
        kind:
          $ref: '#/components/schemas/ChannelKind'
        number:
          description: The number people write to, in E.164.
          type: string
        updated_at:
          format: date-time
          type: string
        webhook_url:
          description: Where the provider should deliver. Paste it into Meta's or Linq's webhook setup; a Telnyx number is pointed at it for you.
          type: string
      required:
        - id
        - kind
        - number
        - webhook_url
        - delivering
        - created_at
        - updated_at
      type: object
    ChannelIdentity:
      description: How a sender becomes an end user. phone makes each number an end user of its own, phone:+15551234567, so anybody who writes is answered. link answers only a number somebody tied to an end user with a code from POST /v1/agents/channels/links, which is what an agent reading a person's own calendar or orders needs. Omitted is phone.
      enum:
        - phone
        - link
      type: string
    ChannelKind:
      description: A channel a conversation can be carried over.
      enum:
        - whatsapp
        - sms
        - imessage
      type: string
    ChannelLineRequest:
      properties:
        number:
          description: The number people write to, in E.164. It must be a line this app connected.
          maxLength: 20
          minLength: 2
          type: string
      required:
        - number
      type: object
    ChannelLink:
      description: A code that ties the number texting it to one end user, for one agent.
      properties:
        code:
          description: The code to show the end user. They text it to the agent from the number they want answered.
          type: string
        expires_at:
          description: When the code stops working.
          format: date-time
          type: string
      required:
        - code
        - expires_at
      type: object
    ChatToken:
      properties:
        api_key:
          description: The Stream app the channel is in, which the browser SDK connects to.
          type: string
        channel_id:
          description: The channel holding the conversation, which is the agent id.
          type: string
        channel_type:
          description: Always agent, which is the type a conversation is written to.
          type: string
        expires_at:
          format: date-time
          type: string
        token:
          type: string
        user_id:
          type: string
        user_name:
          type: string
      required:
        - api_key
        - channel_id
        - channel_type
        - expires_at
        - token
        - user_id
        - user_name
      type: object
    ChatTokenRequest:
      properties:
        agent_id:
          description: Whose conversation to read. This is the session's agent id, which is what names the channel it is written to.
          type: string
        user_id:
          description: Who the browser reads as. Somebody watching is not the agent, so this defaults to a reader of its own rather than to the agent's user.
          type: string
        user_name:
          description: The name shown against anything they write. Defaults to the user id.
          type: string
      required:
