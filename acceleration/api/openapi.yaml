openapi: 3.0.3
info:
  title: Model Router
  version: 0.2.0
  description: >
    Routes speech-to-text and text-to-speech traffic across providers and reports
    what it cost. Every path is scoped by modality, so the same provider serving
    two modalities is reported on separately. The caller is identified by a
    trusted X-Customer-Id header; real authentication is not part of this version.

servers:
  - url: http://localhost:8080

security:
  - CustomerId: []

paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness and dependency check
      security: []
      responses:
        "200":
          description: The router is serving
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: A dependency is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /v1/{modality}/providers:
    get:
      operationId: listProviders
      summary: List the providers configured for a modality and their live health
      parameters:
        - $ref: "#/components/parameters/Modality"
      responses:
        "200":
          description: The configured providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Provider"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/{modality}/routes/{target}:
    get:
      operationId: resolveTarget
      summary: Resolve a provider name or capability shortcut to a ranked candidate list
      parameters:
        - $ref: "#/components/parameters/Modality"
        - name: target
          in: path
          required: true
          description: A "provider/model" name or a capability shortcut such as en-low-latency.
          schema:
            type: string
          example: en-low-latency
        - name: language
          in: query
          required: false
          description: Language hints that candidates must cover. Repeat for several.
          schema:
            type: array
            items:
              type: string
          example: ["en"]
      responses:
        "200":
          description: Candidates in preference order, best first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Candidate"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/{modality}/stats:
    get:
      operationId: getStats
      summary: Aggregated usage for the calling customer
      parameters:
        - $ref: "#/components/parameters/Modality"
        - name: granularity
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Granularity"
        - name: from
          in: query
          required: true
          description: Start of the window, inclusive.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          description: End of the window, exclusive.
          schema:
            type: string
            format: date-time
        - name: tag
          in: query
          required: false
          description: >
            Only count requests carrying every one of these cost labels, each written
            "key:value". Repeat for several. Filtering reads the request rows rather
            than the rollups, since a rollup bucket no longer knows which labels its
            requests carried.
          schema:
            type: array
            items:
              type: string
          example: ["project:moderation", "environment:dev"]
      responses:
        "200":
          description: One row per bucket, provider and model
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatsBucket"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/{modality}/stats/tags:
    get:
      operationId: getTagStats
      summary: Aggregated usage broken down by the values of one cost label
      description: >
        What drives the spend. Requests are labelled with whatever keys the customer
        chooses, so asking for key=project returns one row per project per bucket.
      parameters:
        - $ref: "#/components/parameters/Modality"
        - name: key
          in: query
          required: true
          description: The cost label to group by.
          schema:
            type: string
          example: project
        - name: granularity
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Granularity"
        - name: from
          in: query
          required: true
          description: Start of the window, inclusive.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          description: End of the window, exclusive.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: One row per bucket and label value
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TagStatsBucket"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/turns/stats:
    get:
      operationId: getTurnStats
      summary: Conversational latency for the calling customer
      description: >
        One row per bucket and agent. A request row measures one provider call; a turn
        measures what the caller felt, from finishing a sentence to hearing the answer
        start, with the transcription, model and voice legs kept apart so a slow
        conversation can be attributed.
      parameters:
        - name: agent_id
          in: query
          required: false
          description: Narrow to one agent. Omit for every agent the customer runs.
          schema:
            type: string
        - name: granularity
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Granularity"
        - name: from
          in: query
          required: true
          description: Start of the window, inclusive.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          description: End of the window, exclusive.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: One row per bucket and agent
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TurnStatsBucket"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/phone/vendors:
    get:
      operationId: listPhoneVendors
      summary: List the telephony vendors and whether they can be used
      description: >
        Every vendor this service knows about. A vendor that is declared but not
        implemented is listed rather than hidden, so what is missing is visible
        before a number is bought.
      responses:
        "200":
          description: The declared vendors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PhoneVendor"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/phone/numbers/available:
    get:
      operationId: searchPhoneNumbers
      summary: Search for numbers to buy, at one vendor or all of them
      description: >
        Naming a vendor searches only that one. Leaving it out asks every vendor
        that has its credentials, at once, and merges what they offer cheapest
        first. Vendors do not agree on how a search can be narrowed, so one whose
        API cannot express a filter is reported in `skipped` rather than asked
        without it, which would answer a search for one place with numbers from
        another.
      parameters:
        - name: vendor
          in: query
          required: false
          description: One vendor to search. Absent searches every usable vendor.
          schema:
            type: string
          example: telnyx
        - name: country
          in: query
          required: true
          description: ISO 3166-1 alpha-2 country code.
          schema:
            type: string
          example: US
        - name: area_code
          in: query
          required: false
          schema:
            type: string
        - name: contains
          in: query
          required: false
          description: Digits the number must contain, anywhere in it.
          schema:
            type: string
        - name: prefix
          in: query
          required: false
          description: >
            Digits the number must start with, matched after the country dial
            code. This differs from `contains` in where the digits have to fall.
          schema:
            type: string
          example: "719"
        - name: locality
          in: query
          required: false
          description: A city, region or rate centre.
          schema:
            type: string
          example: Denver
        - name: administrative_area
          in: query
          required: false
          description: A US state or Canadian province.
          schema:
            type: string
          example: CO
        - name: number_type
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/PhoneNumberType"
        - name: features
          in: query
          required: false
          description: >
            Capabilities every number must have. Repeat the parameter to require
            several. A vendor that cannot filter on one still reports what its
            numbers carry, so these are checked on the results either way.
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/PhoneCapability"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: What the vendors are offering, and which could not answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NumberSearchResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/phone/numbers:
    get:
      operationId: listPhoneNumbers
      summary: The numbers the calling customer holds
      parameters:
        - name: include_released
          in: query
          required: false
          description: >
            Include numbers that have been given back. A released number keeps its
            row, because what it cost while it was held is still part of that
            month's bill.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: The customer's numbers, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PhoneNumber"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: buyPhoneNumber
      summary: Buy a number, which starts its monthly charge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuyNumberRequest"
      responses:
        "201":
          description: The number is bought and recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneNumber"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/phone/numbers/{e164}:
    delete:
      operationId: releasePhoneNumber
      summary: Give a number back, which stops its monthly charge
      parameters:
        - name: e164
          in: path
          required: true
          description: The number in +15551234567 form.
          schema:
            type: string
          example: "+15125551234"
      responses:
        "204":
          description: The number was released
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/phone/numbers/{e164}/attach:
    post:
      operationId: attachPhoneNumber
      summary: Point a number at a Stream call
      description: >
        Creates the SIP inbound trunk and routing rule and tells the vendor to send
        calls there. This is what turns a bought number into one that reaches an
        agent.
      parameters:
        - name: e164
          in: path
          required: true
          schema:
            type: string
          example: "+15125551234"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachNumberRequest"
      responses:
        "200":
          description: The number now reaches a call
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachedNumber"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/phone/calls:
    post:
      operationId: placePhoneCall
      summary: Place an outbound call and bridge it into a Stream call
      description: >
        Stream's SIP is inbound only, so the vendor originates the call and connects
        it to a trunk the agent is already on, rather than Stream dialling out.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaceCallRequest"
      responses:
        "202":
          description: The vendor is placing the call
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlacedCall"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/phone/calls/transfer:
    post:
      operationId: transferPhoneCall
      summary: Bring a human onto a call that is already happening
      description: >
        Stream's SIP is inbound only, so a transfer is a second leg rather than a
        handover: the vendor dials the human and the answered leg is routed into the
        same Stream call, after which the agent can leave. The caller is never moved,
        so nothing is lost if nobody answers.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferCallRequest"
      responses:
        "202":
          description: The vendor is dialling the human
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlacedCall"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/phone/calls/{vendor_call_id}/digits:
    post:
      operationId: pressPhoneDigits
      summary: Press digits on a call placed from here
      description: >
        For getting past a menu on an outbound call. The call is named by the id its
        vendor gave when it was dialled, so only calls placed from this service can be
        pressed at. Not every vendor can do this without ending the call it is on, and
        one that cannot says so.
      parameters:
        - name: vendor_call_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PressDigitsRequest"
      responses:
        "204":
          description: The digits were pressed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/agents/sync:
    post:
      operationId: syncAgent
      summary: Store an agent directory's instructions, skills and knowledge
      description: >
        Reads as "this is what the agent is", from a directory of instructions.md,
        skills/ and knowledge/. The hash is a fingerprint of that directory: a second
        call with the same hash does nothing, so a process that syncs on startup is
        cheap when nothing has changed.

        Models, voice and the rest of a config are left alone. This path only writes
        what a directory can hold.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncAgentRequest"
      responses:
        "200":
          description: The config as stored, or as it already was
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncAgentResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/agents/configs:
    get:
      operationId: listAgentConfigs
      summary: The agent configs the calling customer holds
      responses:
        "200":
          description: The customer's configs, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentConfig"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createAgentConfig
      summary: Store a named configuration a session can be created from
      description: >
        A config holds what a caller would otherwise repeat on every call: the models, the
        voice, the instructions and which skills the subagent may be handed. What is about
        one conversation rather than the agent behind it, the call id above all, stays in
        the create-session request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentConfigRequest"
      responses:
        "201":
          description: The config was stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentConfig"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/agents/configs/{id}:
    get:
      operationId: getAgentConfig
      summary: One agent config
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: The config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentConfig"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateAgentConfig
      summary: Replace an agent config
      description: >
        Every field is written, so the body is what the config now is rather than what
        changed about it. Sessions already running keep the configuration they started
        with.
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentConfigRequest"
      responses:
        "200":
          description: The config as it now is
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentConfig"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteAgentConfig
      summary: Delete an agent config
      description: >
        Calls that already ran under it keep naming it, so the config stops being usable
        rather than stops having existed.
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "204":
          description: The config is gone
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/agents/voices:
    get:
      operationId: listVoices
      summary: The voices the calling customer has brought with them
      responses:
        "200":
          description: The customer's voices, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Voice"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createVoice
      summary: Name a voice of the customer's own
      description: >
        A voice starts empty. Recordings are added to it one at a time, and then it is
        prepared with the text-to-speech providers that should be able to speak in it. An
        agent config names this voice rather than any provider's id for it, so the router
        can still fail over between providers mid-call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoiceRequest"
      responses:
        "201":
          description: The voice was stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Voice"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/agents/voices/{id}:
    get:
      operationId: getVoice
      summary: One voice, with its recordings and what each provider made of them
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: The voice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Voice"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateVoice
      summary: Rename a voice
      description: >
        Only what the voice is called changes. The recordings and the provider bindings are
        what it sounds like, and renaming it does not make it sound different.
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoiceRequest"
      responses:
        "200":
          description: The voice as it now is
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Voice"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteVoice
      summary: Delete a voice
      description: >
        The voice is taken off every provider it was prepared with, so a deleted voice
        stops being billed for as well as stops being usable. Calls that spoke in it keep
        naming it.
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "204":
          description: The voice is gone
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/agents/voices/{id}/samples:
    post:
      operationId: addVoiceSample
      summary: Add a recording to a voice
      description: >
        The audio is stored in the deployment's object bucket and the voice keeps a
        reference to it, so recordings can be re-sent to a provider that is added later
        without asking the customer for them again. Adding a recording does not re-prepare
        the voice.
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoiceSampleRequest"
      responses:
        "201":
          description: The voice with the recording added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Voice"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/agents/voices/{id}/prepare:
    post:
      operationId: prepareVoice
      summary: Teach the text-to-speech providers this voice
      description: >
        Each provider is sent the recordings and hands back an id of its own, which is
        remembered so a session can ask for this voice by name. Providers are prepared
        independently: one refusing the recordings leaves the others usable, and the
        binding says why it refused.
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrepareVoiceRequest"
      responses:
        "200":
          description: The voice with a binding per provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Voice"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/agents/skills:
    get:
      operationId: listSkills
      summary: The skills the calling customer has defined
      responses:
        "200":
          description: The customer's skills, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Skill"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createSkill
      summary: Define a kind of work worth handing to the slower model
      description: >
        Skills live apart from the configs that use them so several configs can share one,
        and so editing what a skill means changes it everywhere at once. The built-in
        think, recall and explain need no row: a config may name them without defining
        them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillRequest"
      responses:
        "201":
          description: The skill was stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Skill"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/agents/skills/{id}:
    get:
      operationId: getSkill
      summary: One skill
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: The skill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Skill"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateSkill
      summary: Replace a skill
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillRequest"
      responses:
        "200":
          description: The skill as it now is
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Skill"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteSkill
      summary: Delete a skill
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "204":
          description: The skill is gone
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/agents/knowledge:
    post:
      operationId: ingestKnowledge
      summary: Fill a knowledge base with what the business wrote down
      description: >
        The writing half of the lookup a config's knowledge_namespace gives an agent. Each
        document is cut into passages here rather than by the caller, so a file read off
        disk by the command and one posted by an SDK are cut the same way and can replace
        each other.

        Passages are keyed by the source and the position they came from, so posting a
        document again after editing it replaces that document's passages rather than
        leaving two versions of them to be found. A namespace is never shared between
        agents, and the caller names it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestKnowledgeRequest"
      responses:
        "200":
          description: The passages were written
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestedKnowledge"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/agents/campaigns:
    get:
      operationId: listCampaigns
      summary: The campaigns the calling customer has
      responses:
        "200":
          description: The customer's campaigns, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Campaign"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createCampaign
      summary: Define a list of people to ring
      description: >
        A campaign is created stopped. Add the people to ring, then start it: concurrency
        is how many of these calls may be happening at once, and every call is a
        conversation this service is running.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignRequest"
      responses:
        "201":
          description: The campaign was stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/agents/campaigns/{id}:
    get:
      operationId: getCampaign
      summary: One campaign
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: The campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/agents/campaigns/{id}/contacts:
    get:
      operationId: listCampaignContacts
      summary: Who a campaign is ringing, and how far it has got
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: The contacts, in the order they are rung
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contact"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: addCampaignContacts
      summary: Add people to ring
      description: >
        Contacts are added rather than replaced, so a campaign can be topped up while it
        is running. Each may carry instructions of their own, which the agent is told
        along with whatever its config already says.
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactsRequest"
      responses:
        "201":
          description: The contacts, in the order they are rung
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contact"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/agents/campaigns/{id}/start:
    post:
      operationId: startCampaign
      summary: Start ringing
      description: >
        Returns once the campaign is running rather than once it is over. A campaign that
        was paused carries on from whoever is left.
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "202":
          description: The campaign is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/agents/campaigns/{id}/pause:
    post:
      operationId: pauseCampaign
      summary: Stop ringing anybody new
      description: >
        The calls already happening are left alone: a campaign is paused to stop ringing
        people, not to hang up on the ones who answered.
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: The campaign is paused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/agents/calls:
    get:
      operationId: listCalls
      summary: The calls the calling customer has run
      description: >
        A session lives in memory and is gone when the process is, so a call is recorded
        as it starts and again as it ends. This is what answers what happened yesterday,
        and what is happening now after a restart.
      parameters:
        - name: agent_id
          in: query
          required: false
          description: Narrow to one agent.
          schema:
            type: string
        - name: campaign_id
          in: query
          required: false
          description: Narrow to the calls one campaign placed.
          schema:
            type: string
        - name: running
          in: query
          required: false
          description: Only calls that have not ended.
          schema:
            type: boolean
            default: false
        - name: from
          in: query
          required: false
          description: Only calls that started at or after this, inclusive.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Only calls that started before this, exclusive.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: The customer's calls, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Call"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/agents/calls/{id}:
    get:
      operationId: getCall
      summary: One call, with whatever was made of it afterwards
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: The call
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Call"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/agents/calls/{id}/transcript:
    get:
      operationId: getCallTranscript
      summary: What was said on a call
      description: >
        Read back from the chat channel the conversation was written to as it happened,
        rather than copied into a second place that could disagree with it.
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: The conversation, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TranscriptMessage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/agents/calls/{id}/timeline:
    get:
      operationId: getCallTimeline
      summary: The call as it unfolded, said and measured together
      description: >
        Each exchange with what was said in it and what it cost the caller in waiting:
        how long the answer took to start, how much the agent spoke, and whether it was
        talked over.
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: The exchanges, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimelineEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/agents/calls/{id}/events:
    get:
      operationId: getCallEvents
      summary: What the conversation decided, and why
      description: >
        A timeline says what a call cost the caller in waiting. This says why the call went
        the way it did: why the agent waited rather than answering, why it read something
        as not meant for it, why it stopped mid-sentence. Read in order they are the
        reasoning behind the conversation, which is the only thing that explains a call
        that surprised somebody. A call still running reports the same decisions live on
        the session socket.
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - name: limit
          in: query
          required: false
          description: How many to return, oldest first.
          schema:
            type: integer
            default: 1000
      responses:
        "200":
          description: The judgements, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CallEvent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/agents/calls/{id}/token:
    post:
      operationId: createCallToken
      summary: What a browser needs to join this call
      description: >
        Mints a Stream token so a person can join the call from a browser and talk to the
        agent, and says which call to join with it. The secret stays here: the browser is
        handed a token that expires, never the key that signs one.
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallTokenRequest"
      responses:
        "200":
          description: The credentials, and the call they are for
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallToken"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/agents/sessions:
    get:
      operationId: listSessions
      summary: The sessions the calling customer is running
      responses:
        "200":
          description: The customer's sessions, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createSession
      summary: Join a call as a voice agent
      description: >
        The whole conversation runs here: the agent joins the call, transcribes what it
        hears, answers it and speaks back, all through the routers. The caller keeps the
        session id and watches the conversation over the events socket.

        It returns once the agent is in the call, so a session that comes back is one that
        is already listening. Tools declared here are the caller's own: the model asks for
        them over the events socket and waits for the caller to answer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: The agent is in the call
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/agents/sessions/{id}:
    get:
      operationId: getSession
      summary: One session
      parameters:
        - $ref: "#/components/parameters/SessionID"
      responses:
        "200":
          description: The session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: closeSession
      summary: Leave the call and end the session
      parameters:
        - $ref: "#/components/parameters/SessionID"
      responses:
        "204":
          description: The agent has left
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/agents/sessions/{id}/say:
    post:
      operationId: saySession
      summary: Speak a piece of text without going through the model
      description: >
        For when the caller already knows what should be said, such as a greeting. A model
        would only add latency and cost to words that were never in question.
      parameters:
        - $ref: "#/components/parameters/SessionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SayRequest"
      responses:
        "204":
          description: The text is being spoken
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/agents/sessions/{id}/respond:
    post:
      operationId: respondSession
      summary: Answer a piece of text through the model, as though it had been said
      parameters:
        - $ref: "#/components/parameters/SessionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SayRequest"
      responses:
        "204":
          description: The model is answering
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/agents/sessions/{id}/interrupt:
    post:
      operationId: interruptSession
      summary: Abandon the reply being spoken
      description: >
        What a caller outside the call has instead of a voice. A murmur is not interrupted,
        because it was meant to overlap with whoever is talking.
      parameters:
        - $ref: "#/components/parameters/SessionID"
      responses:
        "204":
          description: The reply was abandoned, if there was one
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/agents/sessions/{id}/instructions:
    put:
      operationId: setSessionInstructions
      summary: Change what the agent is told to be
      description: >
        Applies from the next turn. The reply being spoken keeps the prompt it started
        with, because rewriting it mid-sentence would have the agent change character in
        the middle of a thought.
      parameters:
        - $ref: "#/components/parameters/SessionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstructionsRequest"
      responses:
        "204":
          description: The next turn will use them
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/agents/sessions/{id}/events:
    get:
      operationId: watchSession
      summary: Watch the conversation and answer the model's tool calls
      description: >
        A WebSocket, which OpenAPI cannot describe past the upgrade. Frames are JSON
        objects carrying a `type` and the fields of that event.

        The server sends what the conversation did: `joined`, `heard`, `responding`,
        `response_delta`, `responded`, `spoke`, `turn`, `decision`, `delegated`,
        `task_settled`, `task_cancelled`, `tool_call`, `tool_ran`, `transferred`,
        `pressed`, `looked_up`, `backchannel`, `interrupted`, `overlap_decided`,
        `conversation_compacted`, `error` and `left`.

        A `decision` frame is one judgement the conversation made, carrying the same
        fields as a CallEvent. Together they are why the call went the way it did, and
        they are also written down, so a finished call replays them from
        `/v1/agents/calls/{id}/events`.

        Two frames are only sent when asked for, because they are far more frequent than
        the rest and most consumers want neither. `interim=true` adds `hearing`, which is
        a transcript revision as it arrives rather than a settled turn. `decisions=false`
        drops `decision`.

        The client sends `tool_result` to answer a `tool_call`, and `say`, `respond`,
        `interrupt`, `instructions` or `close` to act on the session. A `tool_call` is the
        only frame that must be answered: everything else is a report.
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - name: interim
          in: query
          required: false
          description: Also send `hearing` frames, which are the words as they are revised.
          schema:
            type: boolean
            default: false
        - name: decisions
          in: query
          required: false
          description: Send `decision` frames.
          schema:
            type: boolean
            default: true
      responses:
        "101":
          description: The socket is open
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/{modality}/stream:
    get:
      operationId: streamModality
      summary: Route one modality over a socket, for a pipeline running elsewhere
      description: >
        A WebSocket, which OpenAPI cannot describe past the upgrade. This is the routing
        the agent does, offered a piece at a time: a caller running its own pipeline sends
        audio or text and gets transcripts, audio or completions back, and the request is
        failed over and billed exactly as it would be inside a session.

        Every socket opens with a `start` frame naming the target and the cost tags.
        Speech-to-text then takes binary 16 kHz mono PCM and returns `transcript` frames.
        Text-to-speech takes `speak` frames and returns binary audio with
        `synthesis_complete` between utterances: each audio frame opens with a
        little-endian header of a uint32 sample rate, a uint16 channel count and two
        reserved bytes, followed by PCM16 samples. Completions take `respond` frames and
        return `delta` and `complete`. All three report failures as `error` frames and end
        with `closed`.

        Memory and phone are recorded rather than routed, so they are not served here.
      parameters:
        - $ref: "#/components/parameters/Modality"
      responses:
        "101":
          description: The socket is open
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/stats/rollup:
    post:
      operationId: runRollup
      summary: Aggregate request rows into a rollup table
      description: >
        Covers every modality and customer in the window. Idempotent: re-running it over
        the same window recomputes those buckets, so a missed run is fixed by running it
        again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RollupRequest"
      responses:
        "200":
          description: The rollup completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RollupResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    CustomerId:
      type: apiKey
      in: header
      name: X-Customer-Id
      description: Trusted customer identifier. Every statistic is keyed by it.

  parameters:
    Modality:
      name: modality
      in: path
      required: true
      description: Which kind of model to route.
      schema:
        $ref: "#/components/schemas/Modality"
    SessionID:
      name: id
      in: path
      required: true
      description: The session, as returned when it was created.
      schema:
        type: string
    ResourceID:
      name: id
      in: path
      required: true
      description: The resource, as returned when it was created.
      schema:
        type: string

  responses:
    BadRequest:
      description: The request was malformed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: The customer header is missing
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No such modality, provider or shortcut
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    SessionState:
      type: string
      enum: [live, ended]
      description: Whether the agent is still in the call.

    SessionTool:
      type: object
      required: [name, description]
      description: >
        One of the caller's own functions. The model is offered it by name and description;
        running it is the caller's business, over the events socket.
      properties:
        name:
          type: string
        description:
          type: string
          description: >
            What the model is told the tool does, which is the whole of how it decides when
            to reach for one.
        parameters:
          type: object
          additionalProperties: true
          description: A JSON Schema object describing the arguments.

    SessionSkill:
      type: object
      required: [name, description, instructions]
      description: >
        A kind of work worth handing to the slower model. There is nothing behind a skill
        but a better model: what it declares is the instructions that model answers under.
      properties:
        name:
          type: string
        description:
          type: string
          description: The one line the fast model sees.
        instructions:
          type: string
          description: The full prompt, which only the subagent sees.
        deadline_ms:
          type: integer
          format: int64
          description: How long the work may run before it is abandoned. Zero is the default.

    SessionMemory:
      type: object
      description: >
        Who the session's memories are about. Without a user id nothing is recalled or
        stored, which is the case for a call with nobody identified on it.
      properties:
        user_id:
          type: string
          description: Who the memories belong to. Empty means the customer.
        app_id:
          type: string
          description: Separates two deployments sharing one memory account.
        filter:
          type: object
          additionalProperties:
            type: string
          description: >
            The caller's own labels, which narrow recall further. They cannot widen it: a
            filter is applied alongside the user id, never instead of it.

    SessionPhone:
      type: object
      required: [number]
      description: The number the session acts from, which is what turns transferring on.
      properties:
        number:
          type: string
          description: One of the customer's own numbers, written as +15551234567.
        vendor:
          type: string
          description: Who carries an outbound leg.
        vendor_call_id:
          type: string
          description: >
            The outbound leg, set for a call the agent placed. Without one the agent has no
            keypad to press at.

    AgentConfigRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: What the config is called, which is unique among the customer's own.
        stt:
          type: string
          description: A provider/model or a capability shortcut. Empty leaves the default.
        tts:
          type: string
        voice:
          type: string
          description: Provider-specific voice id.
        llm:
          type: string
          description: The model holding the conversation.
        subagent:
          type: string
          description: >
            The model that does the thinking. Empty means the voice model answers
            everything itself, and skills mean nothing.
        instructions:
          type: string
        greeting:
          type: string
        skills:
          type: array
          items:
            type: string
          description: >
            Skill names, either the customer's own or one of the built-in think, recall
            and explain. Omit for the built-in set.
        keyterms:
          type: array
          items:
            type: string
          description: >
            Business-specific words the transcriber would otherwise get wrong, such as
            product or company names. Up to 100 terms, and providers that cannot be told
            about vocabulary ignore them.
        knowledge_namespace:
          type: string
          description: >
            What the agent may look things up in. Empty means it knows only what it was
            told.
        tags:
          type: object
          additionalProperties:
            type: string
          description: Cost labels, carried onto every request a session using it makes.

    AgentConfig:
      type: object
      required: [id, name, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        stt:
          type: string
        tts:
          type: string
        voice:
          type: string
        llm:
          type: string
        subagent:
          type: string
        instructions:
          type: string
        greeting:
          type: string
        skills:
          type: array
          items:
            type: string
        keyterms:
          type: array
          items:
            type: string
        knowledge_namespace:
          type: string
        tags:
          type: object
          additionalProperties:
            type: string
        sync_hash:
          type: string
          description: >
            Fingerprint of the last directory synced onto this config. Empty if it was
            never synced from a directory.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SyncAgentRequest:
      type: object
      required: [name, hash]
      properties:
        name:
          type: string
          description: What the config is called, which is also the directory's name.
        hash:
          type: string
          description: >
            A fingerprint of the directory. A second sync with the same hash does
            nothing.
        instructions:
          type: string
        skills:
          type: array
          items:
            $ref: "#/components/schemas/SkillRequest"
        knowledge:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgeDocument"

    SyncAgentResult:
      type: object
      required: [unchanged, config]
      properties:
        unchanged:
          type: boolean
          description: True when the hash matched and nothing was written.
        config:
          $ref: "#/components/schemas/AgentConfig"

    VoiceRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: >
            What an agent config names the voice by, which is unique among the customer's
            own voices.
        description:
          type: string
          description: A note for whoever reads the voice back, and for the provider's dashboard.

    VoiceSampleRequest:
      type: object
      required: [audio]
      properties:
        audio:
          type: string
          format: byte
          description: The recording, base64 encoded. A minute of clean speech is plenty.
        filename:
          type: string
          description: >
            What to call the file upstream. The extension is how a provider knows what it
            was given, so send one.
        content_type:
          type: string
        transcript:
          type: string
          description: >
            What is said in the recording. Optional, and the providers that use one clone
            more faithfully with it.

    PrepareVoiceRequest:
      type: object
      properties:
        providers:
          type: array
          items:
            type: string
          description: >
            Which providers to teach the voice to. Empty means every provider this
            deployment can clone with.

    VoiceSample:
      type: object
      required: [id, created_at]
      properties:
        id:
          type: string
        filename:
          type: string
        content_type:
          type: string
        bytes:
          type: integer
          format: int64
        transcript:
          type: string
        created_at:
          type: string
          format: date-time

    VoiceBinding:
      type: object
      required: [provider, state]
      properties:
        provider:
          type: string
        external_id:
          type: string
          description: What this provider calls the voice.
        state:
          type: string
          enum: [pending, ready, failed]
        error:
          type: string
          description: Why the provider would not take the recordings, when it would not.
        updated_at:
          type: string
          format: date-time

    Voice:
      type: object
      required: [id, name, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        samples:
          type: array
          items:
            $ref: "#/components/schemas/VoiceSample"
        bindings:
          type: array
          items:
            $ref: "#/components/schemas/VoiceBinding"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SkillRequest:
      type: object
      required: [name, description, instructions]
      properties:
        name:
          type: string
          description: How a config names it, which is unique among the customer's own.
        description:
          type: string
          description: The one line the fast model sees.
        instructions:
          type: string
          description: The full prompt, which only the subagent sees.
        deadline_ms:
          type: integer
          format: int64
          description: How long the work may run before it is abandoned. Zero is the default.

    Skill:
      type: object
      required: [id, name, description, instructions, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        instructions:
          type: string
        deadline_ms:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    KnowledgeDocument:
      type: object
      required: [source, text]
      properties:
        source:
          type: string
          description: >
            Where the document came from, as a reader would recognise it. Passage ids are
            keyed by it, so posting the same source again replaces what it wrote before.
          example: pricing.md
        text:
          type: string
          description: The document, whole. It is cut into passages here.

    IngestKnowledgeRequest:
      type: object
      required: [namespace, documents]
      properties:
        namespace:
          type: string
          description: >
            The knowledge base to write into, which is what a config's
            knowledge_namespace names. Knowledge is never shared, so there is no default.
          example: docs
        documents:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/KnowledgeDocument"
        chunk_size:
          type: integer
          description: >
            Characters per passage. Zero is the default, which is small enough that several
            passages fit in front of a model and large enough that one still answers the
            question on its own.

    IngestedKnowledge:
      type: object
      required: [namespace, documents, passages]
      properties:
        namespace:
          type: string
        documents:
          type: integer
          description: How many documents were read.
        passages:
          type: integer
          description: How many passages they were cut into and written as.

    CampaignRequest:
      type: object
      required: [name, config_id, from_number]
      properties:
        name:
          type: string
        config_id:
          type: string
          description: The agent config the calls are made with.
        from_number:
          type: string
          description: One of your own numbers, which is what the person sees.
        concurrency:
          type: integer
          description: How many of these calls may be happening at once.
          default: 1
        tags:
          type: object
          additionalProperties:
            type: string

    Campaign:
      type: object
      required: [id, name, config_id, from_number, concurrency, state, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        config_id:
          type: string
        from_number:
          type: string
        concurrency:
          type: integer
        state:
          type: string
          enum: [draft, running, paused, finished]
        tags:
          type: object
          additionalProperties:
            type: string
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time

    ContactsRequest:
      type: object
      required: [contacts]
      properties:
        contacts:
          type: array
          items:
            type: object
            required: [to_number]
            properties:
              to_number:
                type: string
              instructions:
                type: string
                description: >
                  What to say to this person, added to whatever the config already says.

    Contact:
      type: object
      required: [id, to_number, state, attempts]
      properties:
        id:
          type: string
        to_number:
          type: string
        instructions:
          type: string
        state:
          type: string
          enum: [pending, calling, done, failed]
        attempts:
          type: integer
        call_id:
          type: string
          description: The call this contact became, which is what the call paths take.
        vendor_call_id:
          type: string
        error:
          type: string
          description: Why they could not be rung, when they could not be.

    Call:
      type: object
      required: [id, call_id, agent_id, direction, started_at]
      properties:
        id:
          type: string
          description: The session that ran the call, which is what it is held by.
        call_id:
          type: string
        agent_id:
          type: string
          description: Which agent ran it, and where its transcript is kept.
        config_id:
          type: string
        campaign_id:
          type: string
        contact_id:
          type: string
        from_number:
          type: string
        to_number:
          type: string
        direction:
          type: string
          enum: [inbound, outbound]
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          description: Absent while the call is still running.
        summary:
          type: string
          description: What a model made of the call, written once it was over.
        review_score:
          type: integer
          description: How well the agent handled it, from 1 to 5.
        review_notes:
          type: string
        tags:
          type: object
          additionalProperties:
            type: string

    TranscriptMessage:
      type: object
      required: [speaker, text, created_at]
      properties:
        speaker:
          type: string
          description: Who said it, the agent under its own user id.
        text:
          type: string
        created_at:
          type: string
          format: date-time

    CallTokenRequest:
      type: object
      properties:
        user_id:
          type: string
          description: >
            Who the browser joins as. Somebody watching a call is not the agent, so this
            defaults to a listener of its own rather than to the agent's user.
        user_name:
          type: string
          description: The name the other participants see. Defaults to the user id.

    CallToken:
      type: object
      required: [api_key, token, user_id, user_name, call_id, call_type, expires_at]
      properties:
        api_key:
          type: string
          description: The Stream app the call is in, which the browser SDK joins against.
        token:
          type: string
        user_id:
          type: string
        user_name:
          type: string
        call_id:
          type: string
          description: >
            The Stream call to join, which is not the id this call is held by here.
        call_type:
          type: string
        expires_at:
          type: string
          format: date-time

    TimelineEntry:
      type: object
      required: [turn_id, started_at]
      properties:
        turn_id:
          type: string
        started_at:
          type: string
          format: date-time
        heard:
          type: string
          description: What the caller said, when it can be matched to this exchange.
        said:
          type: string
          description: What the agent answered.
        roundtrip_ms:
          type: number
          format: double
          description: How long the caller waited between finishing and being answered.
        audio_out_ms:
          type: number
          format: double
          description: How much the agent spoke.
        interrupted:
          type: boolean
          description: Whether the caller talked over the answer.

    CallEvent:
      type: object
      required: [at, kind, reason]
      properties:
        at:
          type: string
          format: date-time
        kind:
          $ref: "#/components/schemas/DecisionKind"
        reason:
          type: string
          description: Why the conversation chose it, in words.
        turn_id:
          type: string
          description: The exchange it was about, which lines it up against that turn's timings.
        participant:
          type: string
          description: Who it concerned.
        said:
          type: string
          description: What was heard, or what the agent decided to say.
        latency_ms:
          type: number
          format: double
          description: What the flow controller took to rule, where anything was asked.

    DecisionKind:
      type: string
      description: >
        What a conversation decided. Asking puts a settled turn to the flow controller;
        waiting leaves it because the caller has not finished; ignoring drops speech meant
        for somebody else; answering replies to it; queueing holds it until the agent has
        stopped talking; interrupting abandons the reply being spoken and shortening ends
        it early; a backchannel is a listening noise that never reaches the model;
        superseding drops a ruling about words that have since changed; compacting
        replaces old history with a summary; delegating hands work to the subagent.
      enum:
        - ask
        - wait
        - ignore
        - answer
        - queue
        - interrupt
        - shorten
        - backchannel
        - supersede
        - compact
        - delegate
        - fail

    CreateSessionRequest:
      type: object
      properties:
        call_id:
          type: string
          description: The call to join. Required unless the session is text.
        text:
          type: boolean
          default: false
          description: >
            Hold the conversation in writing rather than on a call. Nothing is transcribed
            and nothing is spoken, so no call is joined and neither speech target is used.
            Everything between hearing and answering is unchanged: a text session has the
            same skills, knowledge and tools a call would have had, and its replies arrive
            as response_delta and responded events on the session's socket.
        config_id:
          type: string
          description: >
            An agent config to start from. Everything else in this request overrides what
            the config says, so a caller can reuse a configuration and still change one
            thing about this call.
        call_type:
          type: string
          default: default
        user_id:
          type: string
          description: Who the agent joins the call as.
          default: vision-agent
        user_name:
          type: string
          default: Vision Agent
        agent_id:
          type: string
          description: Keys transcripts and statistics. Empty means the call id.
        instructions:
          type: string
        greeting:
          type: string
          description: >
            Said on joining without going through the model. Empty means the agent waits to
            be spoken to.
        navigating:
          type: boolean
          default: false
          description: >
            The agent placed this call, so let recordings finish and answer their menus.
        llm:
          type: string
          description: >
            A provider/model or a capability shortcut. Omit it and the config decides,
            or llm-fast when there is no config. These carry no schema default on
            purpose: a generated client that filled one in would send it, and a caller
            naming a config would silently lose the model it configured.
        stt:
          type: string
          description: >
            Omit it and the config decides, or en-low-latency when there is no config.
        tts:
          type: string
          description: >
            Omit it and the config decides, or en-low-latency when there is no config.
        subagent:
          type: string
          description: >
            The model that does the thinking. Empty means the voice model answers
            everything itself, and skills mean nothing.
        voice:
          type: string
          description: Provider-specific voice id.
        languages:
          type: array
          items:
            type: string
          description: Language hints, which narrow the candidates in every modality.
        keyterms:
          type: array
          items:
            type: string
          description: >
            Business-specific words the transcriber would otherwise get wrong. Up to 100
            terms, and providers that cannot be told about vocabulary ignore them.
        max_tokens:
          type: integer
        tasks:
          type: integer
          description: How much delegated work may run at once.
        sandbox:
          type: string
          enum: [daytona]
          description: >
            Where the subagent may run code it writes. Only the subagent is offered it:
            running code takes seconds, and the model holding the conversation has none to
            spare. Omit it and the subagent works everything out in its head.
        backchannel:
          type: boolean
          default: false
          description: Murmur while a participant is still talking, the way a person does.
        min_confidence:
          type: number
          format: double
          description: >
            How sure the transcriber must be before the agent answers rather than checks
            what was meant.
        skills:
          type: array
          items:
            $ref: "#/components/schemas/SessionSkill"
          description: Omit for the built-in set of think, recall and explain.
        skill_names:
          type: array
          items:
            type: string
          description: >
            Skills to look up rather than spell out: the customer's own, or one of the
            built-in think, recall and explain. Ignored when skills are given in full,
            and a name nothing defines is refused rather than dropped.
        tools:
          type: array
          items:
            $ref: "#/components/schemas/SessionTool"
        tool_timeout_ms:
          type: integer
          description: How long the model waits for a tool result. Zero is the default.
        tags:
          type: object
          additionalProperties:
            type: string
          description: Cost labels, carried onto every request the session makes.
        memory:
          $ref: "#/components/schemas/SessionMemory"
        phone:
          $ref: "#/components/schemas/SessionPhone"

    Session:
      type: object
      required: [id, call_id, call_type, user_id, agent_id, state, created_at]
      properties:
        id:
          type: string
        call_id:
          type: string
          description: Empty for a text session, which joins no call.
        text:
          type: boolean
          description: The conversation is held in writing rather than on a call.
        call_type:
          type: string
        user_id:
          type: string
        agent_id:
          type: string
        state:
          $ref: "#/components/schemas/SessionState"
        created_at:
          type: string
          format: date-time
        llm:
          type: string
          description: The provider and model answering, once routing has picked one.
        tts:
          type: string
          description: The provider and model speaking.
        instructions:
          type: string

    SayRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string

    InstructionsRequest:
      type: object
      required: [instructions]
      properties:
        instructions:
          type: string

    HealthStatus:
      type: object
      required: [status, dependencies]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        dependencies:
          type: object
          additionalProperties:
            type: string
          description: Dependency name to "ok" or a failure description.
          example: { postgres: ok, redis: ok }

    Modality:
      type: string
      enum: [stt, tts, llm, memory, knowledge, phone]
      description: >
        What kind of work was done. The first three are routed across providers.
        Memory, knowledge and phone are recorded but not routed, since there is one
        memory store, one knowledge base and one vendor per number, so the provider
        paths do not serve them while the statistics paths do.
      example: tts

    Granularity:
      type: string
      enum: [hourly, daily]
      default: hourly

    Tier:
      type: string
      enum: [low-latency, high-quality]
      description: What the model optimises for.

    Provider:
      type: object
      required: [provider, model, languages, realtime, tier, health]
      properties:
        provider:
          type: string
          example: elevenlabs
        model:
          type: string
          example: eleven_flash_v2_5
        languages:
          type: array
          items:
            type: string
        realtime:
          type: boolean
        tier:
          $ref: "#/components/schemas/Tier"
        health:
          $ref: "#/components/schemas/ProviderHealth"

    ProviderHealth:
      type: object
      required: [available, requests, errors, error_rate, latency_ms_avg]
      properties:
        available:
          type: boolean
          description: False once the error rate crosses the configured threshold.
        requests:
          type: integer
          format: int64
          description: Requests seen in the current health window.
        errors:
          type: integer
          format: int64
        error_rate:
          type: number
          format: double
        latency_ms_avg:
          type: number
          format: double

    Candidate:
      type: object
      required: [provider, model, health]
      properties:
        provider:
          type: string
        model:
          type: string
        health:
          $ref: "#/components/schemas/ProviderHealth"

    StatsBucket:
      type: object
      required:
        [
          provider,
          model,
          bucket,
          audio_ms_total,
          characters_total,
          input_tokens_total,
          cached_input_tokens_total,
          output_tokens_total,
          cost_micros_total,
          request_count,
          error_count,
        ]
      properties:
        provider:
          type: string
        model:
          type: string
        bucket:
          type: string
          format: date-time
        audio_ms_total:
          type: integer
          format: int64
          description: Billable audio, transcribed or produced.
        characters_total:
          type: integer
          format: int64
          description: Billable text. Zero for providers that bill by audio.
        input_tokens_total:
          type: integer
          format: int64
          description: Prompt tokens read, cached ones included. Zero outside llm.
        cached_input_tokens_total:
          type: integer
          format: int64
          description: The part of the prompt served from the provider's cache.
        output_tokens_total:
          type: integer
          format: int64
          description: Generated tokens, reasoning included. Zero outside llm.
        cost_micros_total:
          type: integer
          format: int64
          description: Millionths of a dollar, priced from the configured rates.
        request_count:
          type: integer
          format: int64
        error_count:
          type: integer
          format: int64
        latency_p50_ms:
          type: number
          format: double
          nullable: true
        latency_p95_ms:
          type: number
          format: double
          nullable: true
        uptime:
          type: number
          format: double
          nullable: true
          description: Successes over total requests in the bucket.

    TagStatsBucket:
      type: object
      required:
        [
          tag_key,
          tag_value,
          bucket,
          audio_ms_total,
          characters_total,
          input_tokens_total,
          cached_input_tokens_total,
          output_tokens_total,
          cost_micros_total,
          request_count,
          error_count,
        ]
      properties:
        tag_key:
          type: string
          example: project
        tag_value:
          type: string
          example: moderation
        bucket:
          type: string
          format: date-time
        audio_ms_total:
          type: integer
          format: int64
        characters_total:
          type: integer
          format: int64
        input_tokens_total:
          type: integer
          format: int64
        cached_input_tokens_total:
          type: integer
          format: int64
        output_tokens_total:
          type: integer
          format: int64
        cost_micros_total:
          type: integer
          format: int64
          description: Millionths of a dollar, priced from the configured rates.
        request_count:
          type: integer
          format: int64
        error_count:
          type: integer
          format: int64
        latency_p50_ms:
          type: number
          format: double
          nullable: true
        latency_p95_ms:
          type: number
          format: double
          nullable: true
        uptime:
          type: number
          format: double
          nullable: true

    TurnStatsBucket:
      type: object
      required:
        [agent_id, bucket, turn_count, interrupted_count, audio_out_ms_total]
      properties:
        agent_id:
          type: string
        bucket:
          type: string
          format: date-time
        turn_count:
          type: integer
          format: int64
        interrupted_count:
          type: integer
          format: int64
          description: Turns a participant talked over before they finished.
        audio_out_ms_total:
          type: number
          format: double
          description: How much speech the agent published in the bucket.
        stt_latency_p50_ms:
          type: number
          format: double
          nullable: true
        stt_latency_p95_ms:
          type: number
          format: double
          nullable: true
        llm_ttft_p50_ms:
          type: number
          format: double
          nullable: true
        llm_ttft_p95_ms:
          type: number
          format: double
          nullable: true
        tts_ttfb_p50_ms:
          type: number
          format: double
          nullable: true
        tts_ttfb_p95_ms:
          type: number
          format: double
          nullable: true
        roundtrip_p50_ms:
          type: number
          format: double
          nullable: true
          description: Settled transcript to first audio published.
        roundtrip_p95_ms:
          type: number
          format: double
          nullable: true
        roundtrip_p99_ms:
          type: number
          format: double
          nullable: true

    PhoneVendor:
      type: object
      required: [vendor, implemented, ready, capabilities]
      properties:
        vendor:
          type: string
          example: twilio
        implemented:
          type: boolean
          description: Whether this service can actually work with the vendor.
        ready:
          type: boolean
          description: Implemented and holding every credential it needs.
        operations:
          type: array
          description: >
            What this service can do at the vendor. Eight vendors buy numbers and
            two of those also bridge calls, so a number is not bought from a
            vendor that cannot answer on it by accident.
          items:
            $ref: "#/components/schemas/PhoneOperation"
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/PhoneCapability"
        missing_credentials:
          type: array
          description: The environment variables the vendor needs and does not have.
          items:
            type: string

    PhoneOperation:
      type: string
      enum: [search, buy, release, attach, dial, send_digits]
      # Without these the generated constants are named Search, Buy and Dial, which are too
      # generic to sit at the top of a package that is mostly generated.
      x-enum-varnames:
        - PhoneOperationSearch
        - PhoneOperationBuy
        - PhoneOperationRelease
        - PhoneOperationAttach
        - PhoneOperationDial
        - PhoneOperationSendDigits

    PhoneCapability:
      type: string
      description: >
        What a number can carry. The names are Telnyx's feature names, because
        they are the widest vocabulary any of these vendors offers.
      enum:
        [
          voice,
          sms,
          mms,
          fax,
          emergency,
          hd_voice,
          international_sms,
          local_calling,
        ]

    PhoneNumberType:
      type: string
      description: What kind of number it is, which decides who pays for the call.
      enum: [local, toll_free, mobile]

    NumberSearchResult:
      type: object
      required: [numbers, skipped]
      properties:
        numbers:
          type: array
          description: What the vendors are offering, cheapest first.
          items:
            $ref: "#/components/schemas/AvailableNumber"
        skipped:
          type: array
          description: >
            Vendors that were not part of the answer. A search that reached two
            of eight vendors found what two vendors had, and deciding whether to
            buy needs to know which.
          items:
            $ref: "#/components/schemas/SkippedVendor"

    SkippedVendor:
      type: object
      required: [vendor, reason]
      properties:
        vendor:
          type: string
          example: twilio
        reason:
          type: string
          example: cannot search by administrative_area

    AvailableNumber:
      type: object
      required: [e164, vendor, country, capabilities]
      properties:
        e164:
          type: string
          example: "+15125551234"
        vendor:
          type: string
          description: Who is offering it, which is also who to buy it from.
          example: telnyx
        country:
          type: string
        region:
          type: string
        locality:
          type: string
        number_type:
          $ref: "#/components/schemas/PhoneNumberType"
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/PhoneCapability"
        monthly_cost_micros:
          type: integer
          format: int64
          description: Millionths of a dollar per month, zero when the vendor does not quote one.

    PhoneNumber:
      type: object
      required: [e164, vendor, country, capabilities, monthly_cost_micros, purchased_at]
      properties:
        e164:
          type: string
        vendor:
          type: string
        country:
          type: string
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/PhoneCapability"
        monthly_cost_micros:
          type: integer
          format: int64
        tags:
          type: object
          additionalProperties:
            type: string
          description: The customer's own cost labels.
        stream_trunk_id:
          type: string
          description: The SIP trunk calls to this number arrive on. Absent until attached.
        purchased_at:
          type: string
          format: date-time
        released_at:
          type: string
          format: date-time
          nullable: true

    BuyNumberRequest:
      type: object
      required: [vendor, e164]
      properties:
        vendor:
          type: string
          example: twilio
        e164:
          type: string
          example: "+15125551234"
        country:
          type: string
          description: >
            The country the number was offered from, as the search reported it.
            Most vendors buy by number alone; the few that buy out of a country's
            inventory need this, and it cannot be guessed back out of the number.
          example: US
        tags:
          type: object
          additionalProperties:
            type: string
          description: Cost labels carried onto the purchase's request row.

    AttachNumberRequest:
      type: object
      properties:
        call_id:
          type: string
          description: >
            The call every caller joins. Omit to give each caller their own call,
            named after the number they rang.
        call_type:
          type: string
          description: The Stream call type. Omit for "default".
        allowed_ips:
          type: array
          description: The vendor's signalling addresses, as IPs or CIDR blocks.
          items:
            type: string

    AttachedNumber:
      type: object
      required: [trunk_id, route_id, sip_uri]
      properties:
        trunk_id:
          type: string
        route_id:
          type: string
        sip_uri:
          type: string
          description: Where the vendor sends calls, e.g. sip:trunk@sip.stream-io-api.com.

    PlaceCallRequest:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
          description: One of the customer's own numbers, which is what the person sees.
        to:
          type: string
        call_id:
          type: string
          description: >
            The Stream call the answered leg joins, and so the one the agent has to be
            in. Omit to have one named after this call, since two calls from the same
            number are two conversations.
        call_type:
          type: string
          description: The Stream call type. Omit for "default".
        ring_timeout_seconds:
          type: integer
          description: >
            How long to ring before giving up. Omit to leave the vendor's default,
            which is long enough to reach voicemail. A vendor whose call API cannot
            express it refuses the call rather than ringing for its own default.
        initial_digits:
          type: string
          description: >
            Digits pressed once the person answers, for reaching an extension behind a
            menu, e.g. "ww1234#". w is a short pause and W a long one.
        custom:
          type: object
          description: >
            Put on the Stream call, where the agent in it can read it. It is set at
            Stream rather than at the vendor, so every vendor can carry it.
          additionalProperties:
            type: string
        headers:
          type: object
          description: >
            Carried to the person's leg as custom SIP headers. Only some vendors can
            express these, and one that cannot refuses the call.
          additionalProperties:
            type: string
        tags:
          type: object
          additionalProperties:
            type: string

    PlacedCall:
      type: object
      required: [vendor_call_id, status]
      properties:
        vendor_call_id:
          type: string
        status:
          type: string
          description: The vendor's own word for where the call is, e.g. "queued".
        vendor:
          type: string
          description: Who is placing the call.
        call_id:
          type: string
          description: >
            The Stream call the answered leg is routed into. An agent that is not in it
            hears nothing when the person picks up.
        call_type:
          type: string

    TransferCallRequest:
      type: object
      required: [from, to, call_id]
      properties:
        from:
          type: string
          description: >
            The customer's number the human is dialled from, which is what they see.
        to:
          type: string
          description: The human being brought onto the call.
        call_id:
          type: string
          description: The Stream call the caller and the agent are already on.
        call_type:
          type: string
          description: The Stream call type. Omit for "default".
        tags:
          type: object
          additionalProperties:
            type: string

    PressDigitsRequest:
      type: object
      required: [vendor, digits]
      properties:
        vendor:
          type: string
          description: Who is carrying the call, e.g. "telnyx".
        digits:
          type: string
          description: >
            What to press. Only 0-9, * and # can be pressed, and w waits half a second
            between two of them.

    RollupRequest:
      type: object
      required: [from, to]
      properties:
        granularity:
          $ref: "#/components/schemas/Granularity"
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time

    RollupResult:
      type: object
      required: [granularity, buckets_written]
      properties:
        granularity:
          $ref: "#/components/schemas/Granularity"
        buckets_written:
          type: integer
          format: int64
