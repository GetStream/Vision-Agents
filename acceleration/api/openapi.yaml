  /v1/phone/numbers/available:
    get:
      description: Naming a vendor searches only that one. Leaving it out asks every vendor that has its credentials, at once, and merges what they offer cheapest first. Vendors do not agree on how a search can be narrowed, so one whose API cannot express a filter is reported in `skipped` rather than asked without it, which would answer a search for one place with numbers from another.
      operationId: searchPhoneNumbers
      parameters:
        - in: query
          name: limit
          schema:
            default: 10
            type: integer
        - description: One vendor to search. Absent searches every usable vendor.
          explode: false
          in: query
          name: vendor
          schema:
            description: One vendor to search. Absent searches every usable vendor.
            type: string
        - description: ISO 3166-1 alpha-2 country code.
          explode: false
          in: query
          name: country
          required: true
          schema:
            description: ISO 3166-1 alpha-2 country code.
            type: string
        - explode: false
          in: query
          name: area_code
          schema:
            type: string
        - description: Digits the number must contain, anywhere in it.
          explode: false
          in: query
          name: contains
          schema:
            description: Digits the number must contain, anywhere in it.
            type: string
        - description: Digits the number must start with, matched after the country dial code. This differs from `contains` in where the digits have to fall.
          explode: false
          in: query
          name: prefix
          schema:
            description: Digits the number must start with, matched after the country dial code. This differs from `contains` in where the digits have to fall.
            type: string
        - description: A city, region or rate centre.
          explode: false
          in: query
          name: locality
          schema:
            description: A city, region or rate centre.
            type: string
        - description: A US state or Canadian province.
          explode: false
          in: query
          name: administrative_area
          schema:
            description: A US state or Canadian province.
            type: string
        - explode: false
          in: query
          name: number_type
          schema:
            $ref: '#/components/schemas/PhoneNumberType'
        - description: Capabilities every number must have. Repeat the parameter to require several. A vendor that cannot filter on one still reports what its numbers carry, so these are checked on the results either way.
          explode: true
          in: query
          name: features
          schema:
            description: Capabilities every number must have. Repeat the parameter to require several. A vendor that cannot filter on one still reports what its numbers carry, so these are checked on the results either way.
            items:
              $ref: '#/components/schemas/PhoneCapability'
            type: array
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NumberSearchResult'
          description: What the vendors are offering, and which could not answer
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Search for numbers to buy, at one vendor or all of them
