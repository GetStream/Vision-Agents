  /v1/agents/simulations:
    get:
      operationId: listSimulations
      summary: The simulations the calling customer has
      responses:
        "200":
          description: The customer's simulations, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Simulation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createSimulation
      x-server-side-only: true
      summary: Write down a conversation to have with an agent
      description: >
        A simulation is a scenario to put an agent through and something that has to be
        true at the end of it. The scenario is a brief rather than a script: it is given
        to a model that plays the caller, reads what the agent says back and decides what
        to say next, so a scenario can say to change your mind once the order is handled.
