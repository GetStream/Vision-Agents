        Server-side only: it needs a server-side token, so it cannot be reached from an
        end user's device.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulationRequest"
      responses:
        "201":
          description: The simulation was stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Simulation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/agents/simulations/{id}:
    get:
      operationId: getSimulation
      summary: One simulation
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: The simulation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Simulation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateSimulation
      x-server-side-only: true
      summary: Replace a simulation
      description: >
        Every field is written, so the body is what the simulation now asks rather than
        what changed about it. The runs it already has keep their own copy of what they
        tested, so an old result still says what it was a result of.

        Server-side only: it needs a server-side token, so it cannot be reached from an
        end user's device.
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulationRequest"
      responses:
        "200":
          description: The simulation as it now is
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Simulation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteSimulation
      x-server-side-only: true
      summary: Delete a simulation
      description: >
        The runs that named it are kept, so the simulation stops being runnable rather
        than stops having existed.

        Server-side only: it needs a server-side token, so it cannot be reached from an
        end user's device.
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "204":
          description: The simulation is gone
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/agents/simulations/{id}/run:
    post:
      operationId: runSimulation
      x-server-side-only: true
      summary: Have the conversations
      description: >
        Returns once the run is written rather than once it is over: the conversations
        happen after the answer, and the run says how far along they are. A simulation
        asking several ways has them all at once.

        Server-side only: it needs a server-side token, so it cannot be reached from an
        end user's device.
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "202":
          description: The run is going
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/agents/simulation-runs:
    get:
      operationId: listSimulationRuns
      summary: What the simulations have come to, newest first
      description: >
        Without a simulation named this is the log of everything that has been run
        lately, which is the same question as what one simulation has come to, asked of
        all of them.
      parameters:
        - name: simulation_id
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
            enum: [running, passed, failed, cancelled, errored]
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: The runs, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SimulationRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/agents/simulation-runs/{id}:
    get:
      operationId: getSimulationRun
      summary: One run, with the conversations it had
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: The run and its conversations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/agents/simulation-runs/{id}/cancel:
    post:
      operationId: cancelSimulationRun
      x-server-side-only: true
      summary: Stop a run
      description: >
        Unlike a paused campaign the conversations in flight are ended too: there is
        nobody on the other end of them to be hung up on.

        Server-side only: it needs a server-side token, so it cannot be reached from an
        end user's device.
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: The run is stopping
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/agents/calls:
    get:
      operationId: listCalls
      summary: The calls the calling customer has run
      description: >
        A session lives in memory and is gone when the process is, so a call is recorded
        as it starts and again as it ends. This is what answers what happened yesterday,
        and what is happening now after a restart.
      parameters:
        - name: agent_id
          in: query
          required: false
          description: Narrow to one agent.
          schema:
            type: string
        - name: campaign_id
          in: query
          required: false
          description: Narrow to the calls one campaign placed.
          schema:
            type: string
        - name: running
          in: query
          required: false
          description: Only calls that have not ended.
          schema:
            type: boolean
            default: false
        - name: from
          in: query
          required: false
          description: Only calls that started at or after this, inclusive.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Only calls that started before this, exclusive.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: The customer's calls, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Call"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/agents/calls/{id}:
    get:
      operationId: getCall
      summary: One call, with whatever was made of it afterwards
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: The call
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Call"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/agents/calls/{id}/transcript:
    get:
      operationId: getCallTranscript
      summary: What was said on a call
      description: >
        Read back from the chat channel the conversation was written to as it happened,
        rather than copied into a second place that could disagree with it.
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: The conversation, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TranscriptMessage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/agents/calls/{id}/timeline:
    get:
      operationId: getCallTimeline
      summary: The call as it unfolded, said and measured together
      description: >
        Each exchange with what was said in it and what it cost the caller in waiting:
        how long the answer took to start, how much the agent spoke, and whether it was
        talked over.
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: The exchanges, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimelineEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/agents/calls/{id}/events:
    get:
      operationId: getCallEvents
      summary: What the conversation decided, and why
      description: >
        A timeline says what a call cost the caller in waiting. This says why the call went
        the way it did: why the agent waited rather than answering, why it read something
        as not meant for it, why it stopped mid-sentence. Read in order they are the
        reasoning behind the conversation, which is the only thing that explains a call
        that surprised somebody. A call still running reports the same decisions live on
        the session socket.
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - name: limit
          in: query
          required: false
          description: How many to return, oldest first.
          schema:
            type: integer
            default: 1000
      responses:
        "200":
          description: The judgements, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CallEvent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/agents/calls/{id}/token:
    post:
      operationId: createCallToken
      summary: What a browser needs to join this call
      description: >
        Mints a Stream token so a person can join the call from a browser and talk to the
        agent, and says which call to join with it. The secret stays here: the browser is
        handed a token that expires, never the key that signs one.
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallTokenRequest"
      responses:
        "200":
          description: The credentials, and the call they are for
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallToken"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/agents/chat-token:
    post:
      operationId: createChatToken
      summary: What a browser needs to read an agent's conversation
      description: >
        An agent writes what was said into the Stream Chat channel agent:{agent_id},
        so a client that can read that channel needs no transcript API. This mints the
        token to read it with, and adds the reader to the channel, since a conversation
        they are not a member of is one they cannot watch.

        The secret stays here, the same as for a call token: the browser is handed
        something that expires.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatTokenRequest"
      responses:
        "200":
          description: The credentials, and the channel they are for
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatToken"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/agents/sessions:
    get:
      operationId: listSessions
      summary: The sessions the calling customer is running
      responses:
        "200":
          description: The customer's sessions, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createSession
      summary: Join a call as a voice agent
      description: >
        The whole conversation runs here: the agent joins the call, transcribes what it
        hears, answers it and speaks back, all through the routers. The caller keeps the
        session id and watches the conversation over the events socket.

        It returns once the agent is in the call, so a session that comes back is one that
        is already listening. Tools declared here are the caller's own: the model asks for
        them over the events socket and waits for the caller to answer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: The agent is in the call
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/agents/sessions/{id}:
    get:
      operationId: getSession
      summary: One session
      parameters:
        - $ref: "#/components/parameters/SessionID"
      responses:
        "200":
          description: The session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: closeSession
      summary: Leave the call and end the session
      parameters:
        - $ref: "#/components/parameters/SessionID"
      responses:
        "204":
          description: The agent has left
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/agents/sessions/{id}/say:
    post:
      operationId: saySession
      summary: Speak a piece of text without going through the model
      description: >
        For when the caller already knows what should be said, such as a greeting. A model
        would only add latency and cost to words that were never in question.
      parameters:
        - $ref: "#/components/parameters/SessionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SayRequest"
      responses:
        "204":
          description: The text is being spoken
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/agents/sessions/{id}/respond:
    post:
      operationId: respondSession
      summary: Answer a piece of text through the model, as though it had been said
      parameters:
        - $ref: "#/components/parameters/SessionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SayRequest"
      responses:
        "204":
          description: The model is answering
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/agents/sessions/{id}/interrupt:
    post:
      operationId: interruptSession
      summary: Abandon the reply being spoken
      description: >
        What a caller outside the call has instead of a voice. A murmur is not interrupted,
        because it was meant to overlap with whoever is talking.
      parameters:
        - $ref: "#/components/parameters/SessionID"
      responses:
        "204":
          description: The reply was abandoned, if there was one
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/agents/sessions/{id}/instructions:
    put:
      operationId: setSessionInstructions
      summary: Change what the agent is told to be
      description: >
        Applies from the next turn. The reply being spoken keeps the prompt it started
        with, because rewriting it mid-sentence would have the agent change character in
        the middle of a thought.
      parameters:
        - $ref: "#/components/parameters/SessionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstructionsRequest"
      responses:
        "204":
          description: The next turn will use them
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/agents/sessions/{id}/events:
    get:
      operationId: watchSession
      summary: Watch the conversation and answer the model's tool calls
      description: >
        A WebSocket, which OpenAPI cannot describe past the upgrade. Frames are JSON
        objects carrying a `type` and the fields of that event.

        The server sends what the conversation did: `joined`, `heard`, `responding`,
        `response_delta`, `responded`, `spoke`, `turn`, `decision`, `delegated`,
        `task_settled`, `task_cancelled`, `tool_call`, `tool_ran`, `transferred`,
        `pressed`, `looked_up`, `backchannel`, `interrupted`, `overlap_decided`,
        `conversation_compacted`, `error` and `left`.

        A `decision` frame is one judgement the conversation made, carrying the same
        fields as a CallEvent. Together they are why the call went the way it did, and
        they are also written down, so a finished call replays them from
        `/v1/agents/calls/{id}/events`.

        Two frames are only sent when asked for, because they are far more frequent than
        the rest and most consumers want neither. `interim=true` adds `hearing`, which is
        a transcript revision as it arrives rather than a settled turn. `decisions=false`
        drops `decision`.

        The client sends `tool_result` to answer a `tool_call`, and `say`, `respond`,
        `interrupt`, `instructions` or `close` to act on the session. A `tool_call` is the
        only frame that must be answered: everything else is a report.
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - name: interim
          in: query
          required: false
          description: Also send `hearing` frames, which are the words as they are revised.
          schema:
            type: boolean
            default: false
        - name: decisions
          in: query
          required: false
          description: Send `decision` frames.
          schema:
            type: boolean
            default: true
      responses:
        "101":
          description: The socket is open
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/{modality}/stream:
    get:
      operationId: streamModality
      summary: Route one modality over a socket, for a pipeline running elsewhere
      description: >
        A WebSocket, which OpenAPI cannot describe past the upgrade. This is the routing
        the agent does, offered a piece at a time: a caller running its own pipeline sends
        audio or text and gets transcripts, audio or completions back, and the request is
        failed over and billed exactly as it would be inside a session.

        Every socket opens with a `start` frame. It names either a `config_id`, a stored
        router config to take the options from, or the options outright; naming both
        overrides that config field by field. What it may carry is the modality's own
        option block - `SttOptions` for speech-to-text, `TtsOptions` for a voice,
        `LlmOptions` for a model - plus `agent_id` and `call_id` to attribute the work to a
        conversation and `tags` to bill it.

        Speech-to-text then takes binary PCM at the `sample_rate` the start frame named, 16
        kHz mono by default, and returns `transcript` frames. Text-to-speech takes `speak`
        frames and returns binary audio with `synthesis_complete` between utterances: each
        audio frame opens with a little-endian header of a uint32 sample rate, a uint16
        channel count and two reserved bytes, followed by PCM16 samples. Language models
        take `respond` frames, each naming an `id` and anything from `LlmOptions` for that
        one response along with its `tools`, and return `delta`, `reasoning_delta` and one
        `complete` per response; a `complete` reports the `status` the response ended in,
        what it cost in tokens and how long the caller waited for the first of them. An
        `interrupt` frame naming `response_ids` abandons responses still being generated,
        which still settle and are still billed for what they produced before being cut
        off. All three report failures as `error` frames and end with `closed`.

        Search is answered at `/v1/search` rather than here: one question and its answer
        need no socket held open between them. Memory and phone are recorded rather than
        routed, so they are not served either.
      parameters:
        - $ref: "#/components/parameters/Modality"
      responses:
        "101":
          description: The socket is open
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/search:
    post:
      operationId: search
      summary: Answer a question out of what is true now
      description: >
        The fourth routed modality, reachable on its own rather than only as a tool an
        agent reaches for. One question, one answer: routed, failed over and billed like
        the rest, and with no socket because nothing arrives in pieces.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: What the provider found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchAnswer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/stt/recordings:
    post:
      operationId: transcribeRecording
      summary: Transcribe a recording, off the live path
      description: >
        The non-realtime half of speech-to-text: a whole recording in, a whole transcript
        out. It is a job rather than a response because an hour of audio takes minutes to
        transcribe, so this returns immediately with an id to poll, or calls a callback
        when it is done.

        Routing works as it does everywhere else, except that the candidates are the
        providers registered as not realtime - the batch APIs, which are cheaper and more
        accurate than the same vendor's streaming model.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranscriptionRequest"
      responses:
        "202":
          description: The job was accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transcription"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/stt/recordings/{id}:
    get:
      operationId: getTranscription
      summary: One transcription job, and its transcript once it has one
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: The job as it now stands
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transcription"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/tts/recordings:
    post:
      operationId: recordSpeech
      summary: Speak a whole text into one audio file, off the live path
      description: >
        The non-realtime half of text-to-speech: a chapter in, a file out. A job for the
        same reason transcription is - an audiobook is not a conversation, and nothing is
        waiting to hear the first chunk.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpeechRequest"
      responses:
        "202":
          description: The job was accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Speech"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/tts/recordings/{id}:
    get:
      operationId: getSpeech
      summary: One speech job, and its audio once it has some
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: The job as it now stands
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Speech"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/dispatch:
    get:
      operationId: dispatchCalls
      x-server-side-only: true
      summary: Wait for inbound calls to answer, as a worker
      description: >
        A WebSocket, which OpenAPI cannot describe past the upgrade. The worker connects
        here and waits, rather than being called, because the agent runs in the customer's
        own process and this service cannot reach into it.

        The socket opens with a `ready` frame naming the worker, and a `call` frame arrives
        for each call handed to it. The worker sends `load` so the pool can rank it,
        `accepted` or `rejected` per call, and `ping` to time the round trip itself.

        Server-side only: it needs a server-side token, so it cannot be reached from an
        end user's device. This is the clearest case of why: a worker is offered other
        people's callers, so anything that can open this socket can answer for the whole
        app. The auth type has no query parameter, so a browser cannot open one at all.
      parameters:
        - name: capacity
          in: query
          required: false
          description: How many calls this worker takes at once.
          schema:
            type: integer
            minimum: 1
            default: 4
      responses:
        "101":
          description: The socket is open
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/stats/rollup:
    post:
      operationId: runRollup
      summary: Aggregate request rows into a rollup table
      description: >
        Covers every modality and customer in the window. Idempotent: re-running it over
        the same window recomputes those buckets, so a missed run is fixed by running it
        again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RollupRequest"
      responses:
        "200":
          description: The rollup completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RollupResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    CustomerId:
      type: apiKey
      in: header
      name: X-Customer-Id
      description: >-
        The customer, taken at face value. Read only in noauth mode, where a proxy in front
        has already decided who the caller is. X-Stream-App-Id and X-Stream-Organization-Id
        say the same thing with the organization around it.
    ApiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: >-
        The public half of a credential, which names the app and the secret to verify with.
        A socket sends it as the api_key query parameter, because a browser WebSocket
        cannot set a header.
    AppToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        A token signed HS256 with the secret belonging to the API key. A socket sends it as
        the token query parameter. A token minted for an end user to hold names them in a
        user_id claim; one a backend mints for itself carries server: true instead, and is
        what the operations marked x-server-side-only require.
    AuthType:
      type: apiKey
      in: header
      name: Stream-Auth-Type
      description: >-
        Which kind of credential is presented: server for a process the customer runs, jwt
        for a request made on an end user's behalf, which is what a caller that names
        neither is taken to be. It has no query parameter counterpart, so a browser socket
        cannot claim to be a backend. The header is the caller's declaration and AppToken
        is the proof, so both have to say the same thing.

  parameters:
    Modality:
      name: modality
      in: path
      required: true
      description: Which kind of model to route.
      schema:
        $ref: "#/components/schemas/Modality"
    SessionID:
      name: id
      in: path
      required: true
      description: The session, as returned when it was created.
      schema:
        type: string
    ResourceID:
      name: id
      in: path
      required: true
      description: The resource, as returned when it was created.
      schema:
        type: string
    PluginID:
      name: plugin_id
      in: path
      required: true
      description: A built-in catalog id such as slack or calendly.
      schema:
        type: string

  responses:
    BadRequest:
      description: The request was malformed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: The customer header is missing
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: >-
        The caller is known and this operation is server-side only. It needs
        Stream-Auth-Type: server and a token carrying server: true, which means it cannot
        be reached from an end user's device.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No such modality, provider or shortcut
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    SessionState:
      type: string
      enum: [live, ended]
      description: Whether the agent is still in the call.

    SessionTool:
      type: object
      required: [name, description]
      description: >
        One of the caller's own functions. The model is offered it by name and description;
        running it is the caller's business, over the events socket.
      properties:
        name:
          type: string
        description:
          type: string
          description: >
            What the model is told the tool does, which is the whole of how it decides when
            to reach for one.
        parameters:
          type: object
          additionalProperties: true
          description: A JSON Schema object describing the arguments.

    SessionSkill:
      type: object
      required: [name, description, instructions]
      description: >
        A kind of work worth handing to the slower model. There is nothing behind a skill
        but a better model: what it declares is the instructions that model answers under.
      properties:
        name:
          type: string
        description:
          type: string
          description: The one line the fast model sees.
        instructions:
          type: string
          description: The full prompt, which only the subagent sees.
        deadline_ms:
          type: integer
          format: int64
          description: How long the work may run before it is abandoned. Zero is the default.

    SessionMemory:
      type: object
      description: >
        Who the session's memories are about. Without a user id nothing is recalled or
        stored, which is the case for a call with nobody identified on it.
      properties:
        user_id:
          type: string
          description: Who the memories belong to. Empty means the customer.
        app_id:
          type: string
          description: Separates two deployments sharing one memory account.
        filter:
          type: object
          additionalProperties:
            type: string
          description: >
            The caller's own labels, which narrow recall further. They cannot widen it: a
            filter is applied alongside the user id, never instead of it.

    SessionPhone:
      type: object
      required: [number]
      description: The number the session acts from, which is what turns transferring on.
      properties:
        number:
          type: string
          description: One of the customer's own numbers, written as +15551234567.
        vendor:
          type: string
          description: Who carries an outbound leg.
        vendor_call_id:
          type: string
          description: >
            The outbound leg, set for a call the agent placed. Without one the agent has no
            keypad to press at.

    AgentMode:
      type: string
      enum: [voice, text]
      default: voice
      description: >
        Whether the agent is spoken to or written to. A voice agent joins a call,
        transcribes what it hears and speaks its replies. A text agent holds the same
        conversation in writing, so it uses neither speech target and a session created
        from it needs no call to join.

    AgentConfigRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: What the config is called, which is unique among the customer's own.
        mode:
          $ref: "#/components/schemas/AgentMode"
        stt:
          type: string
          description: >
            A provider/model or a capability shortcut. Empty leaves the default, and a
            text agent ignores it.
        tts:
          type: string
        voice:
          type: string
          description: Provider-specific voice id.
        llm:
          type: string
          description: The model holding the conversation.
        subagent:
          type: string
          description: >
            The model that does the thinking. Empty means the voice model answers
            everything itself, and skills mean nothing.
        search:
          type: string
          description: >
            What the agent finds out today's answers with, as a provider/model or a
            capability shortcut. Empty leaves the default, and a deployment that routes no
            search offers the tool to nobody either way.
        instructions:
          type: string
        greeting:
          type: string
        skills:
          type: array
          items:
            type: string
          description: >
            Skill names, either the customer's own or one of the built-in think, recall
            and explain. Omit for the built-in set.
        plugins:
          type: array
          items:
            type: string
          description: >
            Hosted MCP servers this agent may reach, named from the built-in catalog.
        keyterms:
          type: array
          items:
            type: string
          description: >
            Business-specific words the transcriber would otherwise get wrong, such as
            product or company names. Up to 100 terms, and providers that cannot be told
            about vocabulary ignore them.
        knowledge_namespace:
          type: string
          description: >
            What the agent may look things up in. Empty means it knows only what it was
            told.
        tags:
          type: object
          additionalProperties:
            type: string
          description: Cost labels, carried onto every request a session using it makes.

    AgentConfig:
      type: object
      required: [id, name, mode, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        mode:
          $ref: "#/components/schemas/AgentMode"
        stt:
          type: string
        tts:
          type: string
        voice:
          type: string
        llm:
          type: string
        subagent:
          type: string
        search:
          type: string
        instructions:
          type: string
        greeting:
          type: string
        skills:
          type: array
          items:
            type: string
        plugins:
          type: array
          items:
            type: string
        keyterms:
          type: array
          items:
            type: string
        knowledge_namespace:
          type: string
        tags:
          type: object
          additionalProperties:
            type: string
        sync_hash:
          type: string
          description: >
            Fingerprint of the last directory synced onto this config. Empty if it was
            never synced from a directory.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RouterConfigRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: What the config is called, which is unique among the customer's own.
        tags:
          type: object
          additionalProperties:
            type: string
          description: >
            Cost labels, carried onto every request made under this config. At most 16,
            keys matching ^[a-zA-Z0-9_.-]{1,64}$ and values under 256 characters, which is
            what the rollups can carry.
        stt:
          $ref: "#/components/schemas/SttOptions"
        tts:
          $ref: "#/components/schemas/TtsOptions"
        llm:
          $ref: "#/components/schemas/LlmOptions"
        search:
          $ref: "#/components/schemas/SearchOptions"

    RouterConfig:
      type: object
      required: [id, name, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        tags:
          type: object
          additionalProperties:
            type: string
        stt:
          $ref: "#/components/schemas/SttOptions"
        tts:
          $ref: "#/components/schemas/TtsOptions"
        llm:
          $ref: "#/components/schemas/LlmOptions"
        search:
          $ref: "#/components/schemas/SearchOptions"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SttOptions:
      type: object
      description: >
        How this config transcribes, live or from a recording. A field that only means
        something on one of the two forms says so: a recording has no endpointing to do,
        and a socket has no file to write subtitles from. A provider that cannot express a
        term refuses the request rather than dropping it silently.
      properties:
        target:
          type: string
          description: >
            A provider/model or a capability shortcut such as en-low-latency for the live
            path or en-recorded for a recording.
          example: en-low-latency
        languages:
          type: array
          items:
            type: string
          description: ISO codes candidates must cover. Empty with detect_language lets the provider decide.
          example: ["en"]
        detect_language:
          type: boolean
          description: Let the provider identify the language instead of being told it.
        sample_rate:
          type: integer
          description: Rate of the PCM sent on the socket. Zero means 16 kHz. Live only.
          example: 16000
        interim:
          type: boolean
          description: Emit partial transcripts as they firm up, not only final ones. Live only.
        endpointing:
          $ref: "#/components/schemas/Endpointing"
        silence_ms:
          type: integer
          description: How long a pause ends a turn, for silence endpointing. Live only.
          example: 300
        utterance_end_ms:
          type: integer
          description: How long after the last word an utterance is declared over. Live only.
        diarize:
          type: boolean
          description: Label each stretch of speech with who said it.
        max_speakers:
          type: integer
          minimum: 1
          maximum: 32
          description: >
            A hard cap on the speakers diarization may find, not a hint. Providers differ
            in what they allow, so one asked for more than it supports refuses.
        keyterms:
          type: array
          items:
            type: string
          description: >
            Business-specific words the transcriber would otherwise get wrong. Up to 100
            terms, and providers that cannot be told about vocabulary refuse them.
        format:
          type: boolean
          description: Punctuation, capitalisation and smart formatting of numbers and dates.
        redact:
          type: boolean
          description: Remove personally identifying information from the transcript.
        events:
          type: boolean
          description: Tag non-speech audio events such as laughter or music.
        channels:
          type: integer
          minimum: 1
          description: Transcribe a multichannel recording per channel rather than mixed down.
        words:
          type: boolean
          description: Word-level timestamps. Recording only.
        output:
          $ref: "#/components/schemas/TranscriptFormat"
        summary:
          type: boolean
          description: >
            Summarise the recording, where the provider offers audio intelligence.
            Recording only.
        entities:
          type: boolean
          description: Extract named entities from the recording. Recording only.

    Endpointing:
      type: string
      enum: [silence, semantic]
      description: >
        What decides a turn is over: a long enough pause, or a model reading the words and
        judging the sentence finished.

    TranscriptFormat:
      type: string
      enum: [json, srt, vtt]
      description: >
        What a finished transcript is rendered as. json carries the words and speakers;
        srt and vtt are subtitle files. Recording only.

    TtsOptions:
      type: object
      description: >
        How this config speaks. A provider that cannot express a term refuses the request
        rather than dropping it silently, since a voice asked to sound urgent and speaking
        flatly is worse than one that says it cannot.
      properties:
        target:
          type: string
          description: A provider/model or a capability shortcut.
          example: en-low-latency
        voice:
          type: string
          description: Provider-specific voice id.
        languages:
          type: array
          items:
            type: string
        speed:
          type: number
          format: float
          description: >
            Rate of delivery, 1 being the voice's own. Providers differ in the range they
            accept, so one asked for a speed outside its own refuses.
          example: 1
        volume:
          type: number
          format: float
          description: Loudness, 1 being the voice's own.
        emotion:
          type: string
          description: Affect to speak with, for the providers that take one.
        style:
          type: string
          description: Delivery style, for the providers that name styles rather than emotions.
        stability:
          type: number
          format: float
          description: How much the voice may vary between chunks. Higher is flatter and more consistent.
        similarity:
          type: number
          format: float
          description: How closely a cloned voice tracks its reference.
        format:
          type: string
          description: >
            Codec, sample rate and bitrate as one name - pcm_16000, mp3_44100_128,
            ulaw_8000 for telephony.
          example: pcm_16000
        pronunciations:
          type: object
          additionalProperties:
            type: string
          description: How to say words the voice gets wrong, keyed by the word.
        chunk_schedule:
          type: array
          items:
            type: integer
          description: >
            Character counts at which a streaming voice flushes audio. Smaller first
            values start speaking sooner and cost more requests. Live only.

    LlmOptions:
      type: object
      description: >
        How this config answers. The names are the response parameters the router already
        speaks rather than a second vocabulary for the same things.
      properties:
        target:
          type: string
          description: A provider/model or a capability shortcut.
          example: llm-fast
        instructions:
          type: string
          description: What the model answers under, when a request does not say.
        max_output_tokens:
          type: integer
        temperature:
          type: number
          format: float
        reasoning_effort:
          type: string
          enum: [minimal, low, medium, high]
          description: How long the model may think before answering, on the models that think.
        format:
          type: string
          enum: [text, json_object]
          description: Whether the answer is prose or a JSON object.
        verbosity:
          type: string
          enum: [low, medium, high]
        tool_choice:
          type: string
          description: >
            auto, none, required, or the name of a tool the model must call. Which tools
            exist is per-request, since they change with the turn.
        store:
          type: boolean
          description: Keep the response on the provider so a later one can continue from it.
        prompt_cache_key:
          type: string
          description: >
            What a cached prompt prefix is keyed by. Requests sharing a key and a prefix
            are read from the cache rather than charged in full.
        metadata:
          type: object
          additionalProperties:
            type: string
          description: Passed to the provider untouched, for the providers that store it.

    SearchOptions:
      type: object
      description: How this config finds out today's answers.
      properties:
        target:
          type: string
          description: A provider/model or a capability shortcut.
          example: search-fast
        depth:
          $ref: "#/components/schemas/SearchDepth"
        results:
          type: integer
          minimum: 1
          description: How many hits to return.
        include_domains:
          type: array
          items:
            type: string
          description: Only answer from these domains.
        exclude_domains:
          type: array
          items:
            type: string
        category:
          type: string
          description: >
            The kind of source to prefer - news, papers, company, github - for the
            providers that classify their index.
        max_age_hours:
          type: integer
          minimum: 0
          description: >
            How stale a cached page may be. Zero forces a live crawl, which is slower and
            costs more.
        location:
          type: string
          description: Country or region to answer from, for queries whose answer depends on where.
        contents:
          type: array
          items:
            type: string
            enum: [text, highlights, summary]
          description: What to return alongside each hit.
        output_schema:
          type: object
          additionalProperties: true
          description: >
            A JSON schema the answer must fit, for the providers that can be asked to
            structure what they found.

    SearchDepth:
      type: string
      enum: [instant, fast, standard, deep]
      description: >
        How much work a search is worth. instant answers from the index in a few hundred
        milliseconds; deep crawls and reasons over what it finds and can take tens of
        seconds. Providers offer different ladders, so each one maps these four onto its
        own.

    SearchRequest:
      type: object
      required: [query]
      properties:
        config_id:
          type: string
          description: >
            A stored router config to take the options from. Anything named here as well
            overrides that one field of it.
        query:
          type: string
          description: The question, in the caller's own words.
          example: perioperative antibiotic guidance
        options:
          $ref: "#/components/schemas/SearchOptions"
        tags:
          type: object
          additionalProperties:
            type: string

    SearchAnswer:
      type: object
      required: [provider, model, results]
      properties:
        provider:
          type: string
        model:
          type: string
        answer:
          type: string
          description: >
            The provider's own summary, where it offers one. It is what a voice agent
            wants: a sentence to say rather than a page to read.
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchResult"
          description: The sources behind it, most relevant first.

    SearchResult:
      type: object
      required: [url]
      properties:
        title:
          type: string
        url:
          type: string
        text:
          type: string
          description: The relevant extract, which is what a model reads.
        score:
          type: number
          format: float
          description: How relevant the provider judged it.

    RecordingSource:
      type: object
      description: >
        Where the audio to work on comes from. A URL is what every vendor's batch API
        takes and what anything longer than a clip should use; inline bytes save a caller
        with a short local file from having to host it somewhere first.
      properties:
        url:
          type: string
          description: A fetchable audio or video file.
        audio:
          type: string
          format: byte
          description: The file itself, base64. For clips - a long recording belongs behind a URL.

    RecordingStatus:
      type: string
      enum: [queued, running, completed, failed]
      description: >
        Where a job has got to. A failed job carries the reason in `error`, and a completed
        one carries its result.

    TranscriptionRequest:
      type: object
      required: [source]
      properties:
        config_id:
          type: string
          description: >
            A stored router config to take the options from. Anything named here as well
            overrides that one field of it.
        source:
          $ref: "#/components/schemas/RecordingSource"
        options:
          $ref: "#/components/schemas/SttOptions"
        callback:
          type: string
          description: >
            A URL the finished job is POSTed to, so a caller does not have to poll. The
            body is the same Transcription this returns.
        tags:
          type: object
          additionalProperties:
            type: string
          description: Cost labels for this job.

    Transcription:
      type: object
      required: [id, status, created_at, updated_at]
      properties:
        id:
          type: string
        status:
          $ref: "#/components/schemas/RecordingStatus"
        provider:
          type: string
        model:
          type: string
        language:
          type: string
          description: What was spoken, whether it was asked for or detected.
        text:
          type: string
          description: The whole transcript as prose.
        words:
          type: array
          items:
            $ref: "#/components/schemas/TranscriptWord"
          description: Present when word-level timestamps were asked for.
        speakers:
          type: array
          items:
            type: string
          description: The speakers diarization found, in the order they first spoke.
        subtitles:
          type: string
          description: The transcript as an SRT or VTT file, when one of those was asked for.
        summary:
          type: string
        entities:
          type: array
          items:
            $ref: "#/components/schemas/TranscriptEntity"
        audio_duration_ms:
          type: integer
          format: int64
          description: How long the recording was, which is what it was billed on.
        error:
          type: string
          description: Why the job failed, if it did.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time

    TranscriptWord:
      type: object
      required: [text, start_ms, end_ms]
      properties:
        text:
          type: string
        start_ms:
          type: integer
          format: int64
        end_ms:
          type: integer
          format: int64
        confidence:
          type: number
          format: float
        speaker:
          type: string
          description: Who said it, when diarization was asked for.

    TranscriptEntity:
      type: object
      required: [type, text]
      description: Something the recording named, for the providers that pick them out.
      properties:
        type:
          type: string
          example: person
        text:
          type: string
        start_ms:
          type: integer
          format: int64
        end_ms:
          type: integer
          format: int64

    SpeechRequest:
      type: object
      required: [text]
      properties:
        config_id:
          type: string
          description: >
            A stored router config to take the options from. Anything named here as well
            overrides that one field of it.
        text:
          type: string
          description: What to say. Whole paragraphs rather than the sentence at a time a socket takes.
        options:
          $ref: "#/components/schemas/TtsOptions"
        callback:
          type: string
          description: A URL the finished job is POSTed to, so a caller does not have to poll.
        tags:
          type: object
          additionalProperties:
            type: string

    Speech:
      type: object
      required: [id, status, created_at, updated_at]
      properties:
        id:
          type: string
        status:
          $ref: "#/components/schemas/RecordingStatus"
        provider:
          type: string
        model:
          type: string
        format:
          type: string
          description: What the audio is encoded as, which is what was asked for.
          example: mp3_44100_128
        url:
          type: string
          description: >
            Where the finished audio is, on a deployment that stores it. Empty means the
            audio came back inline instead.
        audio:
          type: string
          format: byte
          description: The audio itself, base64, when it was not stored behind a URL.
        audio_duration_ms:
          type: integer
          format: int64
        characters:
          type: integer
          format: int64
          description: How much text was spoken, which is what it was billed on.
        error:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time

    Plugin:
      type: object
      required: [id, name, category, description]
      description: One hosted MCP server from the built-in catalog.
      properties:
        id:
          type: string
        name:
          type: string
        category:
          type: string
        description:
          type: string
        instance_required:
          type: boolean
        instance_hint:
          type: string

    PluginConnection:
      type: object
      required: [plugin_id, name, status]
      description: A catalog plugin as this agent has it, including whether it is logged in.
      properties:
        plugin_id:
          type: string
        name:
          type: string
        category:
          type: string
        description:
          type: string
        instance_required:
          type: boolean
        instance_hint:
          type: string
        instance_url:
          type: string
        status:
          type: string
          enum: [pending, connected, failed]

    AuthorizePluginRequest:
      type: object
      properties:
        instance_url:
          type: string
          description: >
            The shop hostname or Salesforce my-domain. Required for plugins that have no
            single global URL.

    PluginAuthorization:
      type: object
      required: [authorize_url]
      properties:
        authorize_url:
          type: string
          description: The URL the browser should open to finish the login.

    SyncAgentRequest:
      type: object
      required: [name, hash]
      properties:
        name:
          type: string
          description: What the config is called, which is also the directory's name.
        hash:
          type: string
          description: >
            A fingerprint of the directory. A second sync with the same hash does
            nothing.
        instructions:
          type: string
        skills:
          type: array
          items:
            $ref: "#/components/schemas/SkillRequest"
        knowledge:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgeDocument"

    SyncAgentResult:
      type: object
      required: [unchanged, config]
      properties:
        unchanged:
          type: boolean
          description: True when the hash matched and nothing was written.
        config:
          $ref: "#/components/schemas/AgentConfig"

    VoiceRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: >
            What an agent config names the voice by, which is unique among the customer's
            own voices.
        description:
          type: string
          description: A note for whoever reads the voice back, and for the provider's dashboard.

    VoiceSampleRequest:
      type: object
      required: [audio]
      properties:
        audio:
          type: string
          format: byte
          description: The recording, base64 encoded. A minute of clean speech is plenty.
        filename:
          type: string
          description: >
            What to call the file upstream. The extension is how a provider knows what it
            was given, so send one.
        content_type:
          type: string
        transcript:
          type: string
          description: >
            What is said in the recording. Optional, and the providers that use one clone
            more faithfully with it.

    PrepareVoiceRequest:
      type: object
      properties:
        providers:
          type: array
          items:
            type: string
          description: >
            Which providers to teach the voice to. Empty means every provider this
            deployment can clone with.

    VoiceSample:
      type: object
      required: [id, created_at]
      properties:
        id:
          type: string
        filename:
          type: string
        content_type:
          type: string
        bytes:
          type: integer
          format: int64
        transcript:
          type: string
        created_at:
          type: string
          format: date-time

    VoiceBinding:
      type: object
      required: [provider, state]
      properties:
        provider:
          type: string
        external_id:
          type: string
          description: What this provider calls the voice.
        state:
          type: string
          enum: [pending, ready, failed]
        error:
          type: string
          description: Why the provider would not take the recordings, when it would not.
        updated_at:
          type: string
          format: date-time

    Voice:
      type: object
      required: [id, name, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        samples:
          type: array
          items:
            $ref: "#/components/schemas/VoiceSample"
        bindings:
          type: array
          items:
            $ref: "#/components/schemas/VoiceBinding"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SkillRequest:
      type: object
      required: [config_id, name, description, instructions]
      properties:
        config_id:
          type: string
          description: >
            The agent config this skill belongs to. A skill is not shared: two agents that
            both need one have one each, so editing either leaves the other alone.
        name:
          type: string
          description: >
            How the config names it, which is unique among that config's own skills.
        description:
          type: string
          description: The one line the fast model sees.
        instructions:
          type: string
          description: The full prompt, which only the subagent sees.
        deadline_ms:
          type: integer
          format: int64
          description: How long the work may run before it is abandoned. Zero is the default.

    Skill:
      type: object
      required: [id, config_id, name, description, instructions, created_at, updated_at]
      properties:
        id:
          type: string
        config_id:
          type: string
        name:
          type: string
        description:
          type: string
        instructions:
          type: string
        deadline_ms:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    KnowledgeDocument:
      type: object
      required: [source, text]
      properties:
        source:
          type: string
          description: >
            Where the document came from, as a reader would recognise it. Passage ids are
            keyed by it, so posting the same source again replaces what it wrote before.
          example: pricing.md
        text:
          type: string
          description: The document, whole. It is cut into passages here.

    IngestKnowledgeRequest:
      type: object
      required: [namespace, documents]
      properties:
        namespace:
          type: string
          description: >
            The knowledge base to write into, which is what a config's
            knowledge_namespace names. Knowledge is never shared, so there is no default.
          example: docs
        documents:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/KnowledgeDocument"
        chunk_size:
          type: integer
          description: >
            Characters per passage. Zero is the default, which is small enough that several
            passages fit in front of a model and large enough that one still answers the
            question on its own.

    IngestedKnowledge:
      type: object
      required: [namespace, documents, passages]
      properties:
        namespace:
          type: string
        documents:
          type: integer
          description: How many documents were read.
        passages:
          type: integer
          description: How many passages they were cut into and written as.

    KnowledgeUrlRequest:
      type: object
      required: [namespace, url]
      properties:
        namespace:
          type: string
          description: >
            The knowledge base to fill, which is what a config's knowledge_namespace names.
          example: docs
        url:
          type: string
          description: >
            The page to read. It must be http or https: this is handed to a crawler and
            then used to key the passages it becomes.
          example: https://example.com/pricing

    KnowledgeUrlState:
      type: string
      enum: [pending, indexed, failed]
      description: >
        Where the page has got to. Pending means it has been added but not yet read, which
        is also what a read that died halfway through leaves behind.

    KnowledgeUrl:
      type: object
      required: [id, namespace, url, state, passages, created_at, updated_at]
      properties:
        id:
          type: string
        namespace:
          type: string
        url:
          type: string
        title:
          type: string
          description: What the page called itself when it was last read.
        state:
          $ref: "#/components/schemas/KnowledgeUrlState"
        error:
          type: string
          description: Why the last read failed. Empty otherwise.
        passages:
          type: integer
          description: How many passages the page was last cut into.
        last_indexed_at:
          type: string
          format: date-time
          nullable: true
          description: >
            When it was last read successfully. Absent means never, which is what separates
            a page that has never worked from one that worked and has since broken.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CampaignRequest:
      type: object
      required: [name, config_id, from_number]
      properties:
        name:
          type: string
        config_id:
          type: string
          description: The agent config the calls are made with.
        from_number:
          type: string
          description: One of your own numbers, which is what the person sees.
        concurrency:
          type: integer
          description: How many of these calls may be happening at once.
          default: 1
        tags:
          type: object
          additionalProperties:
            type: string

    Campaign:
      type: object
      required: [id, name, config_id, from_number, concurrency, state, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        config_id:
          type: string
        from_number:
          type: string
        concurrency:
          type: integer
        state:
          type: string
          enum: [draft, running, paused, finished]
        tags:
          type: object
          additionalProperties:
            type: string
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time

    ContactsRequest:
      type: object
      required: [contacts]
      properties:
        contacts:
          type: array
          items:
            type: object
            required: [to_number]
            properties:
              to_number:
                type: string
              instructions:
                type: string
                description: >
                  What to say to this person, added to whatever the config already says.

    Contact:
      type: object
      required: [id, to_number, state, attempts]
      properties:
        id:
          type: string
        to_number:
          type: string
        instructions:
          type: string
        state:
          type: string
          enum: [pending, calling, done, failed]
        attempts:
          type: integer
        call_id:
          type: string
          description: The call this contact became, which is what the call paths take.
        vendor_call_id:
          type: string
        error:
          type: string
          description: Why they could not be rung, when they could not be.

    SimulationRequest:
      type: object
      required: [name, config_id, scenario, assertion]
      properties:
        name:
          type: string
        mode:
          type: string
          enum: [text, audio]
          description: >
            Text hands the agent the words, which tests everything between hearing and
            answering. Audio generates speech and runs the whole pipeline, so what is
            judged is what a caller would actually have heard. Text when left out.
        config_id:
          type: string
          description: The agent being tested.
        scenario:
          type: string
          description: >
            What to ask, in your own words and over as many turns as it takes. This is a
            brief for the caller rather than a script, so it may describe things that
            depend on what the agent says back.
        assertion:
          type: string
          description: What has to be true at the end for the run to have passed.
        variations:
          type: integer
          description: >
            How many ways of asking the same thing one run tries, up to ten. The scenario
            as written is always the first of them, and one is what left out means.
        judge_target:
          type: string
          description: >
            The model that rules on the conversations, named the way any other routing
            target is. Empty takes a quality tier, since nobody is waiting for it.
        caller_target:
          type: string
          description: The model that plays the caller. Empty takes a fast tier.
        caller_tts:
          type: string
          description: How the caller speaks. Audio simulations only.
        caller_stt:
          type: string
          description: How the caller hears the agent. Audio simulations only.
        caller_voice:
          type: string
          description: The voice the caller speaks in. Audio simulations only.
        max_turns:
          type: integer
          description: >
            How many times the caller may speak, up to thirty. It is what stops a caller
            that never decides it is finished. Twelve when left out.
        tags:
          type: object
          additionalProperties:
            type: string

    Simulation:
      type: object
      required: [id, name, mode, config_id, scenario, assertion, variations, max_turns, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        mode:
          type: string
          enum: [text, audio]
        config_id:
          type: string
        scenario:
          type: string
        assertion:
          type: string
        variations:
          type: integer
        judge_target:
          type: string
        caller_target:
          type: string
        caller_tts:
          type: string
        caller_stt:
          type: string
        caller_voice:
          type: string
        max_turns:
          type: integer
        tags:
          type: object
          additionalProperties:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SimulationRun:
      type: object
      required: [id, simulation_id, state, cases, passed, failed, started_at]
      properties:
        id:
          type: string
        simulation_id:
          type: string
        state:
          type: string
          enum: [running, passed, failed, cancelled, errored]
          description: >
            A run passed only if every one of its conversations did. A conversation that
            never got as far as a ruling leaves the run errored rather than failed.
        cases:
          type: integer
          description: How many conversations this run is having.
        passed:
          type: integer
        failed:
          type: integer
        mode:
          type: string
          enum: [text, audio]
        config_id:
          type: string
        scenario:
          type: string
        assertion:
          type: string
          description: >
            What was asked of this run, copied when it started. Editing a simulation does
            not rewrite what an old run tested.
        judge_target:
          type: string
        error:
          type: string
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        conversations:
          type: array
          description: >
            The conversations this run had. Present when one run is asked for, and left
            out of a list so that reading the log does not mean reading every transcript.
          items:
            $ref: "#/components/schemas/SimulationCase"

    SimulationCase:
      type: object
      required: [id, variation, scenario, state, turns, started_at]
      properties:
        id:
          type: string
        variation:
          type: integer
          description: Which way of asking this was, and the order they are listed in.
        scenario:
          type: string
          description: The wording this conversation used.
        state:
          type: string
          enum: [pending, running, passed, failed, errored, cancelled]
        call_id:
          type: string
          description: >
            The session that held it, which is what the call and transcript paths take. It
            is written as soon as it exists, so a conversation still going can be watched.
        transcript:
          type: array
          items:
            $ref: "#/components/schemas/SimulationLine"
        turns:
          type: integer
          description: How many times the caller spoke.
        passed:
          type: boolean
          description: >
            The judge's ruling. Absent when it never got as far as ruling, which is not the
            same as having ruled against.
        verdict:
          type: string
          description: What in the conversation decided it.
        score:
          type: integer
          description: How sure the judge was, from 1 to 5.
        ended:
          type: string
          enum: [complete, turns, timeout, failed]
          description: Why the conversation stopped.
        error:
          type: string
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time

    SimulationLine:
      type: object
      required: [caller, text]
      properties:
        caller:
          type: boolean
          description: True when the simulated caller said it rather than the agent.
        text:
          type: string
        intended:
          type: string
          description: >
            What the agent meant to say, where that differs from what the caller heard.
            Only an audio simulation has both, and the difference is what running one is
            for.
        at:
          type: string
          format: date-time
    Call:
      type: object
      required: [id, call_id, agent_id, direction, started_at]
      properties:
        id:
          type: string
          description: The session that ran the call, which is what it is held by.
        call_id:
          type: string
        agent_id:
          type: string
          description: Which agent ran it, and where its transcript is kept.
        config_id:
          type: string
        campaign_id:
          type: string
        contact_id:
          type: string
        from_number:
          type: string
        to_number:
          type: string
        direction:
          type: string
          enum: [inbound, outbound]
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          description: Absent while the call is still running.
        stt:
          type: string
          description: >
            The transcription target the call ran with, after a session's overrides were
            folded into whatever config it named. This is what was asked for rather than
            what each turn resolved to: a shortcut is several models and routing fails
            over between them, so per-turn providers are in the request rows.
        tts:
          type: string
          description: The voice target, on the same terms as stt.
        llm:
          type: string
          description: The target that held the conversation.
        subagent:
          type: string
          description: >
            The slower target delegated work ran on. Empty means nothing was delegated,
            which also means the skills below were never offered.
        stt_used:
          type: string
          description: >
            The provider/model that transcribed, once routing picked one. Empty until
            somebody has been heard, and the last one that served if routing failed over.
        tts_used:
          type: string
          description: The provider/model that spoke, on the same terms as stt_used.
        llm_used:
          type: string
          description: The provider/model that held the conversation.
        subagent_used:
          type: string
          description: >
            The provider/model delegated work ran on. Empty when nothing was handed over,
            or when the thinking target was never reached.
        instructions:
          type: string
          description: What the agent was told to be on this call.
        skills:
          type: array
          items:
            type: string
          description: >
            What the fast model could hand to the subagent. The instructions behind each
            name are in the skill registry.
        summary:
          type: string
          description: What a model made of the call, written once it was over.
        review_score:
          type: integer
          description: How well the agent handled it, from 1 to 5.
        review_notes:
          type: string
        tags:
          type: object
          additionalProperties:
            type: string

    TranscriptMessage:
      type: object
      required: [speaker, text, created_at]
      properties:
        speaker:
          type: string
          description: Who said it, the agent under its own user id.
        text:
          type: string
        created_at:
          type: string
          format: date-time

    CallTokenRequest:
      type: object
      properties:
        user_id:
          type: string
          description: >
            Who the browser joins as. Somebody watching a call is not the agent, so this
            defaults to a listener of its own rather than to the agent's user.
        user_name:
          type: string
          description: The name the other participants see. Defaults to the user id.

    CallToken:
      type: object
      required: [api_key, token, user_id, user_name, call_id, call_type, expires_at]
      properties:
        api_key:
          type: string
          description: The Stream app the call is in, which the browser SDK joins against.
        token:
          type: string
        user_id:
          type: string
        user_name:
          type: string
        call_id:
          type: string
          description: >
            The Stream call to join, which is not the id this call is held by here.
        call_type:
          type: string
        expires_at:
          type: string
          format: date-time

    ChatTokenRequest:
      type: object
      required: [agent_id]
      properties:
        agent_id:
          type: string
          description: >
            Whose conversation to read. This is the session's agent id, which is what
            names the channel it is written to.
        user_id:
          type: string
          description: >
            Who the browser reads as. Somebody watching is not the agent, so this defaults
            to a reader of its own rather than to the agent's user.
        user_name:
          type: string
          description: The name shown against anything they write. Defaults to the user id.

    ChatToken:
      type: object
      required:
        [api_key, token, user_id, user_name, channel_type, channel_id, expires_at]
      properties:
        api_key:
          type: string
          description: The Stream app the channel is in, which the browser SDK connects to.
        token:
          type: string
        user_id:
          type: string
        user_name:
          type: string
        channel_type:
          type: string
          description: Always agent, which is the type a conversation is written to.
        channel_id:
          type: string
          description: The channel holding the conversation, which is the agent id.
        expires_at:
          type: string
          format: date-time

    TimelineEntry:
      type: object
      required: [turn_id, started_at]
      properties:
        turn_id:
          type: string
        started_at:
          type: string
          format: date-time
        heard:
          type: string
          description: What the caller said, when it can be matched to this exchange.
        said:
          type: string
          description: What the agent answered.
        roundtrip_ms:
          type: number
          format: double
          description: How long the caller waited between finishing and being answered.
        audio_out_ms:
          type: number
          format: double
          description: How much the agent spoke.
        interrupted:
          type: boolean
          description: Whether the caller talked over the answer.

    CallEvent:
      type: object
      required: [at, kind, reason]
      properties:
        at:
          type: string
          format: date-time
        kind:
          $ref: "#/components/schemas/DecisionKind"
        reason:
          type: string
          description: Why the conversation chose it, in words.
        turn_id:
          type: string
          description: The exchange it was about, which lines it up against that turn's timings.
        participant:
          type: string
          description: Who it concerned.
        said:
          type: string
          description: >
            What was heard, what the agent decided to say, or what the subagent came back
            with.
        latency_ms:
          type: number
          format: double
          description: >
            What the flow controller took to rule, or what the subagent took to answer.
            Zero where nothing was asked.

    DecisionKind:
      type: string
      description: >
        What a conversation decided. Asking puts a settled turn to the flow controller;
        waiting leaves it because the caller has not finished; ignoring drops speech meant
        for somebody else; answering replies to it; queueing holds it until the agent has
        stopped talking; interrupting abandons the reply being spoken and shortening ends
        it early; a backchannel is a listening noise that never reaches the model;
        superseding drops a ruling about words that have since changed; compacting
        replaces old history with a summary; delegating hands work to the subagent and
        settling is that work coming back, answered or not.
      enum:
        - ask
        - wait
        - ignore
        - answer
        - queue
        - interrupt
        - shorten
        - backchannel
        - supersede
        - compact
        - delegate
        - settle
        - fail

    CreateSessionRequest:
      type: object
      properties:
        call_id:
          type: string
          description: The call to join. Required unless the session is text.
        text:
          type: boolean
          default: false
          description: >
            Hold the conversation in writing rather than on a call. Nothing is transcribed
            and nothing is spoken, so no call is joined and neither speech target is used.
            Everything between hearing and answering is unchanged: a text session has the
            same skills, knowledge and tools a call would have had, and its replies arrive
            as response_delta and responded events on the session's socket.
        config_id:
          type: string
          description: >
            An agent config to start from. Everything else in this request overrides what
            the config says, so a caller can reuse a configuration and still change one
            thing about this call.
        call_type:
          type: string
          default: default
        user_id:
          type: string
          description: Who the agent joins the call as.
          default: vision-agent
        user_name:
          type: string
          default: Vision Agent
        agent_id:
          type: string
          description: Keys transcripts and statistics. Empty means the call id.
        instructions:
          type: string
        greeting:
          type: string
          description: >
            Said on joining without going through the model. Empty means the agent waits to
            be spoken to.
        navigating:
          type: boolean
          default: false
          description: >
            The agent placed this call, so let recordings finish and answer their menus.
        llm:
          type: string
          description: >
            A provider/model or a capability shortcut. Omit it and the config decides,
            or llm-fast when there is no config. These carry no schema default on
            purpose: a generated client that filled one in would send it, and a caller
            naming a config would silently lose the model it configured.
        stt:
          type: string
          description: >
            Omit it and the config decides, or en-low-latency when there is no config.
        tts:
          type: string
          description: >
            Omit it and the config decides, or en-low-latency when there is no config.
        subagent:
          type: string
          description: >
            The model that does the thinking. Empty means the voice model answers
            everything itself, and skills mean nothing.
        search:
          type: string
          description: >
            Omit it and the config decides, or search-fast when there is no config.
        voice:
          type: string
          description: Provider-specific voice id.
        languages:
          type: array
          items:
            type: string
          description: Language hints, which narrow the candidates in every modality.
        keyterms:
          type: array
          items:
            type: string
          description: >
            Business-specific words the transcriber would otherwise get wrong. Up to 100
            terms, and providers that cannot be told about vocabulary ignore them.
        max_tokens:
          type: integer
        tasks:
          type: integer
          description: How much delegated work may run at once.
        sandbox:
          type: string
          enum: [daytona]
          description: >
            Where the subagent may run code it writes. Only the subagent is offered it:
            running code takes seconds, and the model holding the conversation has none to
            spare. Omit it and the subagent works everything out in its head.
        backchannel:
          type: boolean
          default: false
          description: Murmur while a participant is still talking, the way a person does.
        min_confidence:
          type: number
          format: double
          description: >
            How sure the transcriber must be before the agent answers rather than checks
            what was meant.
        skills:
          type: array
          items:
            $ref: "#/components/schemas/SessionSkill"
          description: Omit for the built-in set of think, recall and explain.
        skill_names:
          type: array
          items:
            type: string
          description: >
            Skills to look up rather than spell out: the customer's own, or one of the
            built-in think, recall and explain. Ignored when skills are given in full,
            and a name nothing defines is refused rather than dropped.
        tools:
          type: array
          items:
            $ref: "#/components/schemas/SessionTool"
        tool_timeout_ms:
          type: integer
          description: How long the model waits for a tool result. Zero is the default.
        tags:
          type: object
          additionalProperties:
            type: string
          description: Cost labels, carried onto every request the session makes.
        memory:
          $ref: "#/components/schemas/SessionMemory"
        phone:
          $ref: "#/components/schemas/SessionPhone"

    Session:
      type: object
      required: [id, call_id, call_type, user_id, agent_id, state, created_at]
      properties:
        id:
          type: string
        call_id:
          type: string
          description: Empty for a text session, which joins no call.
        text:
          type: boolean
          description: The conversation is held in writing rather than on a call.
        call_type:
          type: string
        user_id:
          type: string
        agent_id:
          type: string
        state:
          $ref: "#/components/schemas/SessionState"
        created_at:
          type: string
          format: date-time
        llm:
          type: string
          description: The provider and model answering, once routing has picked one.
        tts:
          type: string
          description: The provider and model speaking.
        stt:
          type: string
          description: The provider and model transcribing, once somebody has been heard.
        subagent:
          type: string
          description: The provider and model delegated work runs on.
        instructions:
          type: string

    SayRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string

    InstructionsRequest:
      type: object
      required: [instructions]
      properties:
        instructions:
          type: string

    HealthStatus:
      type: object
      required: [status, dependencies]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        dependencies:
          type: object
          additionalProperties:
            type: string
          description: Dependency name to "ok" or a failure description.
          example: { postgres: ok, redis: ok }

    Modality:
      type: string
      enum: [stt, tts, llm, search, memory, knowledge, phone]
      description: >
        What kind of work was done. The first four are routed across providers.
        Memory, knowledge and phone are recorded but not routed, since there is one
        memory store, one knowledge base and one vendor per number, so the provider
        paths do not serve them while the statistics paths do.
      example: tts

    Granularity:
      type: string
      enum: [hourly, daily]
      default: hourly

    Tier:
      type: string
      enum: [low-latency, high-quality]
      description: What the model optimises for.

    Provider:
      type: object
      required: [provider, model, languages, realtime, tier, health]
      properties:
        provider:
          type: string
          example: elevenlabs
        model:
          type: string
          example: eleven_flash_v2_5
        languages:
          type: array
          items:
            type: string
        realtime:
          type: boolean
        tier:
          $ref: "#/components/schemas/Tier"
        health:
          $ref: "#/components/schemas/ProviderHealth"

    ProviderHealth:
      type: object
      required: [available, requests, errors, error_rate, latency_ms_avg]
      properties:
        available:
          type: boolean
          description: False once the error rate crosses the configured threshold.
        requests:
          type: integer
          format: int64
          description: Requests seen in the current health window.
        errors:
          type: integer
          format: int64
        error_rate:
          type: number
          format: double
        latency_ms_avg:
          type: number
          format: double

    Candidate:
      type: object
      required: [provider, model, health]
      properties:
        provider:
          type: string
        model:
          type: string
        health:
          $ref: "#/components/schemas/ProviderHealth"

    StatsBucket:
      type: object
      required:
        [
          provider,
          model,
          bucket,
          audio_ms_total,
          characters_total,
          input_tokens_total,
          cached_input_tokens_total,
          output_tokens_total,
          cost_micros_total,
          request_count,
          error_count,
        ]
      properties:
        provider:
          type: string
        model:
          type: string
        bucket:
          type: string
          format: date-time
        audio_ms_total:
          type: integer
          format: int64
          description: Billable audio, transcribed or produced.
        characters_total:
          type: integer
          format: int64
          description: Billable text. Zero for providers that bill by audio.
        input_tokens_total:
          type: integer
          format: int64
          description: Prompt tokens read, cached ones included. Zero outside llm.
        cached_input_tokens_total:
          type: integer
          format: int64
          description: The part of the prompt served from the provider's cache.
        output_tokens_total:
          type: integer
          format: int64
          description: Generated tokens, reasoning included. Zero outside llm.
        cost_micros_total:
          type: integer
          format: int64
          description: Millionths of a dollar, priced from the configured rates.
        request_count:
          type: integer
          format: int64
        error_count:
          type: integer
          format: int64
        latency_p50_ms:
          type: number
          format: double
          nullable: true
        latency_p95_ms:
          type: number
          format: double
          nullable: true
        uptime:
          type: number
          format: double
          nullable: true
          description: Successes over total requests in the bucket.

    TagStatsBucket:
      type: object
      required:
        [
          tag_key,
          tag_value,
          bucket,
          audio_ms_total,
          characters_total,
          input_tokens_total,
          cached_input_tokens_total,
          output_tokens_total,
          cost_micros_total,
          request_count,
          error_count,
        ]
      properties:
        tag_key:
          type: string
          example: project
        tag_value:
          type: string
          example: moderation
        bucket:
          type: string
          format: date-time
        audio_ms_total:
          type: integer
          format: int64
        characters_total:
          type: integer
          format: int64
        input_tokens_total:
          type: integer
          format: int64
        cached_input_tokens_total:
          type: integer
          format: int64
        output_tokens_total:
          type: integer
          format: int64
        cost_micros_total:
          type: integer
          format: int64
          description: Millionths of a dollar, priced from the configured rates.
        request_count:
          type: integer
          format: int64
        error_count:
          type: integer
          format: int64
        latency_p50_ms:
          type: number
          format: double
          nullable: true
        latency_p95_ms:
          type: number
          format: double
          nullable: true
        uptime:
          type: number
          format: double
          nullable: true

    TurnStatsBucket:
      type: object
      required:
        [agent_id, bucket, turn_count, interrupted_count, audio_out_ms_total]
      properties:
        agent_id:
          type: string
        bucket:
          type: string
          format: date-time
        turn_count:
          type: integer
          format: int64
        interrupted_count:
          type: integer
          format: int64
          description: Turns a participant talked over before they finished.
        audio_out_ms_total:
          type: number
          format: double
          description: How much speech the agent published in the bucket.
        stt_latency_p50_ms:
          type: number
          format: double
          nullable: true
        stt_latency_p95_ms:
          type: number
          format: double
          nullable: true
        llm_ttft_p50_ms:
          type: number
          format: double
          nullable: true
        llm_ttft_p95_ms:
          type: number
          format: double
          nullable: true
        tts_ttfb_p50_ms:
          type: number
          format: double
          nullable: true
        tts_ttfb_p95_ms:
          type: number
          format: double
          nullable: true
        roundtrip_p50_ms:
          type: number
          format: double
          nullable: true
          description: Settled transcript to first audio published.
        roundtrip_p95_ms:
          type: number
          format: double
          nullable: true
        roundtrip_p99_ms:
          type: number
          format: double
          nullable: true

    PhoneVendor:
      type: object
      required: [vendor, implemented, ready, capabilities]
      properties:
        vendor:
          type: string
          example: twilio
        implemented:
          type: boolean
          description: Whether this service can actually work with the vendor.
        ready:
          type: boolean
          description: Implemented and holding every credential it needs.
        operations:
          type: array
          description: >
            What this service can do at the vendor. Eight vendors buy numbers and
            two of those also bridge calls, so a number is not bought from a
            vendor that cannot answer on it by accident.
          items:
            $ref: "#/components/schemas/PhoneOperation"
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/PhoneCapability"
        missing_credentials:
          type: array
          description: The environment variables the vendor needs and does not have.
          items:
            type: string

    PhoneOperation:
      type: string
      enum: [search, buy, release, attach, dial, send_digits]
      # Without these the generated constants are named Search, Buy and Dial, which are too
      # generic to sit at the top of a package that is mostly generated.
      x-enum-varnames:
        - PhoneOperationSearch
        - PhoneOperationBuy
        - PhoneOperationRelease
        - PhoneOperationAttach
        - PhoneOperationDial
        - PhoneOperationSendDigits

    PhoneCapability:
      type: string
      description: >
        What a number can carry. The names are Telnyx's feature names, because
        they are the widest vocabulary any of these vendors offers.
      enum:
        [
          voice,
          sms,
          mms,
          fax,
          emergency,
          hd_voice,
          international_sms,
          local_calling,
        ]

    PhoneNumberType:
      type: string
      description: What kind of number it is, which decides who pays for the call.
      enum: [local, toll_free, mobile]

    NumberSearchResult:
      type: object
      required: [numbers, skipped]
      properties:
        numbers:
          type: array
          description: What the vendors are offering, cheapest first.
          items:
            $ref: "#/components/schemas/AvailableNumber"
        skipped:
          type: array
          description: >
            Vendors that were not part of the answer. A search that reached two
            of eight vendors found what two vendors had, and deciding whether to
            buy needs to know which.
          items:
            $ref: "#/components/schemas/SkippedVendor"

    SkippedVendor:
      type: object
      required: [vendor, reason]
      properties:
        vendor:
          type: string
          example: twilio
        reason:
          type: string
          example: cannot search by administrative_area

    AvailableNumber:
      type: object
      required: [e164, vendor, country, capabilities]
      properties:
        e164:
          type: string
          example: "+15125551234"
        vendor:
          type: string
          description: Who is offering it, which is also who to buy it from.
          example: telnyx
        country:
          type: string
        region:
          type: string
        locality:
          type: string
        number_type:
          $ref: "#/components/schemas/PhoneNumberType"
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/PhoneCapability"
        monthly_cost_micros:
          type: integer
          format: int64
          description: Millionths of a dollar per month, zero when the vendor does not quote one.

    PhoneNumber:
      type: object
      required: [e164, vendor, country, capabilities, monthly_cost_micros, purchased_at]
      properties:
        e164:
          type: string
        vendor:
          type: string
        country:
          type: string
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/PhoneCapability"
        monthly_cost_micros:
          type: integer
          format: int64
        tags:
          type: object
          additionalProperties:
            type: string
          description: The customer's own cost labels.
        stream_trunk_id:
          type: string
          description: The SIP trunk calls to this number arrive on. Absent until attached.
        purchased_at:
          type: string
          format: date-time
        released_at:
          type: string
          format: date-time
          nullable: true

    BuyNumberRequest:
      type: object
      required: [vendor, e164]
      properties:
        vendor:
          type: string
          example: twilio
        e164:
          type: string
          example: "+15125551234"
        country:
          type: string
          description: >
            The country the number was offered from, as the search reported it.
            Most vendors buy by number alone; the few that buy out of a country's
            inventory need this, and it cannot be guessed back out of the number.
          example: US
        tags:
          type: object
          additionalProperties:
            type: string
          description: Cost labels carried onto the purchase's request row.

    AttachNumberRequest:
      type: object
      properties:
        call_id:
          type: string
          description: >
            The call every caller joins. Omit to give each caller their own call,
            named after the number they rang.
        call_type:
          type: string
          description: The Stream call type. Omit for "agent".
        allowed_ips:
          type: array
          description: The vendor's signalling addresses, as IPs or CIDR blocks.
          items:
            type: string

    AttachedNumber:
      type: object
      required: [trunk_id, route_id, sip_uri]
      properties:
        trunk_id:
          type: string
        route_id:
          type: string
        sip_uri:
          type: string
          description: Where the vendor sends calls, e.g. sip:trunk@sip.stream-io-api.com.

    PlaceCallRequest:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
          description: One of the customer's own numbers, which is what the person sees.
        to:
          type: string
        call_id:
          type: string
          description: >
            The Stream call the answered leg joins, and so the one the agent has to be
            in. Omit to have one named after this call, since two calls from the same
            number are two conversations.
        call_type:
          type: string
          description: The Stream call type. Omit for "agent".
        ring_timeout_seconds:
          type: integer
          description: >
            How long to ring before giving up. Omit to leave the vendor's default,
            which is long enough to reach voicemail. A vendor whose call API cannot
            express it refuses the call rather than ringing for its own default.
        initial_digits:
          type: string
          description: >
            Digits pressed once the person answers, for reaching an extension behind a
            menu, e.g. "ww1234#". w is a short pause and W a long one.
        custom:
          type: object
          description: >
            Put on the Stream call, where the agent in it can read it. It is set at
            Stream rather than at the vendor, so every vendor can carry it.
          additionalProperties:
            type: string
        headers:
          type: object
          description: >
            Carried to the person's leg as custom SIP headers. Only some vendors can
            express these, and one that cannot refuses the call.
          additionalProperties:
            type: string
        tags:
          type: object
          additionalProperties:
            type: string

    PlacedCall:
      type: object
      required: [vendor_call_id, status]
      properties:
        vendor_call_id:
          type: string
        status:
          type: string
          description: The vendor's own word for where the call is, e.g. "queued".
        vendor:
          type: string
          description: Who is placing the call.
        call_id:
          type: string
          description: >
            The Stream call the answered leg is routed into. An agent that is not in it
            hears nothing when the person picks up.
        call_type:
          type: string

    TransferCallRequest:
      type: object
      required: [from, to, call_id]
      properties:
        from:
          type: string
          description: >
            The customer's number the human is dialled from, which is what they see.
        to:
          type: string
          description: The human being brought onto the call.
        call_id:
          type: string
          description: The Stream call the caller and the agent are already on.
        call_type:
          type: string
          description: The Stream call type. Omit for "agent".
        tags:
          type: object
          additionalProperties:
            type: string

    PressDigitsRequest:
      type: object
      required: [vendor, digits]
      properties:
        vendor:
          type: string
          description: Who is carrying the call, e.g. "telnyx".
        digits:
          type: string
          description: >
            What to press. Only 0-9, * and # can be pressed, and w waits half a second
            between two of them.

    RollupRequest:
      type: object
      required: [from, to]
      properties:
        granularity:
          $ref: "#/components/schemas/Granularity"
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time

    RollupResult:
      type: object
      required: [granularity, buckets_written]
      properties:
        granularity:
          $ref: "#/components/schemas/Granularity"
        buckets_written:
          type: integer
          format: int64
