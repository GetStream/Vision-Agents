openapi: 3.0.3
info:
  title: Model Router
  version: 0.2.0
  description: >
    Routes speech-to-text and text-to-speech traffic across providers and reports
    what it cost. Every path is scoped by modality, so the same provider serving
    two modalities is reported on separately. The caller is identified by a
    trusted X-Customer-Id header, or by an API key and a token signed with its
    secret, depending on ROUTER_AUTH_MODE.

    Operations marked `x-server-side-only` are refused with a 403 unless the
    caller is a process the customer runs. Configuring an agent, replacing what
    it knows and waiting for calls to answer are all of that kind: an end user's
    device holding a token its own backend minted may hold a conversation, and
    may not rewrite the agent holding it. A server-side caller sends
    `Stream-Auth-Type: server` and a token carrying `server: true` and no
    `user_id` claim. Both are required, and the token is what proves it, since
    nothing signs the header.

servers:
  - url: http://localhost:8080

# Either the customer header, or an API key and the token signed with its secret. Which of
# the two a deployment accepts is ROUTER_AUTH_MODE, not a per-request choice: noauth reads
# the header and ignores keys, api_key verifies the pair and ignores the header.
security:
  - CustomerId: []
  - ApiKey: []
    AppToken: []
    AuthType: []

paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness and dependency check
      security: []
      responses:
        "200":
          description: The router is serving
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: A dependency is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /v1/{modality}/providers:
    get:
      operationId: listProviders
      summary: List the providers configured for a modality and their live health
      parameters:
        - $ref: "#/components/parameters/Modality"
      responses:
        "200":
          description: The configured providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Provider"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/{modality}/routes/{target}:
    get:
      operationId: resolveTarget
      summary: Resolve a provider name or capability shortcut to a ranked candidate list
      parameters:
        - $ref: "#/components/parameters/Modality"
        - name: target
          in: path
          required: true
          description: A "provider/model" name or a capability shortcut such as en-low-latency.
          schema:
            type: string
          example: en-low-latency
        - name: language
          in: query
          required: false
          description: Language hints that candidates must cover. Repeat for several.
          schema:
            type: array
            items:
              type: string
          example: ["en"]
      responses:
        "200":
          description: Candidates in preference order, best first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Candidate"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/{modality}/stats:
    get:
      operationId: getStats
      summary: Aggregated usage for the calling customer
      parameters:
        - $ref: "#/components/parameters/Modality"
        - name: granularity
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Granularity"
        - name: from
          in: query
          required: true
          description: Start of the window, inclusive.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          description: End of the window, exclusive.
          schema:
            type: string
            format: date-time
        - name: tag
          in: query
          required: false
          description: >
            Only count requests carrying every one of these cost labels, each written
            "key:value". Repeat for several. Filtering reads the request rows rather
            than the rollups, since a rollup bucket no longer knows which labels its
            requests carried.
          schema:
            type: array
            items:
              type: string
          example: ["project:moderation", "environment:dev"]
      responses:
        "200":
          description: One row per bucket, provider and model
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatsBucket"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/{modality}/stats/tags:
    get:
      operationId: getTagStats
      summary: Aggregated usage broken down by the values of one cost label
      description: >
        What drives the spend. Requests are labelled with whatever keys the customer
        chooses, so asking for key=project returns one row per project per bucket.
      parameters:
        - $ref: "#/components/parameters/Modality"
        - name: key
          in: query
          required: true
          description: The cost label to group by.
          schema:
            type: string
          example: project
        - name: granularity
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Granularity"
        - name: from
          in: query
          required: true
          description: Start of the window, inclusive.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          description: End of the window, exclusive.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: One row per bucket and label value
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TagStatsBucket"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/router/configs:
    get:
      operationId: listRouterConfigs
      summary: The router configs the calling customer holds
      description: >
        A router config is what an agent config is for a session, for a caller that routes
        one modality at a time: the target, the language and every per-modality option,
        decided once and named. It is separate from an agent config because it configures
        transcribing, speaking, answering and searching on their own, with no conversation
        behind them.
      responses:
        "200":
          description: The customer's router configs, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RouterConfig"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createRouterConfig
      x-server-side-only: true
      summary: Store a named set of per-modality routing options
      description: >
        A modality block that names no target falls back to what a session falls back to,
        so a config only has to say what it wants changed.

        Server-side only: it needs a server-side token, so it cannot be reached from an
        end user's device.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouterConfigRequest"
      responses:
        "201":
          description: The config was stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouterConfig"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/router/configs/{id}:
    get:
      operationId: getRouterConfig
      summary: One router config
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: The config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouterConfig"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateRouterConfig
      x-server-side-only: true
      summary: Replace a router config
      description: >
        Every field is written, so the body is what the config now is rather than what
        changed about it. Sockets already open keep the options they were started with.

        Server-side only: it needs a server-side token, so it cannot be reached from an
        end user's device.
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouterConfigRequest"
      responses:
        "200":
          description: The config as it now is
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouterConfig"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteRouterConfig
      x-server-side-only: true
      summary: Delete a router config
      description: >
        The requests that ran under it still name it, so the config stops being usable
        rather than stops having existed.

        Server-side only: it needs a server-side token, so it cannot be reached from an
        end user's device.
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "204":
          description: The config is gone
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/turns/stats:
    get:
      operationId: getTurnStats
      summary: Conversational latency for the calling customer
      description: >
        One row per bucket and agent. A request row measures one provider call; a turn
        measures what the caller felt, from finishing a sentence to hearing the answer
        start, with the transcription, model and voice legs kept apart so a slow
        conversation can be attributed.
      parameters:
        - name: agent_id
          in: query
          required: false
          description: Narrow to one agent. Omit for every agent the customer runs.
          schema:
            type: string
        - name: granularity
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Granularity"
        - name: from
          in: query
          required: true
          description: Start of the window, inclusive.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          description: End of the window, exclusive.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: One row per bucket and agent
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TurnStatsBucket"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/phone/vendors:
    get:
      operationId: listPhoneVendors
      summary: List the telephony vendors and whether they can be used
      description: >
        Every vendor this service knows about. A vendor that is declared but not
        implemented is listed rather than hidden, so what is missing is visible
        before a number is bought.
      responses:
        "200":
          description: The declared vendors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PhoneVendor"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/phone/numbers/available:
    get:
      operationId: searchPhoneNumbers
      summary: Search for numbers to buy, at one vendor or all of them
      description: >
        Naming a vendor searches only that one. Leaving it out asks every vendor
        that has its credentials, at once, and merges what they offer cheapest
        first. Vendors do not agree on how a search can be narrowed, so one whose
        API cannot express a filter is reported in `skipped` rather than asked
        without it, which would answer a search for one place with numbers from
        another.
      parameters:
        - name: vendor
          in: query
          required: false
          description: One vendor to search. Absent searches every usable vendor.
          schema:
            type: string
          example: telnyx
        - name: country
          in: query
          required: true
          description: ISO 3166-1 alpha-2 country code.
          schema:
            type: string
          example: US
        - name: area_code
          in: query
          required: false
          schema:
            type: string
        - name: contains
          in: query
          required: false
          description: Digits the number must contain, anywhere in it.
          schema:
            type: string
        - name: prefix
          in: query
          required: false
          description: >
            Digits the number must start with, matched after the country dial
            code. This differs from `contains` in where the digits have to fall.
          schema:
            type: string
          example: "719"
        - name: locality
          in: query
          required: false
          description: A city, region or rate centre.
          schema:
            type: string
          example: Denver
        - name: administrative_area
          in: query
          required: false
          description: A US state or Canadian province.
          schema:
            type: string
          example: CO
        - name: number_type
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/PhoneNumberType"
        - name: features
          in: query
          required: false
          description: >
            Capabilities every number must have. Repeat the parameter to require
            several. A vendor that cannot filter on one still reports what its
            numbers carry, so these are checked on the results either way.
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/PhoneCapability"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: What the vendors are offering, and which could not answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NumberSearchResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/phone/numbers:
    get:
      operationId: listPhoneNumbers
      summary: The numbers the calling customer holds
      parameters:
        - name: include_released
          in: query
          required: false
          description: >
            Include numbers that have been given back. A released number keeps its
            row, because what it cost while it was held is still part of that
            month's bill.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: The customer's numbers, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PhoneNumber"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: buyPhoneNumber
      summary: Buy a number, which starts its monthly charge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuyNumberRequest"
      responses:
        "201":
          description: The number is bought and recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneNumber"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/phone/numbers/{e164}:
    delete:
      operationId: releasePhoneNumber
      summary: Give a number back, which stops its monthly charge
      parameters:
        - name: e164
          in: path
          required: true
          description: The number in +15551234567 form.
          schema:
            type: string
          example: "+15125551234"
      responses:
        "204":
          description: The number was released
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/phone/numbers/{e164}/attach:
    post:
      operationId: attachPhoneNumber
      summary: Point a number at a Stream call
      description: >
        Creates the SIP inbound trunk and routing rule and tells the vendor to send
        calls there. This is what turns a bought number into one that reaches an
        agent.
      parameters:
        - name: e164
          in: path
          required: true
          schema:
            type: string
          example: "+15125551234"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachNumberRequest"
      responses:
        "200":
          description: The number now reaches a call
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachedNumber"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/phone/calls:
    post:
      operationId: placePhoneCall
      summary: Place an outbound call and bridge it into a Stream call
      description: >
        Stream's SIP is inbound only, so the vendor originates the call and connects
        it to a trunk the agent is already on, rather than Stream dialling out.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaceCallRequest"
      responses:
        "202":
          description: The vendor is placing the call
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlacedCall"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/phone/calls/transfer:
    post:
      operationId: transferPhoneCall
      summary: Bring a human onto a call that is already happening
      description: >
        Stream's SIP is inbound only, so a transfer is a second leg rather than a
        handover: the vendor dials the human and the answered leg is routed into the
        same Stream call, after which the agent can leave. The caller is never moved,
        so nothing is lost if nobody answers.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferCallRequest"
      responses:
        "202":
          description: The vendor is dialling the human
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlacedCall"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/phone/calls/{vendor_call_id}/digits:
    post:
      operationId: pressPhoneDigits
      summary: Press digits on a call placed from here
      description: >
        For getting past a menu on an outbound call. The call is named by the id its
        vendor gave when it was dialled, so only calls placed from this service can be
        pressed at. Not every vendor can do this without ending the call it is on, and
        one that cannot says so.
      parameters:
        - name: vendor_call_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PressDigitsRequest"
      responses:
        "204":
          description: The digits were pressed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/agents/sync:
    post:
      operationId: syncAgent
      x-server-side-only: true
      summary: Store an agent directory's instructions, skills and knowledge
      description: >
        Reads as "this is what the agent is", from a directory of instructions.md,
        skills/ and knowledge/. The hash is a fingerprint of that directory: a second
        call with the same hash does nothing, so a process that syncs on startup is
        cheap when nothing has changed.

        Models, voice and the rest of a config are left alone. This path only writes
        what a directory can hold.

        Server-side only: it needs a server-side token, so it cannot be reached from an
        end user's device.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncAgentRequest"
      responses:
        "200":
          description: The config as stored, or as it already was
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncAgentResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/agents/configs:
    get:
      operationId: listAgentConfigs
      summary: The agent configs the calling customer holds
      responses:
        "200":
          description: The customer's configs, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentConfig"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createAgentConfig
      x-server-side-only: true
      summary: Store a named configuration a session can be created from
      description: >
        A config holds what a caller would otherwise repeat on every call: the models, the
        voice, the instructions and which skills the subagent may be handed. What is about
        one conversation rather than the agent behind it, the call id above all, stays in
        the create-session request.

        Server-side only: it needs a server-side token, so it cannot be reached from an
        end user's device.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentConfigRequest"
      responses:
        "201":
          description: The config was stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentConfig"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/agents/configs/{id}:
    get:
      operationId: getAgentConfig
      summary: One agent config
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: The config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentConfig"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateAgentConfig
      x-server-side-only: true
      summary: Replace an agent config
      description: >
        Every field is written, so the body is what the config now is rather than what
        changed about it. Sessions already running keep the configuration they started
        with.

        Server-side only: it needs a server-side token, so it cannot be reached from an
        end user's device.
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentConfigRequest"
      responses:
        "200":
          description: The config as it now is
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentConfig"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteAgentConfig
      x-server-side-only: true
      summary: Delete an agent config
      description: >
        Calls that already ran under it keep naming it, so the config stops being usable
        rather than stops having existed.

        Server-side only: it needs a server-side token, so it cannot be reached from an
        end user's device.
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "204":
          description: The config is gone
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/agents/plugins:
    get:
      operationId: listPlugins
      summary: The hosted MCP servers an agent may attach
      description: >
        A built-in catalog, not the customer's own rows. q filters by name, category or
        description. Connecting one is a login on a config, not a change to this list.
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Filter by name, category or description.
      responses:
        "200":
          description: Matching plugins, in catalog order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Plugin"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/agents/plugins/callback:
    get:
      operationId: pluginOAuthCallback
      summary: Finish a plugin login
      description: >
        The provider redirects here with a code. The path is unauthenticated because the
        browser arrives from the identity provider, and the state is the secret.
      security: []
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: The browser is sent back to the agent editor

