    Call:
      properties:
        agent_id:
          description: Which agent ran it, and where its transcript is kept.
          type: string
        call_id:
          type: string
        campaign_id:
          type: string
        config_id:
          type: string
        contact_id:
          type: string
        direction:
          enum:
            - inbound
            - outbound
          type: string
        ended_at:
          description: Absent while the call is still running.
          format: date-time
          type: string
        from_number:
          type: string
        id:
          description: The session that ran the call, which is what it is held by.
          type: string
        instructions:
          description: What the agent was told to be on this call.
          type: string
        llm:
          description: The target that held the conversation.
          type: string
        llm_used:
          description: The provider/model that held the conversation.
          type: string
        mode:
          $ref: '#/components/schemas/SessionMode'
        review_notes:
          type: string
        review_score:
          description: How well the agent handled it, from 1 to 5.
          type: integer
        skills:
          description: What the fast model could hand to the subagent. The instructions behind each name are in the skill registry.
          items:
            type: string
          type: array
        started_at:
          format: date-time
          type: string
        sts:
          description: The speech-to-speech target, for a native call, on the same terms as stt.
          type: string
        sts_used:
          description: The provider/model that held a native call, on the same terms as stt_used.
          type: string
        stt:
          description: 'The transcription target the call ran with, after a session''s overrides were folded into whatever config it named. This is what was asked for rather than what each turn resolved to: a shortcut is several models and routing fails over between them, so per-turn providers are in the request rows.'
          type: string
        stt_used:
          description: The provider/model that transcribed, once routing picked one. Empty until somebody has been heard, and the last one that served if routing failed over.
          type: string
        summary:
          description: What a model made of the call, written once it was over.
          type: string
        tags:
          additionalProperties:
            type: string
          type: object
        thinking_llm:
          description: The target delegated work ran on. Empty means nothing was delegated, which also means the skills below were never offered. A text call names its llm, which runs its skills too.
          type: string
        thinking_llm_used:
          description: The provider/model delegated work ran on. Empty when nothing was handed over, or when the thinking target was never reached.
          type: string
        to_number:
          type: string
        tts:
          description: The voice target, on the same terms as stt.
          type: string
        tts_used:
          description: The provider/model that spoke, on the same terms as stt_used.
          type: string
        usage:
          $ref: '#/components/schemas/CallUsage'
        user_id:
          description: Who the agent spoke to, as the client's own token named them. Empty for a call the customer's backend opened, and for telephony, where the number is the name.
          type: string
        voice:
          description: The voice the call asked for, in the provider's own terms. Empty means the provider's default.
          type: string
        voice_used:
          description: The voice that spoke, which is the provider's default when none was asked for. Known only while the call is running.
          type: string
      required:
        - agent_id
        - call_id
        - direction
        - id
        - started_at
      type: object
    CallEvent:
      properties:
