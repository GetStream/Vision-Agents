        from_number:
          description: One of your own numbers, which is what the person sees.
          type: string
        name:
          type: string
        tags:
          additionalProperties:
            type: string
          type: object
      required:
        - config_id
        - from_number
        - name
      type: object
    Candidate:
      properties:
