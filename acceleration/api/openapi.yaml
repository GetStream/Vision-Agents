          format: date-time
          type: string
        kind:
          $ref: '#/components/schemas/DecisionKind'
        latency_ms:
          description: What the flow controller took to rule, or what the subagent took to answer. Zero where nothing was asked.
          format: double
          type: number
        participant:
          description: Who it concerned.
          type: string
        reason:
          description: Why the conversation chose it, in words.
          type: string
        said:
          description: What was heard, what the agent decided to say, or what the subagent came back with.
          type: string
        turn_id:
          description: The exchange it was about, which lines it up against that turn's timings.
          type: string
      required:
        - at
        - kind
        - reason
      type: object
    CallToken:
      properties:
        api_key:
          description: The Stream app the call is in, which the browser SDK joins against.
          type: string
        call_id:
          description: The Stream call to join, which is not the id this call is held by here.
          type: string
        call_type:
          type: string
        expires_at:
          format: date-time
          type: string
        token:
          type: string
        user_id:
          type: string
        user_name:
          type: string
      required:
        - api_key
        - call_id
        - call_type
        - expires_at
        - token
        - user_id
        - user_name
      type: object
    CallTokenRequest:
      properties:
        user_id:
          description: Who the browser joins as. Somebody watching a call is not the agent, so this defaults to a listener of its own rather than to the agent's user.
          type: string
        user_name:
          description: The name the other participants see. Defaults to the user id.
          type: string
      type: object
    CallUsage:
      description: 'What the call spent, summed over every request it made. Counted once the call is over, so it is absent while one is still running. Requests that failed are included: a model that read the prompt and then fell over is still billed for it.'
      properties:
        cached_input_tokens:
          description: The part of those prompts a provider served from its own cache.
          format: int64
          type: integer
        cost_micros:
          description: Millionths of a dollar, priced from the providers' configured rates.
          format: int64
          type: integer
        input_tokens:
          description: Every prompt the models read, the cached part included.
          format: int64
          type: integer
        output_tokens:
          description: Everything the models generated, reasoning included.
          format: int64
          type: integer
        requests:
          description: How many calls to a model it took, transcription and speech included.
          format: int64
          type: integer
      required:
        - cached_input_tokens
        - cost_micros
        - input_tokens
        - output_tokens
        - requests
      type: object
    Campaign:
      properties:
        concurrency:
          type: integer
        config_id:
          type: string
        created_at:
          format: date-time
          type: string
        finished_at:
          format: date-time
          type: string
        from_number:
          type: string
        id:
          type: string
        name:
          type: string
        started_at:
          format: date-time
          type: string
        state:
