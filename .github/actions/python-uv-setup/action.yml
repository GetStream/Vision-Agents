name: Python + uv setup
description: Checkout, set up uv/Python, and sync dev deps
inputs:
  python-version:
    description: Python version to install
    required: false
    default: "3.13.9"
  sync-flags:
    description: Extra flags for uv sync (e.g., --all-extras --dev)
    required: false
    default: "--all-extras --dev --frozen"
  working-directory:
    description: Directory to run in
    required: false
    default: "."
  enable-cache:
    description: Restore and save uv's download cache; "false" in a job that holds an OIDC token
    required: false
    default: "true"
  cpu-torch:
    description: Install the CPU build of torch, without the CUDA packages its PyPI build needs on Linux
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Install uv
      id: setup_uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      with:
        python-version: ${{ inputs.python-version }}
        version: "0.13.6"
        enable-cache: ${{ inputs.enable-cache }}
        prune-cache: false
        cache-suffix: ${{ inputs.python-version }}${{ inputs.cpu-torch == 'true' && '-cpu-torch' || '' }}
        cache-dependency-glob: |
          **/pyproject.toml
          **/uv.lock

    - name: Log cache status
      shell: bash
      run: |
        echo "uv download cache hit: ${{ steps.setup_uv.outputs['cache-hit'] }}"

    - name: Install the project dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CPU_TORCH: ${{ inputs.cpu-torch }}
      run: |
        if [ "$CPU_TORCH" != true ]; then
          uv sync ${{ inputs.sync-flags }}
          exit 0
        fi
        # On Linux, torch from PyPI is the CUDA build. Its CUDA packages (about 3 GB) are
        # locked for Linux only and named nvidia-*, cuda-* or triton.
        locked=$(uv export ${{ inputs.sync-flags }} --no-hashes --no-header --no-annotate)
        skip=$(grep -E "^(torch|torchvision|torchaudio)==|^(nvidia-|cuda-|triton)[^ ]*==.*sys_platform == 'linux'" <<< "$locked" | cut -d= -f1)
        uv sync ${{ inputs.sync-flags }} $(printf -- '--no-install-package %s ' $skip)
        uv pip install --no-deps --index-url https://download.pytorch.org/whl/cpu \
          $(grep -E '^(torch|torchvision|torchaudio)==' <<< "$locked" | cut -d' ' -f1 | sed 's/$/+cpu/')
