name: Integration (router)
# The router's `-tags integration` suites that need Postgres, each package in its own job on its
# own Postgres and Redis. CI (unit) runs `go test ./...` without the tag, so these ran only on
# laptops. Not a required check. Vendor suites (tts, stt, llm, sts, search, imagegen, detection)
# need API keys, so they are not here.
on:
  push:
    branches: [ "main", "accelerate" ]
    paths:
      - 'acceleration/**'
      - 'go.work'
      - 'go.work.sum'
      - '.github/workflows/integration.yml'
  pull_request:
    branches: [ "**" ]
    paths:
      - 'acceleration/**'
      - 'go.work'
      - 'go.work.sum'
      - '.github/workflows/integration.yml'

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        package:
          - cmd/router
          - internal/agent
          - internal/api
          - internal/appconfig
          - internal/channels
          - internal/connectors/credentialstores/pgsealed
          - internal/connectors/resolver
          - internal/decisionrouter
          - internal/eventforward
          - internal/imagerouter
          - internal/knowledge/urls
          - internal/llmrouter
          - internal/metered
          - internal/omnichannel
          - internal/phone
          - internal/policy
          - internal/routing
          - internal/sandbox/egress
          - internal/scheduling
          - internal/session
          - internal/store
          - internal/streamapp
          - internal/stsrouter
          - internal/sttrouter
          - internal/ttsrouter
          - internal/tts/voices
          - internal/users
    # acceleration/internal/config/testing.yaml wins over the environment and names these two
    # host ports, so the services listen there and no ROUTER_* variable is set.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: acceleration/go.mod
          cache-dependency-path: |
            acceleration/go.sum
            sdks/go/go.sum
            tui/go.sum
            benchmark/go.sum

      - name: Test ${{ matrix.package }}
        run: go test -tags integration -p 1 -count=1 -timeout 30m ./${{ matrix.package }}
        working-directory: acceleration
