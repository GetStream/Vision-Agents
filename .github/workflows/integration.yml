name: Integration (router)
# The router's `-tags integration` suites that need Postgres, in six jobs: each runs its group of
# packages one at a time on its own Postgres and Redis. Groups, not a job per package, because each
# job spends about 35 s on setup; the groups are balanced by test time on CI, so a new package goes
# in the lightest one. CI (unit) runs `go test ./...` without the tag, so only this workflow runs
# these suites on CI. Not a required check. Vendor suites (tts, stt, llm, sts, search, imagegen, detection)
# need API keys, so they are not here. internal/campaign, internal/phone/outcome,
# internal/searchrouter and internal/simulation are Postgres suites left out of the matrix too
# (simulation also needs an OpenAI key). imagerouter and dlc are left out of the matrix: AI-2040.
# mem0 is the exception: whose memories a session reads is decided by mem0's own filters, so
# the jobs marked `mem0` run its live suites with the MEM0_API_KEY secret on a push, and skip them
# on a pull request, which is given no secrets.
on:
  push:
    branches: [ "main" ]
    paths:
      - 'acceleration/**'
      - '!**/*.md'
      - 'go.work'
      - 'go.work.sum'
      - '.github/workflows/integration.yml'
  pull_request:
    branches: [ "**" ]
    paths:
      - 'acceleration/**'
      - '!**/*.md'
      - 'go.work'
      - 'go.work.sum'
      - '.github/workflows/integration.yml'

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    name: integration (${{ matrix.group }})
    runs-on: ubuntu-latest
    # MEM0_API_KEY lives in this environment, which a pull request's code never enters.
    environment: ${{ github.event_name == 'push' && matrix.mem0 && 'integration' || '' }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # A test that fails on CI at the base is skipped in its job, so the rest of the package
        # still gates. `skip` is a `go test -skip` regex: `^Suite$/^Test$`, the suite named too.
        # It applies to every package in the group.
        include:
          - group: agent
            packages: ./internal/agent
          - group: store
            packages: >-
              ./internal/store ./internal/concurrency ./internal/connectors/core ./internal/usage
              ./internal/live ./internal/users ./internal/streamapp
          # AI-2003, and claiming a guest does not move its memories yet. Both levels of a
          # skip are alternations, so it also names pairs that do not exist.
          - group: api
            packages: ./internal/api ./internal/memory/mem0 ./internal/phone/siptrunk ./internal/omnichannel
            skip: '^(TestConnectionProxyOffSuite|TestMemorySuite)$/^(TestTheConnectionEndpointsAnswerAsOnBase|TestAClaimedGuestsMemoriesMoveToTheUserWhoClaimedThem)$'
            mem0: true
            ffmpeg: true
          - group: router
            packages: ./cmd/router ./internal/session ./cmd/usage
          - group: routers
            packages: >-
              ./internal/routing ./internal/channels ./internal/sandbox/daytona ./internal/phone
              ./internal/sttrouter ./internal/harness ./internal/ttsrouter
          - group: rest
            packages: >-
              ./internal/channelbridge ./internal/tts/voices ./internal/llmrouter ./internal/policy
              ./internal/stsrouter ./internal/sandbox/egress ./internal/knowledge/urls
              ./internal/metered ./internal/quota ./internal/scheduling ./internal/limitnotice
              ./internal/appconfig ./internal/decisionrouter ./internal/eventforward
              ./internal/chatinbound ./internal/connectors/resolver
              ./internal/connectors/credentialstores/pgsealed ./internal/usage/ledger
              ./internal/usage/server
            # AI-2037
            skip: '^TestResolverSuite$/^TestAConnectedConnectionResolvesToACredentialTheProviderTakes$'
    # Each service listens on a host port the runner picks: a fixed one is sometimes already
    # held on the runner, and the job then fails before its first test.
    # Postgres keeps its data in memory: the suites truncate their tables before every test,
    # and on disk each TRUNCATE waits on fsync.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # goaec3, the echo canceller, is a private GetStream module: Go fetches it over git with
      # a read-only token, and only it skips the public proxy and checksum database.
      - name: Give Go read access to the private goaec3 module
        env:
          GOAEC3_READ_TOKEN: ${{ secrets.GOAEC3_READ_TOKEN }}
        run: |
          if [ -z "$GOAEC3_READ_TOKEN" ]; then
            echo "::error::GOAEC3_READ_TOKEN is not available to this run (fork pull requests get no secrets); acceleration/ cannot fetch github.com/GetStream/goaec3"
            exit 1
          fi
          git config --global url."https://x-access-token:${GOAEC3_READ_TOKEN}@github.com/GetStream/goaec3".insteadOf "https://github.com/GetStream/goaec3"
          echo "GOPRIVATE=github.com/GetStream/goaec3" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version-file: acceleration/go.mod
          cache-dependency-path: |
            acceleration/go.sum
            sdks/go/go.sum
            tui/go.sum

      # acceleration/internal/config/testing.yaml wins over the environment and is embedded at
      # build time, so the suites reach the services only through the ports written into it.
      - name: Point testing.yaml at this job's services
        run: |
          [[ "$POSTGRES_PORT" =~ ^[0-9]+$ && "$REDIS_PORT" =~ ^[0-9]+$ ]]
          sed -i -e "s/localhost:55432\//localhost:$POSTGRES_PORT\//" -e "s/localhost:56379\$/localhost:$REDIS_PORT/" internal/config/testing.yaml
          grep -q "localhost:$POSTGRES_PORT/" internal/config/testing.yaml
          grep -q "localhost:$REDIS_PORT\$" internal/config/testing.yaml
          echo "postgres on $POSTGRES_PORT, redis on $REDIS_PORT"
        env:
          POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
          REDIS_PORT: ${{ job.services.redis.ports['6379'] }}
        working-directory: acceleration

      # internal/api sends a video to a response, whose frames are cut with ffmpeg, and fails
      # on CI without it.
      - name: Install ffmpeg
        if: matrix.ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      # -p 1 runs the group's packages one at a time: they share this job's Postgres and Redis.
      - name: Test ${{ matrix.group }}
        run: go test -tags integration -p 1 -count=1 -timeout 30m -skip "$SKIP" $PACKAGES
        env:
          GOEXPERIMENT: simd
          PACKAGES: ${{ matrix.packages }}
          SKIP: ${{ matrix.skip }}
          MEM0_API_KEY: ${{ github.event_name == 'push' && matrix.mem0 && secrets.MEM0_API_KEY || '' }}
          RUN_MEM0_SUITE: ${{ github.event_name == 'push' && matrix.mem0 && secrets.MEM0_API_KEY != '' && '1' || '' }}
        working-directory: acceleration
