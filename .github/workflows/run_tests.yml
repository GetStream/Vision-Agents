name: _run-tests
on:
  workflow_call:
    inputs:
      marker:
        description: 'pytest -m expression (e.g., `not integration` or `integration`)'
        required: true
        type: string
      pytest-params:
        description: 'additional pytest params'
        required: false
        default: ""
        type: string
      notify-on-failure:
        description: 'Post to Slack on test failure'
        required: false
        default: false
        type: boolean
      ref:
        description: 'Branch to check out; empty checks out the commit that triggered the run'
        required: false
        default: ""
        type: string
concurrency:
  group: ${{ github.workflow }}-${{ inputs.marker }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  # If set, uv will run without updating the uv.lock file. Equivalent to the `uv run --frozen`.
  UV_FROZEN: "1"

jobs:
  # Run linters in one step to reduce checkout & dependencies setup overhead
  lint:
    name: Lint (ruff + mypy + validate pyproject.toml)
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - name: Install dependencies
        uses: ./.github/actions/python-uv-setup
        with:
          python-version: "3.12.13"
      # Run ruff
      - name: Run Ruff linter
        run: uv run ruff check .
      - name: Run Ruff formatter
        run: uv run ruff format --check .
      # Validate extras are defined in pyproject.toml
      - name: Validate extra dependencies in "sdks/python/pyproject.toml"
        run: uv run dev.py validate-extras
      # The generated client is committed; a spec change without a regen fails here. Status, not
      # `git diff`, so a new generated file that is untracked fails too.
      - name: Check the stream plugin's generated client is in step with the spec
        run: |
          uv run plugins/stream/generate.py
          changed=$(git status --porcelain -- plugins/stream/vision_agents/plugins/stream/_generated)
          if [ -n "$changed" ]; then echo "$changed"; git diff; exit 1; fi
      # Run mypy. A cache key is written once and never updated, so each push to main or
      # accelerate saves its own, and every other run starts from the newest one.
      - name: Restore mypy cache
        uses: actions/cache/restore@v5
        with:
          path: .mypy_cache
          key: mypy-cache-${{ hashFiles('pyproject.toml', 'uv.lock') }}-${{ github.sha }}
          restore-keys: |
            mypy-cache-${{ hashFiles('pyproject.toml', 'uv.lock') }}-
            mypy-cache-
      - name: Run mypy for core
        run: uv run --no-sync dev.py mypy
      - name: Run mypy for plugins
        run: uv run --no-sync dev.py mypy-plugins
      - name: Save mypy cache
        if: github.event_name == 'push'
        uses: actions/cache/save@v5
        with:
          path: .mypy_cache
          key: mypy-cache-${{ hashFiles('pyproject.toml', 'uv.lock') }}-${{ github.sha }}

  test:
    name: Test "${{ inputs.marker }}"
    runs-on: ubuntu-latest
    env:
      ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
      DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      FAL_KEY: ${{ secrets.FAL_KEY }}
      FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      STREAM_API_KEY: ${{ secrets.STREAM_API_KEY }}
      STREAM_API_SECRET: ${{ secrets.STREAM_API_SECRET }}
      TELNYX_API_KEY: ${{ secrets.TELNYX_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      TURBOPUFFER_API_KEY: ${{ secrets.TURBOPUFFER_API_KEY }}
      AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
      AWS_BEDROCK_API_KEY: ${{ secrets.AWS_BEDROCK_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
      INWORLD_API_KEY: ${{ secrets.INWORLD_API_KEY }}
      TWELVELABS_API_KEY: ${{ secrets.TWELVELABS_API_KEY }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libportaudio2
      - name: Install dependencies
        uses: ./.github/actions/python-uv-setup
        with:
          python-version: "3.12.13"
      # The VAD and turn models land in the temp dir by default and are otherwise fetched
      # from GitHub and Hugging Face on every run.
      - name: Cache ONNX models
        uses: actions/cache@v4
        with:
          path: |
            /tmp/silero_vad.onnx
            /tmp/smart-turn-v3.0.onnx
          key: onnx-models-${{ hashFiles('sdks/python/vision_agents/core/vad/silero.py', 'plugins/smart_turn/vision_agents/plugins/smart_turn/smart_turn_detection.py') }}
      # Unit tests spread over every core; integration tests stay serial so the providers'
      # rate limits see one caller.
      - name: Run core tests
        run: uv run --no-sync pytest -m "${{ inputs.marker }}" ${{ inputs.marker != 'integration' && '-n auto --dist worksteal' || '' }} tests/ ${{ inputs.pytest-params }}
      - name: Run plugin tests
        run: uv run --no-sync pytest -m "${{ inputs.marker }}" ${{ inputs.marker != 'integration' && '-n auto --dist worksteal' || '' }} plugins/*/tests/*.py ${{ inputs.pytest-params }}
      - name: Notify Slack on failure
        if: failure() && inputs.notify-on-failure
        uses: ./.github/actions/notify-slack
        with:
          workflow-name: ${{ github.workflow }}
          report-file: .report.json
          summary: "${{ github.workflow }} failed"
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
