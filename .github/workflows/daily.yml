name: Integration (daily)
on:
  schedule:
    # Runs at 03:00 UTC daily — adjust as needed
    - cron: '0 3 * * *'
  workflow_dispatch: { }

permissions:
  contents: read

jobs:
  integration:
    uses: ./.github/workflows/run_tests.yml
    with:
      marker: 'integration'
      pytest-params: "--json-report --json-report-file=.report.json"
      notify-on-failure: true
      # The provider keys and the Slack webhook live in this environment. Its rules let only
      # main, accelerate and v* tags run this workflow.
      environment: integration
    secrets: inherit
