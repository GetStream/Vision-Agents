name: Integration (daily)
on:
  schedule:
    # Runs at 03:00 UTC daily — adjust as needed
    - cron: '0 3 * * *'
  workflow_dispatch: { }

permissions:
  actions: write
  contents: read

jobs:
  integration:
    uses: ./.github/workflows/run_tests.yml
    with:
      marker: 'integration'
      pytest-params: "--json-report --json-report-file=.report.json"
      notify-on-failure: true
      # A schedule only fires on the default branch, so it tests accelerate, where the
      # work happens; Run workflow on any other branch tests that branch.
      ref: ${{ github.ref_name == github.event.repository.default_branch && 'accelerate' || '' }}
    secrets: inherit
