name: CI (unit)
on:
  push:
    branches: [ "**" ]
    paths-ignore:
      - '**/*.md'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.gif'
      - '**/*.mp3'
      - '**/*.mp4'
      - '**/*.wav'
      - 'LICENSE'
      - '.gitignore'
      - '.dockerignore'
      - '.git-blame-ignore-revs'
      - 'assets/**'
      - 'docs/**'
      - '.coderabbit.yaml'
      - '.cursor/**'
      - '.claude/**'
      - '.idea/**'
  pull_request:
    branches: [ "**" ]
    paths-ignore:
      - '**/*.md'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.gif'
      - '**/*.mp3'
      - '**/*.mp4'
      - '**/*.wav'
      - 'LICENSE'
      - '.gitignore'
      - '.dockerignore'
      - '.git-blame-ignore-revs'
      - 'assets/**'
      - 'docs/**'
      - '.coderabbit.yaml'
      - '.cursor/**'
      - '.claude/**'
      - '.idea/**'

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  unit:
    uses: ./.github/workflows/run_tests.yml
    with:
      marker: 'not integration'
    secrets: inherit

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: acceleration/go.mod
          cache-dependency-path: |
            acceleration/go.sum
            sdks/go/go.sum

      # cmd/transcribe and cmd/agent decode and encode Opus through cgo, so the codecs have
      # to be present before the acceleration module will build at all.
      - name: Install the audio codecs
        run: sudo apt-get update && sudo apt-get install -y pkg-config libopus-dev libopusfile-dev libsoxr-dev

      # The server, the Go client and the Python client all come from one spec, so a spec
      # edited without regenerating them is a spec the three have already drifted from.
      - name: Check the generated code is in step with the spec
        run: |
          (cd acceleration && go tool oapi-codegen -config api/oapi-codegen.yaml api/openapi.yaml)
          (cd sdks/go && go generate ./...)
          git diff --exit-code -- acceleration/internal/api/generated.go sdks/go/acceleration/generated.go

      - name: Vet the backend
        run: go vet ./...
        working-directory: acceleration

      - name: Test the backend
        run: go test ./...
        working-directory: acceleration

      - name: Vet the SDK
        run: go vet ./...
        working-directory: sdks/go

      - name: Test the SDK
        run: go test -race ./...
        working-directory: sdks/go

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install
        run: npm ci

      # The dashboard's types come from the same spec the Go and Python clients do, so a
      # spec edited without regenerating them is a dashboard already reading a shape the
      # router no longer answers with.
      - name: Check the generated types are in step with the spec
        run: |
          npm run types
          git diff --exit-code -- src/lib/api.d.ts

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

# Cancel in-flight runs for the same branch/PR when new commits arrive
concurrency:
  group: ci-unit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
