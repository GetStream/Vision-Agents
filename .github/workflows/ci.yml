name: CI (unit)
# Feature branches run through pull_request; a push of the same commit would be a second,
# uncancellable copy of every job.
on:
  push:
    branches: [ "main", "accelerate" ]
    paths-ignore:
      - '**/*.md'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.gif'
      - '**/*.mp3'
      - '**/*.mp4'
      - '**/*.wav'
      - 'LICENSE'
      - '.gitignore'
      - '.dockerignore'
      - '.git-blame-ignore-revs'
      - 'assets/**'
      - 'docs/**'
      - '.coderabbit.yaml'
      - '.cursor/**'
      - '.claude/**'
      - '.idea/**'
  pull_request:
    branches: [ "**" ]
    paths-ignore:
      - '**/*.md'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.gif'
      - '**/*.mp3'
      - '**/*.mp4'
      - '**/*.wav'
      - 'LICENSE'
      - '.gitignore'
      - '.dockerignore'
      - '.git-blame-ignore-revs'
      - 'assets/**'
      - 'docs/**'
      - '.coderabbit.yaml'
      - '.cursor/**'
      - '.claude/**'
      - '.idea/**'

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  unit:
    uses: ./.github/workflows/run_tests.yml
    with:
      marker: 'not integration'
    secrets: inherit

  go:
    runs-on: ubuntu-latest
    # The backend tests that need Redis skip without ROUTER_REDIS_ADDR (cmd/router, internal/session):
    # the service gives them one. The health check holds the steps until it answers PING.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: acceleration/go.mod
          cache-dependency-path: |
            acceleration/go.sum
            sdks/go/go.sum
            tui/go.sum
            benchmark/go.sum

      # The spec is rendered from the server's Go operations and the clients are generated
      # from the spec, so any of them left behind has already drifted from the others.
      - name: Check the generated code is in step with the spec
        run: |
          (cd acceleration && go run ./cmd/openapi)
          (cd sdks/go && go generate ./...)
          git diff --exit-code -- acceleration/api/openapi.yaml sdks/go/acceleration/generated.go

      - name: Vet the backend
        run: go vet ./...
        working-directory: acceleration

      - name: Test the backend
        run: go test ./...
        working-directory: acceleration
        env:
          ROUTER_REDIS_ADDR: localhost:6379

      - name: Vet phonecheck
        run: go vet ./...
        working-directory: acceleration/cmd/phonecheck

      - name: Test phonecheck
        run: go test -race ./...
        working-directory: acceleration/cmd/phonecheck

      - name: Compile STS integration tests
        run: go test -tags integration -run '^$' -exec=true ./internal/sts/...
        working-directory: acceleration

      - name: Vet the SDK
        run: go vet ./...
        working-directory: sdks/go

      - name: Test the SDK
        run: go test -race ./...
        working-directory: sdks/go

      - name: Vet the terminal UI
        run: go vet ./...
        working-directory: tui

      - name: Test the terminal UI
        run: go test -race ./...
        working-directory: tui

      # Without the webrtc tag Voicebench builds its transports as stubs, so its scoring,
      # reporting and world server are tested here without live calls or native libraries.
      - name: Vet Voicebench
        run: go vet ./...
        working-directory: benchmark

      - name: Test Voicebench
        run: go test ./...
        working-directory: benchmark

  js:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/js
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdks/js/package-lock.json

      - name: Install
        run: npm ci

      # The generated types are committed so that installing the package needs no code
      # generation, which only holds while they are the ones the spec describes.
      - name: Check the generated types are in step with the spec
        run: npm run types -- --check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  dotnet:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/dotnet
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: sdks/dotnet/global.json

      - name: Check the generated models are in step with the spec
        run: dotnet run --project tools/Generate -- --check

      - name: Check formatting
        run: dotnet format --verify-no-changes

      - name: Build
        run: dotnet build -warnaserror

      - name: Test
        run: dotnet test --no-build

  php:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/php
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer

      - name: Install
        run: composer install --no-interaction --no-progress

      - name: Check the generated classes are in step with the spec
        run: composer generate-check

      - name: Analyse
        run: composer stan

      - name: Test
        run: composer test

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/rust
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdks/rust

      - name: Check the generated types are in step with the spec
        run: cargo run -p generate -- --check

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  ruby:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/ruby
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: sdks/ruby

      # The default task checks the generated spec table against the spec, then runs the tests.
      - name: Check and test
        run: bundle exec rake

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7

      - name: Check for dashboard
        id: dashboard
        working-directory: .
        run: echo "present=$([[ -f dashboard/package-lock.json ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        if: steps.dashboard.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install
        if: steps.dashboard.outputs.present == 'true'
        run: npm ci

      # The dashboard's types come from the same spec the Go and Python clients do, so a
      # spec edited without regenerating them is a dashboard already reading a shape the
      # router no longer answers with.
      - name: Check the generated types are in step with the spec
        if: steps.dashboard.outputs.present == 'true'
        run: |
          npm run types
          git diff --exit-code -- src/lib/api.d.ts

      - name: Lint
        if: steps.dashboard.outputs.present == 'true'
        run: npm run lint

      - name: Build
        if: steps.dashboard.outputs.present == 'true'
        run: npm run build

# Cancel in-flight runs for the same branch/PR when new commits arrive
concurrency:
  group: ci-unit-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
