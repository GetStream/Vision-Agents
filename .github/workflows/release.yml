name: Integration (pre-release / release)
on:
  release:
    types: [published] # Run after a Github publish

permissions:
  contents: read

# Only a release of the Python packages, tagged vX.Y.Z, publishes them. A release made for
# another tag, such as accelerate-vX.Y.Z or sdk-dotnet-vX.Y.Z, runs nothing here.
jobs:
  integration:
    if: startsWith(github.event.release.tag_name, 'v')
    uses: ./.github/workflows/run_tests.yml
    with:
      marker: 'integration'
      # The provider keys live in this environment.
      environment: integration
    secrets: inherit

  build-core:
    name: Build & Test Core SDK
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    environment: pypi
    # The OIDC token is this job's alone, so the integration job, which holds every
    # provider secret, cannot mint one.
    permissions:
      contents: read
      id-token: write       # REQUIRED for PyPI Trusted Publishing (OIDC)
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      # No dependency cache in a job that holds an OIDC token: a cache poisoned by another
      # run would hand that token to whatever it planted.
      - uses: ./.github/actions/python-uv-setup
        with:
          enable-cache: "false"

      - name: Clean dist directory
        run: |
          rm -rf dist

      - name: Build all distributions
        run: |
          uv build --all

      - name: Extract package version (hatch via uv)
        id: get_version
        working-directory: sdks/python
        run: |
          VERSION=$(uvx -q hatch version)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish to PyPI (Trusted Publishing)
        run: uv publish

  test-core-index:
    name: Verify PIP install works
    needs: build-core
    runs-on: ubuntu-latest
    env:
      UV_NO_SOURCES: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/python-uv-setup

      - name: Install core PyPI using uv
        run: |
          uv pip install vision-agents==${{ needs.build-core.outputs.version }}