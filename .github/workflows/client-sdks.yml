name: CI (client SDKs)
# Feature branches run through pull_request; a push of the same commit would be a second,
# uncancellable copy of every job.
on:
  push:
    branches: [ "main", "accelerate" ]
    paths:
      - 'sdks/kotlin/**'
      - 'sdks/swift/**'
      - 'sdks/dart/**'
      - 'examples/voice_agents/swift_demo/app/**'
      - 'examples/voice_agents/android_demo/**'
      - 'acceleration/api/openapi.yaml'
      - '.github/workflows/client-sdks.yml'
  pull_request:
    branches: [ "**" ]
    paths:
      - 'sdks/kotlin/**'
      - 'sdks/swift/**'
      - 'sdks/dart/**'
      - 'examples/voice_agents/swift_demo/app/**'
      - 'examples/voice_agents/android_demo/**'
      - 'acceleration/api/openapi.yaml'
      - '.github/workflows/client-sdks.yml'

permissions:
  contents: read
  pull-requests: read

# The live posture tests are left out: they skip without INTEGRATION_ROUTER_KEY and
# VISION_AGENTS_URL, which nothing here sets.
jobs:
  # A pull request builds only the SDKs it touches, so a Dart change does not wait on the
  # macOS runner. A push to main or accelerate builds them all.
  changes:
    runs-on: ubuntu-latest
    outputs:
      kotlin: ${{ steps.filter.outputs.kotlin }}
      dart: ${{ steps.filter.outputs.dart }}
      swift: ${{ steps.filter.outputs.swift }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            kotlin:
              - 'sdks/kotlin/**'
              - 'examples/voice_agents/android_demo/**'
              - 'acceleration/api/openapi.yaml'
              - '.github/workflows/client-sdks.yml'
            dart:
              - 'sdks/dart/**'
              - 'acceleration/api/openapi.yaml'
              - '.github/workflows/client-sdks.yml'
            swift:
              - 'sdks/swift/**'
              - 'examples/voice_agents/swift_demo/app/**'
              - 'acceleration/api/openapi.yaml'
              - '.github/workflows/client-sdks.yml'

  kotlin:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.kotlin == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/kotlin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # The runner carries an Android SDK, but not necessarily compileSdk 37.
      - name: Android platform 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" >/dev/null

      # PostureTest reads acceleration/api/openapi.yaml, so a spec change that opens or
      # closes an operation the SDK calls fails here.
      - name: Test and build core
        run: ./gradlew :core:testDebugUnitTest :core:assembleRelease

      # Against core as it is in this checkout, through an included build.
      - name: Build android_demo
        working-directory: examples/voice_agents/android_demo
        run: ./gradlew :app:assembleDebug

      - uses: astral-sh/setup-uv@v6

      - name: Generated models match the spec
        run: |
          uv run generate.py
          changed=$(git status --porcelain -- core/src/main/kotlin/io/getstream/visionagents/android/core/generated)
          if [ -n "$changed" ]; then echo "$changed"; git diff; exit 1; fi

  dart:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.dart == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Check and test core
        working-directory: sdks/dart/core
        run: |
          dart pub get
          dart format --set-exit-if-changed .
          dart analyze
          dart run tool/generate.dart --check
          dart test

      - name: Check and test chat
        working-directory: sdks/dart/chat
        run: |
          dart pub get
          dart format --set-exit-if-changed .
          dart analyze
          dart test

  swift:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.swift == 'true'
    # The examples add StreamChatAI, whose iOS 13 target Xcode 26 refuses beside MarkdownUI's
    # iOS 15. macos-26 carries only Xcode 26; this image carries 27, betas included.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.0'

      - uses: astral-sh/setup-uv@v6

      - uses: actions/cache@v4
        id: generator
        with:
          path: .codegen/swift/swift-openapi-generator
          key: swift-openapi-generator-1.13.1-${{ runner.os }}-xcode27

      - name: Build swift-openapi-generator
        if: steps.generator.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/oapigen .codegen/swift
          cat > /tmp/oapigen/Package.swift <<'EOF'
          // swift-tools-version:6.0
          import PackageDescription
          let package = Package(
              name: "oapigen",
              dependencies: [.package(url: "https://github.com/apple/swift-openapi-generator", exact: "1.13.1")]
          )
          EOF
          swift build -c release --product swift-openapi-generator --package-path /tmp/oapigen
          cp /tmp/oapigen/.build/release/swift-openapi-generator .codegen/swift/

      - name: Generated client matches the spec
        run: |
          uv run sdks/swift/generate.py
          changed=$(git status --porcelain -- sdks/swift/core/Sources/VisionAgentsCore/Generated)
          if [ -n "$changed" ]; then echo "$changed"; git diff; exit 1; fi

      # Both builds resolve into one checkout directory and compile into one DerivedData, so
      # the Stream SDKs and WebRTC are fetched and built once a run rather than twice.
      - uses: actions/cache/restore@v4
        id: packages
        with:
          path: ${{ runner.temp }}/spm
          key: spm-${{ runner.os }}-xcode27-${{ hashFiles('sdks/swift/**/Package.swift', 'sdks/swift/**/Package.resolved', 'examples/voice_agents/swift_demo/app/SwiftDemo.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-xcode27-

      # The package is iOS only, so it is tested on a simulator rather than with `swift test`.
      - name: Build core tests
        working-directory: sdks/swift/core
        timeout-minutes: 15
        run: |
          device=$(xcrun simctl list devices available -j | python3 -c "import json, sys; devices = json.load(sys.stdin)['devices']; print(next(d['udid'] for runtime, found in devices.items() if 'iOS' in runtime for d in found if d['name'].startswith('iPhone')))")
          echo "SIMULATOR=$device" >> "$GITHUB_ENV"
          xcodebuild build-for-testing -scheme vision-agents-core -destination "platform=iOS Simulator,id=$device" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" -derivedDataPath "$RUNNER_TEMP/DerivedData"

      # Booting takes this runner minutes and starves whatever runs beside it, and tests
      # started before it has finished time out, so it boots alone between build and test.
      - name: Boot the simulator
        timeout-minutes: 10
        run: xcrun simctl bootstatus "$SIMULATOR" -b

      # Parallel testing clones the simulator, and a clone left behind keeps xcodebuild
      # waiting after the tests have finished. A failure's diagnostics take the simulator
      # ten minutes to give up on and add nothing the test log lacks.
      - name: Test core
        working-directory: sdks/swift/core
        timeout-minutes: 10
        run: |
          xcodebuild test-without-building -scheme vision-agents-core -destination "platform=iOS Simulator,id=$SIMULATOR" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -parallel-testing-enabled NO -disable-concurrent-destination-testing -collect-test-diagnostics never

      - name: Shut down the simulator
        if: always() && env.SIMULATOR != ''
        run: xcrun simctl shutdown "$SIMULATOR" || true

      - name: Build swift_demo
        working-directory: examples/voice_agents/swift_demo/app
        timeout-minutes: 10
        run: |
          xcodebuild -project SwiftDemo.xcodeproj -scheme SwiftDemo -destination 'generic/platform=iOS Simulator' \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" -derivedDataPath "$RUNNER_TEMP/DerivedData" build

      # Saved even when a test fails, so a red run still leaves the next one a warm cache.
      - uses: actions/cache/save@v4
        if: always() && steps.packages.outcome == 'success' && steps.packages.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/spm
          key: ${{ steps.packages.outputs.cache-primary-key }}

concurrency:
  group: ci-client-sdks-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
