name: CI (client SDKs)
on:
  push:
    branches: [ "**" ]
    paths:
      - 'sdks/kotlin/**'
      - 'sdks/swift/**'
      - 'sdks/dart/**'
      - 'examples/voice_agents/swift_demo/app/**'
      - 'examples/video_agents/flower_spotter/app/**'
      - 'acceleration/api/openapi.yaml'
      - '.github/workflows/client-sdks.yml'
  pull_request:
    branches: [ "**" ]
    paths:
      - 'sdks/kotlin/**'
      - 'sdks/swift/**'
      - 'sdks/dart/**'
      - 'examples/voice_agents/swift_demo/app/**'
      - 'examples/video_agents/flower_spotter/app/**'
      - 'acceleration/api/openapi.yaml'
      - '.github/workflows/client-sdks.yml'

permissions:
  contents: read

# The live posture tests are left out: they skip without INTEGRATION_ROUTER_KEY and
# VISION_AGENTS_URL, which nothing here sets.
jobs:
  kotlin-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/kotlin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # PostureTest reads acceleration/api/openapi.yaml, so a spec change that opens or
      # closes an operation the SDK calls fails here.
      - name: Test core
        run: ./gradlew -PcoreOnly :core:test

  kotlin-android:
    runs-on: ubuntu-latest
    # compileSdk 37, which this image carries and the runner's own Android SDK may not.
    container:
      image: cimg/android:2026.08.1
      options: --user root
    defaults:
      run:
        working-directory: sdks/kotlin
    steps:
      - uses: actions/checkout@v4

      - name: Build ui, rtc and chat
        run: ./gradlew :ui:assembleRelease :rtc:assembleRelease :chat:assembleRelease

  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Check and test core
        working-directory: sdks/dart/core
        run: |
          dart pub get
          dart format --set-exit-if-changed .
          dart analyze
          dart run tool/generate.dart --check
          dart test

      - name: Check and test chat
        working-directory: sdks/dart/chat
        run: |
          dart pub get
          dart format --set-exit-if-changed .
          dart analyze
          dart test

  swift:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # The examples add StreamChatAI, which needs Xcode 27 to resolve with SwiftPM.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # The package is iOS only, so it is tested on a simulator rather than with `swift test`.
      - name: Test core
        working-directory: sdks/swift/core
        run: |
          device=$(xcrun simctl list devices available -j | python3 -c "import json, sys; devices = json.load(sys.stdin)['devices']; print(next(d['udid'] for runtime, found in devices.items() if 'iOS' in runtime for d in found if d['name'].startswith('iPhone')))")
          xcodebuild test -scheme vision-agents-core -destination "platform=iOS Simulator,id=$device"

      - name: Build swift_demo
        working-directory: examples/voice_agents/swift_demo/app
        run: xcodebuild -project SwiftDemo.xcodeproj -scheme SwiftDemo -destination 'generic/platform=iOS Simulator' build

      - name: Build flower_spotter
        working-directory: examples/video_agents/flower_spotter/app
        run: xcodebuild -project FlowerSpotter.xcodeproj -scheme FlowerSpotter -destination 'generic/platform=iOS Simulator' build

concurrency:
  group: ci-client-sdks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
