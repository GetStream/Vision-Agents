[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "vision-agents-plugins-omni"
dynamic = ["version"]
description = "Omni messaging for Vision Agents - Slack, WhatsApp, RCS, SMS and iMessage as Stream Chat messages"
readme = "README.md"
keywords = ["getstream", "chat", "slack", "whatsapp", "rcs", "sms", "imessage", "agents"]
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "getstream>=4.1.0,<5",
]

[project.urls]
Documentation = "https://visionagents.ai/"
Website = "https://visionagents.ai/"
Source = "https://github.com/GetStream/Vision-Agents"

[tool.hatch.version]
source = "vcs"
raw-options = { root = "..", search_parent_directories = true, fallback_version = "0.0.0" }

[tool.hatch.build.targets.wheel]
packages = ["vision_agents"]

[tool.hatch.build.targets.sdist]
include = ["/vision_agents"]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.0.0",
]
